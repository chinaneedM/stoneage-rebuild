name: Probe 21CN May-2002 StoneAge records

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_21cn_may2002_probe.py
      - tests/test_stoneage_sa25_21cn_may2002_probe.py
      - .github/workflows/probe-stoneage-sa25-21cn-may2002.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-21cn-may2002
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate focused 21CN probe
        run: python3 -m unittest tests.test_stoneage_sa25_21cn_may2002_probe -v
      - name: Probe May-2002 detail window
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_21cn_may2002_probe \
            > research/recovered/STONEAGE-SA25-21CN-MAY2002-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-21CN-MAY2002-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe 21CN May-2002 StoneAge record'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
