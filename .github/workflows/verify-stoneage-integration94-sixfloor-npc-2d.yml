name: Verify StoneAge INTEGRATION94 sixfloor NPC original TW1 2D
on:
  push:
    branches: [main, 'agent/stoneage-integration94-*']
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION94-SIX-FLOOR-18-NPC-TW1-ORIGINAL-2D-R1.json'
      - 'tests/test_stoneage_integration94_sixfloor_npc_2d.py'
      - '.github/workflows/verify-stoneage-integration94-sixfloor-npc-2d.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION94-SIX-FLOOR-18-NPC-TW1-ORIGINAL-2D-R1.json'
      - 'tests/test_stoneage_integration94_sixfloor_npc_2d.py'
      - '.github/workflows/verify-stoneage-integration94-sixfloor-npc-2d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-qualified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Crosscheck 119 original CREATE bytes source, 18 NPC rows, six DAT catalog and 245 original 2D SHA receipts
        run: python -m unittest discover -s tests -p 'test_stoneage_integration94_sixfloor_npc_2d.py' -v
