name: Verify StoneAge INTEGRATION35 original Kelke mining source relation
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION35-SAINASU-MINERAL-APPRAISAL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_35.py'
      - 'docs/continuity/STONEAGE-INTEGRATION35-SAINASU-MINERAL-APPRAISAL-20261110.md'
      - '.github/workflows/verify-stoneage-integration35-source.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION35-SAINASU-MINERAL-APPRAISAL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_35.py'
      - 'docs/continuity/STONEAGE-INTEGRATION35-SAINASU-MINERAL-APPRAISAL-20261110.md'
      - '.github/workflows/verify-stoneage-integration35-source.yml'
      - 'README.md'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_35.py' -v
