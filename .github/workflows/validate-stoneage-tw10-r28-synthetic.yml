name: Validate TW1.0 R28 native file API conditional synthetic and strict guard
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r28-call-supported-io-20261013]
    paths:
      - .github/workflows/validate-stoneage-tw10-r28-synthetic.yml
      - tools/stoneage_tw10_savedata_native_io_r28.py
      - tools/stoneage_tw10_savedata_native_io_r28_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r28.py
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet capstone pefile
      - name: R28 and R27 synthetic and strict negative controls
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r28 tests.test_stoneage_tw10_savedata_native_io_r27
          python -m compileall -q tools/stoneage_tw10_savedata_native_io_r28.py tools/stoneage_tw10_savedata_native_io_r28_guard.py
          echo TW10_R28_SYNTHETIC_STRICT=PASS
          echo TW10_R28_ORIGINAL_EVIDENCE=OPEN
