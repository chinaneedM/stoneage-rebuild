name: Validate StoneAge common item effect model
concurrency:
  group: stoneage-item-effect-model
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-item-effect-model.yml
      - tools/stoneage_item_effect_model.py
      - tests/test_stoneage_item_effect_model.py
      - research/mechanics/STONEAGE-ITEM-EFFECT-CORE-R1.md
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic item-effect tests
        run: python3 -m unittest tests.test_stoneage_item_effect_model -v
