name: Probe Hananet StoneAge PDS topology
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_pds_topology_probe.py
      - tests/test_stoneage_hananet_pds_topology_probe.py
      - .github/workflows/probe-stoneage-hananet-pds-topology.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-pds-topology
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_pds_topology_probe -v
      - name: Extract PDS topology metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_pds_topology_probe             > research/recovered/STONEAGE-HANANET-PDS-TOPOLOGY-R1.txt
      - name: Commit derived topology metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-PDS-TOPOLOGY-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: extract Hananet PDS topology'
          git pull --rebase origin main
          git push
