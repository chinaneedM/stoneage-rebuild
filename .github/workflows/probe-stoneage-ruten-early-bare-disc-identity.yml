name: Probe early StoneAge bare-disc identity

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_ruten_early_bare_disc_identity_probe.py
      - tests/test_stoneage_ruten_early_bare_disc_identity_probe.py
      - .github/workflows/probe-stoneage-ruten-early-bare-disc-identity.yml

permissions:
  contents: write

concurrency:
  group: stoneage-ruten-early-bare-disc-identity
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate identity probe
        run: python3 -m unittest tests.test_stoneage_ruten_early_bare_disc_identity_probe -v
      - name: Probe public bare-disc identity
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_ruten_early_bare_disc_identity_probe \
            > research/recovered/STONEAGE-RUTEN-EARLY-BARE-DISC-IDENTITY-R2.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R=research/recovered/STONEAGE-RUTEN-EARLY-BARE-DISC-IDENTITY-R2.txt
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe early bare-disc identity'
          git pull --rebase origin main
          git push
