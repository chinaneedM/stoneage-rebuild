name: Reacquire StoneAge original bytes and verify version delta
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reacquire-stoneage-cross-version-original-bytes.yml'
permissions:
  contents: read
jobs:
  real-source-byte-reacquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit archived derived metadata before network acquisition
        run: |
          python3 -m unittest tests.test_stoneage_tw10_preserved25_file_intersection -v
          python3 tools/stoneage_tw10_preserved25_file_intersection.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq unar
      - name: Download and verify accepted Taiwan preservation archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 --silent --show-error \
            -o /tmp/CD_DIC.rar 'https://archive.org/download/stoneage_tw_2000_win/CD_DIC.rar'
          echo "b37a4a47f4eb608cac67e4ddf7a1621a  /tmp/CD_DIC.rar" | md5sum -c -
          echo "b8cf92720b6ec8b3f46ea2e9bfcda986d21e7ded  /tmp/CD_DIC.rar" | sha1sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/tw10
          7z x -y -o/tmp/tw10 /tmp/CD_DIC.rar 'STONEAGE.bin' >/dev/null
          test "$(stat -c %s /tmp/tw10/STONEAGE.bin)" = "523449360"
      - name: Recover verified preservation bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib,html,json,re,http.cookiejar,urllib.parse,urllib.request
          from pathlib import Path
          ua='Mozilla/5.0'; hashes={'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5','ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb'}
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def get(k,s):
            data=urllib.parse.urlencode({'quick_key':k,'response_format':'json'}).encode(); req=urllib.request.Request('https://www.mediafire.com/api/1.5/file/get_info.php',data=data,headers={'User-Agent':ua})
            with op.open(req,timeout=60) as r:i=json.load(r)['response']['file_info']
            if str(i.get('hash','')).lower()!=hashes[k]:raise SystemExit('metadata hash changed')
            with op.open(urllib.request.Request(i['links']['normal_download'],headers={'User-Agent':ua}),timeout=60) as r:page=r.read().decode('utf-8','replace');ref=r.geturl()
            m=re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S) or re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
            if not m:raise SystemExit('no direct link')
            p=Path('/tmp/sa25')/('part.'+s);h=hashlib.sha256()
            with op.open(urllib.request.Request(html.unescape(m.group(1)),headers={'User-Agent':ua,'Referer':ref}),timeout=300) as r,p.open('wb') as o:
              while True:
                b=r.read(1048576)
                if not b:break
                o.write(b);h.update(b)
            if h.hexdigest()!=hashes[k]:raise SystemExit('hash mismatch')
          get('ev7l29fw77891go','001');get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 >/tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar|awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out; ulimit -c 0; unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/dev/null 2>&1
      - name: Rehash 383 Taiwan disc files and 2302 preserved 2.5 source files
        run: |
          set -euo pipefail
          python3 -m tools.stoneage_tw10_client_inventory --bin /tmp/tw10/STONEAGE.bin > /tmp/tw10-live.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from tools.stoneage_tw10_preserved25_file_intersection import (
              TW, BRIDGE, GIT_BLOBS, TW_CORE, BRIDGE_HASH, BRIDGE_ROOT, replay, validate, git_blob
          )
          
          def archived(path):
              raw=Path(path).read_bytes()
              if git_blob(raw)!=GIT_BLOBS[path]:
                  raise ValueError("historical Git blob changed: "+path)
              return raw.decode("utf-8")
          
          expected_tw={}
          for line in archived(TW).splitlines():
              m=TW_CORE.fullmatch(line)
              if m:
                  category, path, size, digest=m.groups()
                  key=path.casefold()
                  if key in expected_tw:
                      raise ValueError("historical duplicate TW path")
                  expected_tw[key]=(category, int(size), digest)
          if len(expected_tw)!=383:
              raise ValueError("unexpected TW reference count")
          
          observed_tw={}
          for line in Path("/tmp/tw10-live.txt").read_text().splitlines():
              m=TW_CORE.fullmatch(line)
              if m:
                  category,path,size,digest=m.groups()
                  key=path.casefold()
                  if key in observed_tw:
                      raise ValueError("live duplicate TW path")
                  observed_tw[key]=(category,int(size),digest)
          if observed_tw!=expected_tw:
              missing=set(expected_tw)-set(observed_tw)
              extra=set(observed_tw)-set(expected_tw)
              changed=[k for k in expected_tw.keys() & observed_tw.keys() if expected_tw[k]!=observed_tw[k]]
              raise ValueError(f"TW original bytes mismatch: missing={len(missing)} extra={len(extra)} changed={len(changed)}")
          
          expected_bridge={}
          after=False
          for line in archived(BRIDGE).splitlines():
              if line=="ALL-FILE SHA256":
                  after=True
                  continue
              if not after:
                  continue
              m=BRIDGE_HASH.fullmatch(line)
              if m and BRIDGE_ROOT in m.group(2):
                  sha,full=m.groups()
                  path=full.split(BRIDGE_ROOT,1)[1]
                  key=path.casefold()
                  if key in expected_bridge:
                      raise ValueError("historical duplicate bridge path")
                  expected_bridge[key]=sha
          if len(expected_bridge)!=2302:
              raise ValueError("unexpected 2.5 reference count")
          
          roots=[p for p in Path("/tmp/sa25/out").rglob("stoneage2.5") if p.is_dir() and p.parent.name=="SA2.5主程式"]
          if len(roots)!=1:
              raise ValueError("cannot identify exactly one preserved 2.5 client subtree")
          root=roots[0]
          observed_bridge={}
          bridge_bytes=0
          for file in sorted(root.rglob("*")):
              if file.is_symlink():
                  raise ValueError("preserved 2.5 tree contains symlink")
              if not file.is_file():
                  continue
              rel=file.relative_to(root).as_posix()
              key=rel.casefold()
              if key in observed_bridge or key not in expected_bridge:
                  raise ValueError("duplicate or unexpected bridge path: "+rel)
              h=hashlib.sha256()
              with file.open("rb") as reader:
                  while block:=reader.read(1024*1024):
                      h.update(block)
              if h.hexdigest()!=expected_bridge[key]:
                  raise ValueError("preserved 2.5 original file hash mismatch: "+rel)
              observed_bridge[key]=h.hexdigest()
              bridge_bytes+=file.stat().st_size
          if observed_bridge!=expected_bridge:
              raise ValueError("missing 2.5 files: "+str(len(set(expected_bridge)-set(observed_bridge))))
          if bridge_bytes!=863480809:
              raise ValueError("2.5 original bytes logical length changed")
          old=replay()["counts"]
          validate()
          index={}
          for path,sha in observed_bridge.items():
              index.setdefault(sha,[]).append(path)
          matched=[(p,v) for p,v in observed_tw.items() if v[2] in index]
          got={
              "original_core_file_count":len(observed_tw),
              "bridge_client_subtree_file_count":len(observed_bridge),
              "original_core_matched_files":len(matched),
              "original_core_unmatched_files":len(observed_tw)-len(matched),
              "matched_cross_archive_path_occurrences":sum(len(index[v[2]]) for _,v in matched),
              "original_core_matched_byte_sum":sum(v[1] for _,v in matched),
          }
          if got!=old:
              raise ValueError("fresh two-client byte comparison differs from pinned historic intersection")
          report={
              "schema":"stoneage.original_source_reacquired_sha_join_r1",
              "status":"SOURCE_BYTES_REACQUIRED_AND_REHASHED",
              "source_versions":{"tw":"Waei/JSS TW 1.0 Redump 104630 accepted original",
                                 "bridge":"mixed community preserved 2.5 candidate; not proven clean official"},
              "archive_digest_gates":{
                "tw_archive_md5":"b37a4a47f4eb608cac67e4ddf7a1621a",
                "tw_archive_sha1":"b8cf92720b6ec8b3f46ea2e9bfcda986d21e7ded",
                "bridge_combined_sha256":"d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"},
              "historical_manifest_git_blobs":GIT_BLOBS,
              "counts":got,
              "tw_core_bytes":sum(x[1] for x in observed_tw.values()),
              "bridge_subtree_logical_bytes":bridge_bytes,
              "github_run_id":os.environ.get("GITHUB_RUN_ID"),
              "github_head_sha":os.environ.get("GITHUB_SHA"),
              "original_payload_published":False,
              "official_purity_of_bridge_qualified":False,
              "pet_npc_quest_server_data_inferred":False
          }
          out=Path("/tmp/stoneage-original-cross-version-derived.json")
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          print(json.dumps(got,sort_keys=True))
          PY
      - name: Delete transient proprietary payloads
        if: always()
        run: rm -rf /tmp/sa25 /tmp/tw10 /tmp/CD_DIC.rar
      - name: Upload source-verified derived metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stoneage-real-source-cross-version-derived-r1
          path: /tmp/stoneage-original-cross-version-derived.json
          if-no-files-found: error
          retention-days: 30
