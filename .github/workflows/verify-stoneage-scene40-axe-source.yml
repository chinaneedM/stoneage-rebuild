name: Source-qualify SCENE40 one user-contributed axe catalogue page
on:
  pull_request:
    paths:
      - .github/workflows/verify-stoneage-scene40-axe-source.yml
      - research/recovered/STONEAGE-SCENE40-*
      - tests/test_stoneage_scene40_source.py
  push:
    paths:
      - .github/workflows/verify-stoneage-scene40-axe-source.yml
      - research/recovered/STONEAGE-SCENE40-*
      - tests/test_stoneage_scene40_source.py
permissions:
  contents: read
jobs:
  bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Frozen scope and no build promotion
        run: python3 -m unittest tests.test_stoneage_scene40_source -v
      - name: Acquire one exact public page and derive three rows
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, html.parser, json, re, unicodedata, urllib.request
          from pathlib import Path
          source = 'https://games.sina.com.cn/handbook/0101/01186086_c1.shtml'
          req = urllib.request.Request(source, headers={'User-Agent':'Mozilla/5.0 StoneAgeResearch/1.0', 'Accept-Encoding':'identity'})
          with urllib.request.urlopen(req, timeout=25) as resp:
              final = resp.geturl()
              raw = resp.read(1000000)
              status = resp.status
          assert status == 200 and final == source and 2000 < len(raw) < 1000000, (status, final, len(raw))
          decoded = raw.decode('gb18030', errors='surrogateescape')
          invalid_codepoints = sum(0xDC80 <= ord(ch) <= 0xDCFF for ch in decoded)
          assert invalid_codepoints <= 256, ('too_many_invalid_original_bytes', invalid_codepoints)
          class P(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
              def handle_data(self, value):
                  self.parts.append(value)
          parser = P()
          parser.feed(decoded)
          flat = re.sub(r'\s+', ' ', unicodedata.normalize('NFKC', ' '.join(parser.parts)))
          assert '石器时代' in flat and '本田太郎' in flat and '物品大全' in flat
          wanted = [
              ('小斧头', 65, ['攻+9','防-3','敏-3'], ['萨姆吉尔村','加加村'], 0),
              ('莱伊卡LV1斧头', 105, ['攻+7','防-2','敏-2'], ['萨姆吉尔村'], 4),
              ('普普通通的斧头', 260, ['攻+14','防-5','敏-5'], ['玛丽娜斯村','萨姆吉尔村'], 10),
          ]
          rows = []
          for name, cost, attrs, villages, item_id in wanted:
              hits = list(re.finditer(re.escape(name), flat, re.I))
              assert len(hits) == 1, (name, len(hits))
              seg = flat[hits[0].start():hits[0].start()+145]
              assert not any(0xDC80 <= ord(ch) <= 0xDCFF for ch in seg), ('invalid_original_byte_in_selected_row', name)
              for attr in attrs:
                  assert re.search(re.escape(attr),seg,re.I), (name,attr,seg)
              assert re.search(r'(?<!\d)'+str(cost)+r'(?!\d)',seg), (name,cost,seg)
              for v in villages:
                  assert v in seg, (name,v,seg)
              rows.append({'player_guide_name':name,'player_guide_price':cost,'player_guide_attrs':attrs,'player_guide_places':villages,'preserved_mixed25_item_id_for_comparison':item_id,'original_client_same_build_proven':False,'commercial_trade_executed':False})
          report={'schema':'stoneage.scene40.sina_one_axe_page_source_replay.r1','url_requested':source,'url_final':final,'status':status,'raw_bytes':len(raw),'raw_sha256':hashlib.sha256(raw).hexdigest(),'raw_decoding':'gb18030_surrogateescape_lossless','invalid_decoding_original_bytes':invalid_codepoints,'genre':'USER_CONTRIBUTED_GAME_GUIDE','author_as_stated':'本田太郎','verified_original_publication_date':None,'historical_exact_build_id':None,'source_rows':rows,'source_row_count':len(rows),'new_official_rules':0,'native_game_executed':False,'original_html_in_public_git':False}
          output=json.dumps(report, ensure_ascii=False, indent=2)+'\n'
          frozen=Path('research/recovered/STONEAGE-SCENE40-SINA-AXE-PLAYER-REPLAY-R1.json').read_text(encoding='utf-8')
          assert output == frozen, 'live_source_and_fixed_source_record_drift'
          Path('scene40-source-replay.json').write_text(output,encoding='utf-8')
          print('SCENE40_SOURCE_REPLAY '+json.dumps({'bytes':len(raw),'sha256':report['raw_sha256'],'rows':len(rows),'invalid_original_bytes':invalid_codepoints,'source_date':None,'official':False},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: scene40-derived-sina-axe-source
          path: scene40-source-replay.json
          retention-days: 14
