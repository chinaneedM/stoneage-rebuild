name: Validate TW1.0 R31 native file API conditional synthetic and strict guard
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r31-create-capture-20261013]
    paths:
      - .github/workflows/validate-stoneage-tw10-r31-synthetic.yml
      - tools/stoneage_tw10_savedata_native_io_r31.py
      - tools/stoneage_tw10_savedata_native_io_r31_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r31.py
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet capstone pefile
      - name: R31 and R30 synthetic and strict negative controls
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r31 tests.test_stoneage_tw10_savedata_native_io_r30
          python -m compileall -q tools/stoneage_tw10_savedata_native_io_r31.py tools/stoneage_tw10_savedata_native_io_r31_guard.py
          echo TW10_R31_SYNTHETIC_STRICT=PASS
          echo TW10_R31_ORIGINAL_EVIDENCE=OPEN
