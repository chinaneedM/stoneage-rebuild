name: Verify one named CN2.0 pet web image without client sprite projection
on:
  push:
    paths:
      - tools/stoneage_waei_cn20_amiduo_visual.py
      - tools/stoneage_early_content_probe.py
      - tools/stoneage_wayi_newbie_riding_plan.py
      - tests/test_stoneage_waei_cn20_amiduo_visual.py
      - research/recovered/STONEAGE-WAEI-CN20-NEW-PET-CATALOG-FIRST-PAGE-R1.json
      - research/recovered/STONEAGE-WAEI-CN20-AMIDUO-VISUAL-REFERENCE-R1.json
      - docs/specs/STONEAGE-WAEI-CN20-AMIDUO-VISUAL-REFERENCE-R1.md
      - .github/workflows/verify-stoneage-waei-cn20-amiduo-visual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-exact-image-and-pinned-catalog-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest tests.test_stoneage_waei_cn20_amiduo_visual -v
      - name: Reacquire one exact image; machine metadata does not repeat human inspection
        run: python -m tools.stoneage_waei_cn20_amiduo_visual --output output/derived.json
      - run: cmp output/derived.json research/recovered/STONEAGE-WAEI-CN20-AMIDUO-VISUAL-REFERENCE-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: waei-cn20-amiduo-visual-derived-only
          path: output/derived.json
          retention-days: 30
