name: Census Waei StoneAge first-party subdomain
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_subdomain_launch_census.py
      - tests/test_stoneage_waei_subdomain_launch_census.py
      - .github/workflows/census-stoneage-waei-subdomain-launch.yml
permissions:
  contents: write
concurrency:
  group: stoneage-waei-subdomain-launch-census
  cancel-in-progress: true
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_waei_subdomain_launch_census -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_subdomain_launch_census > research/recovered/STONEAGE-WAEI-SUBDOMAIN-LAUNCH-CDX-R1.txt
      - run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-WAEI-SUBDOMAIN-LAUNCH-CDX-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: census Waei StoneAge first-party subdomain'
          git pull --rebase origin main
          git push
