name: PET126H first-party GaiaX 2005 original-PC pet press source gate
on:
  push:
    paths:
      - '.github/workflows/validate-stoneage-pet126h-gaiax-operator-press.yml'
      - 'docs/continuity/STONEAGE-PET126H-JP2005-GAIAX-DIRECT-OPERATOR-PET-PRESS-20261121.md'
      - 'research/recovered/STONEAGE-PET126H-JP2005-GAIAX-DIRECT-OPERATOR-PET-PRESS-R1.json'
      - 'tests/test_stoneage_pet126h_gaiax_operator_press.py'
  pull_request:
    paths:
      - '.github/workflows/validate-stoneage-pet126h-gaiax-operator-press.yml'
      - 'docs/continuity/STONEAGE-PET126H-JP2005-GAIAX-DIRECT-OPERATOR-PET-PRESS-20261121.md'
      - 'research/recovered/STONEAGE-PET126H-JP2005-GAIAX-DIRECT-OPERATOR-PET-PRESS-R1.json'
      - 'tests/test_stoneage_pet126h_gaiax_operator_press.py'
jobs:
  operator-document-date-and-not-live-species:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check direct operator press, existing event and no live promotion
        run: |
          python -m unittest discover -s tests -p 'test_stoneage_pet126h_gaiax_operator_press.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet126g_jp_album_crosswalk.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pc_only_scope_20261119.py' -v
