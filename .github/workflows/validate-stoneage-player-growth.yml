name: Validate StoneAge player growth model
on:
  workflow_dispatch:
  push:
    paths:
      - research/mechanics/STONEAGE-PLAYER-GROWTH-CORE-R1.md
      - tools/stoneage_player_growth_model.py
      - tests/test_stoneage_player_growth_model.py
      - .github/workflows/validate-stoneage-player-growth.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_player_growth_model -v
