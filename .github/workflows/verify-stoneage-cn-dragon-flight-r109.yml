name: Verify R109 CN dragon flight guide source boundaries
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN2003-2006-DRAGON-FLIGHT-R109.json'
      - 'tools/stoneage_cn_dragon_flight_r109.py'
      - 'tests/test_stoneage_cn_dragon_flight_r109.py'
      - '.github/workflows/verify-stoneage-cn-dragon-flight-r109.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version split, source claims and negative boundaries
        run: |
          python tools/stoneage_cn_dragon_flight_r109.py
          python -m unittest discover -s tests -p test_stoneage_cn_dragon_flight_r109.py -v
