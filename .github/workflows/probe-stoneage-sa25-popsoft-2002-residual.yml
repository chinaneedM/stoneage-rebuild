name: Probe StoneAge 2.5 Popsoft 2002 residual
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_popsoft_2002_residual_probe.py
      - tests/test_stoneage_sa25_popsoft_2002_residual_probe.py
      - .github/workflows/probe-stoneage-sa25-popsoft-2002-residual.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-popsoft-2002-residual
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate residual probe
        run: python3 -m unittest tests.test_stoneage_sa25_popsoft_2002_residual_probe -v
      - name: Expand Internet Archive residual metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_popsoft_2002_residual_probe \
            > research/recovered/STONEAGE-SA25-POPSOFT-2002-RESIDUAL-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          report='research/recovered/STONEAGE-SA25-POPSOFT-2002-RESIDUAL-R1.txt'
          git add "$report"
          git diff --cached --quiet && exit 0
          git commit -m 'research: expand Popsoft 2002 carrier residual'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_sa25_popsoft_2002_residual_probe > "$report"
            git add "$report"
            git diff --cached --quiet && exit 0
            git commit -m 'research: expand Popsoft 2002 carrier residual'
          fi
          git push
