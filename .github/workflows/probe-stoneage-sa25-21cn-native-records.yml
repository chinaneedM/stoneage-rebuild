name: Scan native 21CN StoneAge records

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_21cn_native_record_probe.py
      - tests/test_stoneage_sa25_21cn_native_record_probe.py
      - .github/workflows/probe-stoneage-sa25-21cn-native-records.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-21cn-native-records
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate native-record probe
        run: python3 -m unittest tests.test_stoneage_sa25_21cn_native_record_probe -v
      - name: Scan archived 21CN detail pages
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_21cn_native_record_probe \
            > research/recovered/STONEAGE-SA25-21CN-NATIVE-RECORDS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-21CN-NATIVE-RECORDS-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan native 21CN StoneAge records'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
