name: Verify StoneAge INTEGRATION78 riding consent original source-only bridge
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION78-RIDING-CONSENT-ORIGINAL-ITEM-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration78_riding_consent_source.py'
      - '.github/workflows/verify-stoneage-integration78-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION78-RIDING-CONSENT-ORIGINAL-ITEM-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration78_riding_consent_source.py'
      - '.github/workflows/verify-stoneage-integration78-source.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration78_riding_consent_source.py' -v
