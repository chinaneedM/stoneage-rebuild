name: Trace exact 21CN StoneAge record 22318

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_21cn_record22318_probe.py
      - tests/test_stoneage_sa25_21cn_record22318_probe.py
      - .github/workflows/probe-stoneage-sa25-21cn-record22318.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-21cn-record22318
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact-record probe
        run: python3 -m unittest tests.test_stoneage_sa25_21cn_record22318_probe -v
      - name: Trace record and download topology
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_21cn_record22318_probe \
            > research/recovered/STONEAGE-SA25-21CN-RECORD-22318-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-21CN-RECORD-22318-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: trace exact 21CN StoneAge record 22318'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
