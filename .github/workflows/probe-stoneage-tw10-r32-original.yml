name: Probe TW1.0 R32 original intervening call conditional branch and stack slot
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r32-call-branch-20261013]
    paths:
      - .github/workflows/probe-stoneage-tw10-r32-original.yml
      - tools/stoneage_tw10_savedata_native_io_r32.py
      - tools/stoneage_tw10_savedata_native_io_r32_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r32.py
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify R32 and R31 synthetic prerequisites
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r32 tests.test_stoneage_tw10_savedata_native_io_r31
      - name: Transient pinned historical archive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m tools.stoneage_tw10_archive_parallel_download --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar; then
              echo TW10_R32_ARCHIVE_PINNED=PASS
              break
            fi
            rm -f /tmp/CD_DIC.rar
            if [ "$attempt" -eq 3 ]; then
              echo TW10_R32_ORIGINAL_SOURCE_UNAVAILABLE=OPEN
              exit 1
            fi
            sleep 10
          done
      - name: Extract pinned original temporary BIN only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r32
          7z x -y -o/tmp/stoneage-r32 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r32/STONEAGE.bin)" -eq 523449360
      - name: Emit static R32 derived-only witness and guard
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_native_io_r32 --bin /tmp/stoneage-r32/STONEAGE.bin > /tmp/stoneage-r32-derived.json
          python -m tools.stoneage_tw10_savedata_native_io_r32_guard --report /tmp/stoneage-r32-derived.json
          test "$(stat -c %s /tmp/stoneage-r32-derived.json)" -le 75000
          echo TW10_R32_ORIGINAL_STATIC_ONLY=PASS
          echo TW10_R32_NATIVE_SAVE=OPEN
      - name: Always purge all historical original content
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r32
      - name: Upload bounded DERIVED JSON only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-r32-original-call-branch-derived
          path: /tmp/stoneage-r32-derived.json
          retention-days: 21
