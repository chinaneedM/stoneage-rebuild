name: Probe NetPower StoneAge Latin recovery tokens
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_netpower_latin_token_probe.py
      - tests/test_stoneage_netpower_latin_token_probe.py
      - .github/workflows/probe-stoneage-netpower-latin-tokens.yml

permissions:
  contents: write

concurrency:
  group: stoneage-netpower-latin-token-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_netpower_latin_token_probe -v
      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Fetch pages and OCR transiently
        run: |
          set -euo pipefail
          mkdir -p /tmp/netpower-img /tmp/netpower-ocr
          python3 - <<'PY'
          import pathlib, urllib.request
          ua="Mozilla/5.0 StoneAgeArchaeology/1.0"
          out=pathlib.Path("/tmp/netpower-img")
          for page in range(87,97):
              url=f"https://m.gamemeca.com/mgz_img.php?m=b&title=netpower&ym=2000_9&p={page}"
              req=urllib.request.Request(url,headers={"User-Agent":ua,"Accept":"image/*"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=r.read()
              if not data.startswith(b"\xff\xd8"):
                  raise SystemExit(f"page {page}: not JPEG")
              (out/f"page{page}.jpg").write_bytes(data)
          PY
          for page in $(seq 87 96); do
            for psm in 6 11; do
              tesseract "/tmp/netpower-img/page${page}.jpg" stdout -l eng --psm "$psm" 2>/dev/null                 > "/tmp/netpower-ocr/page${page}_psm${psm}.txt"
            done
          done
      - name: Emit sparse token report only
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_netpower_latin_token_probe             --ocr-dir /tmp/netpower-ocr             > research/recovered/STONEAGE-NETPOWER-2000-09-LATIN-TOKENS-R1.txt
          rm -rf /tmp/netpower-img /tmp/netpower-ocr
      - name: Commit derived token report only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-NETPOWER-2000-09-LATIN-TOKENS-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: extract NetPower StoneAge recovery tokens'
          git pull --rebase origin main
          git push
