name: Verify StoneAge INTEGRATION43 source-bound A6 and finish
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION43-JARUGA-A6-FINISH-SOURCE-BOUNDARY-R1.json'
      - 'tests/test_stoneage_integration_module_43.py'
      - '.github/workflows/verify-stoneage-integration43-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION43-JARUGA-A6-FINISH-SOURCE-BOUNDARY-R1.json'
      - 'tests/test_stoneage_integration_module_43.py'
      - '.github/workflows/verify-stoneage-integration43-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_43.py' -v
