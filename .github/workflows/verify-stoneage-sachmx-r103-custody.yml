name: Verify R103 immutable SACH-MX source and static-UI custody
on:
  push:
    paths:
      - 'tools/stoneage_sachmx_version_visual_r103_custody.py'
      - 'tests/test_stoneage_sachmx_version_visual_r103_custody.py'
      - 'research/recovered/STONEAGE-SACHMX-VERSION-VISUAL-CUSTODY-R103.json'
      - 'research/recovered/STONEAGE-SACHMX-VERSION-VISUAL-CI-*-R103.json'
      - '.github/workflows/verify-stoneage-sachmx-r103-custody.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  derived-only-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest tests.test_stoneage_sachmx_version_visual_r103 tests.test_stoneage_sachmx_version_visual_r103_custody -v
      - run: python -m tools.stoneage_sachmx_version_visual_r103_custody
