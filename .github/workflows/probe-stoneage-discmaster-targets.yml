name: Probe StoneAge targets in DiscMaster
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_discmaster_target_probe.py
      - tests/test_stoneage_discmaster_target_probe.py
      - .github/workflows/probe-stoneage-discmaster-targets.yml

permissions:
  contents: write

concurrency:
  group: stoneage-discmaster-targets
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate DiscMaster target probe
        run: python3 -m unittest tests.test_stoneage_discmaster_target_probe -v
      - name: Probe exact StoneAge carrier traits
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_discmaster_target_probe \
            > research/recovered/STONEAGE-JAPAN-DISCMASTER-TARGETS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          report='research/recovered/STONEAGE-JAPAN-DISCMASTER-TARGETS-R1.txt'
          git add "$report"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe StoneAge targets in DiscMaster'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_discmaster_target_probe > "$report"
            git add "$report"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe StoneAge targets in DiscMaster'
          fi
          git push
