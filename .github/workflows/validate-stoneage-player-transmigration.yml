name: Validate StoneAge player transmigration model
on:
  workflow_dispatch:
  push:
    paths:
      - research/mechanics/STONEAGE-PLAYER-TRANSMIGRATION-CORE-R1.md
      - tools/stoneage_player_transmigration_model.py
      - tests/test_stoneage_player_transmigration_model.py
      - .github/workflows/validate-stoneage-player-transmigration.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_player_transmigration_model -v
