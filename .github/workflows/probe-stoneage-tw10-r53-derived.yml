name: Probe TW1.0 R53 conditional transform specification using invented fixtures
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r53-conditional-transform-20261015]
    paths:
      - .github/workflows/probe-stoneage-tw10-r53-derived.yml
      - tools/stoneage_tw10_savedata_native_io_r53.py
      - tools/stoneage_tw10_savedata_transform_r53_model.py
      - tests/test_stoneage_tw10_savedata_native_io_r53.py
      - research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R53-SPEC.json
permissions:
  contents: read
  actions: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate immutable R51 original-derived custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38719176573" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|ee32f6d16f3dbfeabbb9d73020b64f83f47924dd|agent/tw10-savedata-r51-processor-stack-consumers-20261015'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11963713395" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38719176573|tw10-r51-original-processor-stack-consumers-derived|sha256:3e02a0c79114b8a3e2817a63ef4c6d280944435f4ad1106a213781484c2b4a8b|false'
          mkdir -p /tmp/r53-origin
          gh run download 38719176573 --repo "$GITHUB_REPOSITORY" --name tw10-r51-original-processor-stack-consumers-derived --dir /tmp/r53-origin
          test "$(find /tmp/r53-origin -type f | wc -l)" -eq 1
          test ! -L /tmp/r53-origin/stoneage-r51-derived.json
          test "$(stat -c %s /tmp/r53-origin/stoneage-r51-derived.json)" -eq 284533
          echo '15f54e5de8d1d20128fb7d948b54f13a0e3f6cf372eca203cbc7bb8adc473052  /tmp/r53-origin/stoneage-r51-derived.json' | sha256sum -c -
          cmp /tmp/r53-origin/stoneage-r51-derived.json research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R51-ORIGINAL.json
      - name: Authenticate and retrieve immutable R52 architectural metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38721170772" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|5bdf801831f2a8198ce49c5f91c04d583f03a5ec|agent/tw10-savedata-r52-cdq-sources-20261015'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11964589288" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38721170772|tw10-r52-metadata-cdq-source-derived|sha256:0c4346b23854cde9452a0f803bfcb5f5d36335563df0276101c08e8422d35d54|false'
          mkdir -p /tmp/r53-prior
          gh run download 38721170772 --repo "$GITHUB_REPOSITORY" --name tw10-r52-metadata-cdq-source-derived --dir /tmp/r53-prior
          test "$(find /tmp/r53-prior -type f | wc -l)" -eq 1
          test ! -L /tmp/r53-prior/stoneage-r52-derived.json
          test "$(stat -c %s /tmp/r53-prior/stoneage-r52-derived.json)" -eq 252332
          echo '99c9252bf3a982db565ab29f43d27e67b2c34978a44990564d74d75949a15179  /tmp/r53-prior/stoneage-r52-derived.json' | sha256sum -c -
          cmp /tmp/r53-prior/stoneage-r52-derived.json research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R52-DERIVED.json
      - name: Run R53 controls and inherited R51 through R32 and hardened R7 gates
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r53 tests.test_stoneage_tw10_savedata_native_io_r52 tests.test_stoneage_tw10_savedata_postcall_r51 tests.test_stoneage_tw10_savedata_application_r51 tests.test_stoneage_tw10_savedata_application_r50 tests.test_stoneage_tw10_savedata_native_io_r51 tests.test_stoneage_tw10_savedata_native_io_r50 tests.test_stoneage_tw10_savedata_native_io_r49 tests.test_stoneage_tw10_savedata_native_io_r48 tests.test_stoneage_tw10_savedata_native_io_r47 tests.test_stoneage_tw10_savedata_native_io_r46 tests.test_stoneage_tw10_savedata_native_io_r45 tests.test_stoneage_tw10_savedata_native_io_r44 tests.test_stoneage_tw10_savedata_native_io_r43 tests.test_stoneage_tw10_savedata_native_io_r42 tests.test_stoneage_tw10_savedata_native_io_r41 tests.test_stoneage_tw10_savedata_native_io_r40 tests.test_stoneage_tw10_savedata_native_io_r39 tests.test_stoneage_tw10_savedata_native_io_r38 tests.test_stoneage_tw10_savedata_native_io_r37 tests.test_stoneage_tw10_savedata_native_io_r36 tests.test_stoneage_tw10_savedata_native_io_r35 tests.test_stoneage_tw10_savedata_native_io_r34 tests.test_stoneage_tw10_savedata_native_io_r33 tests.test_stoneage_tw10_savedata_native_io_r32 tests.test_stoneage_tw10_savedata_argtrace_r7 tests.test_stoneage_tw10_savedata_argtrace_r7_guard
          python -m tools.stoneage_tw10_savedata_native_io_r51_guard --report /tmp/r53-origin/stoneage-r51-derived.json
      - name: Recompute bounded R53 metadata and independently reverse-audit sources
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_native_io_r53 --r51 /tmp/r53-origin/stoneage-r51-derived.json --r52 /tmp/r53-prior/stoneage-r52-derived.json > /tmp/stoneage-r53-spec.json
          python -m tools.stoneage_tw10_savedata_native_io_r53 --r51 /tmp/r53-origin/stoneage-r51-derived.json --r52 /tmp/r53-prior/stoneage-r52-derived.json --verify /tmp/stoneage-r53-spec.json
          test "$(stat -c %s /tmp/stoneage-r53-spec.json)" -eq 104275
          echo '26bbdff472638081cd7e26945350598bf89a75a690c5c4205c2d491ad62e8dd5  /tmp/stoneage-r53-spec.json' | sha256sum -c -
          cmp /tmp/stoneage-r53-spec.json research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R53-SPEC.json
          echo TW10_R53_CANONICAL_BYTES_EQUAL=PASS
          echo TW10_R53_INVENTED_FIXTURES_NO_ORIGINAL_BINARY_OR_PAYLOAD=PASS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tw10-r53-conditional-transform-spec
          path: /tmp/stoneage-r53-spec.json
          retention-days: 21
      - name: Purge temporary metadata
        if: always()
        run: rm -rf /tmp/r53-origin /tmp/r53-prior /tmp/stoneage-r53-spec.json
