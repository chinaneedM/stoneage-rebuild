name: Verify Japanese creation visual reference joins without invented character identities
on:
  push:
    paths:
      - tools/stoneage_jp2003_creation_reference_join.py
      - tests/test_stoneage_jp2003_creation_reference_join.py
      - tools/stoneage_early_mail_venue_crosswalk.py
      - research/recovered/STONEAGE-JP2003-CREATION-VISUAL-REFERENCE-JOIN-R1.json
      - research/recovered/STONEAGE-JP2003-GAME-FEATURES-R1.json
      - research/recovered/STONEAGE-JP2003-CHARACTER-VISUAL-SOURCE-R1.json
      - research/recovered/JSS-LOGIN-MANUAL-CREATION-CONTRACT-R1.json
      - docs/specs/STONEAGE-JP2003-CREATION-VISUAL-REFERENCE-JOIN-R1.md
      - .github/workflows/verify-stoneage-jp2003-creation-reference-join.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-pinned-creation-reference-join:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stoneage_jp2003_creation_reference_join -v
      - name: Replay three pinned reports without fetching originals or images
        run: python -m tools.stoneage_jp2003_creation_reference_join --output output/derived.json
      - run: cmp output/derived.json research/recovered/STONEAGE-JP2003-CREATION-VISUAL-REFERENCE-JOIN-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: jp2003-creation-reference-join-derived-only
          path: output/derived.json
          retention-days: 30
