name: Validate StoneAge stable pet-skill core
concurrency:
  group: stoneage-petskill-core
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-petskill-core.yml
      - tools/stoneage_petskill_core_model.py
      - tests/test_stoneage_petskill_core_model.py
      - research/mechanics/STONEAGE-PETSKILL-CORE-R1.md
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic stable pet-skill tests
        run: python3 -m unittest tests.test_stoneage_petskill_core_model -v
