name: Retry Waei 2000 download root

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_www9_root_20001206_retry.py
      - tests/test_stoneage_waei_www9_root_20001206_retry.py
      - .github/workflows/retry-stoneage-waei-www9-root-20001206.yml

permissions:
  contents: write

concurrency:
  group: stoneage-waei-www9-root-20001206
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_waei_www9_root_20001206_retry -v
      - name: Replay bounded historical HTML
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_www9_root_20001206_retry > research/recovered/STONEAGE-WAEI-WWW9-ROOT-20001206-R2.txt
      - name: Commit derived report
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R=research/recovered/STONEAGE-WAEI-WWW9-ROOT-20001206-R2.txt
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: replay Waei 2000 download root'
          git pull --rebase origin main
          git push
