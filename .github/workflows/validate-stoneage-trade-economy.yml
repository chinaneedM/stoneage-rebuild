name: Validate StoneAge trade economy model
on:
  workflow_dispatch:
  push:
    paths:
      - research/mechanics/STONEAGE-TRADE-ECONOMY-CORE-R1.md
      - tools/stoneage_trade_economy_model.py
      - tests/test_stoneage_trade_economy_model.py
      - .github/workflows/validate-stoneage-trade-economy.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_trade_economy_model -v
