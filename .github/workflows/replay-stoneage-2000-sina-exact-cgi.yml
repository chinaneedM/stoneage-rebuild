name: Replay exact Sina 2000 target CGI

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_2000_sina_exact_cgi_replay.py
      - tests/test_stoneage_2000_sina_exact_cgi_replay.py
      - .github/workflows/replay-stoneage-2000-sina-exact-cgi.yml

permissions:
  contents: write

concurrency:
  group: stoneage-2000-sina-exact-cgi
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_2000_sina_exact_cgi_replay -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_2000_sina_exact_cgi_replay \
            > research/recovered/STONEAGE-2000-SINA-EXACT-CGI-REPLAY-R1.txt
      - name: Commit derived routing evidence only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-2000-SINA-EXACT-CGI-REPLAY-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: replay exact Sina 2000 target CGI'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
