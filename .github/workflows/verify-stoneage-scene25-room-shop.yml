name: Verify SCENE25 bounded room shop observation integration
on:
  push:
    branches: [main, agent/scene25-room-shop-integration-20261029]
    paths:
      - tools/stoneage_scene25_*
      - tests/test_stoneage_scene25_*
      - research/recovered/STONEAGE-SCENE25-*.json
      - .github/workflows/verify-stoneage-scene25-room-shop.yml
  pull_request:
    paths:
      - tools/stoneage_scene25_*
      - tests/test_stoneage_scene25_*
      - research/recovered/STONEAGE-SCENE25-*.json
      - .github/workflows/verify-stoneage-scene25-room-shop.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accepted-parents-and-synthetic-room-shop-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install pillow==11.3.0
      - run: python -m tools.stoneage_scene25_room_shop
      - run: python -m unittest -v tests.test_stoneage_scene25_room_shop tests.test_stoneage_scene24_shop_images tests.test_stoneage_scene14_room_shop tests.test_stoneage_tw10_vs_25_resource_diff
      - run: npm install --prefix /tmp/scene25-browser playwright@1.55.1
      - name: Browser receives synthetic pixels and text only
        run: |
          python -m tools.stoneage_scene25_fixture --output /tmp/scene25-fixture.html
          CHROME_PATH="$(command -v google-chrome)" PLAYWRIGHT_MODULE=/tmp/scene25-browser/node_modules/playwright node tools/stoneage_scene25_browser.cjs /tmp/scene25-fixture.html /tmp/scene25-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene25-synthetic-room-shop-reader-only
          path: /tmp/scene25-browser.json
          if-no-files-found: warn
          retention-days: 7
