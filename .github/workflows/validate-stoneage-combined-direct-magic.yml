name: Validate StoneAge Combined direct magic boundary
concurrency:
  group: stoneage-combined-direct-magic-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-combined-direct-magic.yml"
      - "tools/stoneage_combined_direct_magic_model.py"
      - "tools/stoneage_combined_initiative_model.py"
      - "tools/stoneage_combined_effect_model.py"
      - "tools/stoneage_combined_direct_magic_source_audit.py"
      - "tools/stoneage_combined_source_audit.py"
      - "tools/stoneage_enemy_ai_combined_bridge.py"
      - "tools/stoneage_guard_break2_source_audit.py"
      - "tools/stoneage_weaken_source_audit.py"
      - "tools/stoneage_mdfyattack_source_audit.py"
      - "tests/test_stoneage_combined_direct_magic_model.py"
      - "tests/test_stoneage_combined_initiative_model.py"
      - "tests/test_stoneage_combined_effect_model.py"
      - "specs/STONEAGE-COMBINED-DIRECT-MAGIC-BOUNDARY-R1.md"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Combined reference and direct magic boundary models
        run: |
          python -m unittest -v \
            tests.test_stoneage_combined_model \
            tests.test_stoneage_recovered25_combined_probe \
            tests.test_stoneage_recovered25_combined_magic_probe \
            tests.test_stoneage_enemy_ai_combined_bridge \
            tests.test_stoneage_combined_direct_magic_model \
            tests.test_stoneage_combined_initiative_model \
            tests.test_stoneage_combined_effect_model
      - name: Recover clean pinned descendant profiles outside repository
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          profiles={
              "gavin":("gavinlinasd/StoneAge","1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"),
              "iris":("iriselia/StoneAge","9e6c8ce2cd8ed532a7157773acd1c61582c178b5"),
              "bismarck":("BismarckDD/stoneage","999ffdf1d220ec6666eb65339180689c9caf1876"),
          }
          for name,(repo,sha) in profiles.items():
              root=Path("/tmp/combined-direct-source")/name
              root.mkdir(parents=True)
              subprocess.run(["git","init",str(root)],check=True)
              subprocess.run(["git","-C",str(root),"remote","add","origin","https://github.com/"+repo+".git"],check=True)
              subprocess.run(["git","-C",str(root),"fetch","--depth","1","origin",sha],check=True)
              subprocess.run(["git","-C",str(root),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Reproduce all 4800 native wrapper witnesses and checked source facts
        run: |
          python -m tools.stoneage_combined_direct_magic_source_audit \
            --gavin-dir /tmp/combined-direct-source/gavin \
            --iris-dir /tmp/combined-direct-source/iris \
            --bismarck-dir /tmp/combined-direct-source/bismarck \
            > /tmp/combined-direct-magic-audit.txt
          diff -u research/recovered/STONEAGE-COMBINED-DIRECT-MAGIC-AUDIT-R1.txt /tmp/combined-direct-magic-audit.txt
          cat /tmp/combined-direct-magic-audit.txt
