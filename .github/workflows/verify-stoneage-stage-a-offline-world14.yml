name: Verify Stage A WORLD14 original fishing quest derivatives
on:
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-14-*'
      - 'tests/test_stoneage_stage_a_world14_fishing_quest.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world14.yml'
  push:
    branches: [main]
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-14-*'
      - 'tests/test_stoneage_stage_a_world14_fishing_quest.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world14.yml'
jobs:
  source-bound-original-fishing-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_stage_a_world14_fishing_quest.py' -v
