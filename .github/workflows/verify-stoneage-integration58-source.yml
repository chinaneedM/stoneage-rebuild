name: Verify StoneAge INTEGRATION58 Poru three DAT/NPC and TW1 original pixels
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION58-PORU-THREE-MAP-DRAGON-FLAG63-TW1-32-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_58.py'
      - '.github/workflows/verify-stoneage-integration58-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION58-PORU-THREE-MAP-DRAGON-FLAG63-TW1-32-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_58.py'
      - '.github/workflows/verify-stoneage-integration58-source.yml'
permissions:
  contents: read
jobs:
  verify-source-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_58.py' -v
