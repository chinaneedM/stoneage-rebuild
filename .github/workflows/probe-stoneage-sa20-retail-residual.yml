name: Close StoneAge 2.0 retail census residual

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa20_retail_carrier_residual.py
      - tests/test_stoneage_sa20_retail_carrier_residual.py
      - .github/workflows/probe-stoneage-sa20-retail-residual.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa20-retail-residual
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sa20_retail_carrier_residual -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa20_retail_carrier_residual > research/recovered/STONEAGE-SA20-RETAIL-CARRIER-RESIDUAL-R2.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA20-RETAIL-CARRIER-RESIDUAL-R2.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: close StoneAge 2.0 retail census residual'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
