name: Validate StoneAge FallGround runtime
concurrency:
  group: stoneage-fallground-runtime
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-fallground-runtime.yml
      - tools/stoneage_fall_ground_model.py
      - tools/stoneage_enemy_ai_fall_ground_bridge.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_battle_state_model.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_fall_ground_model.py
      - tests/test_stoneage_enemy_ai_fall_ground_bridge.py
      - tests/test_stoneage_fall_ground_round.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovered25 FallGround runtime
        run: |
          python3 -m unittest \
            tests.test_stoneage_fall_ground_model \
            tests.test_stoneage_enemy_ai_fall_ground_bridge \
            tests.test_stoneage_fall_ground_round \
            tests.test_stoneage_local_runtime_session_coordinator -v
