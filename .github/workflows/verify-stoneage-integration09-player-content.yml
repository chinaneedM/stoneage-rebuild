name: Verify StoneAge INTEGRATION09 representative player content source joins
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION09-REPRESENTATIVE-PLAYER-CONTENT-CHAIN-R1.json'
      - 'tests/test_stoneage_integration_module_09.py'
      - '.github/workflows/verify-stoneage-integration09-player-content.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION09-REPRESENTATIVE-PLAYER-CONTENT-CHAIN-R1.json'
      - 'tests/test_stoneage_integration_module_09.py'
      - '.github/workflows/verify-stoneage-integration09-player-content.yml'
jobs:
  static-source-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_09.py' -v
