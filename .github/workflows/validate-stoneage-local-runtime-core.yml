name: Validate StoneAge local runtime core

on:
  workflow_dispatch:
  push:
    paths:
      - game/RUNTIME-BOOTSTRAP-RECOVERED25-R1.json
      - docs/RUNTIME-CORE-INTERFACES-R1.md
      - docs/RUNTIME-BOOTSTRAP-CONTRACT-R1.md
      - tools/stoneage_local_runtime_core.py
      - tools/stoneage_singleplayer_domain.py
      - tools/stoneage_singleplayer_world.py
      - tools/stoneage_singleplayer_persistence.py
      - tests/test_stoneage_local_runtime_core.py
      - .github/workflows/validate-stoneage-local-runtime-core.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local runtime core interfaces
        run: |
          python3 -m unittest \
            tests.test_stoneage_local_runtime_core \
            tests.test_stoneage_singleplayer_world \
            tests.test_stoneage_singleplayer_persistence \
            tests.test_stoneage_singleplayer_runtime -v
