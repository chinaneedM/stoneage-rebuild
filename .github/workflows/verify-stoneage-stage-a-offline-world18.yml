name: Verify Stage A WORLD18 battle entry BGM
on:
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-1[78]-*'
      - 'tests/test_stoneage_stage_a_world18_battle_entry_bgm.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world18.yml'
  push:
    branches: [main]
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-1[78]-*'
      - 'tests/test_stoneage_stage_a_world18_battle_entry_bgm.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world18.yml'
jobs:
  public-source-joins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_stage_a_world18_battle_entry_bgm.py' -v
