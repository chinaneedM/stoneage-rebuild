name: Validate StoneAge Taiwan v1.0 gameplay model

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_tw10_gameplay_model.py
      - tools/stoneage_tw10_25_bridge_model.py
      - tools/stoneage_tw10_25_encounter_bridge.py
      - tools/stoneage_singleplayer_domain.py
      - tools/stoneage_singleplayer_world.py
      - tools/stoneage_map_collision_model.py
      - tools/stoneage_tw10_hit_map_model.py
      - tools/stoneage_encounter_frequency_model.py
      - tools/stoneage_enemy_spawn_model.py
      - tools/stoneage_battle_command_model.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_singleplayer_battle.py
      - tools/stoneage_singleplayer_runtime.py
      - tools/stoneage_singleplayer_persistence.py
      - tools/stoneage_battle_core_model.py
      - tools/stoneage_warp_transition_model.py
      - research/clients/STONEAGE-TW10-GAMEPLAY-SCHEMA-R1.json
      - research/mechanics/STONEAGE-MAP-COLLISION-OVERABILITY-R1.md
      - research/mechanics/STONEAGE-ENCOUNTER-FREQUENCY-CEP-R1.md
      - research/mechanics/STONEAGE-ENEMY-SPAWN-BIRTH-ORCHESTRATION-R1.md
      - research/clients/STONEAGE-TW10-25-GAMEPLAY-BRIDGE-R1.json
      - tests/test_stoneage_tw10_gameplay_model.py
      - tests/test_stoneage_tw10_25_bridge_model.py
      - tests/test_stoneage_tw10_25_encounter_bridge.py
      - tests/test_stoneage_tw10_gameplay_schema.py
      - tests/test_stoneage_tw10_25_gameplay_bridge.py
      - tests/test_stoneage_singleplayer_domain.py
      - tests/test_stoneage_singleplayer_world.py
      - tests/test_stoneage_map_collision_model.py
      - tests/test_stoneage_tw10_hit_map_model.py
      - tests/test_stoneage_encounter_frequency_model.py
      - tests/test_stoneage_enemy_spawn_model.py
      - tests/test_stoneage_battle_command_model.py
      - tests/test_stoneage_battle_round_model.py
      - tests/test_stoneage_group_battle_runtime.py
      - tests/test_stoneage_singleplayer_battle.py
      - tests/test_stoneage_singleplayer_runtime.py
      - tests/test_stoneage_singleplayer_persistence.py
      - tests/test_stoneage_battle_core_model.py
      - tests/test_stoneage_warp_transition_model.py
      - .github/workflows/validate-stoneage-tw10-gameplay-model.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema-driven reconstruction model
        run: |
          python3 -m unittest \
            tests.test_stoneage_tw10_gameplay_schema \
            tests.test_stoneage_tw10_25_gameplay_bridge \
            tests.test_stoneage_tw10_gameplay_model \
            tests.test_stoneage_singleplayer_domain \
            tests.test_stoneage_singleplayer_world \
            tests.test_stoneage_map_collision_model \
            tests.test_stoneage_tw10_hit_map_model \
            tests.test_stoneage_encounter_frequency_model \
            tests.test_stoneage_enemy_spawn_model \
            tests.test_stoneage_battle_command_model \
            tests.test_stoneage_group_battle_runtime \
            tests.test_stoneage_singleplayer_battle \
            tests.test_stoneage_singleplayer_runtime \
            tests.test_stoneage_singleplayer_persistence \
            tests.test_stoneage_warp_transition_model \
            tests.test_stoneage_battle_core_model \
            tests.test_stoneage_battle_round_model -v
