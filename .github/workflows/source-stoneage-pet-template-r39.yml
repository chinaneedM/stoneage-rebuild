name: Source preserved server three-name template facts R39
on:
  push:
    branches: ['agent/preserved-pet-template-source-r39-20261027']
permissions:
  contents: read
jobs:
  original-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rarfile==4.2
      - run: sudo apt-get update -qq && sudo apt-get install -y unar
      - run: python -m tools.stoneage_preserved_pet_template_r39 --output /tmp/r39-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: r39-source-derived-metadata-only
          path: /tmp/r39-source.json
          retention-days: 7
          if-no-files-found: error
