name: Verify JP2005 autumn cooking quest and separate contest rewards
on:
  push:
    paths:
      - 'tools/stoneage_jp2005_autumn_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_jp2005_autumn_source.py'
      - 'research/recovered/STONEAGE-JP2005-AUTUMN-COOKING-*.json'
      - 'research/recovered/STONEAGE-CN20-PET-CRAFTING-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-JP2005-TREASURE-EVENT-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-jp2005-autumn-source.yml'
  pull_request:
    paths:
      - 'tools/stoneage_jp2005_autumn_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_jp2005_autumn_source.py'
      - 'research/recovered/STONEAGE-JP2005-AUTUMN-COOKING-*.json'
      - 'research/recovered/STONEAGE-CN20-PET-CRAFTING-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-JP2005-TREASURE-EVENT-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-jp2005-autumn-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Cooking quest, shop scope, contest prizes and illustration counterexamples
        run: python -m unittest tests.test_stoneage_jp2005_autumn_source -v
      - name: Retrieve one journalistic report and its actual cooking illustration
        run: python -m tools.stoneage_jp2005_autumn_source --fetch --output "$RUNNER_TEMP/r80-content/replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: jp2005-autumn-cooking-derived-r80
          path: ${{ runner.temp }}/r80-content/replay.json
          if-no-files-found: error
          retention-days: 30
