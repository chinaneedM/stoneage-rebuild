name: Census Mainland SA1.0 magazine carriers

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_mainland_sa10_magazine_carrier_census.py
      - tests/test_stoneage_mainland_sa10_magazine_carrier_census.py
      - .github/workflows/census-stoneage-mainland-sa10-magazine-carriers.yml

permissions:
  contents: write

concurrency:
  group: stoneage-mainland-sa10-magazine-carriers
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate magazine-carrier census
        run: python3 -m unittest tests.test_stoneage_mainland_sa10_magazine_carrier_census -v
      - name: Census preservation indexes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_mainland_sa10_magazine_carrier_census \
            > research/recovered/STONEAGE-MAINLAND-SA10-MAGAZINE-CARRIER-CENSUS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-MAINLAND-SA10-MAGAZINE-CARRIER-CENSUS-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: census Mainland SA1.0 magazine carriers'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
