name: Verify StoneAge O15 conflicting SOT source variants
on:
  push:
    paths:
      - "research/recovered/STONEAGE-O15-SOT-CD-SOURCE-VARIANTS-R1.json"
      - "tools/stoneage_o15_sot_variant_boundary.py"
      - "tests/test_stoneage_o15_sot_variant_boundary.py"
      - ".github/workflows/verify-stoneage-o15-sot-variants.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Do not overwrite a dated guide with an unqualified repost
        run: |
          python -m tools.stoneage_o15_sot_variant_boundary
          python -m unittest tests.test_stoneage_o15_sot_variant_boundary -v
