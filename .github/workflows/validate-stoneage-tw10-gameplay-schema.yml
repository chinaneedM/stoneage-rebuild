name: Validate StoneAge Taiwan v1.0 gameplay schema

on:
  workflow_dispatch:
  push:
    paths:
      - research/clients/STONEAGE-TW10-GAMEPLAY-SCHEMA-R1.json
      - tests/test_stoneage_tw10_gameplay_schema.py
      - .github/workflows/validate-stoneage-tw10-gameplay-schema.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate evidence-tagged gameplay schema
        run: python3 -m unittest tests.test_stoneage_tw10_gameplay_schema -v
