name: Recover five original CN50 item RD blocks for private observation
on:
  push:
    branches: [agent/integration14-cn50-source-20261109]
    paths:
      - tools/stoneage_integration14_cn50_rd_source.py
      - research/recovered/STONEAGE-INTEGRATION14-TRANSFER-CERT.pem
      - .github/workflows/source-stoneage-integration14-cn50-rd.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cabextract
      - run: python -m tools.stoneage_integration14_cn50_rd_source --output /tmp/integration14 --certificate research/recovered/STONEAGE-INTEGRATION14-TRANSFER-CERT.pem
      - uses: actions/upload-artifact@v4
        with:
          name: integration14-cn50-five-rd-private-encrypted
          path: /tmp/integration14
          if-no-files-found: error
          retention-days: 7
