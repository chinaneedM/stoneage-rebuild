name: Validate StoneAge Refresh runtime

on:
  push:
    paths:
      - "tools/stoneage_enemy_ai_refresh_bridge.py"
      - "tools/stoneage_refresh_runtime_state.py"
      - "tools/stoneage_battle_round_model.py"
      - "tools/stoneage_battle_state_model.py"
      - "tools/stoneage_local_runtime_session_coordinator.py"
      - "tests/test_stoneage_refresh_runtime.py"
      - "tests/test_stoneage_local_runtime_session_coordinator.py"
      - "specs/STONEAGE-REFRESH-RUNTIME-R1.md"
      - ".github/workflows/validate-stoneage-refresh-runtime.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh runtime and cross regressions
        run: |
          python -m unittest -v \
            tests.test_stoneage_refresh_runtime \
            tests.test_stoneage_refresh_model \
            tests.test_stoneage_recovered25_refresh_probe \
            tests.test_stoneage_weaken_runtime \
            tests.test_stoneage_nocast_model \
            tests.test_stoneage_local_runtime_session_coordinator
