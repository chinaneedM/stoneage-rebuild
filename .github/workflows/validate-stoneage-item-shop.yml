name: Validate StoneAge item shop model
on:
  workflow_dispatch:
  push:
    paths:
      - research/mechanics/STONEAGE-ITEM-SHOP-CORE-R1.md
      - tools/stoneage_item_shop_model.py
      - tests/test_stoneage_item_shop_model.py
      - .github/workflows/validate-stoneage-item-shop.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_item_shop_model -v
