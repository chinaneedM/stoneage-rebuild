name: Probe Mainland StoneAge retail ISBN

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_mainland_retail_isbn_probe.py
      - tests/test_stoneage_mainland_retail_isbn_probe.py
      - .github/workflows/probe-stoneage-mainland-retail-isbn.yml

permissions:
  contents: write

concurrency:
  group: stoneage-mainland-retail-isbn
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate focused probe
        run: python3 -m unittest tests.test_stoneage_mainland_retail_isbn_probe -v
      - name: Probe exact preservation metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_mainland_retail_isbn_probe > research/recovered/STONEAGE-MAINLAND-RETAIL-ISBN-PROBE-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-MAINLAND-RETAIL-ISBN-PROBE-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Mainland StoneAge retail ISBN'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
