name: Validate StoneAge Mdfyattack reference
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-mdfyattack-reference.yml
      - tools/stoneage_mdfyattack_model.py
      - tools/stoneage_mdfyattack_source_audit.py
      - tools/stoneage_recovered25_mdfyattack_probe.py
      - tests/test_stoneage_mdfyattack_model.py
      - tests/test_stoneage_recovered25_mdfyattack_probe.py
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_mdfyattack_model tests.test_stoneage_recovered25_mdfyattack_probe tests.test_stoneage_battle_core_model tests.test_stoneage_recovered25_petskill_pressure_probe -v
