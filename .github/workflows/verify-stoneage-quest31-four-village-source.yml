name: Verify StoneAge QUEST31 four village source relations
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-QUEST31-FOUR-VILLAGE-EVENT09-12-SOURCE-R1.json'
      - 'tests/test_stoneage_quest31_four_village_source.py'
      - '.github/workflows/verify-stoneage-quest31-four-village-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-QUEST31-FOUR-VILLAGE-EVENT09-12-SOURCE-R1.json'
      - 'tests/test_stoneage_quest31_four_village_source.py'
      - '.github/workflows/verify-stoneage-quest31-four-village-source.yml'
jobs:
  derived-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_quest31_four_village_source.py' -v
