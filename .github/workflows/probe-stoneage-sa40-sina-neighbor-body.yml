name: Probe Sina neighbor download-body topology

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa40_sina_neighbor_body_probe.py
      - tests/test_stoneage_sa40_sina_neighbor_body_probe.py
      - .github/workflows/probe-stoneage-sa40-sina-neighbor-body.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa40-sina-neighbor-body
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sa40_sina_neighbor_body_probe -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa40_sina_neighbor_body_probe > research/recovered/STONEAGE-SA40-SINA-NEIGHBOR-BODY-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA40-SINA-NEIGHBOR-BODY-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: inspect Sina neighbor download bodies'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
