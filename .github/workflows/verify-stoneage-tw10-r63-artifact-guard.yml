name: Independently verify TW1.0 R63 derived-only artifact structural guard
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-r63-independent-artifact-guard-20261015, main]
    paths:
      - .github/workflows/verify-stoneage-tw10-r63-artifact-guard.yml
      - tools/stoneage_tw10_savedata_r63_derived_guard.py
      - tests/test_stoneage_tw10_savedata_r63_derived_guard.py
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated R63 derived shape and historical non-promotion controls
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_r63_derived_guard tests.test_stoneage_tw10_savedata_r63_postcall_static
          echo R63_DERIVED_GUARD_PREPARED=PASS
          echo ORIGINAL_SOURCE_ARTIFACT_NOT_YET_ACCEPTED=OPEN
