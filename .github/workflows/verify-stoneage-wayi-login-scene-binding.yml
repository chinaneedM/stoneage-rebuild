name: Verify original login graphics aliases and qualified patch resource join
on:
  push:
    paths:
      - 'tools/stoneage_wayi_login_scene_binding.py'
      - 'tests/test_stoneage_wayi_login_scene_binding.py'
      - 'research/recovered/STONEAGE-WAYI-LOGIN-SCENE-ALIAS-BINDING-R1.json'
      - '.github/workflows/verify-stoneage-wayi-login-scene-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-and-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet capstone==5.0.6
      - name: Synthetic alias/physical namespace and pairing guards
        run: python -m unittest tests.test_stoneage_wayi_login_scene_binding tests.test_stoneage_wayi_pe_resource_directory -v
      - name: Fixed small official program, exact decompressor and real source mutations
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --max-time 90 --retry 1 'https://web.archive.org/web/20060915184620id_/http://www.wayi.com.tw:80/download/file/onlineGame/sa.exe' -o /tmp/wayi-sa.exe
          curl -fLsS --max-time 90 --retry 1 'https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz' -o /tmp/upx.tar.xz
          echo '4b5a059b45b589b609ca925d210d76838be1e970b805fab3df863b7d563fbb38  /tmp/wayi-sa.exe' | sha256sum -c -
          echo '75cab4e57ab72fb4585ee45ff36388d280c7afd72aa03e8d4b9c3cbddb474193  /tmp/upx.tar.xz' | sha256sum -c -
          tar -xJf /tmp/upx.tar.xz -C /tmp upx-4.2.4-amd64_linux/upx
          echo '746af4b1b8c230641d772d6a1ba645f606ac1e7a43951247477f239f29346fad  /tmp/upx-4.2.4-amd64_linux/upx' | sha256sum -c -
          /tmp/upx-4.2.4-amd64_linux/upx -d /tmp/wayi-sa.exe -o /tmp/wayi-sa-unpacked.exe
          python -m tools.stoneage_wayi_login_scene_binding /tmp/wayi-sa-unpacked.exe --output /tmp/login-scene-metadata.json
          cmp /tmp/login-scene-metadata.json research/recovered/STONEAGE-WAYI-LOGIN-SCENE-ALIAS-BINDING-R1.json
      - name: Remove original programs; metadata is already permanent Git data
        if: always()
        run: rm -f /tmp/wayi-sa.exe /tmp/wayi-sa-unpacked.exe /tmp/upx.tar.xz /tmp/upx-4.2.4-amd64_linux/upx
