name: Verify StoneAge INTEGRATION44 original A1 source-bound visuals
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION44-JARUGA-A1-ORIGINAL-SOURCE-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_44.py'
      - '.github/workflows/verify-stoneage-integration44-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION44-JARUGA-A1-ORIGINAL-SOURCE-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_44.py'
      - '.github/workflows/verify-stoneage-integration44-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_44.py' -v
