name: Verify controlled actor-parts order R9 without original assets
on:
  push:
    paths:
      - tools/stoneage_private_scene_actor_order_r9.py
      - tools/scene-room-order-viewer-r9.html
      - tools/stoneage_scene09_*.py
      - tools/stoneage_scene09_*.cjs
      - tests/test_stoneage_scene09_*.py
      - research/recovered/STONEAGE-SCENE09-*.json
      - .github/workflows/verify-stoneage-scene09-order.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safe-metadata-and-synthetic-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow
      - run: python -m tools.stoneage_scene09_evidence_guard
      - run: python -m unittest -v tests.test_stoneage_scene09_order tests.test_stoneage_scene08_pet tests.test_stoneage_scene06_evidence
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python -m tools.stoneage_scene09_synthetic_fixture /tmp/scene09-synthetic.html
      - run: node tools/stoneage_scene09_browser_check.cjs /tmp/scene09-synthetic.html /tmp/scene09-browser
