name: PET-HIGH-FIRST-21 late year beast source replay
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_21.py'
      - 'research/pets/PET-HIGH-FIRST-21-LATE-YEAR-BEAST-SOURCE-R1.json'
      - '.github/workflows/pet-high-first-21.yml'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_21.py'
      - 'research/pets/PET-HIGH-FIRST-21-LATE-YEAR-BEAST-SOURCE-R1.json'
      - '.github/workflows/pet-high-first-21.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/stoneage_pet_high_first_21.py
