name: Verify source-ready original TW1.0 graphics category frame references
on:
  push:
    paths:
      - tools/stoneage_tw10_visual_category_spr_join.py
      - tests/test_stoneage_tw10_visual_category_spr_join.py
      - tests/test_stoneage_22_domain_source_ready_portfolio.py
      - tests/test_stoneage_tw10_visual_category_source_custody.py
      - research/recovered/STONEAGE-TW10-VISUAL-CATEGORY-SPR-JOIN-ACCEPTANCE-R1.json
      - research/recovered/STONEAGE-22-DOMAIN-SOURCE-READY-PORTFOLIO-R2.json
      - research/recovered/STONEAGE-TW10-VISUAL-CATEGORY-SPR-JOIN-R1.json
      - .github/workflows/verify-stoneage-tw10-visual-category-spr-join.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-original-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify portfolio source statuses and original TW1.0 indexes
        run: |
          python -m unittest tests.test_stoneage_22_domain_source_ready_portfolio tests.test_stoneage_tw10_visual_category_spr_join tests.test_stoneage_tw10_visual_category_source_custody -v
          python -m tools.stoneage_tw10_visual_category_spr_join --write "${{ runner.temp }}/tw10-visual-category-join.json"
      - uses: actions/upload-artifact@v4
        with:
          name: original-tw10-visual-category-join
          path: ${{ runner.temp }}/tw10-visual-category-join.json
          retention-days: 30
