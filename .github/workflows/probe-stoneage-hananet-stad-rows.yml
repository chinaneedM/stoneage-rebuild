name: Probe Hananet STAD record rows
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_stad_row_probe.py
      - tests/test_stoneage_hananet_stad_row_probe.py
      - .github/workflows/probe-stoneage-hananet-stad-rows.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-stad-rows
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_stad_row_probe -v
      - name: Extract target STAD rows
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_stad_row_probe             > research/recovered/STONEAGE-HANANET-STAD-ROWS-R1.txt
      - name: Commit derived row metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-STAD-ROWS-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: extract Hananet StoneAge STAD rows'
          git pull --rebase origin main
          git push
