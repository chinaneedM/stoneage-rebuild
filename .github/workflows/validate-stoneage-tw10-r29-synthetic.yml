name: Validate TW1.0 R29 native file API conditional synthetic and strict guard
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r29-scalar-address-20261013]
    paths:
      - .github/workflows/validate-stoneage-tw10-r29-synthetic.yml
      - tools/stoneage_tw10_savedata_native_io_r29.py
      - tools/stoneage_tw10_savedata_native_io_r29_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r29.py
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet capstone pefile
      - name: R29 and R28 synthetic and strict negative controls
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r29 tests.test_stoneage_tw10_savedata_native_io_r28
          python -m compileall -q tools/stoneage_tw10_savedata_native_io_r29.py tools/stoneage_tw10_savedata_native_io_r29_guard.py
          echo TW10_R29_SYNTHETIC_STRICT=PASS
          echo TW10_R29_ORIGINAL_EVIDENCE=OPEN
