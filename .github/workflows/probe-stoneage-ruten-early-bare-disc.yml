name: Probe early StoneAge bare disc

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_ruten_early_bare_disc_probe.py
      - tests/test_stoneage_ruten_early_bare_disc_probe.py
      - .github/workflows/probe-stoneage-ruten-early-bare-disc.yml

permissions:
  contents: write

concurrency:
  group: stoneage-ruten-early-bare-disc
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install transient image-analysis dependencies
        run: python -m pip install --disable-pip-version-check --no-input opencv-python-headless numpy
      - name: Validate bare-disc probe
        run: python3 -m unittest tests.test_stoneage_ruten_early_bare_disc_probe -v
      - name: Probe bare-disc carrier
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_ruten_early_bare_disc_probe \
            > research/recovered/STONEAGE-RUTEN-EARLY-BARE-DISC-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-RUTEN-EARLY-BARE-DISC-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe early StoneAge bare disc'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
