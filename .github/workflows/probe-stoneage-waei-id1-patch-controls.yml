name: Probe Waei StoneAge patch controls

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_id1_patch_control_probe.py
      - tests/test_stoneage_waei_id1_patch_control_probe.py
      - .github/workflows/probe-stoneage-waei-id1-patch-controls.yml

permissions:
  contents: write

concurrency:
  group: stoneage-waei-id1-patch-controls
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate probe
        run: python3 -m unittest tests.test_stoneage_waei_id1_patch_control_probe -v
      - name: Extract StoneAge patch controls
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_id1_patch_control_probe \
            > research/recovered/STONEAGE-WAEI-ID1-PATCH-CONTROLS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-WAEI-ID1-PATCH-CONTROLS-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: bind Waei StoneAge patch controls'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_waei_id1_patch_control_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: bind Waei StoneAge patch controls'
          fi
          git push
