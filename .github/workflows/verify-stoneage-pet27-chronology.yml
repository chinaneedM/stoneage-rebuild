      - "research/recovered/STONEAGE-PET35-JP1999-OPERATOR-AND-PRINT-LEADS-R1.json"
      - ".github/workflows/verify-stoneage-pet27-chronology.yml"
permissions:
  contents: read
jobs:
  chronology-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert source-exact chronological order, version separation and earliest unreviewed year
        run: python -m unittest tests.test_stoneage_pet27_chronology
      - name: PET35 evidence-layer and historic source-boundary test
        run: python -m unittest tests.test_stoneage_pet35_1999_jss_evidence_boundary
      - name: PET36 year-bounded audit source and reopen guards
        run: python -m unittest tests.test_stoneage_pet36_1999_year_audit
      - name: PET37 TW 2000 press and publisher conflicting evidence safeguards
        run: python -m unittest tests.test_stoneage_pet37_tw2000_period_press
      - name: PET38 source-qualified client-first priority and official-release boundaries
        run: python -m unittest tests.test_stoneage_pet38_client_first_priority
      - name: PET40 early acquisition, card history and candidate patch separation
        run: python -m unittest tests.test_stoneage_pet40_early_sources
      - name: PET43 verify inherited SPR matches without early official release promotion
        run: python -m unittest tests.test_stoneage_pet43_later_client_backfill
      - name: PET44 replay candidate graphic cohorts, R28 matches, duplicates, and official exclusion
        run: python -m unittest tests.test_stoneage_pet44_later_client_candidates
      - name: PET46 original TW1 same-source album 124/124 exact SPR crosswalk
        run: python -m unittest tests.test_stoneage_pet46_tw10_album_visual
      - name: PET48 KR2000 period marketing, initial pet and forward-only correction boundaries
        run: python -m unittest tests.test_stoneage_pet48_kr2000_source_boundaries
      - name: PET49 2000 TW original operator prospectus and no pet-roster promotion
        run: python -m unittest tests.test_stoneage_pet49_tw2000_operator_prospectus
      - name: PET50 2000 source-bounded year and 2001 chronological cursor
        run: python -m unittest tests.test_stoneage_pet50_year2000_bounded_audit
      - name: Replay year ordering and 2002 source attestation boundary
        run: |
          python tools/stoneage_pet27_chronology.py --validate --summary
          python tools/stoneage_pet27_chronology.py --year 1999 --region JP
          python tools/stoneage_pet27_chronology.py --year 2002
          python tools/stoneage_pet27_chronology.py --year 2026 --region KR
