name: Probe TW1.0 original R10 savedata ESI and loop predicate provenance by pinned archive

on:
  workflow_dispatch:
  push:
    branches:
      - agent/tw10-savedata-provenance-r10-20261012
    paths:
      - .github/workflows/probe-stoneage-tw10-provenance-r10-original.yml

permissions:
  contents: read

jobs:
  original-static:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
      - name: Verify static path and import-count semantics on synthetic x86
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python3 -m unittest tests.test_stoneage_tw10_savedata_provenance_r10 -v
      - name: Retrieve strictly catalog-pinned original archive in bounded ranges
        run: |
          set -euo pipefail
          python3 -m tools.stoneage_tw10_archive_parallel_download \
            --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar
      - name: Extract accepted disc image for static analysis only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r10
          7z x -y -o/tmp/stoneage-r10 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r10/STONEAGE.bin)" = 523449360
      - name: Verify original embedded hashes and emit bounded R10 metadata only
        run: |
          set -euo pipefail
          python3 -m tools.stoneage_tw10_savedata_provenance_r10 \
            --bin /tmp/stoneage-r10/STONEAGE.bin | tee /tmp/stoneage-r10-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.stoneage_tw10_savedata_provenance_r10 import SCHEMA, STATUS
          report=json.loads(Path('/tmp/stoneage-r10-report.json').read_text())
          assert report['schema']==SCHEMA and report['status']==STATUS
          assert report['delegate_helper']['root_rva']==0x491a1
          assert report['parent_nodes']==50 and report['parent_edges']==55
          for key in ('delegate_effects_admitted','loop_runtime_bound_proven','caller_resumption_admitted',
                      'filename_api_link_proven','handle_buffer_size_link_proven','native_io_executed',
                      'fixed_128_byte_schema_proven','original_bytes_published'):
              assert report[key] is False
          print('TW10_R10_ORIGINAL_STATIC_HELPER=PASS')
          print('TW10_R10_NATIVE_SAVE_IO=OPEN')
          PY
      - name: Remove copyrighted original media even on error
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r10
      - name: Upload derived-only JSON when every provenance gate succeeded
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-original-helper-r10-derived
          path: /tmp/stoneage-r10-report.json
          retention-days: 21
