name: Validate StoneAge BattleModel base DamageSub settlement

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-battlemodel-settlement.yml"
      - "tools/stoneage_battlemodel_settlement_source_audit.py"
      - "tools/stoneage_battlemodel_hit_loop.py"
      - "tools/stoneage_battlemodel_physical_attackseq.py"
      - "tools/stoneage_battlemodel_physical_source_audit.py"
      - "tools/stoneage_battlemodel_itemcrush_model.py"
      - "tools/stoneage_battlemodel_itemcrush_source_audit.py"
      - "tools/stoneage_battlemodel_prepared_handoff.py"
      - "tools/stoneage_battlemodel_round_action.py"
      - "tools/stoneage_default_pet_exit_source_audit.py"
      - "tools/stoneage_profit_exit_source_audit.py"
      - "tools/stoneage_battlemodel_profit_tail_source_audit.py"
      - "tools/stoneage_battlemodel_guardian_profit_tail_source_audit.py"
      - "tools/stoneage_battlemodel_damagesub_profit_tail_source_audit.py"\n      - "tools/stoneage_battlemodel_full_battling_profit_tail_source_audit.py"
      - "tools/stoneage_profit_exit_scan_model.py"
      - "tools/stoneage_nocast_runtime_state.py"
      - "tools/stoneage_battle_round_model.py"
      - "tools/stoneage_default_pet_exit_model.py"
      - "tools/stoneage_battle_state_model.py"
      - "tools/stoneage_local_runtime_session_coordinator.py"
      - "tools/stoneage_battle_core_model.py"
      - "tools/stoneage_battle_guardian_model.py"
      - "tools/stoneage_battle_status_model.py"
      - "tools/stoneage_battle_damage_react_model.py"
      - "tools/stoneage_enemy_ai_battlemodel_bridge.py"
      - "tools/stoneage_battlemodel_reference_model.py"
      - "tools/stoneage_battlemodel_pet_guard_source_audit.py"
      - "tests/test_stoneage_battlemodel_hit_loop.py"
      - "tests/test_stoneage_battlemodel_physical_attackseq.py"
      - "tests/test_stoneage_battlemodel_itemcrush.py"
      - "tests/test_stoneage_battlemodel_prepared_handoff.py"
      - "tests/test_stoneage_battlemodel_ordinary_round.py"
      - "tests/test_stoneage_default_pet_ultimate_runtime.py"
      - "tests/test_stoneage_profit_exit_scan_model.py"
      - "tests/test_stoneage_player_exit_status_runtime.py"
      - "tests/test_stoneage_battle_round_model.py"
      - "tests/test_stoneage_battlemodel_admission.py"
      - "specs/STONEAGE-BATTLEMODEL-PHYSICAL-ATTACKSEQ-R1.md"
      - "specs/STONEAGE-BATTLEMODEL-ITEMCRUSH-R1.md"
      - "specs/STONEAGE-BATTLEMODEL-PREPARED-HANDOFF-R1.md"
      - "specs/STONEAGE-BATTLEMODEL-ORDINARY-ROUND-R1.md"
      - "specs/STONEAGE-BATTLEMODEL-DEFAULT-EXIT-AUDIT-R1.md"
      - "specs/STONEAGE-PVE-PROFIT-EXIT-NATIVE-AUDIT-R1.md"
      - "specs/STONEAGE-PVE-PROFIT-EXIT-SCAN-MODEL-R1.md"
      - "specs/STONEAGE-BATTLEMODEL-PROFIT-TAIL-SPLICE-R1.md"
      - "specs/STONEAGE-BATTLEMODEL-GUARDIAN-PROFIT-TAIL-R1.md"
      - "specs/STONEAGE-BATTLEMODEL-DAMAGESUB-PROFIT-TAIL-R1.md"
      - "specs/STONEAGE-PLAYER-EXIT-STATUS-RUNTIME-R1.md"
      - "specs/STONEAGE-DEFAULT-PET-ULTIMATE-RUNTIME-R1.md"
      - "specs/STONEAGE-BATTLEMODEL-SETTLEMENT-AUDIT-R1.md"

concurrency:
  group: stoneage-battlemodel-settlement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify bounded physical AttackSeq loop and shared primitives
        run: |
          python -m unittest -v \
            tests.test_stoneage_battlemodel_hit_loop \
            tests.test_stoneage_battlemodel_physical_attackseq \
            tests.test_stoneage_battlemodel_itemcrush \
            tests.test_stoneage_battlemodel_prepared_handoff \
            tests.test_stoneage_battlemodel_ordinary_round \
            tests.test_stoneage_default_pet_ultimate_runtime \
            tests.test_stoneage_profit_exit_scan_model \
            tests.test_stoneage_player_exit_status_runtime \
            tests.test_stoneage_weaken_runtime \
            tests.test_stoneage_barrier_runtime \
            tests.test_stoneage_nocast_model \
            tests.test_stoneage_setmagicpet_runtime \
            tests.test_stoneage_attack_crazed_runtime \
            tests.test_stoneage_wildviolent_runtime \
            tests.test_stoneage_2battletimid_runtime \
            tests.test_stoneage_singleplayer_runtime \
            tests.test_stoneage_group_battle_runtime \
            tests.test_stoneage_battle_round_model \
            tests.test_stoneage_battle_state_model \
            tests.test_stoneage_local_runtime_session_coordinator \
            tests.test_stoneage_battlemodel_admission \
            tests.test_stoneage_battlemodel_reference_model \
            tests.test_stoneage_battle_damage_react_model \
            tests.test_stoneage_battle_status_model \
            tests.test_stoneage_battle_core_model \
            tests.test_stoneage_battle_guardian_model
      - name: Recover pinned source profiles
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_guard_break2_source_audit import PINNED
          repositories={
              "gavin":"gavinlinasd/StoneAge",
              "iris":"iriselia/StoneAge",
              "bismarck":"BismarckDD/stoneage",
          }
          for name,repo in repositories.items():
              root=Path("/tmp/battlemodel-hit")/name
              root.mkdir(parents=True,exist_ok=True)
              subprocess.run(["git","init",str(root)],check=True)
              subprocess.run(["git","-C",str(root),"fetch","--depth","1",
                  "https://github.com/"+repo+".git",PINNED[name]],check=True)
              subprocess.run(["git","-C",str(root),"checkout","--detach",
                  "FETCH_HEAD"],check=True)
          PY
      - name: Verify explicit DEFAULTPET helper and separate exit anchors
        run: |
          python -m tools.stoneage_default_pet_exit_source_audit \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/default-pet-exit.txt
          cat /tmp/default-pet-exit.txt
          test "$(grep -c 'native_default_pet_exit_cases=162' /tmp/default-pet-exit.txt)" = 3
          grep -F 'TOTAL|native_default_pet_exit_cases=486' /tmp/default-pet-exit.txt
          grep -F 'RESOLUTION|EXPLICIT_DEFAULT_PET_EXIT_HELPER_NATIVE_PASS' /tmp/default-pet-exit.txt
      - name: Execute bounded original PvE profit and exit composition
        run: |
          python -m tools.stoneage_profit_exit_source_audit \
            --verify-scan-model \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/profit-exit-native.txt
          cat /tmp/profit-exit-native.txt
          test "$(grep -c '\"native_profit_exit_cases\": 6552' /tmp/profit-exit-native.txt)" = 3
          grep -F 'TOTAL|native_profit_exit_cases=19656|original_functions=7|status_fields=10' /tmp/profit-exit-native.txt
          grep -F 'RESOLUTION|BOUNDED_PVE_PROFIT_EXIT_NATIVE_COMPOSITION_PASS' /tmp/profit-exit-native.txt
          test "$(grep -c '\"immutable_scan_model_native_comparisons\": 6552' /tmp/profit-exit-native.txt)" = 3
          grep -F 'MODEL|immutable_scan_model_native_comparisons=19656' /tmp/profit-exit-native.txt
          grep -F 'RESOLUTION|IMMUTABLE_PVE_PROFIT_EXIT_SCAN_MODEL_NATIVE_PASS' /tmp/profit-exit-native.txt
      - name: Execute BattleModel dispatch-tail profit splice
        run: |
          python -m tools.stoneage_battlemodel_profit_tail_source_audit \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/battlemodel-profit-tail.txt
          cat /tmp/battlemodel-profit-tail.txt
          test "$(grep -c '"native_dispatch_tail_cases": 3' /tmp/battlemodel-profit-tail.txt)" = 3
          grep -F 'TOTAL|native_dispatch_tail_cases=9|profiles=3' /tmp/battlemodel-profit-tail.txt
          grep -F 'RESOLUTION|BATTLEMODEL_DISPATCH_TAIL_PROFIT_SPLICE_NATIVE_PASS' \
            /tmp/battlemodel-profit-tail.txt
      - name: Execute same-harness original Guardian profit tail
        run: |
          python -m tools.stoneage_battlemodel_guardian_profit_tail_source_audit \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/battlemodel-guardian-profit-tail.txt
          cat /tmp/battlemodel-guardian-profit-tail.txt
          test "$(grep -c '"native_same_harness_guardian_tail_cases": 3' /tmp/battlemodel-guardian-profit-tail.txt)" = 3
          grep -F 'TOTAL|native_same_harness_guardian_tail_cases=9|profiles=3' \
            /tmp/battlemodel-guardian-profit-tail.txt
          grep -F 'RESOLUTION|BATTLEMODEL_SAME_HARNESS_GUARDIAN_PROFIT_TAIL_NATIVE_PASS' \
            /tmp/battlemodel-guardian-profit-tail.txt
      - name: Execute same-harness exact DamageSub profit tail
        run: |
          python -m tools.stoneage_battlemodel_damagesub_profit_tail_source_audit \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/battlemodel-damagesub-profit-tail.txt
          cat /tmp/battlemodel-damagesub-profit-tail.txt
          test "$(grep -c '"native_same_harness_exact_damagesub_tail_cases": 3' /tmp/battlemodel-damagesub-profit-tail.txt)" = 3
          grep -F 'TOTAL|native_same_harness_exact_damagesub_tail_cases=9|profiles=3' \
            /tmp/battlemodel-damagesub-profit-tail.txt\n            /tmp/battlemodel-full-battling-profit-tail.txt
          grep -F 'RESOLUTION|BATTLEMODEL_SAME_HARNESS_EXACT_DAMAGESUB_PROFIT_TAIL_NATIVE_PASS' \
            /tmp/battlemodel-damagesub-profit-tail.txt
      - name: Execute full original Battling BattleModel profit tail
        run: |
          python -m tools.stoneage_battlemodel_full_battling_profit_tail_source_audit \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/battlemodel-full-battling-profit-tail.txt
          cat /tmp/battlemodel-full-battling-profit-tail.txt
          test "$(grep -c '"native_full_battling_tail_cases": 3' /tmp/battlemodel-full-battling-profit-tail.txt)" = 3
          grep -F 'TOTAL|native_full_battling_tail_cases=9|profiles=3' \
            /tmp/battlemodel-full-battling-profit-tail.txt
          grep -F 'RESOLUTION|BATTLEMODEL_FULL_BATTLING_PROFIT_TAIL_NATIVE_PASS' \
            /tmp/battlemodel-full-battling-profit-tail.txt
      - name: Recheck original bounded Weaken attribute recalculation
        run: |
          python -m tools.stoneage_weaken_source_audit \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/player-exit-weaken-native.txt
          cat /tmp/player-exit-weaken-native.txt
          test "$(grep -c 'name=recalculation_cases|value=128' /tmp/player-exit-weaken-native.txt)" = 3
          grep -F 'RESOLUTION|WEAKEN_FIXED_SOURCE_CLOSED_SAFE_REFERENCE' /tmp/player-exit-weaken-native.txt
      - name: Compare equipment-free physical AttackSeq against native functions
        run: |
          python -m tools.stoneage_battlemodel_physical_source_audit \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/battlemodel-physical-attackseq.txt
          cat /tmp/battlemodel-physical-attackseq.txt
          test "$(grep -c 'physical_attackseq_model_native_comparisons=232' /tmp/battlemodel-physical-attackseq.txt)" = 3
          grep -F 'RESOLUTION|BATTLEMODEL_EQUIPMENT_FREE_PHYSICAL_ATTACKSEQ_MODEL_NATIVE_PASS' \
            /tmp/battlemodel-physical-attackseq.txt
      - name: Compare empty-equipment ItemCrush and surviving helper chronology
        run: |
          python -m tools.stoneage_battlemodel_itemcrush_source_audit \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/battlemodel-itemcrush.txt
          cat /tmp/battlemodel-itemcrush.txt
          test "$(grep -c 'itemcrush_model_native_comparisons=760' /tmp/battlemodel-itemcrush.txt)" = 2
          grep -F 'itemcrush_model_native_comparisons=1900' /tmp/battlemodel-itemcrush.txt
          grep -F 'TOTAL|itemcrush_model_native_comparisons=3420|source_default_rate=400000' /tmp/battlemodel-itemcrush.txt
          grep -F 'RESOLUTION|BATTLEMODEL_EMPTY_EQUIPMENT_ITEMCRUSH_NATIVE_CHRONOLOGY_PASS' /tmp/battlemodel-itemcrush.txt
      - name: Audit bounded native no-ride DamageSub
        run: |
          python -m tools.stoneage_battlemodel_settlement_source_audit \
            --verify-runtime-model \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/battlemodel-settlement.txt
          cat /tmp/battlemodel-settlement.txt
          test "$(grep -c 'native_hits=640' /tmp/battlemodel-settlement.txt)" = 3
          grep -F 'RESOLUTION|BATTLEMODEL_NO_RIDE_SETTLEMENT_LOCAL_NATIVE_PASS' \
            /tmp/battlemodel-settlement.txt
          test "$(grep -c 'physical_marker_model_native_comparisons=160' /tmp/battlemodel-settlement.txt)" = 3
          grep -F 'RESOLUTION|BATTLEMODEL_PHYSICAL_MARKER_RUNTIME_MODEL_NATIVE_PASS' \
            /tmp/battlemodel-settlement.txt
      - name: Verify literal pet guard in explicit reduced SIDE_OFFSET10
        run: |
          python -m tools.stoneage_battlemodel_pet_guard_source_audit \
            --gavin-dir /tmp/battlemodel-hit/gavin \
            --iris-dir /tmp/battlemodel-hit/iris \
            --bismarck-dir /tmp/battlemodel-hit/bismarck \
            > /tmp/battlemodel-pet-guard.txt
          cat /tmp/battlemodel-pet-guard.txt
          test "$(grep -c 'native_pet_guard_cases=20' /tmp/battlemodel-pet-guard.txt)" = 3
          grep -F 'RESOLUTION|BATTLEMODEL_LITERAL_PET_GUARD_REDUCED10_NATIVE_PASS' \
            /tmp/battlemodel-pet-guard.txt
      - uses: actions/upload-artifact@v4
        with:
          name: battlemodel-settlement
          path: |
            /tmp/default-pet-exit.txt
            /tmp/profit-exit-native.txt
            /tmp/battlemodel-profit-tail.txt
            /tmp/battlemodel-guardian-profit-tail.txt
            /tmp/battlemodel-damagesub-profit-tail.txt
            /tmp/battlemodel-full-battling-profit-tail.txt
            /tmp/player-exit-weaken-native.txt
            /tmp/battlemodel-physical-attackseq.txt
            /tmp/battlemodel-itemcrush.txt
            /tmp/battlemodel-settlement.txt
            /tmp/battlemodel-pet-guard.txt
