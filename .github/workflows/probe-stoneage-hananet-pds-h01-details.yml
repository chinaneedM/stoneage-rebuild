name: Probe Hananet PDS H01 details
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_pds_h01_detail_probe.py
      - tests/test_stoneage_hananet_pds_h01_detail_probe.py
      - .github/workflows/probe-stoneage-hananet-pds-h01-details.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-pds-h01-details
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_pds_h01_detail_probe -v
      - name: Enumerate H01 detail records
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_pds_h01_detail_probe             > research/recovered/STONEAGE-HANANET-PDS-H01-DETAILS-R1.txt
      - name: Commit derived detail metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-PDS-H01-DETAILS-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: enumerate Hananet PDS H01 details'
          git pull --rebase origin main
          git push
