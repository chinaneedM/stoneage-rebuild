name: Verify CN2003 group2 later manor report boundaries
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN2003-GROUP2-MANOR-REPORT-*.json'
      - 'tools/stoneage_cn2003_group2_manor_report.py'
      - 'tools/stoneage_cn2011_stall_source.py'
      - 'research/recovered/STONEAGE-CN2003-CLASSIC20-BRANCH-SOURCE-R1.json'
      - 'tests/test_stoneage_cn2003_group2_manor_report.py'
      - '.github/workflows/verify-stoneage-cn2003-group2-manor-report.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN2003-GROUP2-MANOR-REPORT-*.json'
      - 'tools/stoneage_cn2003_group2_manor_report.py'
      - 'tools/stoneage_cn2011_stall_source.py'
      - 'research/recovered/STONEAGE-CN2003-CLASSIC20-BRANCH-SOURCE-R1.json'
      - 'tests/test_stoneage_cn2003_group2_manor_report.py'
      - '.github/workflows/verify-stoneage-cn2003-group2-manor-report.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check source order, prior notice, ambiguous headcount and image limits
        run: python -m unittest tests.test_stoneage_cn2003_group2_manor_report -v
      - name: Fetch report and actual JPEG and reject eighteen real source mutations
        run: python -m tools.stoneage_cn2003_group2_manor_report --fetch --output /tmp/cn2003-group2-manor/replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: cn2003-group2-manor-derived-replay
          path: /tmp/cn2003-group2-manor/replay.json
          if-no-files-found: error
          retention-days: 30
