name: Verify Stage A WORLD13 two-script source item chain
on:
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-13-*'
      - 'tests/test_stoneage_stage_a_world13_item_chain.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world13.yml'
  push:
    branches: [main]
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-13-*'
      - 'tests/test_stoneage_stage_a_world13_item_chain.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world13.yml'
jobs:
  source-bound-item-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_stage_a_world13_item_chain.py' -v
