name: PET-HIGH-FIRST-64 module field coverage
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_64_coverage.py'
      - '.github/workflows/pet-high-first-64-coverage.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-64-MODULE-COVERAGE-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-64-MODULE-COVERAGE-SUMMARY-R1.json'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_64_coverage.py'
      - '.github/workflows/pet-high-first-64-coverage.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-64-MODULE-COVERAGE-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-64-MODULE-COVERAGE-SUMMARY-R1.json'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact historical PET64 replay on the original source tree
        uses: actions/checkout@v4
        with:
          ref: 61d43361cfaa9b285f69800fecb7d4d394435430
          path: pet64-history
          persist-credentials: false
      - name: Compare original summary without overwriting the immutable receipt
        run: |
          set -euo pipefail
          test "$(git -C pet64-history rev-parse HEAD)" = 61d43361cfaa9b285f69800fecb7d4d394435430
          test "$(git -C pet64-history rev-parse HEAD^{tree})" = 26fd6217e7dbc44d836234d353fed87b3c2a765c
          (cd pet64-history && python -m tools.stoneage_pet_high_first_64_coverage) > "$RUNNER_TEMP/pet64-historical.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("research/pets/PET-HIGH-FIRST-64-MODULE-COVERAGE-SUMMARY-R1.json").read_bytes())
          assert (r["source_candidate"],r["source_tree"])==("61d43361cfaa9b285f69800fecb7d4d394435430","26fd6217e7dbc44d836234d353fed87b3c2a765c")
          lines=Path(os.environ["RUNNER_TEMP"],"pet64-historical.txt").read_text().splitlines()
          matches=[json.loads(x.split("=",1)[1]) for x in lines if x.startswith("PET64_SUMMARY=")]
          assert matches==[r["summary"]], "exact historical summary differs"
          print("PET64_EXACT_HISTORICAL_REPLAY_OK")
          PY
      - run: python -m tools.stoneage_pet_high_first_64_coverage
      - run: python -m tools.stoneage_pet_high_first_64_coverage --current > "$RUNNER_TEMP/pet-current-coverage.json"
      - run: python -m tools.stoneage_pet_high_first_64_coverage --all > "$RUNNER_TEMP/pet64-coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pet64-field-coverage
          path: ${{ runner.temp }}/pet64-coverage.json
          retention-days: 7
          if-no-files-found: error
