name: PET-HIGH-FIRST-64 module field coverage
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_64_coverage.py'
      - '.github/workflows/pet-high-first-64-coverage.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-64-MODULE-COVERAGE-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-64-MODULE-COVERAGE-SUMMARY-R1.json'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_64_coverage.py'
      - '.github/workflows/pet-high-first-64-coverage.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-64-MODULE-COVERAGE-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-64-MODULE-COVERAGE-SUMMARY-R1.json'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m tools.stoneage_pet_high_first_64_coverage
      - run: python -m tools.stoneage_pet_high_first_64_coverage --current > "$RUNNER_TEMP/pet-current-coverage.json"
      - run: python -m tools.stoneage_pet_high_first_64_coverage --all > "$RUNNER_TEMP/pet64-coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pet64-field-coverage
          path: ${{ runner.temp }}/pet64-coverage.json
          retention-days: 7
          if-no-files-found: error
