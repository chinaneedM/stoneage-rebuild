name: Validate bounded 2001 media article and pet-source bridge
on:
  workflow_dispatch:
  push:
    paths:
      - research/recovered/STONEAGE-EARLY-MEDIA-ARTICLE-PET-SOURCE-R1.json
      - tests/test_stoneage_early_media_article_source.py
      - .github/workflows/validate-stoneage-early-media-article-source.yml
permissions:
  contents: read
jobs:
  media-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest tests.test_stoneage_early_media_article_source -v
