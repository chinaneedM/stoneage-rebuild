name: Verify StoneAge INTEGRATION15 Hotoru pet service joins
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION15-HOTORU-PET-SERVICE-BRIDGE-R1.json'
      - 'tests/test_stoneage_integration_module_15.py'
      - '.github/workflows/verify-stoneage-integration15-pet-services.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION15-HOTORU-PET-SERVICE-BRIDGE-R1.json'
      - 'tests/test_stoneage_integration_module_15.py'
      - '.github/workflows/verify-stoneage-integration15-pet-services.yml'
jobs:
  public-source-join:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_15.py' -v
