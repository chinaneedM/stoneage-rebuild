name: Census Sina download CGI topology

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sina_download_cgi_topology_census.py
      - tests/test_stoneage_sina_download_cgi_topology_census.py
      - .github/workflows/probe-stoneage-sina-download-cgi-topology.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sina-download-cgi-topology
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sina_download_cgi_topology_census -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sina_download_cgi_topology_census \
            > research/recovered/STONEAGE-SINA-DOWNLOAD-CGI-TOPOLOGY-R1.txt
      - name: Commit derived topology only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SINA-DOWNLOAD-CGI-TOPOLOGY-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: census Sina download CGI topology'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
