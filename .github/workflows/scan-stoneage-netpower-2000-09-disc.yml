name: Scan StoneAge NetPower 2000-09 disc

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_netpower_2000_09_disc_scan.py
      - tests/test_stoneage_netpower_2000_09_disc_scan.py
      - .github/workflows/scan-stoneage-netpower-2000-09-disc.yml

permissions:
  contents: write

concurrency:
  group: stoneage-netpower-2000-09-disc
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_netpower_2000_09_disc_scan -v
      - name: Scan NetPower 2000-09 carrier directories
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_netpower_2000_09_disc_scan \
            > research/recovered/STONEAGE-NETPOWER-2000-09-DISC-SCAN-R1.txt
      - name: Commit derived directory metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-NETPOWER-2000-09-DISC-SCAN-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan NetPower 2000-09 carrier'
          git pull --rebase origin main
          git push
