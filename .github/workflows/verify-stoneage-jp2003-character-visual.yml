name: Verify official Japanese character page DOM pairs and one historical illustration
on:
  push:
    paths:
      - tools/stoneage_jp2003_character_visual.py
      - tests/test_stoneage_jp2003_character_visual.py
      - research/recovered/STONEAGE-JP2003-CHARACTER-VISUAL-*.json
      - docs/specs/STONEAGE-JP2003-CHARACTER-VISUAL-SOURCE-R1.md
      - .github/workflows/verify-stoneage-jp2003-character-visual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-two-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoder
        run: python -m pip install Pillow==12.3.0
      - name: Reject false names IDs DOM pairs dates and visual coverage
        run: python -m unittest tests.test_stoneage_jp2003_character_visual -v
      - name: Reacquire exact official HTML and sole GIF then derive metadata only
        run: python -m tools.stoneage_jp2003_character_visual --output output/derived.json
      - name: Compare full derived report to durable Git content
        run: cmp output/derived.json research/recovered/STONEAGE-JP2003-CHARACTER-VISUAL-SOURCE-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: jp2003-character-source-derived-only
          path: output/derived.json
          retention-days: 30
