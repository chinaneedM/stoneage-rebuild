name: Probe Waei central download ID1 ID2

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_download_id12_probe.py
      - tests/test_stoneage_waei_download_id12_probe.py
      - .github/workflows/probe-stoneage-waei-download-id12.yml

permissions:
  contents: write

concurrency:
  group: stoneage-waei-download-id12
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate focused probe
        run: python3 -m unittest tests.test_stoneage_waei_download_id12_probe -v
      - name: Replay ID1 and ID2
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_download_id12_probe \
            > research/recovered/STONEAGE-WAEI-DOWNLOAD-ID12-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-WAEI-DOWNLOAD-ID12-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: replay Waei central download ID1 ID2'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_waei_download_id12_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: replay Waei central download ID1 ID2'
          fi
          git push
