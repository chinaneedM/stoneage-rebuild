name: Verify CN2.0 healing table anomalies and equipment context
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN20-HEALING-SPELLS-*.json'
      - 'research/recovered/STONEAGE-CN20-BATTLE-COMMANDS-DEFEAT-SOURCE-R1.json'
      - 'tools/stoneage_cn20_healing_spells_source.py'
      - 'tools/stoneage_cn20_recordpoint_source.py'
      - 'tools/stoneage_cn2003_group2_manor_report.py'
      - 'tests/test_stoneage_cn20_healing_spells_source.py'
      - '.github/workflows/verify-stoneage-cn20-healing-spells-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN20-HEALING-SPELLS-*.json'
      - 'research/recovered/STONEAGE-CN20-BATTLE-COMMANDS-DEFEAT-SOURCE-R1.json'
      - 'tools/stoneage_cn20_healing_spells_source.py'
      - 'tools/stoneage_cn20_recordpoint_source.py'
      - 'tools/stoneage_cn2003_group2_manor_report.py'
      - 'tests/test_stoneage_cn20_healing_spells_source.py'
      - '.github/workflows/verify-stoneage-cn20-healing-spells-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check literal plus10, rowspan groups and unproven runtime boundaries
        run: python -m unittest tests.test_stoneage_cn20_healing_spells_source -v
      - name: Refetch two exact HTML pages and reject eighteen real source mutations
        run: python -m tools.stoneage_cn20_healing_spells_source --fetch --output /tmp/cn20-healing/replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: cn20-healing-spells-derived-replay
          path: /tmp/cn20-healing/replay.json
          if-no-files-found: error
          retention-days: 30
