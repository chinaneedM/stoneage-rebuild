name: PET-DETAIL02/03/04 classic PC source-only pet and player-claim regression
on:
  push:
    paths:
      - 'research/pets/CN50-SOURCE-OBSERVATIONS-R1.json'
      - 'research/pets/PET-PROGRESS-R1.json'
      - 'docs/pets/CN50-SOURCE-OBSERVATIONS.md'
      - 'docs/pets/cn50-observations/**'
      - 'docs/pets/INDEX.md'
      - 'research/recovered/STONEAGE-PET126R-CN50-PC-ORIGINAL-ALBUM-FULL-362-SLOT-SOURCE-CATALOGUE-R1.json'
      - 'tests/test_stoneage_pet_cn50_source_observations_r1.py'
      - 'tests/test_stoneage_pet_detail03_operator_award_gap_r1.py'
      - 'tests/test_stoneage_pet_detail04_sina2003_player_claims_r1.py'
      - 'research/pets/PET-DETAIL-EVIDENCE04-SINA2003-15-PLAYER-CLAIMS-R1.json'
      - 'docs/pets/CN2003-SINA-PLAYER-CLAIMS-15-FACTCHECK.md'
      - 'docs/HISTORICAL-TIMELINE.md'
      - 'research/pets/PET-DETAIL-EVIDENCE03-CN2003-GM-ROLE-BRIDGE-R1.json'
      - 'docs/pets/CN2003-OPERATOR-AWARD-SOURCE-CROSSWALK.md'
      - 'docs/pets/TW10-G100344.md'
      - 'docs/pets/TW10-G100350.md'
      - 'docs/pets/TW10-G100360.md'
      - '.github/workflows/validate-stoneage-pet-cn50-source-observations.yml'
  pull_request:
    paths:
      - 'research/pets/CN50-SOURCE-OBSERVATIONS-R1.json'
      - 'research/pets/PET-PROGRESS-R1.json'
      - 'docs/pets/CN50-SOURCE-OBSERVATIONS.md'
      - 'docs/pets/cn50-observations/**'
      - 'docs/pets/INDEX.md'
      - 'research/recovered/STONEAGE-PET126R-CN50-PC-ORIGINAL-ALBUM-FULL-362-SLOT-SOURCE-CATALOGUE-R1.json'
      - 'tests/test_stoneage_pet_cn50_source_observations_r1.py'
      - 'tests/test_stoneage_pet_detail03_operator_award_gap_r1.py'
      - 'tests/test_stoneage_pet_detail04_sina2003_player_claims_r1.py'
      - 'research/pets/PET-DETAIL-EVIDENCE04-SINA2003-15-PLAYER-CLAIMS-R1.json'
      - 'docs/pets/CN2003-SINA-PLAYER-CLAIMS-15-FACTCHECK.md'
      - 'docs/HISTORICAL-TIMELINE.md'
      - 'research/pets/PET-DETAIL-EVIDENCE03-CN2003-GM-ROLE-BRIDGE-R1.json'
      - 'docs/pets/CN2003-OPERATOR-AWARD-SOURCE-CROSSWALK.md'
      - 'docs/pets/TW10-G100344.md'
      - 'docs/pets/TW10-G100350.md'
      - 'docs/pets/TW10-G100360.md'
      - '.github/workflows/validate-stoneage-pet-cn50-source-observations.yml'
permissions:
  contents: read
jobs:
  cn50-client-source-only-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently replay 362 album records and 181 source observation pages
        run: |
          python -m unittest discover -s tests -p 'test_stoneage_pet_cn50_source_observations_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_individual_profiles_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_internal_ids_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_documentary_waei2001_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail03_operator_award_gap_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail04_sina2003_player_claims_r1.py' -v
