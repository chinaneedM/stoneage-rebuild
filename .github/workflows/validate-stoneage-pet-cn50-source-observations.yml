permissions:
  contents: read
jobs:
  cn50-client-source-only-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently replay 362 album records and 181 source observation pages
        run: |
          python -m unittest discover -s tests -p 'test_stoneage_pet_cn50_source_observations_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_individual_profiles_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_internal_ids_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_documentary_waei2001_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail03_operator_award_gap_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail04_sina2003_player_claims_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail05_cn70_operator_tournament_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail06_cn2004_riding_crosswalk_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail07_cn2001_player_initial_ranges_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail08_tw10_mixed25_server_stat_crosswalk_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail09_2016_pc_birth_growth_lv1_source_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail10_later_pc_stat_projection_k_boundary_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail11_three_pc_k_sender_lineages_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail12_tw10_native_k_to_status_view_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail13_tw10_w_skill_ui_bridge_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail14_three_pc_w_skill_sender_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail15_six_tw10_skill_claims_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail16_tw10_native_battle_skill_r1.py' -v
