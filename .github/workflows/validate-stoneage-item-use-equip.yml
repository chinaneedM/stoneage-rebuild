name: Validate StoneAge item use equip model
on:
  workflow_dispatch:
  push:
    paths:
      - research/mechanics/STONEAGE-ITEM-USE-EQUIP-CORE-R1.md
      - tools/stoneage_item_use_equip_model.py
      - tests/test_stoneage_item_use_equip_model.py
      - .github/workflows/validate-stoneage-item-use-equip.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_item_use_equip_model -v
