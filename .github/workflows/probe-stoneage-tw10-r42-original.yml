name: Probe TW1.0 original R42 savedata-wrapper native IO correspondence candidates
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r42-payload-wrappers-20261014]
    paths:
      - .github/workflows/probe-stoneage-tw10-r42-original.yml
      - tools/stoneage_tw10_savedata_native_io_r42.py
      - tools/stoneage_tw10_savedata_native_io_r42_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r42.py
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: R42 and inherited synthetic strict gates
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r42 tests.test_stoneage_tw10_savedata_native_io_r41 tests.test_stoneage_tw10_savedata_native_io_r40
      - name: Retrieve authenticated transient TW1.0 retail archive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m tools.stoneage_tw10_archive_parallel_download --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar; then
              echo TW10_R42_PINNED_ARCHIVE=PASS
              break
            fi
            rm -f /tmp/CD_DIC.rar
            if [ "$attempt" -eq 3 ]; then
              echo TW10_R42_SOURCE_UNAVAILABLE=OPEN
              exit 1
            fi
            sleep 10
          done
      - name: Extract original BIN transient only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r42
          7z x -y -o/tmp/stoneage-r42 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r42/STONEAGE.bin)" -eq 523449360
      - name: Derive bounded R42 static-only original metadata
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_native_io_r42 --bin /tmp/stoneage-r42/STONEAGE.bin > /tmp/stoneage-r42-derived.json
          python -m tools.stoneage_tw10_savedata_native_io_r42_guard --report /tmp/stoneage-r42-derived.json
          test "$(stat -c %s /tmp/stoneage-r42-derived.json)" -le 300000
          echo TW10_R42_ORIGINAL_STATIC_ONLY=PASS
          echo TW10_R42_NATIVE_SAVE=OPEN
      - name: Always purge proprietary source
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r42
      - name: Upload derived metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-r42-original-payload-wrappers-derived
          path: /tmp/stoneage-r42-derived.json
          retention-days: 21
