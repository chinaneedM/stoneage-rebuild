name: Verify MAP01 actual original map source batch and paired variants
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-MAP-SCENE-MODULE-01-ORIGINAL-SOURCE-MANIFEST-R1.json'
      - 'tests/test_stoneage_map_scene_module_01.py'
      - '.github/workflows/verify-stoneage-map-scene-module-01.yml'
  workflow_dispatch:
jobs:
  original-map-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_map_scene_module_01.py' -v
