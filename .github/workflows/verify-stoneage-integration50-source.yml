name: Verify StoneAge INTEGRATION50 room service source bridge
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION50-28-ROOM-SHOP-PET-ARGUMENT-BRIDGE-R1.json'
      - 'tests/test_stoneage_integration_module_50.py'
      - '.github/workflows/verify-stoneage-integration50-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION50-28-ROOM-SHOP-PET-ARGUMENT-BRIDGE-R1.json'
      - 'tests/test_stoneage_integration_module_50.py'
      - '.github/workflows/verify-stoneage-integration50-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_50.py' -v
