name: Probe recovered StoneAge Bus Air usage
concurrency:
  group: stoneage-25-transport-usage
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-stoneage-25-transport-usage.yml
      - tools/stoneage_transport_usage_probe.py
      - tests/test_stoneage_transport_usage_probe.py
      - tools/stoneage_shadowed_branch_transport_probe.py
      - tests/test_stoneage_shadowed_branch_transport_probe.py
      - tools/stoneage_shadowed_branch_warpman_gate_probe.py
      - tests/test_stoneage_shadowed_branch_warpman_gate_probe.py
      - tools/stoneage_shadowed_branch_warpman_free_probe.py
      - tests/test_stoneage_shadowed_branch_warpman_free_probe.py
      - tools/stoneage_shadowed_branch_warpman_satisfiability_probe.py
      - tests/test_stoneage_shadowed_branch_warpman_satisfiability_probe.py
      - tools/stoneage_shadowed_branch_item_shop_acquisition_probe.py
      - tests/test_stoneage_shadowed_branch_item_shop_acquisition_probe.py
      - tools/stoneage_shadowed_branch_item_npc_reference_probe.py
      - tests/test_stoneage_shadowed_branch_item_npc_reference_probe.py
      - tools/stoneage_shadowed_branch_key_item_nonshop_probe.py
      - tests/test_stoneage_shadowed_branch_key_item_nonshop_probe.py
      - tools/stoneage_shadowed_branch_key_item_exchange_probe.py
      - tests/test_stoneage_shadowed_branch_key_item_exchange_probe.py
      - tools/stoneage_shadowed_branch_legal_state_reachability_probe.py
      - tests/test_stoneage_shadowed_branch_legal_state_reachability_probe.py
      - tools/stoneage_shadowed_branch_progression_witness_probe.py
      - tests/test_stoneage_shadowed_branch_progression_witness_probe.py
      - tools/stoneage_state_gated_runtime_world_reachability_probe.py
      - tests/test_stoneage_state_gated_runtime_world_reachability_probe.py
      - tools/stoneage_shadowed_branch_coordinate_access_probe.py
      - tests/test_stoneage_shadowed_branch_coordinate_access_probe.py
      - tools/stoneage_shadowed_branch_dynamic_occupancy_probe.py
      - tests/test_stoneage_shadowed_branch_dynamic_occupancy_probe.py
      - tools/stoneage_shadowed_branch_fresh_start_stone_probe.py
      - tests/test_stoneage_shadowed_branch_fresh_start_stone_probe.py
      - tools/stoneage_shadowed_branch_fresh_start_spatial_probe.py
      - tests/test_stoneage_shadowed_branch_fresh_start_spatial_probe.py
      - tools/stoneage_shadowed_branch_fresh_start_coordinate_probe.py
      - tests/test_stoneage_shadowed_branch_fresh_start_coordinate_probe.py
      - tools/stoneage_shadowed_branch_fresh_start_coordinate_gap_probe.py
      - tests/test_stoneage_shadowed_branch_fresh_start_coordinate_gap_probe.py
      - tools/stoneage_shadowed_branch_fresh_start_level_probe.py
      - tests/test_stoneage_shadowed_branch_fresh_start_level_probe.py
      - tools/stoneage_shadowed_branch_fresh_start_leveling_probe.py
      - tests/test_stoneage_shadowed_branch_fresh_start_leveling_probe.py
      - tools/stoneage_shadowed_branch_fresh_start_combat_probe.py
      - tests/test_stoneage_shadowed_branch_fresh_start_combat_probe.py
      - tools/stoneage_shadowed_branch_fresh_start_leveling_closure_probe.py
      - tests/test_stoneage_shadowed_branch_fresh_start_leveling_closure_probe.py
      - tools/stoneage_shadowed_branch_fresh_start_world_closure_probe.py
      - tests/test_stoneage_shadowed_branch_fresh_start_world_closure_probe.py
      - tools/stoneage_ordered_runtime_world_reachability_probe.py
      - tools/stoneage_ordered_runtime_world_topology.py
      - research/recovered/STONEAGE-25-AMBIGUOUS-WARP-CREATE-ORDER-R1.txt
      - research/recovered/STONEAGE-25-MATERIALIZABLE-WORLD-WARP-GEOMETRY-R1.txt
      - research/recovered/STONEAGE-25-SUPPLEMENTAL-WORLD-AUDIT-R1.txt
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_transport_usage_probe tests.test_stoneage_shadowed_branch_transport_probe tests.test_stoneage_shadowed_branch_warpman_gate_probe tests.test_stoneage_shadowed_branch_warpman_free_probe tests.test_stoneage_shadowed_branch_warpman_satisfiability_probe tests.test_stoneage_shadowed_branch_item_shop_acquisition_probe tests.test_stoneage_shadowed_branch_item_npc_reference_probe tests.test_stoneage_shadowed_branch_key_item_nonshop_probe tests.test_stoneage_shadowed_branch_key_item_exchange_probe tests.test_stoneage_shadowed_branch_progression_witness_probe tests.test_stoneage_shadowed_branch_legal_state_reachability_probe tests.test_stoneage_state_gated_runtime_world_reachability_probe tests.test_stoneage_shadowed_branch_coordinate_access_probe tests.test_stoneage_shadowed_branch_dynamic_occupancy_probe tests.test_stoneage_shadowed_branch_fresh_start_stone_probe tests.test_stoneage_shadowed_branch_fresh_start_spatial_probe tests.test_stoneage_shadowed_branch_fresh_start_coordinate_probe tests.test_stoneage_shadowed_branch_fresh_start_coordinate_gap_probe tests.test_stoneage_shadowed_branch_fresh_start_dialogue_warp_bridge_probe tests.test_stoneage_shadowed_branch_fresh_start_level_probe tests.test_stoneage_shadowed_branch_fresh_start_leveling_probe tests.test_stoneage_shadowed_branch_fresh_start_combat_probe tests.test_stoneage_shadowed_branch_fresh_start_leveling_closure_probe tests.test_stoneage_shadowed_branch_fresh_start_world_closure_probe -v
      - run: sudo apt-get update && sudo apt-get install -y unar
      - name: Recover verified preservation bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib,html,json,re,http.cookiejar,urllib.parse,urllib.request
          from pathlib import Path
          ua='Mozilla/5.0'
          hashes={
            'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5',
            'ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb',
          }
          opener=urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          def get(key,suffix):
            data=urllib.parse.urlencode(
                {'quick_key':key,'response_format':'json'}
            ).encode()
            req=urllib.request.Request(
                'https://www.mediafire.com/api/1.5/file/get_info.php',
                data=data,headers={'User-Agent':ua}
            )
            with opener.open(req,timeout=60) as r:
                info=json.load(r)['response']['file_info']
            if str(info.get('hash','')).lower()!=hashes[key]:
                raise SystemExit('metadata hash changed')
            with opener.open(
                urllib.request.Request(
                    info['links']['normal_download'],
                    headers={'User-Agent':ua}
                ),timeout=60
            ) as r:
                page=r.read().decode('utf-8','replace')
                ref=r.geturl()
            m=(
                re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S)
                or re.search(
                    r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',
                    page,re.I
                )
            )
            if not m:
                raise SystemExit('no direct link')
            path=Path('/tmp/sa25')/('part.'+suffix)
            digest=hashlib.sha256()
            request=urllib.request.Request(
                html.unescape(m.group(1)),
                headers={'User-Agent':ua,'Referer':ref}
            )
            with opener.open(request,timeout=300) as r,path.open('wb') as out:
                while True:
                    block=r.read(1048576)
                    if not block:
                        break
                    out.write(block)
                    digest.update(block)
            if digest.hexdigest()!=hashes[key]:
                raise SystemExit('hash mismatch')
          get('ev7l29fw77891go','001')
          get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 >/tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar|awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out
          ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/dev/null 2>&1
      - name: Probe transport usage
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          test -n "$N"
          mkdir -p research/recovered
          R=research/recovered/STONEAGE-25-BUS-AIR-USAGE-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            python3 -m tools.stoneage_transport_usage_probe --npc-dir "$N"
          } > "$R"
      - name: Probe shadowed-branch nonclassic ingress
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          test -n "$N"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-NONCLASSIC-INGRESS-R1.txt
          python3 -m tools.stoneage_shadowed_branch_transport_probe --npc-dir "$N" > "$R"
          test -s "$R"
          grep -F 'COUNT|classic_reachable_floor_ids|815' "$R"
          grep -F 'COUNT|shadowed_branch_floor_ids|11' "$R"
          grep -F 'COUNT|bus_cross_floor_edges|0' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_NONCLASSIC_INGRESS_AUDITED' "$R"

      - name: Classify shadowed-branch WarpMan gating
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          test -n "$N"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-WARPMAN-GATING-R1.txt
          python3 -m tools.stoneage_shadowed_branch_warpman_gate_probe --npc-dir "$N" > "$R"
          test -s "$R"
          grep -F 'COUNT|target_orphan_floors|11' "$R"
          grep -F 'COUNT|warpman_ingress_rows|1' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_WARPMAN_GATING_AUDITED' "$R"

      - name: Classify shadowed-branch WarpMan FREE grammar
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          test -n "$N"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-WARPMAN-FREE-R1.txt
          python3 -m tools.stoneage_shadowed_branch_warpman_free_probe --npc-dir "$N" > "$R"
          test -s "$R"
          grep -F 'COUNT|ingress_rows|1' "$R"
          grep -F 'COUNT|unparseable_free_rows|0' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_WARPMAN_FREE_GRAMMAR_AUDITED' "$R"

      - name: Audit shadowed-branch WarpMan FREE domain witnesses
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N"
          test -n "$D"
          test -n "$C"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-WARPMAN-SATISFIABILITY-R1.txt
          python3 -m tools.stoneage_shadowed_branch_warpman_satisfiability_probe --npc-dir "$N" --setup "$C" --data-dir "$D" > "$R"
          test -s "$R"
          grep -F 'COUNT|ingress_rows|1' "$R"
          grep -F 'COUNT|unsupported_atoms|0' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_WARPMAN_FREE_DOMAIN_AUDITED' "$R"

      - name: Audit reachable ItemShop acquisition of shadowed-branch key item
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N"
          test -n "$D"
          test -n "$C"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-KEY-ITEM-SHOP-R1.txt
          python3 -m tools.stoneage_shadowed_branch_item_shop_acquisition_probe --npc-dir "$N" --setup "$C" --data-dir "$D" > "$R"
          test -s "$R"
          grep -F 'COUNT|target_predicate_count|1' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_KEY_ITEM_REACHABLE_SHOP_AUDITED' "$R"

      - name: Census reachable NPC references to shadowed-branch key item
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          test -n "$N"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-KEY-ITEM-NPC-REFERENCES-R1.txt
          python3 -m tools.stoneage_shadowed_branch_item_npc_reference_probe --npc-dir "$N" > "$R"
          test -s "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_KEY_ITEM_NPC_REFERENCE_CENSUS_AUDITED' "$R"

      - name: Audit non-shop acquisition of shadowed-branch key item
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N"; test -n "$D"; test -n "$C"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-KEY-ITEM-NONSHOP-R1.txt
          python3 -m tools.stoneage_shadowed_branch_key_item_nonshop_probe --npc-dir "$N" --setup "$C" --data-dir "$D" > "$R"
          test -s "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_KEY_ITEM_NONSHOP_ACQUISITION_AUDITED' "$R"

      - name: Audit ExChangeMan award path for shadowed-branch key item
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N"
          test -n "$C"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-KEY-ITEM-EXCHANGE-R1.txt
          python3 -m tools.stoneage_shadowed_branch_key_item_exchange_probe --npc-dir "$N" --setup "$C" > "$R"
          test -s "$R"
          grep -F 'COUNT|state_domain_satisfiable_records|' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_KEY_ITEM_EXCHANGE_AWARD_AUDITED' "$R"

      - name: Audit joined shadowed-branch progression witness
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N"
          test -n "$C"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-PROGRESSION-R1.txt
          python3 -m tools.stoneage_shadowed_branch_progression_witness_probe --npc-dir "$N" --setup "$C" > "$R"
          test -s "$R"
          grep -F 'COUNT|combined_progression_witness|1' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_PROGRESSION_WITNESS_CLOSED' "$R"

      - name: Join legal-state reachability into shadowed branch
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N"
          test -n "$C"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-LEGAL-STATE-REACHABILITY-R1.txt
          python3 -m tools.stoneage_shadowed_branch_legal_state_reachability_probe --npc-dir "$N" --setup "$C" > "$R"
          test -s "$R"
          grep -F 'LEGAL_STATE_CHAIN|witness=1' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_LEGAL_STATE_REACHABILITY_AUDITED' "$R"

      - name: Recompute state-gated materializable world reachability
        run: |
          set -euo pipefail
          P=research/recovered/STONEAGE-25-SHADOWED-BRANCH-PROGRESSION-R1.txt
          R=research/recovered/STONEAGE-25-STATE-GATED-RUNTIME-WORLD-REACHABILITY-R1.txt
          test -s "$P"
          python3 -m tools.stoneage_state_gated_runtime_world_reachability_probe --progression-report "$P" > "$R"
          test -s "$R"
          grep -F 'COUNT|materializable_floor_ids|826' "$R"
          grep -F 'COUNT|classic_reachable_floor_ids|815' "$R"
          grep -F 'COUNT|state_gated_reachable_floor_ids|826' "$R"
          grep -F 'COUNT|remaining_unreachable_floor_ids|0' "$R"
          grep -F 'RESOLUTION|STATE_GATED_RUNTIME_WORLD_REACHABILITY_CLOSED' "$R"

      - name: Audit shadowed-branch static coordinate accessibility
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          SERVER_MAP_ROOT="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          MAPSET="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/data/map/mapset.txt' -print -quit)"
          test -n "$N"
          test -n "$C"
          test -n "$SERVER_MAP_ROOT"
          test -n "$MAPSET"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-COORDINATE-ACCESS-R1.txt
          python3 -m tools.stoneage_shadowed_branch_coordinate_access_probe --npc-dir "$N" --setup "$C" --server-map-root "$SERVER_MAP_ROOT" --mapset "$MAPSET" > "$R"
          test -s "$R"
          grep -F 'STATIC_COORDINATE_CHAIN|witness=1' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_STATIC_COORDINATE_ACCESS_CLOSED' "$R"

      - name: Audit shadowed-branch dynamic occupancy boundary
        run: |
          set -euo pipefail
          C=research/recovered/STONEAGE-25-SHADOWED-BRANCH-COORDINATE-ACCESS-R1.txt
          S=research/recovered/STONEAGE-25-STATE-GATED-RUNTIME-WORLD-REACHABILITY-R1.txt
          L=research/recovered/STONEAGE-25-SHADOWED-BRANCH-LEGAL-STATE-REACHABILITY-R1.txt
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-DYNAMIC-OCCUPANCY-R1.txt
          test -s "$C"
          test -s "$S"
          test -s "$L"
          python3 -m tools.stoneage_shadowed_branch_dynamic_occupancy_probe --coordinate-report "$C" --state-gated-report "$S" --legal-state-report "$L" --bundle-root /tmp/sa25/out > "$R"
          test -s "$R"
          grep -F 'DETERMINISTIC_INITIAL_DYNAMIC_OCCUPANCY_CHAIN|witness=1' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_DYNAMIC_OCCUPANCY_BOUNDARY_CLOSED' "$R"

      - name: Audit fresh-start Stone sufficiency
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N"
          test -n "$C"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-FRESH-START-STONE-R1.txt
          python3 -m tools.stoneage_shadowed_branch_fresh_start_stone_probe --npc-dir "$N" --setup "$C" > "$R"
          test -s "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_FRESH_START_STONE_AUDITED' "$R"

      - name: Audit fresh-start floor reachability
        run: |
          set -euo pipefail
          L=research/recovered/STONEAGE-25-SHADOWED-BRANCH-LEGAL-STATE-REACHABILITY-R1.txt
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-FRESH-START-SPATIAL-R1.txt
          test -s "$L"
          python3 -m tools.stoneage_shadowed_branch_fresh_start_spatial_probe --legal-state-report "$L" > "$R"
          test -s "$R"
          grep -F 'NORMAL_FRESH_START_FLOOR_CHAIN|witness=1' "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_FRESH_START_FLOOR_REACHABILITY_AUDITED' "$R"

      - name: Audit fresh-start coordinate reachability
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          SERVER_MAP_ROOT="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          MAPSET="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/data/map/mapset.txt' -print -quit)"
          test -n "$N"
          test -n "$C"
          test -n "$SERVER_MAP_ROOT"
          test -n "$MAPSET"
          R=research/recovered/STONEAGE-25-SHADOWED-BRANCH-FRESH-START-COORDINATE-R1.txt
          python3 -m tools.stoneage_shadowed_branch_fresh_start_coordinate_probe --npc-dir "$N" --setup "$C" --server-map-root "$SERVER_MAP_ROOT" --mapset "$MAPSET" > "$R"
          test -s "$R"
          grep -F 'RESOLUTION|SHADOWED_BRANCH_FRESH_START_COORDINATE_REACHABILITY_CLOSED' "$R"

      - name: Classify failed fresh-start coordinate frontiers
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          SERVER_MAP_ROOT="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          MAPSET="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/data/map/mapset.txt' -print -quit)"
          test -n "$N"
          test -n "$C"
