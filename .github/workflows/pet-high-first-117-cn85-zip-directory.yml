name: PET117 CN85 ZIP central directory and PET116 custody
on:
  push:
    branches: ['agent/pet-high-first-114-cn85-zol-archive-20261126']
    paths:
      - 'tools/stoneage_pet_high_first_117_cn85_zip_directory.py'
      - '.github/workflows/pet-high-first-117-cn85-zip-directory.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15118206490/zip > "$RUNNER_TEMP/pet116.zip"
          python -m tools.stoneage_pet_high_first_117_cn85_zip_directory --artifact "$RUNNER_TEMP/pet116.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pet117-cn85-zip-directory-metadata
          path: research/pets/PET-HIGH-FIRST-117-CN85-ZIP-DIRECTORY-R1.json
          if-no-files-found: error
          retention-days: 15
      - name: Retain derived metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/pets/PET-HIGH-FIRST-116-CN85-EXACT-FILE-ARCHIVE-R1.json research/pets/PET-HIGH-FIRST-117-CN85-ZIP-DIRECTORY-R1.json
          git commit -m 'PET116–117: retain exact file range and ZIP directory metadata'
          git push origin HEAD:agent/pet-high-first-114-cn85-zol-archive-20261126
