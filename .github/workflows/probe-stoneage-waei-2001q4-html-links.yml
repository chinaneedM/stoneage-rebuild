name: Probe Waei Q4 2001 archived HTML links

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_2001q4_html_link_probe.py
      - tests/test_stoneage_waei_2001q4_html_link_probe.py
      - .github/workflows/probe-stoneage-waei-2001q4-html-links.yml

permissions:
  contents: write

concurrency:
  group: stoneage-waei-2001q4-html-links
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_waei_2001q4_html_link_probe -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_2001q4_html_link_probe > research/recovered/STONEAGE-WAEI-2001Q4-HTML-LINKS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-WAEI-2001Q4-HTML-LINKS-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: inspect Waei Q4 archived HTML links'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
