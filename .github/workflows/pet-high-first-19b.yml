name: PET-HIGH-FIRST-19B graphic and coordinate replay
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_19b.py'
      - 'research/pets/PET-HIGH-FIRST-19B-GRAPHIC-AND-COORDINATE-R1.json'
      - '.github/workflows/pet-high-first-19b.yml'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_19b.py'
      - 'research/pets/PET-HIGH-FIRST-19B-GRAPHIC-AND-COORDINATE-R1.json'
      - '.github/workflows/pet-high-first-19b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/stoneage_pet_high_first_19b.py
