name: PET-HIGH-FIRST-13 TW85 long and special RD
on:
  push:
    branches: [agent/pet-high-first-13-20261124, main]
    paths:
      - '.github/workflows/pet-high-first-13-tw85-source.yml'
      - 'tools/stoneage_pet_high_first_tw85_residual.py'
  pull_request:
    paths:
      - '.github/workflows/pet-high-first-13-tw85-source.yml'
      - 'tools/stoneage_pet_high_first_tw85_residual.py'
      - 'research/pets/PET-HIGH-FIRST-13-*'
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/agent/pet-high-first-13-20261124'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fixed PET12 receipt and 20 residual group plan
        run: python -m tools.stoneage_pet_high_first_tw85_residual --plan-only
      - name: Install static MSI reader and decoder dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq msitools
          python -m pip install Pillow
      - name: Authenticate and statically extract saved carrier
        run: python -m tools.stoneage_wayi85_sixpart_acquisition --work "$RUNNER_TEMP/tw85" --output "$RUNNER_TEMP/tw85-acquisition.json"
      - name: Decode residual sequence samples and diagnose previous special blocks
        run: |
          python -m tools.stoneage_pet_high_first_tw85_residual --source-dir "$RUNNER_TEMP/tw85/msi-client/Program Files/WAYI/石器時代 魔域大冒險/data"
          python -m tools.stoneage_pet_high_first_tw85_residual
          python -m unittest tests.test_stoneage_pet_high_first_tw85_pixels
      - name: Archive only derived source receipt
        run: |
          git add research/pets/PET-HIGH-FIRST-13-TW85-LONG-AND-SPECIAL-R1.json.gz
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'PET13: archive authenticated TW85 long and special RD receipt'
          git push origin "HEAD:$GITHUB_REF"
  verify:
    if: github.ref != 'refs/heads/agent/pet-high-first-13-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay archived source residual receipt and prior PET12 guards
        run: |
          python -m tools.stoneage_pet_high_first_tw85_residual
          python -m unittest tests.test_stoneage_pet_high_first_tw85_pixels tests.test_stoneage_pet45_tw85_source_join
