name: Validate StoneAge BecomePig attack order native composition

concurrency:
  group: stoneage-becomepig-attack-order-native-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-becomepig-attack-order-native.yml"
      - "tools/stoneage_becomepig_attack_order_native_audit.py"
      - "specs/STONEAGE-BECOMEPIG-ATTACK-ORDER-NATIVE-R1.md"
      - "tools/stoneage_becomepig_attack_order_audit.py"
      - "tools/stoneage_battlemodel_damagesub_profit_tail_source_audit.py"
      - "tools/stoneage_battlemodel_guardian_profit_tail_source_audit.py"
      - "tools/stoneage_battlemodel_physical_source_audit.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retain source-order detector regressions
        run: python -m unittest -v tests.test_stoneage_becomepig_attack_order

      - name: Recover exact pinned descendant source trees
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_guard_break2_source_audit import PINNED
          repos = {
              "gavin": "gavinlinasd/StoneAge",
              "iris": "iriselia/StoneAge",
              "bismarck": "BismarckDD/stoneage",
          }
          root = Path("/tmp/becomepig-attack-order-native")
          for name, sha in PINNED.items():
              dst = root / name
              subprocess.run(["git", "init", str(dst)], check=True)
              subprocess.run(
                  ["git", "-C", str(dst), "remote", "add", "origin",
                   "https://github.com/" + repos[name] + ".git"],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", str(dst), "fetch", "--depth", "1", "origin", sha],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", str(dst), "checkout", "--detach", "FETCH_HEAD"],
                  check=True,
              )
          PY

      - name: Execute exact main Guardian counter retarget native composition
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python -m tools.stoneage_becomepig_attack_order_native_audit \
            --gavin-dir /tmp/becomepig-attack-order-native/gavin \
            --iris-dir /tmp/becomepig-attack-order-native/iris \
            --bismarck-dir /tmp/becomepig-attack-order-native/bismarck \
            > research/recovered/STONEAGE-BECOMEPIG-ATTACK-ORDER-NATIVE-R1.txt
          cat research/recovered/STONEAGE-BECOMEPIG-ATTACK-ORDER-NATIVE-R1.txt
          test "$(grep -c '^PROFILE|' research/recovered/STONEAGE-BECOMEPIG-ATTACK-ORDER-NATIVE-R1.txt)" = 3
          grep -F 'TOTAL|native_comparisons=18|profiles=3' \
            research/recovered/STONEAGE-BECOMEPIG-ATTACK-ORDER-NATIVE-R1.txt
          grep -F 'RESOLUTION|BECOMEPIG_MAIN_GUARDIAN_COUNTER_RETARGET_NATIVE_COMPOSITION_PASS_ZERO_RUNTIME_PROMOTIONS' \
            research/recovered/STONEAGE-BECOMEPIG-ATTACK-ORDER-NATIVE-R1.txt

      - name: Preserve derived native composition evidence
        uses: actions/upload-artifact@v4
        with:
          name: becomepig-attack-order-native-${{ github.sha }}
          path: research/recovered/STONEAGE-BECOMEPIG-ATTACK-ORDER-NATIVE-R1.txt

      - name: Commit only derived native composition report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/recovered/STONEAGE-BECOMEPIG-ATTACK-ORDER-NATIVE-R1.txt
          if ! git diff --cached --quiet; then
            git commit -m "research: verify BecomePig attack order native composition [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
