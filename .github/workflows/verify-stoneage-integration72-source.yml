name: Verify StoneAge INTEGRATION72 dream sage four source-qualified item pixels
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION72-DREAM-SAGE-FOUR-ITEM-TW1-ORIGINAL-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_72.py'
      - '.github/workflows/verify-stoneage-integration72-source.yml'
      - 'research/recovered/STONEAGE-QUEST09-DREAM-CAVE-ORIGINAL-CONTROLS-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-02-R1.json'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION72-DREAM-SAGE-FOUR-ITEM-TW1-ORIGINAL-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_72.py'
      - '.github/workflows/verify-stoneage-integration72-source.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_72.py' -v
