name: Verify StoneAge INTEGRATION71 Chahan priest source and original five pixel candidates
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION71-CHAHAN-PRIEST-TIGER-WATER-ORIGINAL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_71.py'
      - '.github/workflows/verify-stoneage-integration71-source.yml'
      - 'research/recovered/STONEAGE-CHARACTER-NPC-MODULE-01-FULL-SOURCE-ROWS-R1.json'
      - 'research/recovered/STONEAGE-QUEST-STORY-MODULE-01-ORIGINAL-EXCHANGEMAN-QUEST-SOURCE-BLOCK-CATALOG-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-02-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-07-R1.json'
      - 'research/recovered/STONEAGE-MAP09-691-SOURCE-READY-SCENES-R1.json'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION71-CHAHAN-PRIEST-TIGER-WATER-ORIGINAL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_71.py'
      - '.github/workflows/verify-stoneage-integration71-source.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_71.py' -v
