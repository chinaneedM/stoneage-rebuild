name: Validate TW1.0 R24 prefix/scalar/flags synthetic and strict guard
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r24-prefix-scalar-flags-20261013]
    paths:
      - .github/workflows/validate-stoneage-tw10-r24-synthetic.yml
      - tools/stoneage_tw10_savedata_upstream_r24.py
      - tools/stoneage_tw10_savedata_upstream_r24_guard.py
      - tests/test_stoneage_tw10_savedata_upstream_r24.py
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet capstone pefile
      - name: R24 and R23 synthetic and strict negative controls
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_tw10_savedata_upstream_r24 tests.test_stoneage_tw10_savedata_upstream_r23 tests.test_stoneage_tw10_savedata_upstream_r23_guard
          python -m compileall -q tools/stoneage_tw10_savedata_upstream_r24.py tools/stoneage_tw10_savedata_upstream_r24_guard.py
          echo TW10_R24_SYNTHETIC_STRICT=PASS
          echo TW10_R24_ORIGINAL_EVIDENCE=OPEN
