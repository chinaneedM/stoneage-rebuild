name: Probe Hananet StoneAge PDS catalog
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_pds_catalog_probe.py
      - tests/test_stoneage_hananet_pds_catalog_probe.py
      - .github/workflows/probe-stoneage-hananet-pds-catalog.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-pds-catalog
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_pds_catalog_probe -v
      - name: Probe archived PDS catalog/search
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_pds_catalog_probe             > research/recovered/STONEAGE-HANANET-PDS-CATALOG-R1.txt
      - name: Commit derived catalog metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-PDS-CATALOG-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Hananet PDS StoneAge catalog'
          git pull --rebase origin main
          git push
