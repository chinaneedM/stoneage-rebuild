name: Probe TW1.0 original R57 complete savedata write and close return contexts
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r57-write-close-returns-20261015]
    paths:
      - .github/workflows/probe-stoneage-tw10-r57-original.yml
      - tools/stoneage_tw10_savedata_return_r57.py
      - tools/stoneage_tw10_savedata_native_io_r57.py
      - tools/stoneage_tw10_savedata_native_io_r57_guard.py
      - tests/test_stoneage_tw10_savedata_return_r57.py
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: R57 and inherited synthetic strict gates
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_return_r57 tests.test_stoneage_tw10_savedata_frame_r56_guard tests.test_stoneage_tw10_savedata_native_io_r56 tests.test_stoneage_tw10_savedata_native_io_r55 tests.test_stoneage_tw10_savedata_writer_r54_audit tests.test_stoneage_tw10_savedata_writer_r54_contract tests.test_stoneage_tw10_savedata_writer_r54 tests.test_stoneage_tw10_savedata_native_io_r53 tests.test_stoneage_tw10_savedata_native_io_r52 tests.test_stoneage_tw10_savedata_postcall_r51 tests.test_stoneage_tw10_savedata_application_r51 tests.test_stoneage_tw10_savedata_application_r50 tests.test_stoneage_tw10_savedata_native_io_r51 tests.test_stoneage_tw10_savedata_native_io_r50 tests.test_stoneage_tw10_savedata_native_io_r49 tests.test_stoneage_tw10_savedata_native_io_r48 tests.test_stoneage_tw10_savedata_native_io_r47 tests.test_stoneage_tw10_savedata_native_io_r46 tests.test_stoneage_tw10_savedata_native_io_r45 tests.test_stoneage_tw10_savedata_native_io_r44 tests.test_stoneage_tw10_savedata_native_io_r43 tests.test_stoneage_tw10_savedata_native_io_r42 tests.test_stoneage_tw10_savedata_native_io_r41 tests.test_stoneage_tw10_savedata_native_io_r40 tests.test_stoneage_tw10_savedata_native_io_r39 tests.test_stoneage_tw10_savedata_native_io_r38 tests.test_stoneage_tw10_savedata_native_io_r37 tests.test_stoneage_tw10_savedata_native_io_r36 tests.test_stoneage_tw10_savedata_native_io_r35 tests.test_stoneage_tw10_savedata_native_io_r34 tests.test_stoneage_tw10_savedata_native_io_r33 tests.test_stoneage_tw10_savedata_native_io_r32 tests.test_stoneage_tw10_savedata_argtrace_r7 tests.test_stoneage_tw10_savedata_argtrace_r7_guard
      - name: Retrieve authenticated transient TW1.0 retail archive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m tools.stoneage_tw10_archive_parallel_download --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar; then
              echo TW10_R57_PINNED_ARCHIVE=PASS
              break
            fi
            rm -f /tmp/CD_DIC.rar
            if [ "$attempt" -eq 3 ]; then
              echo TW10_R57_SOURCE_UNAVAILABLE=OPEN
              exit 1
            fi
            sleep 10
          done
      - name: Extract original BIN transient only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r57
          7z x -y -o/tmp/stoneage-r57 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r57/STONEAGE.bin)" -eq 523449360
      - name: Derive bounded R57 static-only original metadata
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_native_io_r57 --bin /tmp/stoneage-r57/STONEAGE.bin > /tmp/stoneage-r57-derived.json
          python -m tools.stoneage_tw10_savedata_native_io_r57_guard --report /tmp/stoneage-r57-derived.json
          test "$(stat -c %s /tmp/stoneage-r57-derived.json)" -le 1000000
          echo TW10_R57_ORIGINAL_STATIC_ONLY=PASS
          echo TW10_R57_NATIVE_SAVE=OPEN
      - name: Always purge proprietary source
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r57
      - name: Upload derived metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-r57-original-write-close-derived
          path: /tmp/stoneage-r57-derived.json
          retention-days: 21
