name: Validate R111 JP2009 mystery dungeon press-source boundaries
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-JP2009-MYSTERY-DUNGEON-R111.json'
      - 'tools/stoneage_jp2009_mystery_dungeon_r111.py'
      - 'tests/test_stoneage_jp2009_mystery_dungeon_r111.py'
      - '.github/workflows/verify-stoneage-jp2009-mystery-r111.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify publisher-press source metadata and negative bounds
        run: |
          python tools/stoneage_jp2009_mystery_dungeon_r111.py
          python -m unittest discover -s tests -p test_stoneage_jp2009_mystery_dungeon_r111.py -v
