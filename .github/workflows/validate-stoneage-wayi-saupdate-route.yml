name: Validate Wayi updater manifest route evidence
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-wayi-saupdate-route.yml"
      - "tools/stoneage_wayi_saupdate_route_probe.py"
      - "tests/test_stoneage_wayi_saupdate_route_probe.py"
      - "research/recovered/STONEAGE-WAYI-SAUPDATE-MANIFEST-ROUTE-R1.json"
      - "docs/specs/STONEAGE-WAYI-SAUPDATE-MANIFEST-ROUTE-R1.md"
permissions:
  contents: read
jobs:
  offline-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned static decoder
        run: python -m pip install --quiet capstone==5.0.7
      - name: Validate port width, branches, operands and adjacent archive regressions
        run: |
          python -m unittest -v tests.test_stoneage_wayi_saupdate_route_probe tests.test_stoneage_wayi_pe_static_inventory tests.test_stoneage_wayi_archived_page_inventory tests.test_stoneage_tw80_may16_cdx_probe tests.test_stoneage_tw80_arquivo_pt_index_probe
          python -m json.tool research/recovered/STONEAGE-WAYI-SAUPDATE-MANIFEST-ROUTE-R1.json > /dev/null
