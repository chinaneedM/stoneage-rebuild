name: Probe Hananet StoneAge boards
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_board_probe.py
      - tests/test_stoneage_hananet_board_probe.py
      - .github/workflows/probe-stoneage-hananet-boards.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-boards
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_board_probe -v
      - name: Probe archived StoneAge boards
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_board_probe             > research/recovered/STONEAGE-HANANET-BOARDS-R1.txt
      - name: Commit derived board metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-BOARDS-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Hananet StoneAge boards'
          git pull --rebase origin main
          git push
