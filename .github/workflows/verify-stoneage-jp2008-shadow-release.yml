name: Verify Japanese 2008 shadow quest operator releases
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-JP2008-SHADOW-*.json'
      - 'tools/stoneage_jp2008_shadow_release.py'
      - 'tests/test_stoneage_jp2008_shadow_release.py'
      - '.github/workflows/verify-stoneage-jp2008-shadow-release.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-JP2008-SHADOW-*.json'
      - 'tools/stoneage_jp2008_shadow_release.py'
      - 'tests/test_stoneage_jp2008_shadow_release.py'
      - '.github/workflows/verify-stoneage-jp2008-shadow-release.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check source boundaries, eligibility graph and adversarial inputs
        run: python -m unittest discover -s tests -p 'test_stoneage_jp2008_shadow_release.py' -v
      - name: Independently read exactly three fixed releases and compare core digests and facts
        run: python -m tools.stoneage_jp2008_shadow_release --fetch --output /tmp/shadow-derived/replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: jp2008-shadow-derived-replay
          path: /tmp/shadow-derived/replay.json
          if-no-files-found: error
          retention-days: 30
