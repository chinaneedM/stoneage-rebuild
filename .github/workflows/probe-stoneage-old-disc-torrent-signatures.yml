name: Probe StoneAge old-disc torrent signatures
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_old_disc_torrent_signature_probe.py
      - tests/test_stoneage_old_disc_torrent_signature_probe.py
      - .github/workflows/probe-stoneage-old-disc-torrent-signatures.yml
permissions:
  contents: write
concurrency:
  group: stoneage-old-disc-torrent-signatures
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate signature probe
        run: python3 -m unittest tests.test_stoneage_old_disc_torrent_signature_probe -v
      - name: Scan public torrent metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_old_disc_torrent_signature_probe > research/recovered/STONEAGE-OLD-DISC-TORRENT-SIGNATURES-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-OLD-DISC-TORRENT-SIGNATURES-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan old-disc torrent StoneAge signatures'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
