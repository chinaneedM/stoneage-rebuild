name: Probe Korea 2000 StoneAge via Arquivo.pt

concurrency:
  group: stoneage-korea2000-arquivopt
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_korea2000_arquivopt_probe.py
      - tests/test_stoneage_korea2000_arquivopt_probe.py
      - .github/workflows/probe-stoneage-korea2000-arquivopt.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_korea2000_arquivopt_probe -v
      - name: Query Arquivo.pt metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_korea2000_arquivopt_probe \
            > research/recovered/STONEAGE-KOREA-2000-ARQUIVOPT-PROBE-R1.txt
      - name: Commit derived metadata report only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-KOREA-2000-ARQUIVOPT-PROBE-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Korea 2000 via Arquivo.pt'
          git pull --rebase origin main
          git push
