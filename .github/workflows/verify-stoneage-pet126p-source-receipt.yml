name: PET126P classic original PC source receipt for 305x80 album file offsets
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-PET126P-CN50-ORIGINAL-ALBUM13-305X80-FILE-ACCESS-R1.json'
      - 'docs/continuity/STONEAGE-PET126P-CN50-ALBUM13-305X80-SOURCE-20261121.md'
      - 'tests/test_stoneage_pet126p_source_receipt.py'
      - '.github/workflows/verify-stoneage-pet126p-source-receipt.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-PET126P-CN50-ORIGINAL-ALBUM13-305X80-FILE-ACCESS-R1.json'
      - 'docs/continuity/STONEAGE-PET126P-CN50-ALBUM13-305X80-SOURCE-20261121.md'
      - 'tests/test_stoneage_pet126p_source_receipt.py'
      - '.github/workflows/verify-stoneage-pet126p-source-receipt.yml'
permissions:
  contents: read
jobs:
  source-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_pet126p_source_receipt.py' -v
