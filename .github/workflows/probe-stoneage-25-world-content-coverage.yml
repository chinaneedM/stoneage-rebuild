name: Build versioned StoneAge world-content coverage

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_world_content_coverage_probe.py
      - tests/test_stoneage_world_content_coverage_probe.py
      - tools/stoneage_versioned_world_geometry_probe.py
      - tests/test_stoneage_versioned_world_geometry_probe.py
      - tools/stoneage_versioned_encounter_runtime.py
      - tools/stoneage_versioned_encounter_runtime_probe.py
      - tools/stoneage_versioned_npc_template_binding_probe.py
      - tests/test_stoneage_versioned_npc_template_binding_probe.py
      - tools/stoneage_versioned_npc_template_profile_probe.py
      - tests/test_stoneage_versioned_npc_template_profile_probe.py
      - tools/stoneage_versioned_npc_symbol_resolver_probe.py
      - tests/test_stoneage_versioned_npc_symbol_resolver_probe.py
      - tools/stoneage_world_map_library.py
      - research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt
      - research/recovered/tw10-resource-metadata/SPR-GROUP-R1.tsv.gz
      - .github/workflows/probe-stoneage-25-world-content-coverage.yml

permissions:
  contents: write

concurrency:
  group: stoneage-25-world-content-coverage
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate world-content classifiers
        run: |
          python3 -m unittest \
            tests.test_stoneage_world_content_coverage_probe \
            tests.test_stoneage_versioned_world_geometry_probe \
            tests.test_stoneage_versioned_npc_template_binding_probe \
            tests.test_stoneage_versioned_npc_template_profile_probe \
            tests.test_stoneage_versioned_npc_symbol_resolver_probe -v

      - name: Install archive tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar

      - name: Recover verified 2.5 preservation bundle transiently
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib, html, json, re, http.cookiejar, urllib.parse, urllib.request
          from pathlib import Path

          ua='Mozilla/5.0'
          expected={
              'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5',
              'ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb',
          }
          opener=urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          opener.addheaders=[('User-Agent',ua)]

          def get(key,suffix):
              data=urllib.parse.urlencode({
                  'quick_key':key,
                  'response_format':'json',
              }).encode()
              req=urllib.request.Request(
                  'https://www.mediafire.com/api/1.5/file/get_info.php',
                  data=data,
                  headers={'User-Agent':ua},
              )
              with opener.open(req,timeout=60) as response:
                  info=json.load(response)['response']['file_info']
              if str(info.get('hash') or '').lower()!=expected[key]:
                  raise SystemExit('MediaFire metadata hash changed')
              req=urllib.request.Request(
                  info['links']['normal_download'],
                  headers={'User-Agent':ua},
              )
              with opener.open(req,timeout=60) as response:
                  page=response.read().decode('utf-8','replace')
                  referer=response.geturl()
              match=(
                  re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S)
                  or re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
              )
              if not match:
                  raise SystemExit('No direct MediaFire link')
              dest=Path('/tmp/sa25')/f'part.{suffix}'
              digest=hashlib.sha256()
              request=urllib.request.Request(
                  html.unescape(match.group(1)),
                  headers={'User-Agent':ua,'Referer':referer},
              )
              with opener.open(request,timeout=300) as response,dest.open('wb') as out:
                  while True:
                      block=response.read(1024*1024)
                      if not block:
                          break
                      out.write(block)
                      digest.update(block)
              if digest.hexdigest()!=expected[key]:
                  raise SystemExit('MediaFire payload hash mismatch')

          get('ev7l29fw77891go','001')
          get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 > /tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar | awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out
          ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/tmp/sa25/unar.log 2>&1

      - name: Build floor-level versioned coverage
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          M="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N" && test -n "$D" && test -n "$M"

          report=research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            if [ -n "$C" ]; then
              python3 -m tools.stoneage_world_content_coverage_probe \
                --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
                --npc-dir "$N" \
                --data-dir "$D" \
                --map-dir "$M" \
                --setup "$C"
            else
              python3 -m tools.stoneage_world_content_coverage_probe \
                --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
                --npc-dir "$N" \
                --data-dir "$D" \
                --map-dir "$M"
            fi
          } > "$report"

      - name: Build versioned numeric world geometry
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          M="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N" && test -n "$D" && test -n "$M"

          report=research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            if [ -n "$C" ]; then
              python3 -m tools.stoneage_versioned_world_geometry_probe \
                --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
                --npc-dir "$N" \
                --data-dir "$D" \
                --map-dir "$M" \
                --setup "$C"
            else
              python3 -m tools.stoneage_versioned_world_geometry_probe \
                --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
                --npc-dir "$N" \
                --data-dir "$D" \
                --map-dir "$M"
            fi
          } > "$report"

      - name: Build anonymous stable-world NPC template bindings
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          M="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          test -n "$N" && test -n "$M"

          report=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            python3 -m tools.stoneage_versioned_npc_template_binding_probe \
              --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
              --geometry-report research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt \
              --npc-dir "$N" \
              --map-dir "$M"
          } > "$report"

      - name: Verify anonymous NPC template bindings
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|stable_spawn_placements|3856' "$report"
          test "$(grep -c '^PLACEMENT_TEMPLATE|' "$report")" = "3856"
          grep -F 'RESOLUTION|ANONYMOUS_NPC_TEMPLATE_BINDINGS_CLASSIFIED' "$report"

      - name: Build anonymous stable-world NPC template runtime profiles
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          test -n "$N"

          report=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            python3 -m tools.stoneage_versioned_npc_template_profile_probe \
              --binding-report research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt \
              --npc-dir "$N"
          } > "$report"

      - name: Verify anonymous NPC template runtime profiles
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|referenced_template_identities|73' "$report"
          grep -F 'RESOLUTION|ANONYMOUS_NPC_TEMPLATE_RUNTIME_PROFILES_CLASSIFIED' "$report"

      - name: Audit anonymous NPC graphic/type symbols
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          test -n "$N"

          mkdir -p /tmp/npcsymbol
          curl -fsSL \
            'https://raw.githubusercontent.com/gavinlinasd/StoneAge/1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56/gmsv/src/include/anim_tbl.h' \
            -o /tmp/npcsymbol/gavin.h
          curl -fsSL \
            'https://raw.githubusercontent.com/iriselia/StoneAge/9e6c8ce2cd8ed532a7157773acd1c61582c178b5/Source/gmsv/include/anim_tbl.h' \
            -o /tmp/npcsymbol/iris.h
          curl -fsSL \
            'https://raw.githubusercontent.com/BismarckDD/stoneage/999ffdf1d220ec6666eb65339180689c9caf1876/server/gmsv/include/anim_tbl.h' \
            -o /tmp/npcsymbol/bismarck.h

          A="$(find /tmp/sa25/out -type f -iname 'anim_tbl.h' -path '*/SA2.5服務端/*' -print -quit || true)"
          report=research/recovered/STONEAGE-25-STABLE-NPC-SYMBOL-RESOLUTION-R1.txt
          ARGS=(
            --binding-report research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt
            --profile-report research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt
            --npc-dir "$N"
            --gavin-anim /tmp/npcsymbol/gavin.h
            --iris-anim /tmp/npcsymbol/iris.h
            --bismarck-anim /tmp/npcsymbol/bismarck.h
            --tw1-spr-groups research/recovered/tw10-resource-metadata/SPR-GROUP-R1.tsv.gz
          )
          if [ -n "$A" ]; then
            ARGS+=(--recovered-anim "$A")
          fi
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            echo 'SOURCE_REVISION|gavinlinasd/StoneAge|1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56'
            echo 'SOURCE_REVISION|iriselia/StoneAge|9e6c8ce2cd8ed532a7157773acd1c61582c178b5'
            echo 'SOURCE_REVISION|BismarckDD/stoneage|999ffdf1d220ec6666eb65339180689c9caf1876'
            echo "RECOVERED_ANIM_TABLE_PRESENT|$([ -n "$A" ] && echo 1 || echo 0)"
            python3 -m tools.stoneage_versioned_npc_symbol_resolver_probe "${ARGS[@]}"
          } > "$report"

      - name: Verify anonymous NPC graphic/type symbol audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-NPC-SYMBOL-RESOLUTION-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'RESOLUTION|ANONYMOUS_NPC_SYMBOL_RESOLUTION_AUDITED' "$report"
          test "$(grep -c '^SYMBOL_TOKEN|' "$report")" -ge 1

      - name: Build stable-world encounter runtime audit
        run: |
          set -euo pipefail
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$D"

          report=research/recovered/STONEAGE-25-STABLE-ENCOUNTER-RUNTIME-R1.txt
          if [ -n "$C" ]; then
            python3 -m tools.stoneage_versioned_encounter_runtime_probe \
              --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
              --coverage-report research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt \
              --geometry-report research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt \
              --data-dir "$D" \
              --setup "$C" > "$report"
          else
            python3 -m tools.stoneage_versioned_encounter_runtime_probe \
              --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
              --coverage-report research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt \
              --geometry-report research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt \
              --data-dir "$D" > "$report"
          fi

      - name: Verify derived encounter runtime audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-ENCOUNTER-RUNTIME-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|stable_encounter_areas|402' "$report"
          grep -F 'RESOLUTION|VERSIONED_ENCOUNTER_RUNTIME_AUDITED' "$report"

      - name: Verify derived coverage report
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'COUNT|stable_floor_candidates|761' "$report"
          test "$(grep -c '^FLOOR|' "$report")" = "761"
          grep -F 'RESOLUTION|VERSIONED_WORLD_CONTENT_COVERAGE_CLASSIFIED' "$report"

      - name: Verify derived world geometry report
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|stable_floor_candidates|761' "$report"
          grep -F 'WARP_RULE|only classic functionset=Warp' "$report"
          grep -F 'RESOLUTION|VERSIONED_WORLD_GEOMETRY_CLASSIFIED' "$report"

      - name: Delete transient proprietary payloads
        if: always()
        run: rm -rf /tmp/sa25

      - name: Commit derived floor-level metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          coverage=research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt
          geometry=research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt
          encounter_runtime=research/recovered/STONEAGE-25-STABLE-ENCOUNTER-RUNTIME-R1.txt
          npc_template_bindings=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt
          npc_template_profiles=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt
          npc_symbol_resolution=research/recovered/STONEAGE-25-STABLE-NPC-SYMBOL-RESOLUTION-R1.txt
          git add "$coverage" "$geometry" "$encounter_runtime" "$npc_template_bindings" "$npc_template_profiles" "$npc_symbol_resolution"
          git diff --cached --quiet && exit 0
          git commit -m 'research: classify stable map world geometry'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            exit 1
          fi
          git push
