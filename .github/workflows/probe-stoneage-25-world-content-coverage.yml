name: Build versioned StoneAge world-content coverage

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_world_content_coverage_probe.py
      - tests/test_stoneage_world_content_coverage_probe.py
      - tools/stoneage_versioned_world_geometry_probe.py
      - tests/test_stoneage_versioned_world_geometry_probe.py
      - tools/stoneage_versioned_encounter_runtime.py
      - tools/stoneage_versioned_encounter_runtime_probe.py
      - tools/stoneage_versioned_npc_template_binding_probe.py
      - tests/test_stoneage_versioned_npc_template_binding_probe.py
      - tools/stoneage_versioned_npc_template_profile_probe.py
      - tests/test_stoneage_versioned_npc_template_profile_probe.py
      - tools/stoneage_versioned_npc_symbol_resolver_probe.py
      - tests/test_stoneage_versioned_npc_symbol_resolver_probe.py
      - tools/stoneage_recovered25_runtime_graphic_mapping_probe.py
      - tests/test_stoneage_recovered25_runtime_graphic_mapping_probe.py
      - tools/stoneage_stable_map_name_encoding_probe.py
      - tests/test_stoneage_stable_map_name_encoding_probe.py
      - tools/stoneage_stable_map_name_decode_probe.py
      - tests/test_stoneage_stable_map_name_decode_probe.py
      - tools/stoneage_warp_destination_corpus_probe.py
      - tests/test_stoneage_warp_destination_corpus_probe.py
      - tools/stoneage_missing_warp_destination_payload_probe.py
      - tests/test_stoneage_missing_warp_destination_payload_probe.py
      - tools/stoneage_server_only_floor_gameplay_probe.py
      - tests/test_stoneage_server_only_floor_gameplay_probe.py
      - tools/stoneage_server_static_map.py
      - tests/test_stoneage_server_static_map.py
      - tools/stoneage_server_only_static_map_probe.py
      - tests/test_stoneage_server_only_static_map_probe.py
      - tools/stoneage_world_map_library.py
      - research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt
      - research/recovered/tw10-resource-metadata/SPR-GROUP-R1.tsv.gz
      - .github/workflows/probe-stoneage-25-world-content-coverage.yml

permissions:
  contents: write

concurrency:
  group: stoneage-25-world-content-coverage
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate world-content classifiers
        run: |
          python3 -m unittest \
            tests.test_stoneage_world_content_coverage_probe \
            tests.test_stoneage_versioned_world_geometry_probe \
            tests.test_stoneage_versioned_npc_template_binding_probe \
            tests.test_stoneage_versioned_npc_template_profile_probe \
            tests.test_stoneage_versioned_npc_symbol_resolver_probe \
            tests.test_stoneage_recovered25_runtime_graphic_mapping_probe \
            tests.test_stoneage_stable_map_name_encoding_probe \
            tests.test_stoneage_stable_map_name_decode_probe \
            tests.test_stoneage_warp_destination_corpus_probe \
            tests.test_stoneage_missing_warp_destination_payload_probe \
            tests.test_stoneage_server_only_floor_gameplay_probe \
            tests.test_stoneage_server_static_map \
            tests.test_stoneage_server_only_static_map_probe -v

      - name: Install archive tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar

      - name: Recover verified 2.5 preservation bundle transiently
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib, html, json, re, http.cookiejar, urllib.parse, urllib.request
          from pathlib import Path

          ua='Mozilla/5.0'
          expected={
              'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5',
              'ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb',
          }
          opener=urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          opener.addheaders=[('User-Agent',ua)]

          def get(key,suffix):
              data=urllib.parse.urlencode({
                  'quick_key':key,
                  'response_format':'json',
              }).encode()
              req=urllib.request.Request(
                  'https://www.mediafire.com/api/1.5/file/get_info.php',
                  data=data,
                  headers={'User-Agent':ua},
              )
              with opener.open(req,timeout=60) as response:
                  info=json.load(response)['response']['file_info']
              if str(info.get('hash') or '').lower()!=expected[key]:
                  raise SystemExit('MediaFire metadata hash changed')
              req=urllib.request.Request(
                  info['links']['normal_download'],
                  headers={'User-Agent':ua},
              )
              with opener.open(req,timeout=60) as response:
                  page=response.read().decode('utf-8','replace')
                  referer=response.geturl()
              match=(
                  re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S)
                  or re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
              )
              if not match:
                  raise SystemExit('No direct MediaFire link')
              dest=Path('/tmp/sa25')/f'part.{suffix}'
              digest=hashlib.sha256()
              request=urllib.request.Request(
                  html.unescape(match.group(1)),
                  headers={'User-Agent':ua,'Referer':referer},
              )
              with opener.open(request,timeout=300) as response,dest.open('wb') as out:
                  while True:
                      block=response.read(1024*1024)
                      if not block:
                          break
                      out.write(block)
                      digest.update(block)
              if digest.hexdigest()!=expected[key]:
                  raise SystemExit('MediaFire payload hash mismatch')

          get('ev7l29fw77891go','001')
          get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 > /tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar | awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out
          ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/tmp/sa25/unar.log 2>&1

      - name: Build floor-level versioned coverage
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          M="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N" && test -n "$D" && test -n "$M"

          report=research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            if [ -n "$C" ]; then
              python3 -m tools.stoneage_world_content_coverage_probe \
                --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
                --npc-dir "$N" \
                --data-dir "$D" \
                --map-dir "$M" \
                --setup "$C"
            else
              python3 -m tools.stoneage_world_content_coverage_probe \
                --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
                --npc-dir "$N" \
                --data-dir "$D" \
                --map-dir "$M"
            fi
          } > "$report"

      - name: Build versioned numeric world geometry
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          M="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N" && test -n "$D" && test -n "$M"

          report=research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            if [ -n "$C" ]; then
              python3 -m tools.stoneage_versioned_world_geometry_probe \
                --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
                --npc-dir "$N" \
                --data-dir "$D" \
                --map-dir "$M" \
                --setup "$C"
            else
              python3 -m tools.stoneage_versioned_world_geometry_probe \
                --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
                --npc-dir "$N" \
                --data-dir "$D" \
                --map-dir "$M"
            fi
          } > "$report"

      - name: Audit stable server-map name encoding
        run: |
          set -euo pipefail
          M="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          test -n "$M"
          report=research/recovered/STONEAGE-25-STABLE-MAP-NAME-ENCODING-R1.txt
          python3 -m tools.stoneage_stable_map_name_encoding_probe \
            --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
            --server-map-root "$M" \
            > "$report"

      - name: Verify stable server-map name encoding audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-MAP-NAME-ENCODING-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|stable_floor_candidates|761' "$report"
          grep -F 'RESOLUTION|STABLE_SERVER_MAP_NAME_ENCODING_AUDITED' "$report"

      - name: Decode stable server-map names
        run: |
          set -euo pipefail
          M="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          test -n "$M"
          report=research/recovered/STONEAGE-25-STABLE-MAP-NAMES-R1.txt
          python3 -m tools.stoneage_stable_map_name_decode_probe \
            --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
            --server-map-root "$M" \
            > "$report"

      - name: Verify decoded stable server-map names
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-MAP-NAMES-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|stable_floor_candidates|761' "$report"
          grep -F 'COUNT|stable_with_dimension_matched_server_name|572' "$report"
          grep -F 'RESOLUTION|STABLE_SERVER_MAP_NAMES_DECODED' "$report"

      - name: Build anonymous stable-world NPC template bindings
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          M="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          test -n "$N" && test -n "$M"

          report=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            python3 -m tools.stoneage_versioned_npc_template_binding_probe \
              --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
              --geometry-report research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt \
              --npc-dir "$N" \
              --map-dir "$M"
          } > "$report"

      - name: Verify anonymous NPC template bindings
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|stable_spawn_placements|3856' "$report"
          test "$(grep -c '^PLACEMENT_TEMPLATE|' "$report")" = "3856"
          grep -F 'RESOLUTION|ANONYMOUS_NPC_TEMPLATE_BINDINGS_CLASSIFIED' "$report"

      - name: Build anonymous stable-world NPC template runtime profiles
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          test -n "$N"

          report=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            python3 -m tools.stoneage_versioned_npc_template_profile_probe \
              --binding-report research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt \
              --npc-dir "$N"
          } > "$report"

      - name: Verify anonymous NPC template runtime profiles
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|referenced_template_identities|73' "$report"
          grep -F 'RESOLUTION|ANONYMOUS_NPC_TEMPLATE_RUNTIME_PROFILES_CLASSIFIED' "$report"

      - name: Audit anonymous NPC graphic/type symbols
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          test -n "$N"

          mkdir -p /tmp/npcsymbol
          curl -fsSL \
            'https://raw.githubusercontent.com/gavinlinasd/StoneAge/1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56/gmsv/src/include/anim_tbl.h' \
            -o /tmp/npcsymbol/gavin.h
          curl -fsSL \
            'https://raw.githubusercontent.com/iriselia/StoneAge/9e6c8ce2cd8ed532a7157773acd1c61582c178b5/Source/gmsv/include/anim_tbl.h' \
            -o /tmp/npcsymbol/iris.h
          curl -fsSL \
            'https://raw.githubusercontent.com/BismarckDD/stoneage/999ffdf1d220ec6666eb65339180689c9caf1876/server/gmsv/include/anim_tbl.h' \
            -o /tmp/npcsymbol/bismarck.h

          A="$(find /tmp/sa25/out -type f -iname 'anim_tbl.h' -path '*/SA2.5服務端/*' -print -quit || true)"
          report=research/recovered/STONEAGE-25-STABLE-NPC-SYMBOL-RESOLUTION-R1.txt
          ARGS=(
            --binding-report research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt
            --profile-report research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt
            --npc-dir "$N"
            --gavin-anim /tmp/npcsymbol/gavin.h
            --iris-anim /tmp/npcsymbol/iris.h
            --bismarck-anim /tmp/npcsymbol/bismarck.h
            --tw1-spr-groups research/recovered/tw10-resource-metadata/SPR-GROUP-R1.tsv.gz
          )
          if [ -n "$A" ]; then
            ARGS+=(--recovered-anim "$A")
          fi
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            echo 'SOURCE_REVISION|gavinlinasd/StoneAge|1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56'
            echo 'SOURCE_REVISION|iriselia/StoneAge|9e6c8ce2cd8ed532a7157773acd1c61582c178b5'
            echo 'SOURCE_REVISION|BismarckDD/stoneage|999ffdf1d220ec6666eb65339180689c9caf1876'
            echo "RECOVERED_ANIM_TABLE_PRESENT|$([ -n "$A" ] && echo 1 || echo 0)"
            python3 -m tools.stoneage_versioned_npc_symbol_resolver_probe "${ARGS[@]}"
          } > "$report"

      - name: Verify anonymous NPC graphic/type symbol audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-NPC-SYMBOL-RESOLUTION-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'RESOLUTION|ANONYMOUS_NPC_SYMBOL_RESOLUTION_AUDITED' "$report"
          test "$(grep -c '^SYMBOL_TOKEN|' "$report")" -ge 1

      - name: Audit recovered runtime graphic mapping files
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-RUNTIME-GRAPHIC-MAPPING-R1.txt
          python3 -m tools.stoneage_recovered25_runtime_graphic_mapping_probe \
            --profile-report research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt \
            --binding-report research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt \
            --recovered-root /tmp/sa25/out \
            --tw10-spr-groups research/recovered/tw10-resource-metadata/SPR-GROUP-R1.tsv.gz \
            > "$report"

      - name: Verify recovered runtime graphic mapping audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-RUNTIME-GRAPHIC-MAPPING-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|opaque_token_identities|4' "$report"
          grep -F 'COUNT|runtime_mapping_files|0' "$report"
          grep -F 'COUNT|status:RECOVERED25_MAPPING_ABSENT|4' "$report"
          grep -F 'COUNT|graphic_placements_total|880' "$report"
          grep -F 'COUNT|type_placements_total|89' "$report"
          grep -F 'RESOLUTION|RECOVERED25_RUNTIME_GRAPHIC_MAPPING_AUDITED' "$report"

      - name: Build stable-world encounter runtime audit
        run: |
          set -euo pipefail
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$D"

          report=research/recovered/STONEAGE-25-STABLE-ENCOUNTER-RUNTIME-R1.txt
          if [ -n "$C" ]; then
            python3 -m tools.stoneage_versioned_encounter_runtime_probe \
              --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
              --coverage-report research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt \
              --geometry-report research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt \
              --data-dir "$D" \
              --setup "$C" > "$report"
          else
            python3 -m tools.stoneage_versioned_encounter_runtime_probe \
              --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
              --coverage-report research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt \
              --geometry-report research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt \
              --data-dir "$D" > "$report"
          fi

      - name: Verify derived encounter runtime audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-ENCOUNTER-RUNTIME-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|stable_encounter_areas|402' "$report"
          grep -F 'RESOLUTION|VERSIONED_ENCOUNTER_RUNTIME_AUDITED' "$report"

      - name: Verify derived coverage report
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'COUNT|stable_floor_candidates|761' "$report"
          test "$(grep -c '^FLOOR|' "$report")" = "761"
          grep -F 'RESOLUTION|VERSIONED_WORLD_CONTENT_COVERAGE_CLASSIFIED' "$report"

      - name: Verify derived world geometry report
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|stable_floor_candidates|761' "$report"
          grep -F 'WARP_RULE|only classic functionset=Warp' "$report"
          grep -F 'RESOLUTION|VERSIONED_WORLD_GEOMETRY_CLASSIFIED' "$report"

      - name: Classify outside-stable classic-warp destinations
        run: |
          set -euo pipefail
          MAP_ROOT="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
          test -n "$MAP_ROOT"
          report=research/recovered/STONEAGE-25-OUTSIDE-STABLE-WARP-DESTINATIONS-R1.txt
          python3 -m tools.stoneage_warp_destination_corpus_probe \
            --geometry-report research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt \
            --lineage-report research/recovered/STONEAGE-TW10-FIELDMAP-LINEAGE-R1.txt \
            --map-root "$MAP_ROOT" \
            --profile research/recovered/tw10-resource-metadata/COLLISION-ATTR-R1.tsv.gz \
            > "$report"

      - name: Verify outside-stable warp destination audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-OUTSIDE-STABLE-WARP-DESTINATIONS-R1.txt
          test -s "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|classic_warp_edges|2264' "$report"
          grep -F 'COUNT|outside_stable_edges|355' "$report"
          grep -F 'COUNT|outside_stable_destination_ids|30' "$report"
          grep -F 'COUNT|status:CHANGED:ids|13' "$report"
          grep -F 'COUNT|status:CHANGED:edges|283' "$report"
          grep -F 'COUNT|status:SAME_SHA_NONSTABLE:ids|13' "$report"
          grep -F 'COUNT|status:SAME_SHA_NONSTABLE:edges|68' "$report"
          grep -F 'COUNT|status:CLIENT_DAT_MISSING:ids|4' "$report"
          grep -F 'COUNT|status:CLIENT_DAT_MISSING:edges|4' "$report"
          grep -F 'COUNT|recovered25_tw1_asset_compatible:1:ids|6' "$report"
          grep -F 'COUNT|recovered25_tw1_asset_compatible:1:edges|98' "$report"
          grep -F 'COUNT|recovered25_tw1_asset_compatible:0:ids|20' "$report"
          grep -F 'COUNT|recovered25_tw1_asset_compatible:0:edges|253' "$report"
          test "$(grep -c '^DESTINATION|' "$report")" = "30"
          ! grep -F 'status=CLIENT_DAT_DUPLICATE' "$report"
          ! grep -F 'status=CLIENT_DAT_INVALID' "$report"
          grep -F 'RESOLUTION|OUTSIDE_STABLE_WARP_DESTINATIONS_CLASSIFIED' "$report"

      - name: Audit missing-DAT warp destination payload surfaces
        run: |
          set -euo pipefail
          CLIENT_MAP_ROOT="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
          SERVER_MAP_ROOT="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          test -n "$CLIENT_MAP_ROOT" && test -n "$SERVER_MAP_ROOT"
          report=research/recovered/STONEAGE-25-MISSING-WARP-DESTINATION-PAYLOADS-R1.txt
          python3 -m tools.stoneage_missing_warp_destination_payload_probe \
            --first-stage-report research/recovered/STONEAGE-25-OUTSIDE-STABLE-WARP-DESTINATIONS-R1.txt \
            --client-map-root "$CLIENT_MAP_ROOT" \
            --server-map-root "$SERVER_MAP_ROOT" \
            > "$report"

      - name: Verify missing-DAT warp destination payload audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-MISSING-WARP-DESTINATION-PAYLOADS-R1.txt
          test -s "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|missing_dat_destination_ids|4' "$report"
          grep -F 'COUNT|missing_dat_edges|4' "$report"
          test "$(grep -c '^MISSING_DAT_DESTINATION|' "$report")" = "4"
          grep -F 'RESOLUTION|MISSING_DAT_WARP_DESTINATION_PAYLOADS_CLASSIFIED' "$report"

      - name: Audit gameplay on server-only warp destination floors
        run: |
          set -euo pipefail
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$N" && test -n "$D" && test -n "$C"
          report=research/recovered/STONEAGE-25-SERVER-ONLY-FLOOR-GAMEPLAY-R1.txt
          python3 -m tools.stoneage_server_only_floor_gameplay_probe \
            --payload-report research/recovered/STONEAGE-25-MISSING-WARP-DESTINATION-PAYLOADS-R1.txt \
            --npc-dir "$N" \
            --data-dir "$D" \
            --setup "$C" \
            > "$report"

      - name: Verify server-only floor gameplay audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-SERVER-ONLY-FLOOR-GAMEPLAY-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|target_floors|4' "$report"
          test "$(grep -c '^FLOOR|' "$report")" = "4"
          grep -F 'RESOLUTION|SERVER_ONLY_FLOOR_GAMEPLAY_COVERAGE_CLASSIFIED' "$report"

      - name: Audit static collision materialization on server-only floors
        run: |
          set -euo pipefail
          SERVER_MAP_ROOT="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          MAPSET="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/data/map/mapset.txt' -print -quit)"
          test -n "$SERVER_MAP_ROOT" && test -n "$MAPSET"
          report=research/recovered/STONEAGE-25-SERVER-ONLY-STATIC-MAP-R1.txt
          python3 -m tools.stoneage_server_only_static_map_probe \
            --payload-report research/recovered/STONEAGE-25-MISSING-WARP-DESTINATION-PAYLOADS-R1.txt \
            --server-map-root "$SERVER_MAP_ROOT" \
            --mapset "$MAPSET" \
            > "$report"

      - name: Verify server-only static map audit
        run: |
          set -euo pipefail
          report=research/recovered/STONEAGE-25-SERVER-ONLY-STATIC-MAP-R1.txt
          test -s "$report"
          grep -F 'SEMANTIC_SOURCE_VERSION|recovered25' "$report"
          grep -F 'EVIDENCE_ROLE|LATER_RECOVERED' "$report"
          grep -F 'COUNT|target_floors|4' "$report"
          grep -F 'COUNT|floors_with_missing_image_metadata|0' "$report"
          test "$(grep -c '^FLOOR|' "$report")" = "4"
          ! grep -F 'ordinary_walkable_cells=UNKNOWN' "$report"
          ! grep -F 'flying_walkable_cells=UNKNOWN' "$report"
          grep -F 'RESOLUTION|SERVER_ONLY_STATIC_MAPS_MATERIALIZABLE' "$report"

      - name: Delete transient proprietary payloads
        if: always()
        run: rm -rf /tmp/sa25

      - name: Commit derived floor-level metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          coverage=research/recovered/STONEAGE-25-STABLE-WORLD-CONTENT-COVERAGE-R1.txt
          geometry=research/recovered/STONEAGE-25-STABLE-WORLD-GEOMETRY-R1.txt
          encounter_runtime=research/recovered/STONEAGE-25-STABLE-ENCOUNTER-RUNTIME-R1.txt
          npc_template_bindings=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt
          npc_template_profiles=research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt
          npc_symbol_resolution=research/recovered/STONEAGE-25-STABLE-NPC-SYMBOL-RESOLUTION-R1.txt
          npc_runtime_graphics=research/recovered/STONEAGE-25-RUNTIME-GRAPHIC-MAPPING-R1.txt
          map_name_encoding=research/recovered/STONEAGE-25-STABLE-MAP-NAME-ENCODING-R1.txt
          map_names=research/recovered/STONEAGE-25-STABLE-MAP-NAMES-R1.txt
          outside_warp_destinations=research/recovered/STONEAGE-25-OUTSIDE-STABLE-WARP-DESTINATIONS-R1.txt
          missing_warp_destination_payloads=research/recovered/STONEAGE-25-MISSING-WARP-DESTINATION-PAYLOADS-R1.txt
          server_only_floor_gameplay=research/recovered/STONEAGE-25-SERVER-ONLY-FLOOR-GAMEPLAY-R1.txt
          server_only_static_map=research/recovered/STONEAGE-25-SERVER-ONLY-STATIC-MAP-R1.txt
          git add "$coverage" "$geometry" "$encounter_runtime" "$npc_template_bindings" "$npc_template_profiles" "$npc_symbol_resolution" "$npc_runtime_graphics" "$map_name_encoding" "$map_names" "$outside_warp_destinations" "$missing_warp_destination_payloads" "$server_only_floor_gameplay" "$server_only_static_map"
          git diff --cached --quiet && exit 0
          git commit -m 'research: classify stable map world geometry'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            exit 1
          fi
          git push
