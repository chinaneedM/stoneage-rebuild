name: Probe WeLoveSA 2.5 clean-client replies

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-stoneage-welovesa-25-clean-replies.yml

permissions:
  contents: write

concurrency:
  group: stoneage-welovesa-25-clean-replies
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Probe anonymous reply pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 - > research/recovered/STONEAGE-WELOVESA-25-CLEAN-REPLIES-R1.txt <<'PY'
          import hashlib, html, re, urllib.request
          from html.parser import HTMLParser

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          BASE='https://lab.welovesa.com/viewthread.php?tid=2132&page={page}'
          KEY_RE=re.compile(r'(?i)(下載|下载|網盤|网盘|百度|115|迅雷|mediafire|mega|rayfile|檔案|文件|附件|連結|链接|地址|提取碼|提取码|密碼|密码|失效|過期|过期|解壓|解压|版本|客戶端|客户端|純淨|纯净|2\.5|rar|zip|7z|exe|iso|bin|cue)')
          URL_RE=re.compile(r'(?i)\b(?:https?|ftp)://[^\s"\'<>]+')

          class Visible(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip=0; self.parts=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower() in ('script','style'): self.skip+=1
                  if tag.lower()=='a':
                      href=dict(attrs).get('href')
                      if href: self.links.append(href)
              def handle_endtag(self,tag):
                  if tag.lower() in ('script','style') and self.skip: self.skip-=1
              def handle_data(self,data):
                  if not self.skip:
                      s=' '.join(html.unescape(data).split())
                      if s: self.parts.append(s)

          def clean(s,limit=1200):
              return ' '.join(str(s or '').split()).replace('|','%7C')[:limit]

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      b=r.read(2_000_001)[:2_000_000]
                      return True,getattr(r,'status',r.getcode()),r.geturl(),b
              except Exception as e:
                  return False,'',url,(type(e).__name__+': '+str(e)).encode()

          print('StoneAge WeLoveSA 2.5 clean-client public-reply probe — R1')
          print('SCOPE|tid=2132|anonymous-pages-2-through-5|public-visible-reply-clues-only')
          print('EVIDENCE_BOUNDARY|No login, payment, cookie purchase, or access-control bypass is attempted.')
          total_rows=0; total_external=0
          for page in range(2,6):
              url=BASE.format(page=page)
              ok,status,final,b=fetch(url)
              if not ok:
                  print(f'PAGE|page={page}|ok=0|error={clean(b.decode("utf-8","replace"))}')
                  continue
              text=b.decode('utf-8','replace')
              p=Visible()
              try: p.feed(text)
              except Exception: pass
              digest=hashlib.sha256(b).hexdigest()
              title_hit=('2.5' in text and ('纯净' in text or '純淨' in text) and '石器' in text)
              print(f'PAGE|page={page}|ok=1|status={status}|bytes={len(b)}|sha256={digest}|final={clean(final)}|title_hit={int(title_hit)}|visible_fragments={len(p.parts)}|hrefs={len(p.links)}')

              seen=set()
              for i,s in enumerate(p.parts):
                  if not KEY_RE.search(s): continue
                  ctx=' / '.join(p.parts[max(0,i-2):min(len(p.parts),i+3)])
                  k=clean(ctx,1800)
                  if k in seen: continue
                  seen.add(k); total_rows+=1
                  print(f'CLUE|page={page}|value={k}')

              for href in p.links:
                  h=html.unescape(href); low=h.lower()
                  if h.startswith(('http://','https://','ftp://')) and 'lab.welovesa.com' not in low:
                      if any(t in low for t in ('download','mediafire','115.com','baidu','xunlei','rayfile','mega','drive.google','dropbox','.rar','.zip','.7z','.exe','.iso','.bin','.cue')):
                          total_external+=1
                          print(f'EXTERNAL|page={page}|href={clean(h,2000)}')
                  elif any(t in low for t in ('attachment.php','attach','download.php')):
                      total_external+=1
                      print(f'ATTACHMENT_REF|page={page}|href={clean(h,2000)}')

              for u in URL_RE.findall(text):
                  low=u.lower()
                  if any(t in low for t in ('mediafire','115.com','baidu','xunlei','rayfile','mega','download','.rar','.zip','.7z','.exe','.iso','.bin','.cue')):
                      total_external+=1
                      print(f'RAW_URL|page={page}|url={clean(html.unescape(u),2000)}')

          print(f'COUNT|relevant_text_rows|{total_rows}')
          print(f'COUNT|download_or_attachment_refs|{total_external}')
          if total_external:
              print('RESOLUTION|PUBLIC_REPLY_DOWNLOAD_TOKEN_FOUND|validate token provenance before payload recovery')
          elif total_rows:
              print('RESOLUTION|PUBLIC_REPLY_CONTEXT_ONLY|no public download token extracted')
          else:
              print('RESOLUTION|NO_PUBLIC_REPLY_CLUE|reply pages expose no relevant anonymous clue on tested surface')
          PY

      - name: Commit derived report only
        shell: bash
        run: |
          set -euo pipefail
          report='research/recovered/STONEAGE-WELOVESA-25-CLEAN-REPLIES-R1.txt'
          cp "$report" /tmp/STONEAGE-WELOVESA-25-CLEAN-REPLIES-R1.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/STONEAGE-WELOVESA-25-CLEAN-REPLIES-R1.txt "$report"
          git add "$report"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe WeLoveSA 2.5 clean-client replies'
          git push
