name: Inspect 21CN sa25up JPG metadata

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_21cn_jpg_probe.py
      - tests/test_stoneage_sa25_21cn_jpg_probe.py
      - .github/workflows/probe-stoneage-sa25-21cn-jpg.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-21cn-jpg
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate JPEG metadata parser
        run: python3 -m unittest tests.test_stoneage_sa25_21cn_jpg_probe -v
      - name: Inspect dated archived JPG transiently
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_21cn_jpg_probe \
            > research/recovered/STONEAGE-SA25-21CN-JPG-R1.txt
      - name: Fetch transient JPG for visual inspection
        run: |
          python3 - <<'PY'
          import urllib.request
          url='https://web.archive.org/web/20020517235842id_/http://download.21cn.com:80/file/game/maoxian/sa25up.jpg'
          req=urllib.request.Request(url,headers={'User-Agent':'stoneage-rebuild-archaeology/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read(500000)
          open('/tmp/sa25up-20020517.jpg','wb').write(data)
          PY
      - name: Upload transient JPG artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa25up-jpg-visual-inspection
          path: /tmp/sa25up-20020517.jpg
          retention-days: 1
          if-no-files-found: error
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-21CN-JPG-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: inspect archived 21CN sa25up JPG metadata'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
