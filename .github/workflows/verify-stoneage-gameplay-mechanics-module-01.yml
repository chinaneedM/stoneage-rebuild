  workflow_dispatch:
jobs:
  source-derived-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact independent later community petshop C, never publish it
        run: |
          curl --fail --location --silent --show-error --retry 3 'https://raw.githubusercontent.com/pimpcapital/longzoro-sa/57b14e2bb373ba851c14db28a239273e4a8831bb/gmsv/src/npc/npc_petshop.c' -o /tmp/stoneage-world29-petshop.c
      - name: Verify WORLD29 16 source-qualified shops against the separate pinned C
        env:
          STONEAGE_WORLD29_PINNED_C: /tmp/stoneage-world29-petshop.c
        run: python -m unittest -v tests.test_stoneage_stage_a_world29_petshop_source
      - run: python -m unittest discover -s tests -p 'test_stoneage_gameplay_mechanics_module_01.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_gameplay_mechanics_module_02.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_gameplay_mechanics_module_03.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_gameplay_mechanics_module_04.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_gameplay_mechanics_module_05.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_gameplay_mechanics_module_06.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_gameplay_mechanics_module_07.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_01.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_02.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_03.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_stage_a_source_gap_20261104.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_stage_a_original_rar_block_replay.py' -v
      - run: python -m unittest -v tests.test_stoneage_stage_a_world30_cooking_source
      - run: python -m unittest -v tests.test_stoneage_stage_a_world31_recovery_source
      - run: python -m unittest -v tests.test_stoneage_stage_a_world32_battle_recovery_source
      - run: python -m unittest -v tests.test_stoneage_stage_a_world33_battle_item_gate_source
      - run: python -m unittest -v tests.test_stoneage_stage_a_world34_field_item_bridge
      - run: python -m unittest -v tests.test_stoneage_stage_a_world34_original_field_source
      - run: python -m unittest -v tests.test_stoneage_stage_a_world34_r2_mapped_pe_source
      - run: python -m unittest -v tests.test_stoneage_stage_a_world34_r3_field_item_replay
      - run: python -m unittest -v tests.test_stoneage_stage_a_world35_capture_item_source
      - run: python -m unittest -v tests.test_stoneage_stage_a_world36_capture_roster_source
