name: Verify GAMEPLAY01 original family arena and rebirth source bounds
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-GAMEPLAY01-ORIGINAL-FAMILY-ARENA-PET-REBIRTH-R1.json'
      - 'research/recovered/STONEAGE-CHARACTER-NPC-MODULE-01-FULL-SOURCE-ROWS-R1.json'
      - 'tests/test_stoneage_gameplay_mechanics_module_01.py'
      - '.github/workflows/verify-stoneage-gameplay-mechanics-module-01.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-GAMEPLAY01-ORIGINAL-FAMILY-ARENA-PET-REBIRTH-R1.json'
      - 'tests/test_stoneage_gameplay_mechanics_module_01.py'
      - '.github/workflows/verify-stoneage-gameplay-mechanics-module-01.yml'
  workflow_dispatch:
jobs:
  source-derived-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_gameplay_mechanics_module_01.py' -v
