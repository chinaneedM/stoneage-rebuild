name: Verify modern offline observation and Simplified Chinese default R1
on:
  push:
    branches: [main, agent/modern-observation-zhcn-r1-20261027]
    paths:
      - ".github/workflows/verify-stoneage-modern-observation-zhcn-r1.yml"
      - "tools/stoneage_modern_observation_manifest.py"
      - "tools/modern-observation-viewer.html"
      - "tests/test_stoneage_modern_observation_r1.py"
      - "docs/continuity/STONEAGE-MODERN-OBSERVATION-ZHCN-20261027.md"
      - "docs/DESIGN-DECISIONS.md"
permissions:
  contents: read
jobs:
  offline-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-version isolation and original-client-claim boundaries
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_modern_observation_r1
      - name: Reject bundled commercial artwork/audio and direct external network references
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html=Path("tools/modern-observation-viewer.html").read_text(encoding="utf-8")
          assert "<meta http-equiv=\"Content-Security-Policy\"" in html
          assert "default-src 'none'" in html
          assert "原版游戏" in html and "简体中文" in html
          assert "http://" not in html and "https://" not in html
          assert "fetch(" not in html and "data:image/" not in html
          print("ZHCN_OFFLINE_OBSERVER_SECURITY_BOUNDARY=PASS; ORIGINAL_WORLD_ENTERED=FALSE")
          PY
