name: PET110 CN75 exact archival RAR preflight
on:
  push:
    branches: ['agent/pet-high-first-108-cn75-archive-routes-20261126']
    paths:
      - 'tools/stoneage_pet_high_first_110_cn75_rar_preflight.py'
      - '.github/workflows/pet-high-first-110-cn75-rar-preflight.yml'
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15116635005/zip > "$RUNNER_TEMP/pet109.zip"
          python -m tools.stoneage_pet_high_first_110_cn75_rar_preflight --artifact "$RUNNER_TEMP/pet109.zip" --output "$RUNNER_TEMP/pet110.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pet110-cn75-rar-preflight-metadata
          path: ${{ runner.temp }}/pet110.json
          if-no-files-found: error
          retention-days: 15
