name: Discover Korean StoneAge preservation accounts

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_korean_preservation_account_discovery.py
      - tests/test_stoneage_korean_preservation_account_discovery.py
      - .github/workflows/probe-stoneage-korean-preservation-accounts.yml
      - research/recovered/STONEAGE-KOREAN-HISTORICAL-CD-CORPUS-R1.txt

permissions:
  contents: write

concurrency:
  group: stoneage-korean-preservation-accounts
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_korean_preservation_account_discovery -v
      - name: Resolve preservation uploader accounts
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_korean_preservation_account_discovery \
            > research/recovered/STONEAGE-KOREAN-PRESERVATION-ACCOUNTS-R1.txt
      - name: Commit derived uploader metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-KOREAN-PRESERVATION-ACCOUNTS-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: discover Korean preservation accounts'
          git pull --rebase origin main
          git push
