name: Verify JP2007 Ren home story and charm source boundaries
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-JP2007-REN-HOME-*.json'
      - 'tools/stoneage_jp2007_ren_home_source.py'
      - 'tests/test_stoneage_jp2007_ren_home_source.py'
      - '.github/workflows/verify-stoneage-jp2007-ren-home-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-JP2007-REN-HOME-*.json'
      - 'tools/stoneage_jp2007_ren_home_source.py'
      - 'tests/test_stoneage_jp2007_ren_home_source.py'
      - '.github/workflows/verify-stoneage-jp2007-ren-home-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check story attribution, calendar conflict, exchange and player charm
        run: python -m unittest tests.test_stoneage_jp2007_ren_home_source -v
      - name: Fetch both releases and reject seventeen real body mutations
        run: python -m tools.stoneage_jp2007_ren_home_source --fetch --output /tmp/jp2007-ren-home/replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: jp2007-ren-home-derived-replay
          path: /tmp/jp2007-ren-home/replay.json
          if-no-files-found: error
          retention-days: 30
