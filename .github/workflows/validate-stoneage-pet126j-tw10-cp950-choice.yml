name: PET126J original Taiwan PC CP950 pet-choice evidence dedup
on:
  push:
    paths:
      - '.github/workflows/validate-stoneage-pet126j-tw10-cp950-choice.yml'
      - 'docs/continuity/STONEAGE-PET126J-TW10-ORIGINAL-CP950-PET-CHOICE-RECONCILIATION-20261121.md'
      - 'research/recovered/STONEAGE-PET126J-TW10-CP950-PET-CHOICE-DIFFERENTIAL-R1.json'
      - 'tests/test_stoneage_pet126j_cp950_choice_differential.py'
  pull_request:
    paths:
      - '.github/workflows/validate-stoneage-pet126j-tw10-cp950-choice.yml'
      - 'docs/continuity/STONEAGE-PET126J-TW10-ORIGINAL-CP950-PET-CHOICE-RECONCILIATION-20261121.md'
      - 'research/recovered/STONEAGE-PET126J-TW10-CP950-PET-CHOICE-DIFFERENTIAL-R1.json'
      - 'tests/test_stoneage_pet126j_cp950_choice_differential.py'
jobs:
  original-choice-source-not-native-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate same EXE and CP950 hashes without original commercial binary
        run: |
          python -m unittest discover -s tests -p 'test_stoneage_pet126j_cp950_choice_differential.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet126d_tw10_capture_static.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pc_only_scope_20261119.py' -v
