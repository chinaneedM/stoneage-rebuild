name: Verify Stage A WORLD19 original item-use handlers
on:
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-19-*'
      - 'tests/test_stoneage_stage_a_world19_item_use.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world19.yml'
  push:
    branches: [main]
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-19-*'
      - 'tests/test_stoneage_stage_a_world19_item_use.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world19.yml'
jobs:
  public-source-joins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_stage_a_world19_item_use.py' -v
