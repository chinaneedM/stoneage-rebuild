name: PET-HIGH-FIRST-20 capsule and gallery replay
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_20.py'
      - 'research/pets/PET-HIGH-FIRST-20-CAPSULE-AND-GALLERY-R1.json'
      - '.github/workflows/pet-high-first-20.yml'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_20.py'
      - 'research/pets/PET-HIGH-FIRST-20-CAPSULE-AND-GALLERY-R1.json'
      - '.github/workflows/pet-high-first-20.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/stoneage_pet_high_first_20.py
