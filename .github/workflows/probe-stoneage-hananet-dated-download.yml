name: Probe dated Hananet StoneAge download surfaces
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_dated_download_probe.py
      - tests/test_stoneage_hananet_dated_download_probe.py
      - .github/workflows/probe-stoneage-hananet-dated-download.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-dated-download
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_dated_download_probe -v
      - name: Probe dated GameNet StoneAge surfaces
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_dated_download_probe             > research/recovered/STONEAGE-HANANET-DATED-DOWNLOAD-SURFACES-R1.txt
      - name: Commit derived download metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-DATED-DOWNLOAD-SURFACES-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe dated Hananet StoneAge download surfaces'
          git pull --rebase origin main
          git push
