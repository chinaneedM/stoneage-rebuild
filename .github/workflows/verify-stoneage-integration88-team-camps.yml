name: Verify StoneAge INTEGRATION88 original team camp 2D source
on:
  push:
    branches: [main, 'agent/stoneage-integration88-*']
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION88-TEAM-CAMP-GATE-WARP-ORIGINAL-2D-R1.json'
      - 'tests/test_stoneage_integration88_team_camps.py'
      - '.github/workflows/verify-stoneage-integration88-team-camps.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION88-TEAM-CAMP-GATE-WARP-ORIGINAL-2D-R1.json'
      - 'tests/test_stoneage_integration88_team_camps.py'
      - '.github/workflows/verify-stoneage-integration88-team-camps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original source blocks and 57 prior original pixel receipts
        run: python -m unittest discover -s tests -p 'test_stoneage_integration88_team_camps.py' -v
