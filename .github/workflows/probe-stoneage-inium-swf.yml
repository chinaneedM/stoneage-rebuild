name: Probe Inium StoneAge main SWF
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_inium_swf_probe.py
      - tests/test_stoneage_inium_swf_probe.py
      - .github/workflows/probe-stoneage-inium-swf.yml

permissions:
  contents: write

concurrency:
  group: stoneage-inium-swf
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_inium_swf_probe -v
      - name: Probe archived Inium SWF transiently
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_inium_swf_probe             > research/recovered/STONEAGE-INIUM-MAIN-SWF-TOKENS-R1.txt
      - name: Commit derived SWF metadata/tokens only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-INIUM-MAIN-SWF-TOKENS-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: extract Inium main SWF recovery tokens'
          git pull --rebase origin main
          git push
