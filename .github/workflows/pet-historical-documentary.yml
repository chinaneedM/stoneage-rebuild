name: PET historical documentary access
on:
  push:
    branches: ['agent/pet-historical-documentary-20261126']
    paths:
      - 'tools/stoneage_pet_documentary_access.py'
      - 'tools/stoneage_pet_source_lookup.py'
      - '.github/workflows/pet-historical-documentary.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/stoneage_pet_source_lookup.py --documentary --verify
      - run: python tools/stoneage_pet_source_lookup.py --documentary --source cn20_commission --query 乌力 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --documentary --source cn2004_trainers --query 猛毒攻击 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --legacy-pet16 --verify
      - run: python tools/stoneage_pet_source_lookup.py --verify
      - run: python tools/stoneage_pet_gap_queue.py --current --verify
      - run: PYTHONPATH=. python tools/stoneage_pet_final_review_matrix.py
      - run: cmp pet-final-review-matrix.json research/pets/PET-FINAL-REVIEW-MATRIX-R1.json
