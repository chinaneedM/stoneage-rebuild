name: Map Hananet STAD StoneAge files
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_stad_file_mapping_probe.py
      - tests/test_stoneage_hananet_stad_file_mapping_probe.py
      - .github/workflows/probe-stoneage-hananet-stad-file-mapping.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-stad-file-mapping
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_stad_file_mapping_probe -v
      - name: Map titles and sizes to direct files
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_stad_file_mapping_probe             > research/recovered/STONEAGE-HANANET-STAD-FILE-MAPPING-R1.txt
      - name: Commit derived mapping metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-STAD-FILE-MAPPING-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: map Hananet StoneAge STAD files'
          git pull --rebase origin main
          git push
