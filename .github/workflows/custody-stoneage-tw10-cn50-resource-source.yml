name: Pin TW1.0-CN5 real-source artifact ZIP and Git JSON provenance
on:
  push:
    branches:
      - agent/cn50-tw10-resource-source-custody-20261024
    paths:
      - tools/stoneage_tw10_cn50_record_source_custody.py
      - tests/test_stoneage_tw10_cn50_record_source_custody.py
      - .github/workflows/custody-stoneage-tw10-cn50-resource-source.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate positive and adversarial archive boundaries
        run: python3 -m unittest tests.test_stoneage_tw10_cn50_record_source_custody -v
      - name: Independently download verified original-source derived artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m tools.stoneage_tw10_cn50_record_source_custody /tmp/stoneage-tw10-cn50-custody.json
      - name: Commit evidence-only receipt on separate research branch
        run: |
          set -euo pipefail
          F=research/recovered/STONEAGE-TW10-CN50-REAL-RESOURCE-CUSTODY-R1.json
          mkdir -p research/recovered
          cp /tmp/stoneage-tw10-cn50-custody.json "$F"
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add "$F"
          if ! git diff --cached --quiet; then
            git commit -m 'research: retain audited original-byte CI artifact custody'
            git push origin HEAD:agent/cn50-tw10-resource-source-custody-20261024
          fi
