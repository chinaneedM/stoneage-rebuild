name: Verify CN20 creation choices and reported stat relations
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN20-CREATION-STATUS-*.json'
      - 'research/recovered/JSS-LOGIN-MANUAL-CREATION-CONTRACT-R1.json'
      - 'research/recovered/STONEAGE-WAEI-CN20-NEWCOMER-GUIDE-R1.json'
      - 'tools/stoneage_cn20_creation_status_source.py'
      - 'tools/stoneage_cn20_riding_source.py'
      - 'tools/stoneage_jp2008_shadow_release.py'
      - 'tools/stoneage_cn2003_christmas_source.py'
      - 'tests/test_stoneage_cn20_creation_status_source.py'
      - '.github/workflows/verify-stoneage-cn20-creation-status-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN20-CREATION-STATUS-*.json'
      - 'research/recovered/JSS-LOGIN-MANUAL-CREATION-CONTRACT-R1.json'
      - 'research/recovered/STONEAGE-WAEI-CN20-NEWCOMER-GUIDE-R1.json'
      - 'tools/stoneage_cn20_creation_status_source.py'
      - 'tools/stoneage_cn20_riding_source.py'
      - 'tools/stoneage_jp2008_shadow_release.py'
      - 'tools/stoneage_cn2003_christmas_source.py'
      - 'tests/test_stoneage_cn20_creation_status_source.py'
      - '.github/workflows/verify-stoneage-cn20-creation-status-source.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify creation, level-up, regional scope and image boundaries
        run: python -m unittest discover -s tests -p 'test_stoneage_cn20_creation_status_source.py' -v
      - name: Read exact two HTML and separately dated GIF with pinned derived sources
        run: python -m tools.stoneage_cn20_creation_status_source --fetch --output /tmp/cn20-creation-derived/replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: cn20-creation-derived-replay
          path: /tmp/cn20-creation-derived/replay.json
          if-no-files-found: error
          retention-days: 30

