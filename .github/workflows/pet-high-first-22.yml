name: PET-HIGH-FIRST-22 named dossier replay
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_22.py'
      - 'research/pets/PET-HIGH-FIRST-22-JP-KR-NAMED-INDEX-R1.json'
      - '.github/workflows/pet-high-first-22.yml'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_22.py'
      - 'research/pets/PET-HIGH-FIRST-22-JP-KR-NAMED-INDEX-R1.json'
      - '.github/workflows/pet-high-first-22.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/stoneage_pet_high_first_22.py
