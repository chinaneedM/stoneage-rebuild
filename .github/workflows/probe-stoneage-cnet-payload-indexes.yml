name: Probe CNET StoneAge payload archive indexes
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_cnet_payload_archive_index_probe.py
      - tests/test_stoneage_cnet_payload_archive_index_probe.py
      - .github/workflows/probe-stoneage-cnet-payload-indexes.yml

permissions:
  contents: write

concurrency:
  group: stoneage-cnet-payload-indexes
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_cnet_payload_archive_index_probe -v
      - name: Query exact archive indexes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_cnet_payload_archive_index_probe             > research/recovered/STONEAGE-CNET-KOREA-PAYLOAD-ARCHIVE-INDEX-R1.txt
      - name: Commit derived index metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-CNET-KOREA-PAYLOAD-ARCHIVE-INDEX-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe CNET payload archive indexes'
          git pull --rebase origin main
          git push
