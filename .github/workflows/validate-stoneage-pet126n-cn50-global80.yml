name: PET126N original classic PC compiled pet album 80-byte record structure audit
on:
  push:
    paths:
      - 'tools/stoneage_pet126n_cn50_global80.py'
      - 'tests/test_stoneage_pet126n_cn50_global80.py'
      - '.github/workflows/validate-stoneage-pet126n-cn50-global80.yml'
  pull_request:
    paths:
      - 'tools/stoneage_pet126n_cn50_global80.py'
      - 'tests/test_stoneage_pet126n_cn50_global80.py'
      - '.github/workflows/validate-stoneage-pet126n-cn50-global80.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_pet126n_cn50_global80.py' -v
  actual-original-pc:
    if: github.event_name == 'push'
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cabextract binutils
      - name: Source-qualified CN5 original CAB prefix only
        run: python -m tools.stoneage_stoneage5_battle_extract_probe --output-cab /tmp/pet126n.cab --prefix-bytes 12582912
      - name: Bounded original 5.0 executable provenance and 80-byte global references
        run: |
          mkdir -p /tmp/pet126n-original
          cabextract -q -F sa_5000.exe -d /tmp/pet126n-original /tmp/pet126n.cab
          python -m tools.stoneage_pet126n_cn50_global80 --program /tmp/pet126n-original/sa_5000.exe --output /tmp/pet126n-derived.json
          echo PET126N_DERIVED_START
          cat /tmp/pet126n-derived.json
          echo PET126N_DERIVED_END
      - name: Purge commercial binary and private CAB bytes
        if: always()
        run: rm -rf /tmp/pet126n.cab /tmp/pet126n-original
