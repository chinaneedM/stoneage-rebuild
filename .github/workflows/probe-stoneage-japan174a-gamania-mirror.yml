name: Probe Japan StoneAge sa174gm Gamania mirror

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_japan174a_gamania_mirror_probe.py
      - tests/test_stoneage_japan174a_gamania_mirror_probe.py
      - .github/workflows/probe-stoneage-japan174a-gamania-mirror.yml

permissions:
  contents: write

concurrency:
  group: stoneage-japan174a-gamania-mirror
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_japan174a_gamania_mirror_probe -v
      - name: Probe exact Gamania mirror and public preservation indexes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_japan174a_gamania_mirror_probe             > research/recovered/STONEAGE-JAPAN-174A-GAMANIA-MIRROR-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-JAPAN-174A-GAMANIA-MIRROR-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Japan sa174gm Gamania mirror'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
