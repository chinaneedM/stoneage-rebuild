name: Probe Korean StoneAge payload filename indexes

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_korean_payload_filename_index_probe.py
      - tests/test_stoneage_korean_payload_filename_index_probe.py
      - .github/workflows/probe-stoneage-korean-payload-filename-indexes.yml

permissions:
  contents: write

concurrency:
  group: stoneage-korean-payload-filename-indexes
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate filename-index probe
        run: python3 -m unittest tests.test_stoneage_korean_payload_filename_index_probe -v
      - name: Probe public filename indexes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_korean_payload_filename_index_probe > research/recovered/STONEAGE-KOREA-PAYLOAD-FILENAME-INDEX-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-KOREA-PAYLOAD-FILENAME-INDEX-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan Korean StoneAge payload filenames'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
