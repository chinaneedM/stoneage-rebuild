name: Independently verify TW1.0 R50 original savedata caller and application consumers
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r50-caller-consumers-20261015, main]
    paths:
      - .github/workflows/verify-stoneage-tw10-r50-original.yml
      - tools/stoneage_tw10_savedata_native_io_r50_guard.py
      - tools/stoneage_tw10_savedata_application_r50.py
      - tests/test_stoneage_tw10_savedata_application_r50.py
      - research/recovered/STONEAGE-TW10-SAVEDATA-APPLICATION-R50.json
      - docs/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R50.md
      - research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R50-ORIGINAL.json
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate independent immutable original run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38684319450" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|49d1f536710facf1142b5218e05304616f11791a|agent/tw10-savedata-r50-caller-consumers-20261015'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11948569898" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38684319450|tw10-r50-original-caller-consumers-derived|sha256:87d1833da95abc1a7977db7c395c132ecd89d09b13b5b61ec8bcbc5ba146eec7|false'
      - name: Download bounded R50 original-derived metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r50-independent
          gh run download 38684319450 --repo "$GITHUB_REPOSITORY" --name tw10-r50-original-caller-consumers-derived --dir /tmp/r50-independent
          test "$(find /tmp/r50-independent -type f | wc -l)" -eq 1
          test -f /tmp/r50-independent/stoneage-r50-derived.json
          test ! -L /tmp/r50-independent/stoneage-r50-derived.json
          test "$(stat -c %s /tmp/r50-independent/stoneage-r50-derived.json)" -le 500000
          sha256sum /tmp/r50-independent/stoneage-r50-derived.json
          wc -c /tmp/r50-independent/stoneage-r50-derived.json
      - name: Replay strict R50 through R32 tamper and negative controls
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_application_r50 tests.test_stoneage_tw10_savedata_native_io_r50 tests.test_stoneage_tw10_savedata_native_io_r49 tests.test_stoneage_tw10_savedata_native_io_r48 tests.test_stoneage_tw10_savedata_native_io_r47 tests.test_stoneage_tw10_savedata_native_io_r46 tests.test_stoneage_tw10_savedata_native_io_r45 tests.test_stoneage_tw10_savedata_native_io_r44 tests.test_stoneage_tw10_savedata_native_io_r43 tests.test_stoneage_tw10_savedata_native_io_r42 tests.test_stoneage_tw10_savedata_native_io_r41 tests.test_stoneage_tw10_savedata_native_io_r40 tests.test_stoneage_tw10_savedata_native_io_r39 tests.test_stoneage_tw10_savedata_native_io_r38 tests.test_stoneage_tw10_savedata_native_io_r37 tests.test_stoneage_tw10_savedata_native_io_r36 tests.test_stoneage_tw10_savedata_native_io_r35 tests.test_stoneage_tw10_savedata_native_io_r34 tests.test_stoneage_tw10_savedata_native_io_r33 tests.test_stoneage_tw10_savedata_native_io_r32 tests.test_stoneage_tw10_savedata_argtrace_r7 tests.test_stoneage_tw10_savedata_argtrace_r7_guard
          python -m tools.stoneage_tw10_savedata_native_io_r50_guard --report /tmp/r50-independent/stoneage-r50-derived.json
      - name: Review original bounded report and canonical exact equality when admitted
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from tools.stoneage_tw10_savedata_native_io_r50_guard import validate
          source=Path('/tmp/r50-independent/stoneage-r50-derived.json').read_bytes()
          assert len(source)==163325
          assert hashlib.sha256(source).hexdigest()=='0badd1423f403a9e8a246a40518a68ee5a1bd67d380ea7ab3460fc3c607c3e94'
          report=json.loads(source)
          validate(report)
          p=Path('research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R50-ORIGINAL.json')
          assert p.exists(), 'R50 canonical derivative missing'
          if p.exists():
              assert p.read_bytes() == source, 'original R50 canonical bytes differ'
              print('TW10_R50_EXACT_DERIVED_JSON_EQUALITY=PASS')
          else:
              print('TW10_R50_INDEPENDENT_REVIEW_ONLY=PASS')
          print('TW10_R50_ORIGINAL_DERIVED_JSON_BEGIN')
          from tools.stoneage_tw10_savedata_application_r50 import derive, validate as consumer_validate
          consumer=json.loads(Path('research/recovered/STONEAGE-TW10-SAVEDATA-APPLICATION-R50.json').read_text())
          consumer_validate(consumer, source)
          print('TW10_R50_PINNED_APPLICATION_CONSUMERS=PASS')
          print(json.dumps(consumer['processor_memory_control_sample'],sort_keys=True))
          print('TW10_R50_ORIGINAL_DERIVED_JSON_END')
          PY
      - name: Purge independent temporary derivative
        if: always()
        run: rm -rf /tmp/r50-independent
