name: Validate archived historical site navigation and query boundaries
on:
  workflow_dispatch:
  push:
    paths:
      - research/recovered/STONEAGE-HISTORICAL-SITE-NAVIGATION*.json
      - tools/stoneage_historical_site_navigation*.py
      - tests/test_stoneage_historical_site_navigation*.py
      - docs/specs/STONEAGE-HISTORICAL-SITE-NAVIGATION-R1.md
      - .github/workflows/validate-stoneage-historical-site-navigation.yml
permissions:
  contents: read
jobs:
  archived-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest tests.test_stoneage_historical_site_navigation_probe tests.test_stoneage_historical_site_navigation_catalog tests.test_stoneage_historical_site_navigation_archive tests.test_stoneage_historical_wiki_query_contract -v
