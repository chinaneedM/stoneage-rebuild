name: Trace 21CN StoneAge 2.5 download router 20165

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_21cn_downit20165_probe.py
      - tests/test_stoneage_sa25_21cn_downit20165_probe.py
      - .github/workflows/probe-stoneage-sa25-21cn-downit20165.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-21cn-downit20165
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sa25_21cn_downit20165_probe -v
      - name: Trace archived router topology
        run: |
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_21cn_downit20165_probe > research/recovered/STONEAGE-SA25-21CN-DOWNIT-20165-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA25-21CN-DOWNIT-20165-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: trace 21CN StoneAge 2.5 download router 20165'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
