name: Recover Waei StoneAge early download page
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_early_downloan_recovery.py
      - tests/test_stoneage_waei_early_downloan_recovery.py
      - .github/workflows/recover-stoneage-waei-early-downloan.yml
permissions:
  contents: write
concurrency:
  group: stoneage-waei-early-downloan
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_waei_early_downloan_recovery -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_early_downloan_recovery > research/recovered/STONEAGE-WAEI-EARLY-DOWNLOAN-R1.txt
      - run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-WAEI-EARLY-DOWNLOAN-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: recover Waei early StoneAge download page'
          git pull --rebase origin main
          git push
