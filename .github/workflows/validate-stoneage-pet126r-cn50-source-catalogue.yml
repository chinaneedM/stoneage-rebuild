name: PET126R original classic PC full compiled pet album provenance and SPR hypothesis
on:
  push:
    paths:
      - 'tools/stoneage_pet126r_cn50_source_catalogue.py'
      - 'tests/test_stoneage_pet126r_cn50_source_catalogue.py'
      - 'tests/test_stoneage_pet126r_cn50_lookup_integration.py'
      - 'tools/stoneage_pet16_lookup.py'
      - 'research/recovered/STONEAGE-PET126R-CN50-PC-ORIGINAL-ALBUM-FULL-362-SLOT-SOURCE-CATALOGUE-R1.json'
      - '.github/workflows/validate-stoneage-pet126r-cn50-source-catalogue.yml'
  pull_request:
    paths:
      - 'tools/stoneage_pet126r_cn50_source_catalogue.py'
      - 'tests/test_stoneage_pet126r_cn50_source_catalogue.py'
      - 'tests/test_stoneage_pet126r_cn50_lookup_integration.py'
      - 'tools/stoneage_pet16_lookup.py'
      - 'research/recovered/STONEAGE-PET126R-CN50-PC-ORIGINAL-ALBUM-FULL-362-SLOT-SOURCE-CATALOGUE-R1.json'
      - '.github/workflows/validate-stoneage-pet126r-cn50-source-catalogue.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tests -p 'test_stoneage_pet126r_cn50_source_catalogue.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet126r_cn50_lookup_integration.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet39_tw10_album.py' -v
  original-classic-PC:
    if: github.event_name == 'push'
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cabextract binutils
      - name: Rehydrate real saved 5.0 original classic-PC installer without publishing assets
        run: python -m tools.stoneage_stoneage5_battle_extract_probe --output-cab /tmp/pet126r.cab --prefix-bytes 12582912
      - name: Verify source EXE, full compiled album and exact same-CAB graphic segments
        run: |
          mkdir -p /tmp/pet126r-original
          cabextract -q -F sa_5000.exe -d /tmp/pet126r-original /tmp/pet126r.cab
          python -m tools.stoneage_pet126r_cn50_source_catalogue --program /tmp/pet126r-original/sa_5000.exe --output /tmp/pet126r-derived.json
          echo PET126R_BEGIN
          cat /tmp/pet126r-derived.json
          echo PET126R_END
      - name: Delete original proprietary client bytes
        if: always()
        run: rm -rf /tmp/pet126r.cab /tmp/pet126r-original
