name: Verify 2002 quest dependency and worldline derived sources
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN2002-QUEST-WORLDLINE-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-CN2002-QUEST-WORLDLINE-ACCEPTANCE-R1.json'
      - 'tests/test_stoneage_cn2002_quest_worldline_source.py'
      - '.github/workflows/verify-stoneage-cn2002-quest-worldline.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN2002-QUEST-WORLDLINE-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-CN2002-QUEST-WORLDLINE-ACCEPTANCE-R1.json'
      - 'tests/test_stoneage_cn2002_quest_worldline_source.py'
      - '.github/workflows/verify-stoneage-cn2002-quest-worldline.yml'
jobs:
  derived-claims-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check quest conditions and never-promote constraints
        run: python -m unittest discover -s tests -p 'test_stoneage_cn2002_quest_worldline_source.py' -v
