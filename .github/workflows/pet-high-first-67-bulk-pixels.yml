name: PET-HIGH-FIRST-67 bulk original motion pixels
on:
  push:
    branches: [agent/pet-high-first-67-bulk-pixels-20261125, main]
    paths:
      - 'tools/stoneage_pet_high_first_67_bulk_pixels.py'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-67-BULK-PIXELS-20261125.md'
      - '.github/workflows/pet-high-first-67-bulk-pixels.yml'
      - 'research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-R1.json.gz'
      - 'research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-SUMMARY-R1.json'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_67_bulk_pixels.py'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-67-BULK-PIXELS-20261125.md'
      - '.github/workflows/pet-high-first-67-bulk-pixels.yml'
      - 'research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-R1.json.gz'
      - 'research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-SUMMARY-R1.json'
permissions:
  contents: read
jobs:
  source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/pet-high-first-67-bulk-pixels-20261125'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m tools.stoneage_pet_high_first_67_bulk_pixels --plan-only
      - name: Install static parser and independent decoder dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq msitools
          python -m pip install Pillow
      - name: Authenticate and statically extract saved six-part carrier
        run: python -m tools.stoneage_wayi85_sixpart_acquisition --work "$RUNNER_TEMP/tw85" --output "$RUNNER_TEMP/tw85-acquisition.json"
      - name: Verify original bytes and decode all remaining target RD blocks
        run: |
          python -m tools.stoneage_pet_high_first_67_bulk_pixels --source-dir "$RUNNER_TEMP/tw85/msi-client/Program Files/WAYI/石器時代 魔域大冒險/data" --acquisition "$RUNNER_TEMP/tw85-acquisition.json"
          python -m tools.stoneage_pet_high_first_67_bulk_pixels
          sha256sum 'research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-R1.json.gz' 'research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-SUMMARY-R1.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pet67-derived-evidence
          path: |
            ${{ runner.temp }}/tw85-acquisition.json
            research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-R1.json.gz
            research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-SUMMARY-R1.json
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve only derived metadata on candidate branch
        run: |
          git add 'research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-R1.json.gz' 'research/pets/PET-HIGH-FIRST-67-BULK-PIXELS-SUMMARY-R1.json'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'PET67: archive actual bulk RD dual-decoder receipts'
          git push origin "HEAD:$GITHUB_REF"
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m tools.stoneage_pet_high_first_67_bulk_pixels
