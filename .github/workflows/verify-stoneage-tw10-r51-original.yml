name: Independently verify TW1.0 R51 original savedata caller and application consumers
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r51-processor-stack-consumers-20261015, main]
    paths:
      - .github/workflows/verify-stoneage-tw10-r51-original.yml
      - tools/stoneage_tw10_savedata_native_io_r51_guard.py
      - tools/stoneage_tw10_savedata_postcall_r51.py
      - tests/test_stoneage_tw10_savedata_postcall_r51.py
      - tools/stoneage_tw10_savedata_application_r51.py
      - tests/test_stoneage_tw10_savedata_application_r51.py
      - research/recovered/STONEAGE-TW10-SAVEDATA-POSTCALL-R51.json
      - docs/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R51.md
      - research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R51-ORIGINAL.json
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate independent immutable original run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38719176573" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|ee32f6d16f3dbfeabbb9d73020b64f83f47924dd|agent/tw10-savedata-r51-processor-stack-consumers-20261015'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11963713395" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38719176573|tw10-r51-original-processor-stack-consumers-derived|sha256:3e02a0c79114b8a3e2817a63ef4c6d280944435f4ad1106a213781484c2b4a8b|false'
      - name: Download bounded R51 original-derived metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r51-independent
          gh run download 38719176573 --repo "$GITHUB_REPOSITORY" --name tw10-r51-original-processor-stack-consumers-derived --dir /tmp/r51-independent
          test "$(find /tmp/r51-independent -type f | wc -l)" -eq 1
          test -f /tmp/r51-independent/stoneage-r51-derived.json
          test ! -L /tmp/r51-independent/stoneage-r51-derived.json
          test "$(stat -c %s /tmp/r51-independent/stoneage-r51-derived.json)" -le 1000000
          sha256sum /tmp/r51-independent/stoneage-r51-derived.json
          wc -c /tmp/r51-independent/stoneage-r51-derived.json
      - name: Replay strict R51 through R32 tamper and negative controls
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_postcall_r51 tests.test_stoneage_tw10_savedata_application_r51 tests.test_stoneage_tw10_savedata_application_r50 tests.test_stoneage_tw10_savedata_native_io_r51 tests.test_stoneage_tw10_savedata_native_io_r50 tests.test_stoneage_tw10_savedata_native_io_r49 tests.test_stoneage_tw10_savedata_native_io_r48 tests.test_stoneage_tw10_savedata_native_io_r47 tests.test_stoneage_tw10_savedata_native_io_r46 tests.test_stoneage_tw10_savedata_native_io_r45 tests.test_stoneage_tw10_savedata_native_io_r44 tests.test_stoneage_tw10_savedata_native_io_r43 tests.test_stoneage_tw10_savedata_native_io_r42 tests.test_stoneage_tw10_savedata_native_io_r41 tests.test_stoneage_tw10_savedata_native_io_r40 tests.test_stoneage_tw10_savedata_native_io_r39 tests.test_stoneage_tw10_savedata_native_io_r38 tests.test_stoneage_tw10_savedata_native_io_r37 tests.test_stoneage_tw10_savedata_native_io_r36 tests.test_stoneage_tw10_savedata_native_io_r35 tests.test_stoneage_tw10_savedata_native_io_r34 tests.test_stoneage_tw10_savedata_native_io_r33 tests.test_stoneage_tw10_savedata_native_io_r32 tests.test_stoneage_tw10_savedata_argtrace_r7 tests.test_stoneage_tw10_savedata_argtrace_r7_guard
          python -m tools.stoneage_tw10_savedata_native_io_r51_guard --report /tmp/r51-independent/stoneage-r51-derived.json
      - name: Review original bounded report and canonical exact equality when admitted
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from tools.stoneage_tw10_savedata_native_io_r51_guard import validate
          source=Path('/tmp/r51-independent/stoneage-r51-derived.json').read_bytes()
          assert len(source)==284533
          assert hashlib.sha256(source).hexdigest()=='15f54e5de8d1d20128fb7d948b54f13a0e3f6cf372eca203cbc7bb8adc473052'
          report=json.loads(source)
          validate(report)
          p=Path('research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R51-ORIGINAL.json')
          assert p.exists(), 'R51 canonical derivative missing'
          if p.exists():
              assert p.read_bytes() == source, 'original R51 canonical bytes differ'
              print('TW10_R51_EXACT_DERIVED_JSON_EQUALITY=PASS')
          else:
              print('TW10_R51_INDEPENDENT_REVIEW_ONLY=PASS')
          print('TW10_R51_ORIGINAL_DERIVED_JSON_BEGIN')
          from tools.stoneage_tw10_savedata_postcall_r51 import derive, validate as consumer_validate
          consumer=json.loads(Path('research/recovered/STONEAGE-TW10-SAVEDATA-POSTCALL-R51.json').read_text())
          consumer_validate(consumer, source)
          print('TW10_R51_PINNED_APPLICATION_CONSUMERS=PASS')
          print(json.dumps(consumer,sort_keys=True))
          prior=(json.dumps(report['r50_snapshot'],sort_keys=True)+'\n').encode()
          assert prior==Path('research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R50-ORIGINAL.json').read_bytes()
          from tools.stoneage_tw10_savedata_application_r51 import stack
          from tools.stoneage_tw10_savedata_native_io_r50 import inventory_effect
          from tools.stoneage_tw10_savedata_native_io_r38 import stack_states, state_summary
          rows=report['processor_instruction_shapes'];graph=report['r50_snapshot']['processing_entry_context']
          simple,limited=stack(rows,graph['bounded_edges'],0x47160)
          old,updates,oldlimited=stack_states([inventory_effect(r) for r in rows],graph['bounded_edges'],0x47160)
          assert not limited and not oldlimited
          for a in graph['bounded_node_rvas']:
              assert simple.get(a)==state_summary(old,a,oldlimited)['unique_conditional_esp_delta'], hex(a)
          print('TW10_R51_INDEPENDENT_STACK_MODELS_AGREE=PASS')
          print('TW10_R51_ORIGINAL_DERIVED_JSON_END')
          PY
      - name: Purge independent temporary derivative
        if: always()
        run: rm -rf /tmp/r51-independent
