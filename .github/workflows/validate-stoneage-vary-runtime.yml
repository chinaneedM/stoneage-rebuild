name: Validate StoneAge Vary runtime

concurrency:
  group: stoneage-vary-runtime-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-vary-runtime.yml"
      - "tools/stoneage_vary_runtime_state.py"
      - "tools/stoneage_enemy_ai_vary_bridge.py"
      - "tests/test_stoneage_vary_runtime_state.py"
      - "tests/test_stoneage_enemy_ai_vary_bridge.py"
      - "tools/stoneage_battle_round_model.py"
      - "tests/test_stoneage_vary_ordered_runtime.py"
      - "tools/stoneage_battle_state_model.py"
      - "tests/test_stoneage_vary_persistent_runtime.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Vary recovered runtime admission
        run: |
          python -m unittest -v \
            tests.test_stoneage_vary_runtime_state \
            tests.test_stoneage_enemy_ai_vary_bridge \
            tests.test_stoneage_vary_ordered_runtime \
            tests.test_stoneage_vary_persistent_runtime
