name: Validate StoneAge Vary runtime state

concurrency:
  group: stoneage-vary-runtime-state-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-vary-runtime.yml"
      - "tools/stoneage_vary_runtime_state.py"\n      - "tools/stoneage_enemy_ai_vary_bridge.py"
      - "tests/test_stoneage_vary_runtime_state.py"\n      - "tests/test_stoneage_enemy_ai_vary_bridge.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Vary battle-local runtime state
        run: |\n          python -m unittest -v \\\n            tests.test_stoneage_vary_runtime_state \\\n            tests.test_stoneage_enemy_ai_vary_bridge
