name: Probe Stoneage-5 IA metadata

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_stoneage5_ia_probe.py
      - .github/workflows/probe-stoneage-stoneage5-ia.yml

permissions:
  contents: write

concurrency:
  group: stoneage-stoneage5-ia
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe single IA item
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_stoneage5_ia_probe \
            > research/recovered/STONEAGE-STONEAGE5-IA-METADATA-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-STONEAGE5-IA-METADATA-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Stoneage-5 IA metadata'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
