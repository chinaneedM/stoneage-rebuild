name: Verify CN2003 Ladora routes and Crimson ecology
on:
  push:
    paths:
      - 'tools/stoneage_cn2003_ladora_crimson_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_cn2003_ladora_crimson_source.py'
      - 'research/recovered/STONEAGE-CN2003-LADORA-CRIMSON-*.json'
      - 'research/recovered/STONEAGE-CN2003-QIANG-EN-FAMILY-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-CN20-PET-COMMISSION-HABITATS-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-cn2003-ladora-crimson-source.yml'
  pull_request:
    paths:
      - 'tools/stoneage_cn2003_ladora_crimson_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_cn2003_ladora_crimson_source.py'
      - 'research/recovered/STONEAGE-CN2003-LADORA-CRIMSON-*.json'
      - 'research/recovered/STONEAGE-CN2003-QIANG-EN-FAMILY-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-CN20-PET-COMMISSION-HABITATS-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-cn2003-ladora-crimson-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Directed routes, occurrence ecology, myth and schematic boundaries
        run: python -m unittest tests.test_stoneage_cn2003_ladora_crimson_source -v
      - name: Retrieve one dated portal guide and actual linked route schematic
        run: python -m tools.stoneage_cn2003_ladora_crimson_source --fetch --output "$RUNNER_TEMP/r86-content/replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cn2003-ladora-crimson-derived-r86
          path: ${{ runner.temp }}/r86-content/replay.json
          if-no-files-found: error
          retention-days: 30
