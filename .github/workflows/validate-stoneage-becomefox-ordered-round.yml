name: Validate StoneAge BecomeFox ordered round

concurrency:
  group: stoneage-becomefox-ordered-round-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-becomefox-ordered-round.yml"
      - "tools/stoneage_battle_round_model.py"
      - "tools/stoneage_becomefox_reference_model.py"
      - "tools/stoneage_becomefox_runtime_state.py"
      - "tools/stoneage_enemy_ai_becomefox_bridge.py"
      - "tests/test_stoneage_becomefox_ordered_round.py"
      - "tests/test_stoneage_battle_round_model.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ordered BecomeFox composition and battle-round regressions
        run: |
          python -m unittest -v \
            tests.test_stoneage_becomefox_ordered_round \
            tests.test_stoneage_becomefox_reference_model \
            tests.test_stoneage_becomefox_runtime_state \
            tests.test_stoneage_enemy_ai_becomefox_bridge \
            tests.test_stoneage_battle_round_model
