name: Independently verify TW1.0 R40 original read-frame slots and postcall predicates
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r40-read-frame-endcheck-20261014, main]
    paths:
      - .github/workflows/verify-stoneage-tw10-r40-original.yml
      - tools/stoneage_tw10_savedata_native_io_r40_guard.py
      - research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R40-ORIGINAL.json
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate independent immutable original run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38569997657" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|b9b347825779a861ea45e8c58b97838dd1e88f76|agent/tw10-savedata-r40-read-frame-endcheck-20261014'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11898220647" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38569997657|tw10-r40-original-read-frame-endcheck-derived|sha256:996e46965796c005610aeecdb3ff1a2ee2f5a0597d58bda8a60071dbab42dfd0|false'
      - name: Download bounded R40 original-derived metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r40-independent
          gh run download 38569997657 --repo "$GITHUB_REPOSITORY" --name tw10-r40-original-read-frame-endcheck-derived --dir /tmp/r40-independent
          test "$(find /tmp/r40-independent -type f | wc -l)" -eq 1
          test -f /tmp/r40-independent/stoneage-r40-derived.json
          test ! -L /tmp/r40-independent/stoneage-r40-derived.json
          test "$(stat -c %s /tmp/r40-independent/stoneage-r40-derived.json)" -le 100000
          sha256sum /tmp/r40-independent/stoneage-r40-derived.json
          wc -c /tmp/r40-independent/stoneage-r40-derived.json
      - name: Replay strict R40 through R32 tamper and negative controls
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r40 tests.test_stoneage_tw10_savedata_native_io_r39 tests.test_stoneage_tw10_savedata_native_io_r38 tests.test_stoneage_tw10_savedata_native_io_r37 tests.test_stoneage_tw10_savedata_native_io_r36 tests.test_stoneage_tw10_savedata_native_io_r35 tests.test_stoneage_tw10_savedata_native_io_r34 tests.test_stoneage_tw10_savedata_native_io_r33 tests.test_stoneage_tw10_savedata_native_io_r32
          python -m tools.stoneage_tw10_savedata_native_io_r40_guard --report /tmp/r40-independent/stoneage-r40-derived.json
      - name: Review original bounded report and canonical exact equality when admitted
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from tools.stoneage_tw10_savedata_native_io_r40_guard import validate
          source=Path('/tmp/r40-independent/stoneage-r40-derived.json').read_bytes()
          assert len(source)==80338
          assert hashlib.sha256(source).hexdigest()=='0ec7fe47a34a77143b446cb02df088d647f4694174d025039abffd8b35066c2f'
          report=json.loads(source)
          validate(report)
          p=Path('research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R40-ORIGINAL.json')
          assert p.exists(), 'R40 canonical derivative missing'
          if p.exists():
              assert json.loads(p.read_text()) == report, 'original R40 canonical JSON differs'
              print('TW10_R40_EXACT_DERIVED_JSON_EQUALITY=PASS')
          else:
              print('TW10_R40_INDEPENDENT_REVIEW_ONLY=PASS')
          print('TW10_R40_ORIGINAL_DERIVED_JSON_BEGIN')
          print(json.dumps(report,sort_keys=True,separators=(',',':')))
          print('TW10_R40_ORIGINAL_DERIVED_JSON_END')
          PY
      - name: Purge independent temporary derivative
        if: always()
        run: rm -rf /tmp/r40-independent
