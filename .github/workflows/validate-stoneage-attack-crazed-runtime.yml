name: Validate StoneAge AttackCrazed runtime
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-attack-crazed-runtime.yml
      - tools/stoneage_attack_crazed_model.py
      - tools/stoneage_enemy_ai_attack_crazed_bridge.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_default_pet_exit_model.py
      - tools/stoneage_battle_state_model.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_attack_crazed_runtime.py
      - tests/test_stoneage_attack_crazed_model.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest \
            tests.test_stoneage_attack_crazed_model \
            tests.test_stoneage_recovered25_attack_crazed_probe \
            tests.test_stoneage_attack_crazed_runtime \
            tests.test_stoneage_local_runtime_session_coordinator.LocalRuntimeSessionCoordinatorTests.test_recovered_enemy_ai_attack_crazed_executes_and_persists -v
