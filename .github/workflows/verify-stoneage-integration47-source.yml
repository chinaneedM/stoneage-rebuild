name: Verify StoneAge INTEGRATION47 Poru original source graph
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION47-PORU-13-SCENE-SOURCE-GRAPH-R1.json'
      - 'tests/test_stoneage_integration_module_47.py'
      - '.github/workflows/verify-stoneage-integration47-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION47-PORU-13-SCENE-SOURCE-GRAPH-R1.json'
      - 'tests/test_stoneage_integration_module_47.py'
      - '.github/workflows/verify-stoneage-integration47-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_47.py' -v
