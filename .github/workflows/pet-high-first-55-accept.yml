name: PET-HIGH-FIRST-55 retained source acceptance
on:
  push:
    paths:
      - 'research/pets/PET-HIGH-FIRST-55-SOURCE-*-R1.json'
      - 'tools/stoneage_pet_high_first_55_accept.py'
      - '.github/workflows/pet-high-first-55-accept.yml'
  pull_request:
    paths:
      - 'research/pets/PET-HIGH-FIRST-55-SOURCE-*-R1.json'
      - 'tools/stoneage_pet_high_first_55_accept.py'
      - '.github/workflows/pet-high-first-55-accept.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m tools.stoneage_pet_high_first_55_accept
      - run: python tools/stoneage_pet_source_lookup.py --verify
