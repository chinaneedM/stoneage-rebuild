name: PET125 2025 original classic PC pet source-bounded annual audit
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-PET125-YEAR2025-SIX-REGION-CLASSIC-PC-BOUNDED-AUDIT-R1.json'
      - 'research/recovered/STONEAGE-PET27-GLOBAL-YEAR-VERSION-WORK-QUEUE-R1.json'
      - 'docs/continuity/STONEAGE-PET125-YEAR2025-SIX-REGION-CLASSIC-PC-BOUNDED-AUDIT-20261119.md'
      - 'tests/test_stoneage_pet125_year2025_six_region_pc_bounded_audit.py'
      - '.github/workflows/validate-stoneage-pet125-year2025-pc.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-PET125-YEAR2025-SIX-REGION-CLASSIC-PC-BOUNDED-AUDIT-R1.json'
      - 'research/recovered/STONEAGE-PET27-GLOBAL-YEAR-VERSION-WORK-QUEUE-R1.json'
      - 'docs/continuity/STONEAGE-PET125-YEAR2025-SIX-REGION-CLASSIC-PC-BOUNDED-AUDIT-20261119.md'
      - 'tests/test_stoneage_pet125_year2025_six_region_pc_bounded_audit.py'
      - '.github/workflows/validate-stoneage-pet125-year2025-pc.yml'
jobs:
  pet125-pc-only-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 2025 source-bound PET chronology and unchanged original state
        run: |
          python -m unittest discover -s tests -p 'test_stoneage_pet125_year2025_six_region_pc_bounded_audit.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet27_chronology.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pc_only_scope_20261119.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet124_year2024_six_region_pc_bounded_audit.py' -v
          python -m tools.stoneage_pet27_chronology --validate
