name: Independently verify TW1.0 R7 original-derived argtrace evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/tw10-r7-hardened-artifact-verification-20261012
    paths:
      - .github/workflows/verify-stoneage-tw10-argtrace-r7-hardened-original.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-pinned-derived:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable original source run and branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38228357360" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|a258a1097facaeef8ebd78535cbefd161836cc05|agent/tw10-savedata-argtrace-r7-hardened-20261012'
          echo 'TW10_R7_ORIGINAL_SOURCE_CUSTODY=PASS'
      - name: Retrieve only the original run's tiny derived JSON artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tw10-r7-review
          gh run download 38228357360 --repo "$GITHUB_REPOSITORY" --name tw10-original-argtrace-r7-derived --dir /tmp/tw10-r7-review
          test "$(find /tmp/tw10-r7-review -type f | wc -l)" -eq 1
          test -f /tmp/tw10-r7-review/stoneage-r7-report.json
          test ! -L /tmp/tw10-r7-review/stoneage-r7-report.json
          test "$(stat -c %s /tmp/tw10-r7-review/stoneage-r7-report.json)" -le 24000
      - name: Strict original R7 report validation and bounded expected metrics
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python3 -m tools.stoneage_tw10_savedata_argtrace_r7_guard --report /tmp/tw10-r7-review/stoneage-r7-report.json | tee /tmp/tw10-r7-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/tw10-r7-summary.json').read_text())
          assert v['visited_states']==136 and v['calls']==8 and v['api_candidates']==0
          assert v['conditional_CreateFileA_filename_candidate'] is False
          assert v['native_io_executed'] is False and v['complete_filename_api_link_proven'] is False
          actual=json.loads(Path('/tmp/tw10-r7-review/stoneage-r7-report.json').read_text())
          pinned=json.loads(Path('research/recovered/STONEAGE-TW10-SAVEDATA-ARGTRACE-R7-HARDENED-ORIGINAL.json').read_text())
          assert actual==pinned
          assert actual['trace']['state_limit_hit'] is False
          assert actual['trace']['gaps']=={'alias_write':3,'call_return_summary_missing':9,
                  'depth_limit':2,'return':2,'unsupported_memory':2}
          print('TW10_R7_HARDENED_DERIVED_CUSTODY_AND_CONDITIONAL_PREFIX=PASS')
          print('TW10_R7_COMPLETE_FILENAME_API_HANDLE_BUFFER_SIZE_LINK=OPEN')
          PY
      - name: Purge downloaded derived JSON
        if: always()
        run: rm -rf /tmp/tw10-r7-review /tmp/tw10-r7-summary.json
