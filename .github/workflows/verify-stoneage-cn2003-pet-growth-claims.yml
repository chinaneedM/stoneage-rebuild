name: Verify R92 2003 player pet growth and skill claim boundaries
on:
  push:
    paths:
      - 'tools/stoneage_cn2003_pet_growth_claims_source.py'
      - 'tests/test_stoneage_cn2003_pet_growth_claims_source.py'
      - 'research/recovered/STONEAGE-CN2003-PET-GROWTH-PLAYER-CLAIMS-SOURCE-R1.json'
      - '.github/workflows/verify-stoneage-cn2003-pet-growth-claims.yml'
  pull_request:
    paths:
      - 'tools/stoneage_cn2003_pet_growth_claims_source.py'
      - 'tests/test_stoneage_cn2003_pet_growth_claims_source.py'
      - 'research/recovered/STONEAGE-CN2003-PET-GROWTH-PLAYER-CLAIMS-SOURCE-R1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-bound-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stoneage_cn2003_pet_growth_claims_source -v
      - run: python -m tools.stoneage_cn2003_pet_growth_claims_source
