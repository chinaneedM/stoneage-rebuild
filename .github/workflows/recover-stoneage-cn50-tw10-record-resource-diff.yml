name: Reacquire Taiwan 1.0 and mainland 5.0 real graphics record sources
on:
  push:
    branches:
      - agent/cn50-tw10-record-level-resource-diff-20261024
    paths:
      - tools/stoneage_tw10_cn50_record_resource_diff.py
      - tools/stoneage_tw10_cn50_resource_acquisition.py
      - tests/test_stoneage_tw10_cn50_record_resource_diff.py
      - tests/test_stoneage_tw10_cn50_resource_acquisition.py
      - .github/workflows/recover-stoneage-cn50-tw10-record-resource-diff.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stoneage-cn50-tw10-actual-records
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real-resource parser semantic and negative tests
        run: |
          python3 -m unittest tests.test_stoneage_tw10_cn50_record_resource_diff tests.test_stoneage_tw10_cn50_resource_acquisition -v
      - name: Install archive tools (no client execution)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cabextract 7zip
      - name: Reacquire TW1 accepted original RAR and original optical track bytes
        run: |
          set -euo pipefail
          mkdir -p /tmp/tw10-real
          curl -L --fail --retry 3 --retry-delay 2 --silent --show-error \
            -o /tmp/tw10-real/CD_DIC.rar \
            'https://archive.org/download/stoneage_tw_2000_win/CD_DIC.rar'
          echo 'b37a4a47f4eb608cac67e4ddf7a1621a  /tmp/tw10-real/CD_DIC.rar' | md5sum -c -
          echo 'b8cf92720b6ec8b3f46ea2e9bfcda986d21e7ded  /tmp/tw10-real/CD_DIC.rar' | sha1sum -c -
          7z x -y -o/tmp/tw10-real /tmp/tw10-real/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/tw10-real/STONEAGE.bin)" = 523449360
      - name: Reacquire and verify full 5.0 CAB then compare original RD/SPR records
        run: |
          set -euo pipefail
          python3 -m tools.stoneage_tw10_cn50_resource_acquisition \
            --tw-bin /tmp/tw10-real/STONEAGE.bin \
            --output /tmp/tw10-cn50-real-resource-diff-r1.json
      - name: Delete transient original Taiwan disc and archive
        if: always()
        run: rm -rf /tmp/tw10-real
      - name: Upload derived metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoneage-tw10-cn50-real-record-diff-r1
          path: /tmp/tw10-cn50-real-resource-diff-r1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Store actual derived record report on research branch, not main
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/tw10-cn50-real-resource-diff-r1.json'))
          assert x['result']=='DERIVED_RECORD_LEVEL_DIFF_OF_REACQUIRED_ORIGINAL_RESOURCE_BYTES'
          assert set(x['families'])=={'bitmap_rd','animation_spr'}
          assert x['evidence_boundaries']['original_server_npc_quest_growth_master_recovered'] is False
          assert x['prerequisites']['cn50_413_files_rehashed_again'] is True
          PY
          mkdir -p research/recovered
          cp /tmp/tw10-cn50-real-resource-diff-r1.json \
            research/recovered/STONEAGE-TW10-CN50-REAL-RECORD-DIFF-R1.json
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-TW10-CN50-REAL-RECORD-DIFF-R1.json
          if ! git diff --cached --quiet; then
            git commit -m "research: archive actual Taiwan1.0-vs-CN5 RD and SPR record differences"
            git push origin HEAD:agent/cn50-tw10-record-level-resource-diff-20261024
          fi
