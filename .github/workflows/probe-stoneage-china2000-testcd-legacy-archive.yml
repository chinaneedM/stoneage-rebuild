name: Probe StoneAge China.com Dec-2000 legacy archive

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_china2000_testcd_legacy_archive_probe.py
      - tests/test_stoneage_china2000_testcd_legacy_archive_probe.py
      - .github/workflows/probe-stoneage-china2000-testcd-legacy-archive.yml

permissions:
  contents: write

concurrency:
  group: stoneage-china2000-testcd-legacy-archive
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate China.com legacy archive probe
        run: python3 -m unittest tests.test_stoneage_china2000_testcd_legacy_archive_probe -v
      - name: Probe Wayback and Arquivo CDX metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_china2000_testcd_legacy_archive_probe \
            > research/recovered/STONEAGE-CHINA2000-TEST-CD-LEGACY-ARCHIVE-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-CHINA2000-TEST-CD-LEGACY-ARCHIVE-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe China.com Dec-2000 StoneAge test-CD archive'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_china2000_testcd_legacy_archive_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe China.com Dec-2000 StoneAge test-CD archive'
          fi
          git push
