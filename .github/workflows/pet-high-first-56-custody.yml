name: PET-HIGH-FIRST-56 preserve dual exact derived source reports
on:
  push:
    branches: [agent/pet-high-first-56-special-roles-20261124]
    paths:
      - 'tools/stoneage_pet_high_first_56_custody.py'
      - '.github/workflows/pet-high-first-56-custody.yml'
permissions:
  actions: read
  contents: write
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact derived artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 14958099882 14958593729; do
            curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" -o "/tmp/pet56-$id.zip"
          done
      - run: python -m tools.stoneage_pet_high_first_56_custody
      - name: Preserve verified derived reports on candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/agent/pet-high-first-56-special-roles-20261124'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/pets/PET-HIGH-FIRST-56-SOURCE-REPLAY-*-R1.json research/pets/PET-HIGH-FIRST-56-SOURCE-CUSTODY-R1.json
          git diff --cached --stat
          git commit -m 'PET56: preserve dual original source replay reports and classified references'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/agent/pet-high-first-56-special-roles-20261124"
