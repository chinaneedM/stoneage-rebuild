name: Validate StoneAge Modifyattack runtime
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-modifyattack-runtime.yml
      - tools/stoneage_modifyattack_reference_model.py
      - tools/stoneage_recovered25_modifyattack_probe.py
      - tools/stoneage_enemy_ai_modifyattack_bridge.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_default_pet_exit_model.py
      - tools/stoneage_battle_state_model.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_modifyattack_reference_model.py
      - tests/test_stoneage_recovered25_modifyattack_probe.py
      - tests/test_stoneage_modifyattack_runtime.py
      - tests/test_stoneage_modifyattack_persistent_runtime.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest \
            tests.test_stoneage_modifyattack_reference_model \
            tests.test_stoneage_recovered25_modifyattack_probe \
            tests.test_stoneage_modifyattack_runtime \
            tests.test_stoneage_modifyattack_persistent_runtime \
            tests.test_stoneage_local_runtime_session_coordinator -v
