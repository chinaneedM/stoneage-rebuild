name: Verify CN2.0 first new pet catalog page labels and source cell bindings
on:
  push:
    paths:
      - tools/stoneage_waei_cn20_new_pet_catalog.py
      - tools/stoneage_waei_cn20_newcomer_guide.py
      - tools/stoneage_early_content_probe.py
      - tools/stoneage_wayi_newbie_riding_plan.py
      - tests/test_stoneage_waei_cn20_new_pet_catalog.py
      - research/recovered/STONEAGE-WAEI-CN20-NEW-PET-CATALOG-FIRST-PAGE-R1.json
      - docs/specs/STONEAGE-WAEI-CN20-NEW-PET-CATALOG-FIRST-PAGE-R1.md
      - .github/workflows/verify-stoneage-waei-cn20-new-pet-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-entry-and-one-catalog-body:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stoneage_waei_cn20_new_pet_catalog -v
      - name: Reacquire known entry and only one selected new catalog body
        run: python -m tools.stoneage_waei_cn20_new_pet_catalog --output output/derived.json
      - run: cmp output/derived.json research/recovered/STONEAGE-WAEI-CN20-NEW-PET-CATALOG-FIRST-PAGE-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: waei-cn20-new-pet-catalog-derived-only
          path: output/derived.json
          retention-days: 30
