name: Validate StoneAge original second Loop Finish dispatch
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-party-pet-original-finish-dispatch.yml"
      - "tools/stoneage_party_pet_original_finish_dispatch_audit.py"
      - "tests/test_stoneage_party_pet_original_finish_dispatch.py"
permissions:
  contents: read
jobs:
  finish-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Finish composition and lethal predecessor tests
        run: python -m unittest -v tests.test_stoneage_party_pet_original_finish_dispatch tests.test_stoneage_party_pet_original_lethal_loop tests.test_stoneage_party_pet_original_attack
      - name: Recover pinned original source profiles transiently
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_party_pet_original_attack_audit import PINNED
          repos={"gavin":"gavinlinasd/StoneAge","iris":"iriselia/StoneAge","bismarck":"BismarckDD/stoneage"}
          for p,sha in PINNED.items():
              d=Path("/tmp/stoneage-original-finish-dispatch")/p
              subprocess.run(["git","init",str(d)],check=True)
              subprocess.run(["git","-C",str(d),"remote","add","origin","https://github.com/"+repos[p]+".git"],check=True)
              subprocess.run(["git","-C",str(d),"fetch","--depth","1","origin",sha],check=True)
              subprocess.run(["git","-C",str(d),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Run original second Loop Finish and preserved prior controls
        run: |
          set -euo pipefail
          python -m tools.stoneage_party_pet_original_finish_dispatch_audit --gavin-dir /tmp/stoneage-original-finish-dispatch/gavin --iris-dir /tmp/stoneage-original-finish-dispatch/iris --bismarck-dir /tmp/stoneage-original-finish-dispatch/bismarck > /tmp/stoneage-original-finish-dispatch.txt
          cat /tmp/stoneage-original-finish-dispatch.txt
          grep -Fx 'RESOLUTION|ORIGINAL_REAL_HEADER_PARTY_PET_FINISH_DISPATCH_BOUNDED_PASS' /tmp/stoneage-original-finish-dispatch.txt
          test "$(grep -c '^ACTUAL|.*REAL_HEADER_FINISH_DISPATCH|' /tmp/stoneage-original-finish-dispatch.txt)" -eq 8
      - name: Upload derived observations only
        uses: actions/upload-artifact@v4
        with:
          name: stoneage-original-finish-dispatch
          path: /tmp/stoneage-original-finish-dispatch.txt
