name: PET-DETAIL37 original classic PC portrait RD source overlap
on:
  push:
    paths:
      - 'tools/stoneage_pet_detail37_tw10_cn50_rd_overlap.py'
      - 'tests/test_stoneage_pet_detail37_tw10_cn50_rd_overlap.py'
      - 'research/pets/PET-DETAIL-EVIDENCE37-TW10-CN50-ORIGINAL-RD-OVERLAP-R1.json'
      - '.github/workflows/validate-stoneage-pet-detail37-rd-overlap.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay the 305 classic-PC album rows and 120 exact RD digests
        run: |
          python -m unittest tests.test_stoneage_pet_detail37_tw10_cn50_rd_overlap -v
          python -m tools.stoneage_pet_detail37_tw10_cn50_rd_overlap > /dev/null
