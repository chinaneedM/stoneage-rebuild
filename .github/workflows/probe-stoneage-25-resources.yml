name: Probe recovered StoneAge 2.5 resources

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-stoneage-25-resources.yml
      - tools/stoneage_resource_probe.py
      - tests/test_stoneage_resource_probe.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic parser tests
        run: python3 -m unittest tests.test_stoneage_resource_probe -v
      - name: Install archive tool
        run: sudo apt-get update && sudo apt-get install -y unar
      - name: Recover preserved split bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib,html,json,re,http.cookiejar,urllib.parse,urllib.request
          from pathlib import Path

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124 Safari/537.36'
          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders=[('User-Agent',ua),('Accept-Language','en-US,en;q=0.9')]

          expected_hashes={
              'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5',
              'ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb',
          }

          def get(key,suffix):
              api='https://www.mediafire.com/api/1.5/file/get_info.php'
              data=urllib.parse.urlencode({'quick_key':key,'response_format':'json'}).encode()
              req=urllib.request.Request(api,data=data,headers={'User-Agent':ua})
              with op.open(req,timeout=60) as r:
                  info=json.load(r)['response']['file_info']
              service_hash=str(info.get('hash') or '').lower()
              if service_hash != expected_hashes[key]:
                  raise SystemExit(f'Unexpected MediaFire hash for {key}: {service_hash}')
              landing=info['links']['normal_download']
              req=urllib.request.Request(landing,headers={'User-Agent':ua})
              with op.open(req,timeout=60) as r:
                  page=r.read().decode('utf-8','replace')
                  referer=r.geturl()
              match=re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S)
              if not match:
                  match=re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
              if not match:
                  raise SystemExit(f'No direct link for {key}')
              url=html.unescape(match.group(1))
              dest=Path('/tmp/sa25')/f'part.{suffix}'
              h=hashlib.sha256()
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':referer})
              with op.open(req,timeout=300) as r, dest.open('wb') as out:
                  while True:
                      chunk=r.read(1024*1024)
                      if not chunk:
                          break
                      out.write(chunk)
                      h.update(chunk)
              if h.hexdigest() != expected_hashes[key]:
                  raise SystemExit(f'Download hash mismatch for {key}')

          get('ev7l29fw77891go','001')
          get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 > /tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar | awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
      - name: Extract recovered bytes transiently
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25/out
          ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/tmp/sa25/unar.log 2>&1
      - name: Probe REAL ADRN and MAP structures
        run: |
          set -euo pipefail
          ADRN="$(find /tmp/sa25/out -type f -path '*/SA2.5主程式/stoneage2.5/data/adrn_15.bin' -print -quit)"
          REAL="$(find /tmp/sa25/out -type f -path '*/SA2.5主程式/stoneage2.5/data/real_15.bin' -print -quit)"
          MAPDIR="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
          test -n "$ADRN" && test -n "$REAL" && test -n "$MAPDIR"
          mkdir -p research/recovered
          R=research/recovered/STONEAGE-25-RESOURCE-PROBE-R1.txt
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            sha256sum "$ADRN" | sed 's#  .*#|adrn_15.bin#'
            sha256sum "$REAL" | sed 's#  .*#|real_15.bin#'
            echo
            python3 tools/stoneage_resource_probe.py --adrn "$ADRN" --real "$REAL" --map-dir "$MAPDIR"
          } > "$R"
          git status --short --untracked-files=all
          test "$(git status --short --untracked-files=all | wc -l)" -eq 1
          git status --short --untracked-files=all | grep -F '?? research/recovered/STONEAGE-25-RESOURCE-PROBE-R1.txt'
      - name: Commit derived probe report only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-25-RESOURCE-PROBE-R1.txt
          git commit -m 'research: probe recovered StoneAge 2.5 resource formats'
          git push
