name: Verify bounded original TW1 Windows observation and private custody metadata
on:
  push:
    paths:
      - tools/stoneage_p3h_*.py
      - tests/test_stoneage_p3h_*.py
      - research/recovered/STONEAGE-P3H-*
      - .github/workflows/verify-stoneage-p3h-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-original-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_stoneage_p3h_evidence tests.test_stoneage_p3g_manifest_environment tests.test_stoneage_p3f_manifest tests.test_stoneage_p3e_windows
      - run: python -m tools.stoneage_p3h_evidence_guard
