name: Probe Hananet STAD source order
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_stad_source_order_probe.py
      - tests/test_stoneage_hananet_stad_source_order_probe.py
      - .github/workflows/probe-stoneage-hananet-stad-source-order.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-stad-source-order
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_stad_source_order_probe -v
      - name: Extract bounded source-order contexts
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_stad_source_order_probe             > research/recovered/STONEAGE-HANANET-STAD-SOURCE-ORDER-R1.txt
      - name: Commit derived source-order metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-STAD-SOURCE-ORDER-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: map Hananet STAD source order'
          git pull --rebase origin main
          git push
