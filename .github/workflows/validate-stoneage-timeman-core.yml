name: Validate StoneAge TimeMan core
concurrency:
  group: stoneage-timeman-core
  cancel-in-progress: true
on:
  push:
    paths:
      - .github/workflows/validate-stoneage-timeman-core.yml
      - tools/stoneage_timeman_core_model.py
      - tests/test_stoneage_timeman_core_model.py
      - research/mechanics/STONEAGE-TIMEMAN-CORE-R1.md
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_timeman_core_model -v
