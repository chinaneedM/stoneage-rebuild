name: Probe GameTime StoneAge mirror
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_gametime_mirror_probe.py
      - tests/test_stoneage_gametime_mirror_probe.py
      - .github/workflows/probe-stoneage-gametime-mirror.yml

permissions:
  contents: write

concurrency:
  group: stoneage-gametime-mirror
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_gametime_mirror_probe -v
      - name: Probe GameTime download/article endpoints
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_gametime_mirror_probe             > research/recovered/STONEAGE-GAMETIME-MIRROR-R1.txt
      - name: Commit derived GameTime metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-GAMETIME-MIRROR-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe GameTime StoneAge mirror'
          git pull --rebase origin main
          git push
