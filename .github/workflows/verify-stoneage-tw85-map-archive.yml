name: Verify durable TW8.5 map metadata and historical boundaries
on:
  push:
    paths:
      - 'tools/stoneage_tw85_map_archive.py'
      - 'tests/test_stoneage_tw85_map_archive.py'
      - 'research/recovered/STONEAGE-TW85-MAP-PAYLOAD-*.json'
      - '.github/workflows/verify-stoneage-tw85-map-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_stoneage_tw85_map_payload tests.test_stoneage_tw85_map_archive -v
      - run: python -m tools.stoneage_tw85_map_archive
