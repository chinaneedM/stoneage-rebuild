jobs:
  replay-original-source-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic source-bounded floor and warp checks
        run: python -m unittest discover -s tests -p 'test_stoneage_quest05_original_floor_crosswalk.py' -v
      - name: Validate QUEST06 original source-only four-village courier contracts
        run: python -m unittest discover -s tests -p 'test_stoneage_quest06_four_courier_source.py' -v
      - name: Validate QUEST06-R2 actual source dialogue hints and bounded item-receiver links
        run: python -m unittest discover -s tests -p 'test_stoneage_quest06_r2_original_hint_graph.py' -v
      - name: Validate QUEST08 source mining appraisal and limitshop boundaries
        run: python -m unittest tests.test_stoneage_quest08_mining_source -v
      - name: Validate QUEST09 original dream-cave controls and qualified map observations
        run: python -m unittest tests.test_stoneage_quest09_dream_cave_source -v
      - name: Validate QUEST10 original quarry-spirit source redirection and item conflicts
        run: python -m unittest tests.test_stoneage_quest10_quarry_spirits_source -v
      - name: Validate QUEST11 two-tribe original branches and preserved malformed headers
        run: python -m unittest tests.test_stoneage_quest11_two_tribes_source -v
      - name: Validate QUEST12 mining competition original source and negative provenance guards
        run: python -m unittest tests.test_stoneage_quest12_mining_competition_source -v
      - name: Validate QUEST13 original Goa mountain Uli letter and flower source guards
        run: python -m unittest tests.test_stoneage_quest13_goa_uli_letter_source -v
      - name: Validate QUEST14 dragon nest literal original source and unknown-runtime guards
        run: python -m unittest tests.test_stoneage_quest14_dragon_nest_source -v
      - name: Validate QUEST15 original bandit event20 source and map/item limits
        run: python -m unittest tests.test_stoneage_quest15_bandit_source -v
      - name: Validate QUEST16 original axe, water and wood trade source limits
        run: python -m unittest tests.test_stoneage_quest16_axe_wood_source -v
      - name: Validate QUEST17 original dinosaur-ranch pet, voucher and payout source bounds
        run: python -m unittest tests.test_stoneage_quest17_dino_ranch_source -v
      - name: Validate QUEST18 Giiru source item variants and warp candidate boundary
        run: python -m unittest tests.test_stoneage_quest18_giiru_sink_source -v
