name: Verify StoneAge QUEST05 original NPC-to-DAT source floor crosswalk

on:
  push:
    paths:
      - 'research/recovered/STONEAGE-QUEST05-598-ORIGINAL-CREATE-FLOOR-MAP-AND-WARP-CROSSWALK-R1.json'
      - 'research/recovered/STONEAGE-QUEST-STORY-MODULE-01-ORIGINAL-EXCHANGEMAN-QUEST-SOURCE-BLOCK-CATALOG-R1.json'
      - 'research/recovered/STONEAGE-QUEST-STORY-MODULE-02-ORIGINAL-WARPMAN-CONDITION-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-QUEST-STORY-MODULE-03-QUIZ-TIMEMAN-ORIGINAL-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-QUEST04-SOURCE-BOUNDED-FAMILIES-R1.json'
      - 'research/recovered/STONEAGE-MAP-SCENE-MODULE-04-955-ORIGINAL-DAT-4166-RD-PIXEL-INDEX-R1.json'
      - 'research/recovered/STONEAGE-MAP09-691-SOURCE-READY-SCENES-R1.json'
      - 'research/recovered/STONEAGE-MAP10-PUBLIC-ORIGINAL-SOURCE-CUSTODY-R1.json'
      - 'tests/test_stoneage_quest05_original_floor_crosswalk.py'
      - 'research/recovered/STONEAGE-QUEST06-FOUR-VILLAGE-MAMMOTH-COURIER-SOURCE-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-02-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-05-R1.json'
      - 'tests/test_stoneage_quest06_four_courier_source.py'
      - 'research/recovered/STONEAGE-QUEST06-R2-ORIGINAL-COURIER-ITEM-HINT-GRAPH-R1.json'
      - 'tests/test_stoneage_quest06_r2_original_hint_graph.py'
      - 'research/recovered/STONEAGE-QUEST08-MINING-APPRAISAL-AND-LIMITSHOP-SOURCE-R1.json'
      - 'tools/stoneage_quest08_mining_source.py'
      - 'tests/test_stoneage_quest08_mining_source.py'
      - 'research/recovered/STONEAGE-QUEST09-DREAM-CAVE-ORIGINAL-CONTROLS-R1.json'
      - 'research/recovered/STONEAGE-QUEST09-TWO-ORIGINAL-CAVE-MAPS-OBSERVATION-R1.json'
      - 'tools/stoneage_quest09_dream_cave_source.py'
      - 'tests/test_stoneage_quest09_dream_cave_source.py'
      - '.github/workflows/verify-stoneage-quest05-source-floor-crosswalk.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-QUEST05-598-ORIGINAL-CREATE-FLOOR-MAP-AND-WARP-CROSSWALK-R1.json'
      - 'tests/test_stoneage_quest05_original_floor_crosswalk.py'
      - 'research/recovered/STONEAGE-QUEST06-FOUR-VILLAGE-MAMMOTH-COURIER-SOURCE-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-02-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-05-R1.json'
      - 'tests/test_stoneage_quest06_four_courier_source.py'
      - 'research/recovered/STONEAGE-QUEST06-R2-ORIGINAL-COURIER-ITEM-HINT-GRAPH-R1.json'
      - 'tests/test_stoneage_quest06_r2_original_hint_graph.py'
      - 'research/recovered/STONEAGE-QUEST08-MINING-APPRAISAL-AND-LIMITSHOP-SOURCE-R1.json'
      - 'tools/stoneage_quest08_mining_source.py'
      - 'tests/test_stoneage_quest08_mining_source.py'
      - 'research/recovered/STONEAGE-QUEST09-DREAM-CAVE-ORIGINAL-CONTROLS-R1.json'
      - 'research/recovered/STONEAGE-QUEST09-TWO-ORIGINAL-CAVE-MAPS-OBSERVATION-R1.json'
      - 'tools/stoneage_quest09_dream_cave_source.py'
      - 'tests/test_stoneage_quest09_dream_cave_source.py'
      - '.github/workflows/verify-stoneage-quest05-source-floor-crosswalk.yml'
  workflow_dispatch:

jobs:
  replay-original-source-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic source-bounded floor and warp checks
        run: python -m unittest discover -s tests -p 'test_stoneage_quest05_original_floor_crosswalk.py' -v
      - name: Validate QUEST06 original source-only four-village courier contracts
        run: python -m unittest discover -s tests -p 'test_stoneage_quest06_four_courier_source.py' -v
      - name: Validate QUEST06-R2 actual source dialogue hints and bounded item-receiver links
        run: python -m unittest discover -s tests -p 'test_stoneage_quest06_r2_original_hint_graph.py' -v
      - name: Validate QUEST08 source mining appraisal and limitshop boundaries
        run: python -m unittest tests.test_stoneage_quest08_mining_source -v
      - name: Validate QUEST09 original dream-cave controls and qualified map observations
        run: python -m unittest tests.test_stoneage_quest09_dream_cave_source -v
