name: Validate StoneAge WildViolentAttack conditional reference
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-wildviolent-reference.yml
      - tools/stoneage_wildviolent_model.py
      - tools/stoneage_wildviolent_source_audit.py
      - tools/stoneage_recovered25_wildviolent_probe.py
      - tools/stoneage_nocast_model.py
      - tests/test_stoneage_wildviolent_model.py
      - tests/test_stoneage_recovered25_wildviolent_probe.py
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_wildviolent_model tests.test_stoneage_recovered25_wildviolent_probe tests.test_stoneage_nocast_model tests.test_stoneage_attack_crazed_model tests.test_stoneage_battle_core_model tests.test_stoneage_recovered25_petskill_pressure_probe -v
