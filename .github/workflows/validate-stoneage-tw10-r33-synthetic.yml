name: Validate TW1.0 R33 branch ZF candidates and strict guard
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r33-flag-call-20261013]
    paths:
      - tools/stoneage_tw10_savedata_native_io_r33.py
      - tools/stoneage_tw10_savedata_native_io_r33_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r33.py
      - .github/workflows/validate-stoneage-tw10-r33-synthetic.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: R33 and R32 inherited negative controls
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r33 tests.test_stoneage_tw10_savedata_native_io_r32
          python -m compileall -q tools/stoneage_tw10_savedata_native_io_r33.py tools/stoneage_tw10_savedata_native_io_r33_guard.py
          echo TW10_R33_SYNTHETIC_STRICT=PASS
          echo TW10_R33_ORIGINAL_EVIDENCE=OPEN
