name: Source-bounded SCENE10 original EXE 16MiB range gate
on:
  push:
    branches: [agent/scene10-original-exe-bounded-source-gate-20261028]
    paths:
      - tools/stoneage_scene10_original_exe_source_gate.py
      - tests/test_stoneage_scene10_original_exe_source_gate.py
      - research/recovered/STONEAGE-SCENE10-PRIVATE-CALLS-R1.json
      - .github/workflows/source-stoneage-scene10-exe-range-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-range-and-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic source gates and candidate structure
        run: python -m unittest -v tests.test_stoneage_scene10_original_exe_source_gate
      - name: Install untrusted archive reader (no original executable launched)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - name: Bounded source proof; negative status is not historical acceptance
        run: python -m tools.stoneage_scene10_original_exe_source_gate --out /tmp/stoneage-scene10-source-derived.json --work /tmp/stoneage-scene10-original-prefix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene10-source-range-metadata-only
          path: /tmp/stoneage-scene10-source-derived.json
          if-no-files-found: error
          retention-days: 7
