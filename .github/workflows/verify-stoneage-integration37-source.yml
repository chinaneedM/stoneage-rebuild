name: Verify StoneAge INTEGRATION37 original letter source crosswalk
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION37-GOA-ULI-LETTERS-MAP-SPR-SCRIPT-SOURCE-R1.json'
      - 'docs/continuity/STONEAGE-INTEGRATION37-GOA-ULI-LETTERS-20261110.md'
      - 'tests/test_stoneage_integration_module_37.py'
      - '.github/workflows/verify-stoneage-integration37-source.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION37-GOA-ULI-LETTERS-MAP-SPR-SCRIPT-SOURCE-R1.json'
      - 'docs/continuity/STONEAGE-INTEGRATION37-GOA-ULI-LETTERS-20261110.md'
      - 'tests/test_stoneage_integration_module_37.py'
      - '.github/workflows/verify-stoneage-integration37-source.yml'
      - 'README.md'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_37.py' -v
