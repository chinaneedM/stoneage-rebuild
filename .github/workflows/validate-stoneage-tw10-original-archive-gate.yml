name: Validate TW1.0 original savedata instruction windows by pinned archive

on:
  workflow_dispatch:
  push:
    branches:
      - agent/tw10-savedata-original-gate-20261012
    paths:
      - tools/stoneage_tw10_archive_parallel_download.py
      - tests/test_stoneage_tw10_archive_parallel_download.py
      - tools/stoneage_tw10_archive_chunk_download.py
      - tests/test_stoneage_tw10_archive_chunk_download.py
      - .github/workflows/validate-stoneage-tw10-original-archive-gate.yml

permissions:
  contents: read

jobs:
  original-archive-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded byte-range downloader with synthetic bytes
        run: python3 -m unittest tests.test_stoneage_tw10_archive_chunk_download tests.test_stoneage_tw10_archive_parallel_download -v
      - name: Install original static probe dependencies
        run: pip install --quiet pefile capstone
      - name: Recover and hash-pin accepted 842 MB original archive in transient disk
        run: |
          python3 -m tools.stoneage_tw10_archive_parallel_download \
            --deadline 540 --workers 12 --chunk 8388608 --output /tmp/CD_DIC.rar
      - name: Unpack accepted CD image for static evidence only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/tw10
          7z x -y -o/tmp/tw10 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/tw10/STONEAGE.bin)" = 523449360
      - name: Verify exact executable/data SHA256 and emit four-word analysis metadata
        run: |
          set -euo pipefail
          python3 -m tools.stoneage_tw10_savedata_instruction_probe \
            --bin /tmp/tw10/STONEAGE.bin | tee /tmp/tw10-savedata-instruction-r3.txt
      - name: Remove all temporary copyrighted originals even on error
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/tw10
      - name: Upload derived results only after complete hash gates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-savedata-original-r3-derived
          path: /tmp/tw10-savedata-instruction-r3.txt
          retention-days: 21
