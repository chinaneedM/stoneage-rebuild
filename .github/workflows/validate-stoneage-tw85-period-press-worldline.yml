name: Validate 2006 Taiwan 8.5 press worldline
on:
  push:
    paths:
      - research/recovered/STONEAGE-TW85-PERIOD-PRESS-WORLDLINE-R1.json
      - research/recovered/STONEAGE-TW85-PERIOD-PRESS-ACCEPTANCE-R1.json
      - docs/specs/STONEAGE-TW85-PERIOD-PRESS-WORLDLINE-R1.md
      - tests/test_stoneage_tw85_press_worldline.py
      - tools/stoneage_tw85_press_replay.py
      - .github/workflows/validate-stoneage-tw85-period-press-worldline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  press-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check named-content and evidence negative cases
        run: python -m unittest tests.test_stoneage_tw85_press_worldline -v
      - name: Try bounded raw source replay or record access rejection without claiming SHA
        run: python -m tools.stoneage_tw85_press_replay --output "${{ runner.temp }}/tw85/derived.json"
      - name: Guard access denied does not become source verification
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"tw85/derived.json").read_text())
          assert d["source_status"] in ("RAW_BYTES_VERIFIED", "HTTP_ACCESS_DENIED_IN_RUNNER")
          if d["source_status"] == "HTTP_ACCESS_DENIED_IN_RUNNER":
              assert d["http_status"] in (403,429)
              assert d["sha256"] is None and d["bytes"] is None and d["marker_counts"] is None
          else:
              assert len(d["sha256"]) == 64 and d["bytes"] > 2000
          assert d["raw_html_archived"] is False
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tw85-dated-press-derived-metadata
          path: ${{ runner.temp }}/tw85/derived.json
          retention-days: 30
