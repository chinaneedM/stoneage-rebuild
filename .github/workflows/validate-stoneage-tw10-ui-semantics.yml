name: Validate StoneAge TW1.0 UI semantics five-surface crosswalk

on:
  push:
    paths:
      - "research/recovered/STONEAGE-TW10-UI-SEMANTICS-R1.json"
      - "tools/stoneage_tw10_ui_semantics.py"
      - "tests/test_stoneage_tw10_ui_semantics.py"
      - "docs/specs/STONEAGE-TW10-UI-SEMANTICS-R1.md"
      - ".github/workflows/validate-stoneage-tw10-ui-semantics.yml"
  workflow_dispatch:

jobs:
  validate-original-five-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Original protocol/resource custody and synthetic read-only projection
        run: python -m unittest discover -s tests -p 'test_stoneage_tw10_ui_semantics.py' -v
      - name: Existing original protocol schema regression
        run: python -m unittest discover -s tests -p 'test_stoneage_tw10_gameplay_schema.py' -v
