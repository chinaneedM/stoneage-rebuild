name: Verify TW2002 werewolf battle forms and promotion boundaries
on:
  push:
    paths:
      - 'tools/stoneage_tw2002_werewolf_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_tw2002_werewolf_source.py'
      - 'research/recovered/STONEAGE-TW2002-WEREWOLF-FORMS-*.json'
      - 'research/recovered/STONEAGE-CN30-SPECIAL-PET-SKILLS-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-JP2005-AUTUMN-COOKING-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-tw2002-werewolf-source.yml'
  pull_request:
    paths:
      - 'tools/stoneage_tw2002_werewolf_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_tw2002_werewolf_source.py'
      - 'research/recovered/STONEAGE-TW2002-WEREWOLF-FORMS-*.json'
      - 'research/recovered/STONEAGE-CN30-SPECIAL-PET-SKILLS-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-JP2005-AUTUMN-COOKING-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-tw2002-werewolf-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Capture, pet transition, promotion, tabletop and small-image counterexamples
        run: python -m unittest tests.test_stoneage_tw2002_werewolf_source -v
      - name: Retrieve the exact 2019 archive and three actual small gallery images
        run: python -m tools.stoneage_tw2002_werewolf_source --fetch --output "$RUNNER_TEMP/r82-content/replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tw2002-werewolf-derived-r82
          path: ${{ runner.temp }}/r82-content/replay.json
          if-no-files-found: error
          retention-days: 30
