name: Independently verify TW1.0 R25 original boundary/direct-caller and partial-input evidence
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r25-boundary-callers-20261013]
    paths:
      - .github/workflows/verify-stoneage-tw10-r25-original.yml
      - tools/stoneage_tw10_savedata_upstream_r25_guard.py
      - research/recovered/STONEAGE-TW10-SAVEDATA-UPSTREAM-R25-ORIGINAL.json
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable R25 original source and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38392504284" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|2437eac2c14bf8e8f983f0891effd055f8cd2940|agent/tw10-savedata-r25-boundary-callers-20261013'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11809322312" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38392504284|tw10-r25-original-boundary-callers-derived|sha256:656285d461cd9306d979678ca53fa3dfbdeac886743041d836465648d553dc8a|false'
      - name: Retrieve only bounded derived metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r25-independent
          gh run download 38392504284 --repo "$GITHUB_REPOSITORY" --name tw10-r25-original-boundary-callers-derived --dir /tmp/r25-independent
          test "$(find /tmp/r25-independent -type f | wc -l)" -eq 1
          test -f /tmp/r25-independent/stoneage-r25-derived.json
          test ! -L /tmp/r25-independent/stoneage-r25-derived.json
          test "$(stat -c %s /tmp/r25-independent/stoneage-r25-derived.json)" -le 70000
          sha256sum /tmp/r25-independent/stoneage-r25-derived.json
          wc -c /tmp/r25-independent/stoneage-r25-derived.json
      - name: Strict semantic constraints and independent tamper tests
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_upstream_r25
          python -m tools.stoneage_tw10_savedata_upstream_r25_guard --report /tmp/r25-independent/stoneage-r25-derived.json
      - name: Compare accepted witness and disclose canonical bounded JSON
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.stoneage_tw10_savedata_upstream_r25_guard import validate
          d=json.loads(Path('/tmp/r25-independent/stoneage-r25-derived.json').read_text())
          validate(d)
          canonical=Path('research/recovered/STONEAGE-TW10-SAVEDATA-UPSTREAM-R25-ORIGINAL.json')
          if canonical.exists():
              assert json.loads(canonical.read_text())==d, 'R25 exact original-derived JSON differs from committed witness'
              print('TW10_R25_EXACT_DERIVED_JSON_EQUALITY=PASS')
          else:
              print('TW10_R25_REVIEW_ONLY_NOT_YET_COMMITTED=PASS')
          print('TW10_R25_DERIVED_JSON_BEGIN')
          print(json.dumps(d,sort_keys=True,separators=(',',':')))
          print('TW10_R25_DERIVED_JSON_END')
          PY
      - name: Always remove temporary derived metadata
        if: always()
        run: rm -rf /tmp/r25-independent
