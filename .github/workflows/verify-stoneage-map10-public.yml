name: Verify MAP10 source-bound original map custody
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-MAP10-PUBLIC-ORIGINAL-SOURCE-CUSTODY-R1.json'
      - 'tests/test_stoneage_map10_public_source_custody.py'
      - '.github/workflows/verify-stoneage-map10-public.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-MAP10-PUBLIC-ORIGINAL-SOURCE-CUSTODY-R1.json'
      - 'tests/test_stoneage_map10_public_source_custody.py'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_stoneage_map10_public_source_custody -v
