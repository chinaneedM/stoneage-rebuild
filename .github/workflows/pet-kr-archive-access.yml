name: PET Korean archive integrated delivery access
on:
  push:
    branches: ['agent/pet-kr-archive-delivery-20261126']
    paths:
      - 'tools/stoneage_pet_kr_archive_access.py'
      - 'tools/stoneage_pet_source_lookup.py'
      - 'research/pets/PET-KR2003-GIF-RETRY-CI-OBSERVED-R1.json'
      - '.github/workflows/pet-kr-archive-access.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/stoneage_pet_source_lookup.py --kr-archive --verify
      - run: python tools/stoneage_pet_source_lookup.py --kr-archive --summary
      - run: python tools/stoneage_pet_source_lookup.py --kr-archive --query 4_024.gif --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --kr-archive --query 4_001.gif --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --verify
      - run: PYTHONPATH=. python tools/stoneage_pet_final_review_matrix.py
      - run: cmp pet-final-review-matrix.json research/pets/PET-FINAL-REVIEW-MATRIX-R1.json
