name: Verify preserved O7 shop source attributes and off-window map bounds
on:
  push:
    paths:
      - '.github/workflows/verify-stoneage-o7-shop-attributes.yml'
      - 'tools/stoneage_o7_source_contract.py'
      - 'tests/test_stoneage_o7_source_contract.py'
      - 'research/recovered/STONEAGE-O7-SHOP-ITEM-STATS-AND-SCENE-ACCEPTANCE-R1.json'
      - 'research/recovered/STONEAGE-SCENE24-SHOP-ITEM-IMAGES-R1.json'
      - 'research/recovered/STONEAGE-SCENE25-ROOM-SHOP-INTEGRATION-R1.json'
      - 'research/recovered/STONEAGE-O6-PRIVATE-ASSET-EXPORT-ACCEPTANCE-R1.json'
  pull_request:
    paths:
      - '.github/workflows/verify-stoneage-o7-shop-attributes.yml'
      - 'tools/stoneage_o7_source_contract.py'
      - 'tests/test_stoneage_o7_source_contract.py'
      - 'research/recovered/STONEAGE-O7-SHOP-ITEM-STATS-AND-SCENE-ACCEPTANCE-R1.json'
      - 'research/recovered/STONEAGE-SCENE24-SHOP-ITEM-IMAGES-R1.json'
      - 'research/recovered/STONEAGE-SCENE25-ROOM-SHOP-INTEGRATION-R1.json'
      - 'research/recovered/STONEAGE-O6-PRIVATE-ASSET-EXPORT-ACCEPTANCE-R1.json'
  workflow_dispatch:
jobs:
  derived-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce source-only item statements and reject native gameplay promotions
        run: |
          python -m unittest tests.test_stoneage_o7_source_contract -v
          python -m tools.stoneage_o7_source_contract
