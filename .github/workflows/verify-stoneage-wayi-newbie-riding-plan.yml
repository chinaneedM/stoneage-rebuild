name: Verify Wayi newbie riding operator plan without implemented reward or numeric projection
on:
  push:
    paths:
      - tools/stoneage_wayi_newbie_riding_plan.py
      - tests/test_stoneage_wayi_newbie_riding_plan.py
      - tools/stoneage_early_content_probe.py
      - research/recovered/STONEAGE-WAYI2003-NEWBIE-RIDING-PLAN-R1.json
      - docs/specs/STONEAGE-WAYI2003-NEWBIE-RIDING-PLAN-R1.md
      - .github/workflows/verify-stoneage-wayi-newbie-riding-plan.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-column-index-and-riding-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stoneage_wayi_newbie_riding_plan -v
      - name: Reacquire only exact column index and one selected article
        run: python -m tools.stoneage_wayi_newbie_riding_plan --output output/derived.json
      - run: cmp output/derived.json research/recovered/STONEAGE-WAYI2003-NEWBIE-RIDING-PLAN-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: wayi-newbie-riding-plan-derived-only
          path: output/derived.json
          retention-days: 30
