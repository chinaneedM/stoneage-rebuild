name: Probe provisional early Mainland StoneAge ISBN

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_early_mainland_provisional_isbn_probe.py
      - tests/test_stoneage_early_mainland_provisional_isbn_probe.py
      - .github/workflows/probe-stoneage-early-mainland-provisional-isbn.yml

permissions:
  contents: write

concurrency:
  group: stoneage-early-mainland-provisional-isbn
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate provisional identifier probe
        run: python3 -m unittest tests.test_stoneage_early_mainland_provisional_isbn_probe -v
      - name: Probe public preservation metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_early_mainland_provisional_isbn_probe \
            > research/recovered/STONEAGE-EARLY-MAINLAND-PROVISIONAL-ISBN-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-EARLY-MAINLAND-PROVISIONAL-ISBN-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe provisional early Mainland StoneAge ISBN'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_early_mainland_provisional_isbn_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe provisional early Mainland StoneAge ISBN'
          fi
          git push
