name: Probe Japan 2004 StoneAge Item City product
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_japan2004_itemcity_probe.py
      - tests/test_stoneage_japan2004_itemcity_probe.py
      - .github/workflows/probe-stoneage-japan2004-itemcity.yml

permissions:
  contents: write

concurrency:
  group: stoneage-japan2004-itemcity
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Run Item City probe tests
        run: python3 -m unittest tests.test_stoneage_japan2004_itemcity_probe -v
      - name: Probe period retailer product page
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_japan2004_itemcity_probe \
            > research/recovered/STONEAGE-JAPAN-2004-ITEMCITY-PROBE-R1.txt
      - name: Commit derived metadata report only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-JAPAN-2004-ITEMCITY-PROBE-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Japan 2004 Item City product'
          git pull --rebase origin main
          git push
