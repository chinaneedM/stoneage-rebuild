name: PET Korean 2003 exact GIF payload verification
on:
  push:
    branches: ['agent/pet-kr2003-image-payload-20261126']
    paths:
      - 'tools/stoneage_pet_kr2003_gif_payload.py'
      - 'research/pets/PET-KR2002-IMAGE-CDX-CI-OBSERVED-R1.json'
      - '.github/workflows/pet-kr2003-gif-payload.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python tools/stoneage_pet_kr2003_gif_payload.py --verify
      - run: python tools/stoneage_pet_kr2003_gif_payload.py > pet-kr2003-gif-payload.json
      - run: cat pet-kr2003-gif-payload.json
      - uses: actions/upload-artifact@v4
        with:
          name: pet-kr2003-gif-payload-derived
          path: pet-kr2003-gif-payload.json
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --verify
      - run: PYTHONPATH=. python tools/stoneage_pet_final_review_matrix.py
      - run: cmp pet-final-review-matrix.json research/pets/PET-FINAL-REVIEW-MATRIX-R1.json
