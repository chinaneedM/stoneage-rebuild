name: Verify CHAR05 source NPC / prior original animation joins
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CHARACTER-NPC-MODULE-05-30-ORIGINAL-MOTION-SOURCE-BRIDGE-R1.json'
      - 'tests/test_stoneage_character_npc_module_05.py'
      - '.github/workflows/verify-stoneage-character-npc-module-05.yml'
  workflow_dispatch:
jobs:
  source-association:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_character_npc_module_05.py' -v
