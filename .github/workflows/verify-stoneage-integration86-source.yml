name: Verify StoneAge INTEGRATION86 Sikkoku original source boundaries
on:
  push:
    branches: [main, 'agent/stoneage-integration86-*']
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION86-SIKKOKU-SOURCE-2D-R1.json'
      - 'tests/test_stoneage_integration86_sikkoku_source.py'
      - '.github/workflows/verify-stoneage-integration86-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION86-SIKKOKU-SOURCE-2D-R1.json'
      - 'tests/test_stoneage_integration86_sikkoku_source.py'
      - '.github/workflows/verify-stoneage-integration86-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-qualified static and negative-evidence contracts
        run: python -m unittest discover -s tests -p 'test_stoneage_integration86_sikkoku_source.py' -v
