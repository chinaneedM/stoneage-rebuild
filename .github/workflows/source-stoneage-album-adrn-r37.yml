name: Bounded same-carrier original album ADRN source R37
on:
  push:
    branches: ['agent/album-adrn-source-r37-20261027']
permissions:
  contents: read
jobs:
  bounded-original-adrn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_stoneage_album_adrn_source_r37 tests.test_stoneage_native_album_source_r36
      - name: Pinned RAR4 metadata and static extraction
        run: |
          python -m pip install rarfile==4.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar
      - name: At most16MiB sparse source for one independently extractable ADRN
        run: python -m tools.stoneage_album_adrn_source_r37 --work /tmp/r37-private --output /tmp/r37-derived.json --sealed /tmp/r37-sealed.der
      - name: Remove proprietary originals before upload
        if: always()
        run: rm -rf /tmp/r37-private
      - uses: actions/upload-artifact@v4
        with:
          name: r37-three-alias-derived-and-private-transfer
          path: |
            /tmp/r37-derived.json
            /tmp/r37-sealed.der
          retention-days: 7
          if-no-files-found: error
