name: Verify source-qualified five brothers riddles, passage and chosen reward pairs
on:
  push:
    paths:
      - 'tools/stoneage_five_brothers_source.py'
      - 'tests/test_stoneage_five_brothers_source.py'
      - 'research/recovered/STONEAGE-CN2003-FIVE-BROTHERS-*.json'
      - 'docs/specs/STONEAGE-CN2003-FIVE-BROTHERS-SOURCE-R1.md'
      - '.github/workflows/verify-stoneage-five-brothers-source.yml'
  pull_request:
    paths:
      - 'tools/stoneage_five_brothers_source.py'
      - 'tests/test_stoneage_five_brothers_source.py'
      - 'research/recovered/STONEAGE-CN2003-FIVE-BROTHERS-*.json'
      - 'docs/specs/STONEAGE-CN2003-FIVE-BROTHERS-SOURCE-R1.md'
      - '.github/workflows/verify-stoneage-five-brothers-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Branch, source scope and unknown-identity counterexamples
        run: python -m unittest tests.test_stoneage_five_brothers_source -v
      - name: Retrieve current source and reject semantic mutations
        run: python -m tools.stoneage_five_brothers_source --fetch --output "$RUNNER_TEMP/r71/replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: five-brothers-derived-r71
          path: ${{ runner.temp }}/r71/replay.json
          if-no-files-found: error
          retention-days: 30
