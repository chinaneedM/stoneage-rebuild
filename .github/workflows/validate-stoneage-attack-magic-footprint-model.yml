name: Validate StoneAge AttackMagic footprint

concurrency:
  group: stoneage-attack-magic-footprint
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-attack-magic-footprint-model.yml
      - tools/stoneage_attack_magic_footprint_model.py
      - tests/test_stoneage_attack_magic_footprint_model.py
      - research/mechanics/STONEAGE-ATTACK-MAGIC-FOOTPRINT-R1.md
  pull_request:
    paths:
      - .github/workflows/validate-stoneage-attack-magic-footprint-model.yml
      - tools/stoneage_attack_magic_footprint_model.py
      - tests/test_stoneage_attack_magic_footprint_model.py
      - research/mechanics/STONEAGE-ATTACK-MAGIC-FOOTPRINT-R1.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic AttackMagic footprint tests
        run: python3 -m unittest tests.test_stoneage_attack_magic_footprint_model -v
