name: Verify StoneAge INTEGRATION49 28 original room source graph
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION49-28-ORIGINAL-ROOM-NPC-WARP-SOURCE-ATLAS-R1.json'
      - 'tests/test_stoneage_integration_module_49.py'
      - '.github/workflows/verify-stoneage-integration49-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION49-28-ORIGINAL-ROOM-NPC-WARP-SOURCE-ATLAS-R1.json'
      - 'tests/test_stoneage_integration_module_49.py'
      - '.github/workflows/verify-stoneage-integration49-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_49.py' -v
