name: Validate StoneAge local runtime session coordinator

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_battlemodel_placement_capability.py
      - tools/stoneage_recovered25_petskill_pressure_probe.py
      - tests/test_stoneage_battlemodel_placement_capability.py
      - tests/test_stoneage_recovered25_petskill_pressure_probe.py
      - tools/stoneage_battlemodel_command_entry_source_audit.py
      - tools/stoneage_recovered25_battlemodel_command_entry_probe.py
      - tests/test_stoneage_battlemodel_command_entry_audit.py
      - .github/workflows/validate-stoneage-recovered25-region-payload.yml
      - tools/stoneage_recovered25_battlemodel_runtime_probe.py
      - tests/test_stoneage_recovered25_battlemodel_runtime_probe.py
      - game/STONEAGE-BATTLEMODEL-RUNTIME-GOLDEN-R1.json
      - .github/workflows/validate-stoneage-local-runtime-session-coordinator.yml
      - tools/stoneage_local_runtime_session_coordinator.py
      - tools/stoneage_enemy_ai_petskill_bridge.py
      - tools/stoneage_enemy_ai_2battletimid_bridge.py
      - tools/stoneage_recovered25_petskill_runtime.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_enemy_ai_petskill_bridge.py
      - tests/test_stoneage_recovered25_petskill_runtime.py
      - tools/stoneage_local_application_facade.py
      - tests/test_stoneage_local_application_facade.py
      - tools/stoneage_local_engine_adapter.py
      - tests/test_stoneage_local_engine_adapter.py
      - tools/stoneage_local_runtime_save.py
      - tests/test_stoneage_local_runtime_save.py
      - tools/stoneage_local_filesystem_persistence.py
      - tests/test_stoneage_local_filesystem_persistence.py
      - tools/stoneage_runtime_dynamic_occupancy.py
      - tests/test_stoneage_runtime_dynamic_occupancy.py
      - tools/stoneage_runtime_occupancy_registry.py
      - tests/test_stoneage_runtime_occupancy_registry.py
      - tools/stoneage_local_runtime_core.py
      - tools/stoneage_singleplayer_world.py
      - tools/stoneage_singleplayer_domain.py
      - tools/stoneage_singleplayer_persistence.py
      - tests/test_stoneage_singleplayer_persistence.py
      - tools/stoneage_singleplayer_battle.py
      - tests/test_stoneage_singleplayer_battle_transition_runtime.py
      - tests/test_stoneage_group_battle_runtime.py
      - tools/stoneage_singleplayer_runtime.py
      - tools/stoneage_battle_state_model.py
      - research/mechanics/STONEAGE-PET-CAPTURE-CORE-R1.md
      - research/mechanics/STONEAGE-BATTLE-CAPTURE-R1.md
      - tests/test_stoneage_pet_capture_model.py
      - tools/stoneage_pet_capture_model.py
      - research/mechanics/STONEAGE-PLAYER-DEATH-REVIVAL-CORE-R1.md
      - tests/test_stoneage_player_death_model.py
      - tools/stoneage_player_death_model.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_battlemodel_round_action.py
      - tools/stoneage_battlemodel_hit_loop.py
      - tools/stoneage_battlemodel_physical_attackseq.py
      - tools/stoneage_profit_exit_runtime_binder.py
      - tests/test_stoneage_battlemodel_ordinary_round.py
      - tools/stoneage_default_pet_exit_model.py
      - tools/stoneage_enemy_spawn_model.py
      - tools/stoneage_recovered25_enemybase_runtime.py
      - tests/test_stoneage_singleplayer_battle.py
      - tests/test_stoneage_enemy_spawn_model.py
      - tools/stoneage_recovered25_local_runtime_stack.py
      - tools/stoneage_recovered25_npc_initial_occupancy.py
      - tools/stoneage_versioned_npc_overability_profile.py
      - tests/test_stoneage_recovered25_npc_initial_occupancy.py
      - research/recovered/STONEAGE-25-NPC-OVERABILITY-LINEAGE-R1.txt
      - research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-BINDINGS-R1.txt
      - research/recovered/STONEAGE-25-STABLE-NPC-TEMPLATE-PROFILES-R1.txt
      - game/RUNTIME-BOOTSTRAP-RECOVERED25-R1.json
      - docs/LOCAL-RUNTIME-SESSION-COORDINATOR-R1.md

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local runtime session coordinator
        run: |
          python3 -m unittest \
            tests.test_stoneage_battlemodel_placement_capability \
            tests.test_stoneage_recovered25_petskill_pressure_probe \
            tests.test_stoneage_battlemodel_command_entry_audit \
            tests.test_stoneage_recovered25_battlemodel_runtime_probe \
            tests.test_stoneage_local_runtime_session_coordinator \
            tests.test_stoneage_enemy_ai_petskill_bridge \
            tests.test_stoneage_recovered25_petskill_runtime \
            tests.test_stoneage_local_application_facade \
            tests.test_stoneage_local_engine_adapter \
            tests.test_stoneage_local_runtime_save \
            tests.test_stoneage_local_filesystem_persistence \
            tests.test_stoneage_runtime_dynamic_occupancy \
            tests.test_stoneage_runtime_occupancy_registry \
            tests.test_stoneage_recovered25_npc_initial_occupancy \
            tests.test_stoneage_local_runtime_core \
            tests.test_stoneage_singleplayer_world \
            tests.test_stoneage_singleplayer_persistence \
            tests.test_stoneage_singleplayer_battle \
            tests.test_stoneage_enemy_spawn_model \
            tests.test_stoneage_group_battle_runtime \
            tests.test_stoneage_singleplayer_battle_transition_runtime \
            tests.test_stoneage_pet_capture_model \
            tests.test_stoneage_player_death_model -v
