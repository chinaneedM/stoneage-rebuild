name: Validate StoneAge BecomeFox coordinator

concurrency:
  group: stoneage-becomefox-coordinator-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-becomefox-coordinator.yml"
      - "tools/stoneage_local_runtime_session_coordinator.py"
      - "tools/stoneage_battle_state_model.py"
      - "tools/stoneage_battle_round_model.py"
      - "tools/stoneage_enemy_ai_becomefox_bridge.py"
      - "tools/stoneage_becomefox_runtime_state.py"
      - "tests/test_stoneage_local_runtime_session_coordinator.py"
      - "tests/test_stoneage_becomefox_persistent_runtime.py"
      - "tests/test_stoneage_becomefox_ordered_round.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact ID625 AI selection through persistent coordinator
        run: |
          python -m unittest -v \
            tests.test_stoneage_local_runtime_session_coordinator.LocalRuntimeSessionCoordinatorTests.test_recovered_enemy_ai_becomefox_selects_exact_id625_and_persists_fox \
            tests.test_stoneage_becomefox_persistent_runtime \
            tests.test_stoneage_becomefox_ordered_round
