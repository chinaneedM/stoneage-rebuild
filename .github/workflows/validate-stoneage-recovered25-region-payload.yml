name: Validate StoneAge recovered25 region payload source

concurrency:
  group: stoneage-recovered25-region-payload
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-recovered25-region-payload.yml
      - tools/stoneage_recovered25_region_payload.py
      - tools/stoneage_recovered25_region_payload_smoke.py
      - tests/test_stoneage_recovered25_region_payload.py
      - tools/stoneage_recovered25_local_runtime_stack.py
      - tools/stoneage_recovered25_local_runtime_stack_smoke.py
      - tools/stoneage_recovered25_attack_magic_runtime.py
      - tools/stoneage_recovered25_attack_magic_runtime_smoke.py
      - tests/test_stoneage_recovered25_attack_magic_runtime.py
      - tools/stoneage_attack_magic_crosslink_probe.py
      - tests/test_stoneage_attack_magic_crosslink_probe.py
      - tools/stoneage_recovered25_encounter_runtime.py
      - tools/stoneage_versioned_encounter_runtime.py
      - tools/stoneage_recovered25_enemybase_runtime.py
      - tools/stoneage_recovered25_petskill_runtime.py
      - tools/stoneage_enemy_spawn_model.py
      - tools/stoneage_singleplayer_battle.py
      - tests/test_stoneage_recovered25_enemybase_runtime.py
      - tests/test_stoneage_recovered25_petskill_runtime.py
      - tests/test_stoneage_singleplayer_battle.py
      - tools/stoneage_enemybase_probe.py
      - tools/stoneage_encounter_chain_probe.py
      - tests/test_stoneage_recovered25_local_runtime_stack.py
      - tools/stoneage_recovered25_server_collision_coverage_probe.py
      - tests/test_stoneage_recovered25_server_collision_coverage_probe.py
      - tools/stoneage_recovered25_server_collision_provider.py
      - tools/stoneage_recovered25_server_collision_smoke.py
      - tests/test_stoneage_recovered25_server_collision_provider.py
      - tools/stoneage_recovered25_client_adrn_collision_coverage_probe.py
      - tests/test_stoneage_recovered25_client_adrn_collision_coverage_probe.py
      - tools/stoneage_client_hitmap_core.py
      - tests/test_stoneage_client_hitmap_core.py
      - tools/stoneage_recovered25_client_collision_provider.py
      - tests/test_stoneage_recovered25_client_collision_provider.py
      - tools/stoneage_recovered25_collision_router.py
      - tests/test_stoneage_recovered25_collision_router.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
      - tools/stoneage_local_runtime_save.py
      - tests/test_stoneage_local_runtime_save.py
      - tools/stoneage_runtime_dynamic_occupancy.py
      - tests/test_stoneage_runtime_dynamic_occupancy.py
      - tools/stoneage_server_static_map.py
      - tools/stoneage_recovered25_world_profile_adapter.py
      - game/RUNTIME-BOOTSTRAP-RECOVERED25-R1.json
      - docs/RECOVERED25-REGION-PAYLOAD-SOURCE-R1.md

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic region/runtime-stack tests
        run: |
          python3 -m unittest \
            tests.test_stoneage_recovered25_region_payload \
            tests.test_stoneage_recovered25_world_profile_adapter \
            tests.test_stoneage_recovered25_local_runtime_stack \
            tests.test_stoneage_attack_magic_crosslink_probe \
            tests.test_stoneage_recovered25_attack_magic_runtime \
            tests.test_stoneage_recovered25_enemybase_runtime \
            tests.test_stoneage_recovered25_petskill_runtime \
            tests.test_stoneage_singleplayer_battle \
            tests.test_stoneage_recovered25_server_collision_coverage_probe \
            tests.test_stoneage_recovered25_server_collision_provider \
            tests.test_stoneage_recovered25_client_adrn_collision_coverage_probe \
            tests.test_stoneage_client_hitmap_core \
            tests.test_stoneage_recovered25_client_collision_provider \
            tests.test_stoneage_recovered25_collision_router \
            tests.test_stoneage_runtime_dynamic_occupancy \
            tests.test_stoneage_local_runtime_save \
            tests.test_stoneage_local_runtime_session_coordinator -v
      - name: Install extractor
        run: sudo apt-get update && sudo apt-get install -y unar
      - name: Recover verified preservation bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib,html,json,re,http.cookiejar,urllib.parse,urllib.request
          from pathlib import Path
          ua='Mozilla/5.0'
          expected={
            'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5',
            'ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb',
          }
          op=urllib.request.build_opener(
            urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          def get(key,suffix):
            data=urllib.parse.urlencode({'quick_key':key,'response_format':'json'}).encode()
            req=urllib.request.Request(
              'https://www.mediafire.com/api/1.5/file/get_info.php',
              data=data,headers={'User-Agent':ua}
            )
            with op.open(req,timeout=60) as r:
              info=json.load(r)['response']['file_info']
            if str(info.get('hash','')).lower()!=expected[key]:
              raise SystemExit('metadata hash changed')
            with op.open(
              urllib.request.Request(info['links']['normal_download'],headers={'User-Agent':ua}),
              timeout=60
            ) as r:
              page=r.read().decode('utf-8','replace'); ref=r.geturl()
            m=re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S) or re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
            if not m:
              raise SystemExit('no direct link')
            path=Path('/tmp/sa25')/('part.'+suffix); h=hashlib.sha256()
            request=urllib.request.Request(
              html.unescape(m.group(1)),headers={'User-Agent':ua,'Referer':ref}
            )
            with op.open(request,timeout=300) as r,path.open('wb') as out:
              while True:
                block=r.read(1048576)
                if not block: break
                out.write(block); h.update(block)
            if h.hexdigest()!=expected[key]:
              raise SystemExit('hash mismatch')
          get('ev7l29fw77891go','001')
          get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 >/tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar|awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out
          ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/dev/null 2>&1
      - name: Validate all materializable recovered25 map payloads
        run: |
          set -euo pipefail
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
          S="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          test -n "$D"; test -n "$S"
          R=research/recovered/STONEAGE-25-REGION-PAYLOAD-SOURCE-R1.txt
          python3 -m tools.stoneage_recovered25_region_payload_smoke --client-dat-dir "$D" --server-map-root "$S" > "$R"
          test -s "$R"
          grep -F 'COUNT|materializable_floors|826' "$R"
          grep -F 'COUNT|client_dat_three_plane_floors|761' "$R"
          grep -F 'COUNT|server_ls2map_two_plane_floors|65' "$R"
          grep -F 'COUNT|event_plane_present_floors|761' "$R"
          grep -F 'COUNT|event_plane_separate_floors|65' "$R"
          grep -F 'RESOLUTION|RECOVERED25_REGION_PAYLOAD_SOURCE_CLOSED' "$R"
      - name: Validate concrete recovered25 local runtime stack
        run: |
          set -euo pipefail
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          G="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          S="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          M="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/data/map/mapset.txt' -print -quit)"
          A="$(find /tmp/sa25/out -type f -iname 'adrn_15.bin' -print -quit)"
          test -n "$D"; test -n "$N"; test -n "$G"; test -n "$C"; test -n "$S"; test -n "$M"; test -n "$A"
          R=research/recovered/STONEAGE-25-LOCAL-RUNTIME-STACK-R1.txt
          python3 -m tools.stoneage_recovered25_local_runtime_stack_smoke \
            --client-dat-dir "$D" \
            --npc-dir "$N" \
            --setup "$C" \
            --server-data-dir "$G" \
            --server-map-root "$S" \
            --mapset "$M" \
            --client-adrn "$A" > "$R"
          test -s "$R"
          grep -F 'COUNT|materializable_floors|826' "$R"
          grep -F 'COUNT|state_gated_bindings|3' "$R"
          grep -F 'COUNT|fresh_start_seeds|4' "$R"
          grep -F 'COUNT|fresh_start_concrete_regions|4' "$R"
          grep -F 'COUNT|representative_payload_formats|2' "$R"
          grep -F 'COUNT|state_gated_allow_decisions|3' "$R"
          grep -F 'LOCAL_SESSION_ROUNDTRIP|witness=1' "$R"
          grep -F 'COUNT|collision_server_routed_floors|635' "$R"
          grep -F 'COUNT|collision_client_reconstruction_routed_floors|191' "$R"
          grep -F 'COUNT|collision_routed_floors|826' "$R"
          grep -F 'COUNT|collision_unrouted_floors|0' "$R"
          grep -F 'CLIENT_COLLISION_PROFILE|RECOVERED25_DESCENDANT_STABLE_CLIENT_HITMAP_R1|exact_recovered25_binary_proof=0' "$R"
          grep -F 'CLIENT_COLLISION_MOVEMENT_WITNESS|1' "$R"
          grep -F 'COUNT|enemybase_templates|988' "$R"
          grep -F 'COUNT|petskill_entries|147' "$R"
          grep -F 'COUNT|attackmagic_entries|25' "$R"
          grep -F 'ATTACKMAGIC_NONPLAYER_ITEM_RUNTIME_ROLE|CONFIG_CROSSLINK_ONLY_MP_EXECUTION_DEAD' "$R"
          grep -F 'ATTACKMAGIC_EXACT_FOOTPRINT_WITNESS|magic=301|targets=1|portable=1' "$R"
          grep -F 'ATTACKMAGIC_DYNAMIC_PORTABILITY_WITNESS|magic=305|alive=1|targets=1|portable=1' "$R"
          grep -F 'COUNT|enemybase_referenced_petskill_ids|111' "$R"
          grep -F 'COUNT|enemybase_referenced_noncommon_petskill_ids|80' "$R"
          grep -F 'COUNT|enemybase_noncommon_petskill_slot_uses|365' "$R"
          grep -F 'PETSKILL_NONCOMMON_CALLBACK_COVERAGE|' "$R"
          grep -F 'PETSKILL_ATTACKMAGIC_PARSE|' "$R"
          grep -F 'pair_numeric_ids=25|' "$R"
          grep -F 'PETSKILL_STATUSCHANGE_PARSE|unique_ids=6|matched_status_ids=6|turn_min=3|turn_max=5|attack_modifier_ids=6|defense_modifier_ids=0' "$R"
          grep -F 'PETSKILL_GUARDIAN_PARSE|unique_ids=1|attack_marker_ids=1|defense_marker_ids=0|defensive_com_ids=0|attack_numeric_ids=1|defense_numeric_ids=0|attack_min=-20.0|attack_max=-20.0|defense_min=NONE|defense_max=NONE' "$R"
          grep -F 'PETSKILL_MERGE_PARSE|unique_ids=2|field_all_ids=0|field_battle_ids=0|field_map_ids=2|field_other_ids=0|illegal_ids=2|ascii_ids=2|empty_option_ids=2' "$R"
          grep -F 'PETSKILL_NOGUARD_PARSE|' "$R"
          grep -F 'PETSKILL_CONTINUATIONATTACK_PARSE|unique_ids=4|ascii_ids=4|leading_int_ids=4|in_range_count_ids=4|count_min=2|count_max=5|distinct_count=4' "$R"
          grep -F 'PETSKILL_ABDUCT_PARSE|' "$R"
          grep -F 'PETSKILL_STEAL_PARSE|unique_ids=1|ascii_ids=1' "$R"
          grep -F 'PETSKILL_EARTHROUND_PARSE|unique_ids=1|attack_marker_ids=1|attack_numeric_ids=1|attack_percent_min=90.0|attack_percent_max=90.0' "$R"
          grep -F 'COUNT|enemybase_unresolved_petskill_ids|0' "$R"
          grep -F 'COUNT|stable_unresolved_enemybase_templates|0' "$R"
          grep -F 'ENEMYBASE_NAME_ENCODING_STATUS|OPEN_CP950_BIG5_TWO_ROW_AMBIGUITY' "$R"
          grep -F 'COUNT|stable_encounter_areas|402' "$R"
          grep -F 'COUNT|stable_unresolved_positive_group_refs|23' "$R"
          grep -F 'COUNT|stable_affected_encounter_areas|19' "$R"
          grep -F 'ENCOUNTER_GROUP_RUNTIME_WITNESS|1' "$R"
          grep -F 'ENCOUNTER_VARIANT_RUNTIME_WITNESS|1' "$R"
          grep -F 'ENEMY_SPAWN_BIRTH_RUNTIME_WITNESS|1' "$R"
          grep -F 'RESOLUTION|RECOVERED25_LOCAL_RUNTIME_STACK_CLOSED' "$R"
      - name: Probe recovered25 AttackMagic cross-links
        run: |
          set -euo pipefail
          G="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$G"; test -n "$C"
          R=research/recovered/STONEAGE-25-ATTACKMAGIC-CROSSLINK-R1.txt
          python3 -m tools.stoneage_attack_magic_crosslink_probe             --data-dir "$G"             --setup "$C" > "$R"
          test -s "$R"
          grep -F 'ATTACK_SKILL_COUNT|25' "$R"
          grep -F 'SKILL_MAGIC_ITEM_NUMERIC_PAIRS|25' "$R"
          grep -F 'MAGIC_ROWS_MATCHED|' "$R"
          grep -F 'ITEM_ROWS_MATCHED|' "$R"
          grep -F 'ATTMAGIC_ADJACENT_RECORD_PAIRS_VALID|' "$R"
          grep -F 'RESOLUTION|RECOVERED25_ATTACKMAGIC_CROSSLINK_' "$R"
      - name: Audit recovered25 server-backed collision coverage
        run: |
          set -euo pipefail
          S="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          M="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/data/map/mapset.txt' -print -quit)"
          test -n "$S"; test -n "$M"
          R=research/recovered/STONEAGE-25-SERVER-COLLISION-COVERAGE-R1.txt
          python3 -m tools.stoneage_recovered25_server_collision_coverage_probe \
            --server-map-root "$S" \
            --mapset "$M" > "$R"
          test -s "$R"
          grep -F 'COUNT|materializable_floors|826' "$R"
          grep -F 'COUNT|supplemental_floors|65' "$R"
          grep -F 'COUNT|stable_floors|761' "$R"
          grep -F 'RESOLUTION|RECOVERED25_SERVER_COLLISION_COVERAGE_AUDITED' "$R"
      - name: Validate recovered25 server collision runtime provider
        run: |
          set -euo pipefail
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
          N="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/npc' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          S="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          M="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/data/map/mapset.txt' -print -quit)"
          test -n "$D"; test -n "$N"; test -n "$C"; test -n "$S"; test -n "$M"
          R=research/recovered/STONEAGE-25-SERVER-COLLISION-PROVIDER-R1.txt
          python3 -m tools.stoneage_recovered25_server_collision_smoke \
            --client-dat-dir "$D" \
            --npc-dir "$N" \
            --setup "$C" \
            --server-map-root "$S" \
            --mapset "$M" > "$R"
          test -s "$R"
          grep -F 'COUNT|materializable_floors|826' "$R"
          grep -F 'COUNT|server_collision_closed|635' "$R"
          grep -F 'COUNT|server_collision_uncovered|191' "$R"
          grep -F 'COUNT|status:NO_SERVER_MAP|189' "$R"
          grep -F 'COUNT|status:DIVERGENT_SERVER_DUPLICATE|2' "$R"
          grep -F 'SERVER_BACKED_MOVEMENT_WITNESS|1' "$R"
          grep -F 'UNCOVERED_FAIL_CLOSED_WITNESS|1' "$R"
          grep -F 'RESOLUTION|RECOVERED25_SERVER_COLLISION_PROVIDER_CLOSED_WITH_GAPS' "$R"
      - name: Audit recovered25 client ADRN collision coverage
        run: |
          set -euo pipefail
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
          S="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data/map' -print -quit)"
          M="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/data/map/mapset.txt' -print -quit)"
          A="$(find /tmp/sa25/out -type f -iname 'adrn_15.bin' -print -quit)"
          test -n "$D"; test -n "$S"; test -n "$M"; test -n "$A"
          R=research/recovered/STONEAGE-25-CLIENT-ADRN-COLLISION-COVERAGE-R1.txt
          python3 -m tools.stoneage_recovered25_client_adrn_collision_coverage_probe \
            --client-dat-dir "$D" \
            --server-map-root "$S" \
            --mapset "$M" \
            --adrn "$A" > "$R"
          test -s "$R"
          grep -F 'COUNT|server_uncovered_floors|191' "$R"
          grep -F 'COUNT|adrn_records|234564' "$R"
          grep -F 'RESOLUTION|RECOVERED25_CLIENT_ADRN_COLLISION_COVERAGE_AUDITED' "$R"
      - name: Commit derived aggregate reports
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-25-REGION-PAYLOAD-SOURCE-R1.txt research/recovered/STONEAGE-25-LOCAL-RUNTIME-STACK-R1.txt research/recovered/STONEAGE-25-SERVER-COLLISION-COVERAGE-R1.txt research/recovered/STONEAGE-25-SERVER-COLLISION-PROVIDER-R1.txt research/recovered/STONEAGE-25-CLIENT-ADRN-COLLISION-COVERAGE-R1.txt research/recovered/STONEAGE-25-ATTACKMAGIC-CROSSLINK-R1.txt
          if git diff --cached --quiet; then
            echo 'Derived region report unchanged; nothing to commit.'
          else
            git commit -m 'research: validate recovered25 region payload source'
            git pull --rebase origin main
            git push
          fi
