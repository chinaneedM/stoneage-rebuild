name: Validate StoneAge BecomePig item NPC map timer composition

concurrency:
  group: stoneage-becomepig-item-npc-map-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-becomepig-item-npc-map.yml"
      - "tools/stoneage_becomepig_item_npc_map_native_audit.py"
      - "tests/test_stoneage_becomepig_item_npc_map.py"
      - "specs/STONEAGE-BECOMEPIG-ITEM-NPC-MAP-R1.md"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate independent item NPC map oracle
        run: python -m unittest -v tests.test_stoneage_becomepig_item_npc_map

      - name: Recover exact pinned descendant source trees
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_guard_break2_source_audit import PINNED
          repos = {
              "gavin": "gavinlinasd/StoneAge",
              "iris": "iriselia/StoneAge",
              "bismarck": "BismarckDD/stoneage",
          }
          root = Path("/tmp/becomepig-item-npc-map")
          for name, sha in PINNED.items():
              dst = root / name
              subprocess.run(["git", "init", str(dst)], check=True)
              subprocess.run(
                  ["git", "-C", str(dst), "remote", "add", "origin",
                   "https://github.com/" + repos[name] + ".git"],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", str(dst), "fetch", "--depth", "1", "origin", sha],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", str(dst), "checkout", "--detach", "FETCH_HEAD"],
                  check=True,
              )
          PY

      - name: Execute item NPC map timer native composition
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python -m tools.stoneage_becomepig_item_npc_map_native_audit \
            --gavin-dir /tmp/becomepig-item-npc-map/gavin \
            --iris-dir /tmp/becomepig-item-npc-map/iris \
            --bismarck-dir /tmp/becomepig-item-npc-map/bismarck \
            > research/recovered/STONEAGE-BECOMEPIG-ITEM-NPC-MAP-NATIVE-R1.txt
          cat research/recovered/STONEAGE-BECOMEPIG-ITEM-NPC-MAP-NATIVE-R1.txt
          test "$(grep -c '^PROFILE|' research/recovered/STONEAGE-BECOMEPIG-ITEM-NPC-MAP-NATIVE-R1.txt)" = 3
          grep -F 'TOTAL|native_comparisons=30|profiles=3' \
            research/recovered/STONEAGE-BECOMEPIG-ITEM-NPC-MAP-NATIVE-R1.txt
          grep -F 'RESOLUTION|BECOMEPIG_ITEM_NPC_MAP_TIMER_NATIVE_COMPOSITION_PASS_ZERO_RUNTIME_PROMOTIONS' \
            research/recovered/STONEAGE-BECOMEPIG-ITEM-NPC-MAP-NATIVE-R1.txt

      - name: Preserve derived item NPC map evidence
        uses: actions/upload-artifact@v4
        with:
          name: becomepig-item-npc-map-${{ github.sha }}
          path: research/recovered/STONEAGE-BECOMEPIG-ITEM-NPC-MAP-NATIVE-R1.txt

      - name: Commit only derived item NPC map report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/recovered/STONEAGE-BECOMEPIG-ITEM-NPC-MAP-NATIVE-R1.txt
          if ! git diff --cached --quiet; then
            git commit -m "research: verify BecomePig item NPC map composition [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
