name: Verify O19 one original petshop create parameter pointer
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-O19-ONE-PETSHOP-CREATE-ARGUMENT-LINK-R1.json'
      - 'tools/stoneage_o19_petshop_create_link.py'
      - 'tests/test_stoneage_o19_petshop_create_link.py'
      - '.github/workflows/verify-stoneage-o19-petshop-create.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-O19-ONE-PETSHOP-CREATE-ARGUMENT-LINK-R1.json'
      - 'tools/stoneage_o19_petshop_create_link.py'
      - 'tests/test_stoneage_o19_petshop_create_link.py'
      - '.github/workflows/verify-stoneage-o19-petshop-create.yml'
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source facts and negative claim tests
        run: |
          python -m tools.stoneage_o19_petshop_create_link
          python -m unittest discover -s tests -p 'test_stoneage_o19_petshop_create_link.py' -v
