name: Verify StoneAge INTEGRATION67 spirit-king original pet pixels
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION67-SPIRIT-KING-THREE-GETPET-TW1-ORIGINAL-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_67.py'
      - '.github/workflows/verify-stoneage-integration67-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION67-SPIRIT-KING-THREE-GETPET-TW1-ORIGINAL-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_67.py'
      - '.github/workflows/verify-stoneage-integration67-source.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_67.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_quest29_spirit_king_source.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_stage_a_world21_quest_getpet_conditions.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_pet_module_07_source_pixels.py' -v
