name: Verify StoneAge INTEGRATION53 three dragon original TW10 sprite crosswalk
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION53-THREE-DRAGONS-QUEST-NPC-TW10-SPR-SOURCE-BRIDGE-R1.json'
      - 'tests/test_stoneage_integration_module_53.py'
      - '.github/workflows/verify-stoneage-integration53-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION53-THREE-DRAGONS-QUEST-NPC-TW10-SPR-SOURCE-BRIDGE-R1.json'
      - 'tests/test_stoneage_integration_module_53.py'
      - '.github/workflows/verify-stoneage-integration53-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_53.py' -v
