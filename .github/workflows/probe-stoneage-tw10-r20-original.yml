name: Probe TW1.0 original R20 indirect CALL third-global and alias frontiers
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r20-call-global-alias-20261012]
    paths:
      - .github/workflows/probe-stoneage-tw10-r20-original.yml
      - tools/stoneage_tw10_savedata_upstream_r20.py
      - tests/test_stoneage_tw10_savedata_upstream_r20.py
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: R20 synthetic and adjacent regressions
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_upstream_r20 tests.test_stoneage_tw10_savedata_upstream_r19
      - name: Transient historical pinned-archive retrieval
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_archive_parallel_download --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar
      - name: Extract temporary verified original BIN only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r20
          7z x -y -o/tmp/stoneage-r20 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r20/STONEAGE.bin)" -eq 523449360
      - name: Derive bounded original-static metadata only
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_upstream_r20 --bin /tmp/stoneage-r20/STONEAGE.bin > /tmp/stoneage-r20-derived.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.stoneage_tw10_savedata_upstream_r20 import SCHEMA,STATUS,SECOND_CALL,THIRD_GLOBAL,ALIAS_SITE,FLAGS
          p=Path('/tmp/stoneage-r20-derived.json');d=json.loads(p.read_text())
          assert p.stat().st_size<=70000
          assert d['schema']==SCHEMA and d['status']==STATUS
          assert d['static_only'] and d['r19_original_identity_revalidated']
          assert d['second_call']['call_identity']['call_rva']==SECOND_CALL
          assert d['third_global']['target_virtual_rva']==THIRD_GLOBAL
          assert d['ebx_alias_gap']['site_rva']==ALIAS_SITE
          assert all(d[k] is False for k in FLAGS)
          print('TW10_R20_ORIGINAL_STATIC_FRONTIER=PASS')
          print('TW10_R20_NATIVE_IO_OWNERSHIP=OPEN')
          PY
      - name: Always purge all original bytes
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r20
      - name: Upload derived JSON only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-r20-original-call-global-alias-derived
          path: /tmp/stoneage-r20-derived.json
          retention-days: 21
