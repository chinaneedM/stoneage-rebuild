name: Verify CN2001-2003 shell quest derived records
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN2001-2003-SHELL-QUEST-SOURCE-R1.json'
      - 'tests/test_stoneage_cn2001_2003_shell_quest_source.py'
      - 'research/recovered/STONEAGE-CN2001-2003-SHELL-QUEST-ACCEPTANCE-R1.json'
      - '.github/workflows/verify-stoneage-cn2001-2003-shell-quest.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN2001-2003-SHELL-QUEST-SOURCE-R1.json'
      - 'tests/test_stoneage_cn2001_2003_shell_quest_source.py'
      - 'research/recovered/STONEAGE-CN2001-2003-SHELL-QUEST-ACCEPTANCE-R1.json'
      - '.github/workflows/verify-stoneage-cn2001-2003-shell-quest.yml'
jobs:
  derived-evidence-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert bounded derived source claims
        run: python -m unittest discover -s tests -p 'test_stoneage_cn2001_2003_shell_quest_source.py' -v
