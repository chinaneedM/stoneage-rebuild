name: Independently verify TW1.0 R48 original native count return barriers and savedata read loop
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r48-count-return-loop-20261015, main]
    paths:
      - .github/workflows/verify-stoneage-tw10-r48-original.yml
      - tools/stoneage_tw10_savedata_native_io_r48_guard.py
      - docs/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R48.md
      - research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R48-ORIGINAL.json
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate independent immutable original run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38651895475" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|ed98875e3c9806d2dbf9f288e6a568863f1ef5bc|agent/tw10-savedata-r48-count-return-loop-20261015'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11934579327" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38651895475|tw10-r48-original-count-return-loop-derived|sha256:2bf989d3fa0a0267aaafe45f8d41ae97de75e2ed87cdd2b6c239ec110c5c8eb8|false'
      - name: Download bounded R48 original-derived metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r48-independent
          gh run download 38651895475 --repo "$GITHUB_REPOSITORY" --name tw10-r48-original-count-return-loop-derived --dir /tmp/r48-independent
          test "$(find /tmp/r48-independent -type f | wc -l)" -eq 1
          test -f /tmp/r48-independent/stoneage-r48-derived.json
          test ! -L /tmp/r48-independent/stoneage-r48-derived.json
          test "$(stat -c %s /tmp/r48-independent/stoneage-r48-derived.json)" -le 300000
          sha256sum /tmp/r48-independent/stoneage-r48-derived.json
          wc -c /tmp/r48-independent/stoneage-r48-derived.json
      - name: Replay strict R48 through R32 tamper and negative controls
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r48 tests.test_stoneage_tw10_savedata_native_io_r47 tests.test_stoneage_tw10_savedata_native_io_r46 tests.test_stoneage_tw10_savedata_native_io_r45 tests.test_stoneage_tw10_savedata_native_io_r44 tests.test_stoneage_tw10_savedata_native_io_r43 tests.test_stoneage_tw10_savedata_native_io_r42 tests.test_stoneage_tw10_savedata_native_io_r41 tests.test_stoneage_tw10_savedata_native_io_r40 tests.test_stoneage_tw10_savedata_native_io_r39 tests.test_stoneage_tw10_savedata_native_io_r38 tests.test_stoneage_tw10_savedata_native_io_r37 tests.test_stoneage_tw10_savedata_native_io_r36 tests.test_stoneage_tw10_savedata_native_io_r35 tests.test_stoneage_tw10_savedata_native_io_r34 tests.test_stoneage_tw10_savedata_native_io_r33 tests.test_stoneage_tw10_savedata_native_io_r32 tests.test_stoneage_tw10_savedata_argtrace_r7 tests.test_stoneage_tw10_savedata_argtrace_r7_guard
          python -m tools.stoneage_tw10_savedata_native_io_r48_guard --report /tmp/r48-independent/stoneage-r48-derived.json
      - name: Review original bounded report and canonical exact equality when admitted
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from tools.stoneage_tw10_savedata_native_io_r48_guard import validate
          source=Path('/tmp/r48-independent/stoneage-r48-derived.json').read_bytes()
          assert len(source)==78594
          assert hashlib.sha256(source).hexdigest()=='c6c92887ec57b8c9b6b16e73fdb1434fa7f0dc70b72e5891e2ff392909a4424e'
          report=json.loads(source)
          validate(report)
          p=Path('research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R48-ORIGINAL.json')
          assert p.exists(), 'R48 canonical derivative missing'
          if p.exists():
              assert json.loads(p.read_text()) == report, 'original R48 canonical JSON differs'
              print('TW10_R48_EXACT_DERIVED_JSON_EQUALITY=PASS')
          else:
              print('TW10_R48_INDEPENDENT_REVIEW_ONLY=PASS')
          print('TW10_R48_ORIGINAL_DERIVED_JSON_BEGIN')
          print(json.dumps({'native_count':report['native_count_return_context']['conditional_count_relation'],'memory_boundary':report['native_count_return_context']['return_memory_boundary_audit'],'wrapper_loop':report['wrapper_loop_division_context']['conditional_consumer_relation'],'divisions':report['wrapper_loop_division_context']['division_shapes']},sort_keys=True))
          print('TW10_R48_ORIGINAL_DERIVED_JSON_END')
          PY
      - name: Purge independent temporary derivative
        if: always()
        run: rm -rf /tmp/r48-independent
