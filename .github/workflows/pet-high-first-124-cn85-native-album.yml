name: PET124 CN85 native album and portrait bindings
on:
  push:
    branches: ['agent/pet-high-first-124-cn85-native-album-20261126']
    paths:
      - 'tools/stoneage_pet_high_first_124_cn85_native_album.py'
      - '.github/workflows/pet-high-first-124-cn85-native-album.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y unshield binutils
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15120807113/zip > "$RUNNER_TEMP/pet122.zip"
          python -m tools.stoneage_pet_high_first_124_cn85_native_album --artifact "$RUNNER_TEMP/pet122.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pet124-cn85-native-album-derived-evidence
          path: research/pets/PET-HIGH-FIRST-124-CN85-NATIVE-ALBUM-R1.json
          if-no-files-found: error
          retention-days: 15
      - name: Retain derived metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/pets/PET-HIGH-FIRST-124-CN85-NATIVE-ALBUM-R1.json
          git commit -m 'PET124: retain native album and original portrait candidate evidence'
          git push origin HEAD:agent/pet-high-first-124-cn85-native-album-20261126
