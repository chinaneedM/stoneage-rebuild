name: Verify StoneAge INTEGRATION66 original four-island pet source
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION66-FOUR-ISLAND-TOUR-15-PET-TW1-ORIGINAL-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_66.py'
      - '.github/workflows/verify-stoneage-integration66-source.yml'
      - 'research/recovered/STONEAGE-QUEST25-FOUR-ISLAND-TOUR-ROUTES-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PET-MODULE-07-TW10-BATCH-PUBLIC-R1.json'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION66-FOUR-ISLAND-TOUR-15-PET-TW1-ORIGINAL-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_66.py'
      - '.github/workflows/verify-stoneage-integration66-source.yml'
      - 'research/recovered/STONEAGE-QUEST25-FOUR-ISLAND-TOUR-ROUTES-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PET-MODULE-07-TW10-BATCH-PUBLIC-R1.json'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_66.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_quest25_island_tour_source.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_pet_module_07_source_pixels.py' -v
