name: Probe StoneAge NetPower IA uploader neighborhood

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_ia_netpower_uploader_probe.py
      - tests/test_stoneage_ia_netpower_uploader_probe.py
      - .github/workflows/probe-stoneage-ia-netpower-uploader.yml

permissions:
  contents: write

concurrency:
  group: stoneage-ia-netpower-uploader
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_ia_netpower_uploader_probe -v
      - name: Probe IA uploader neighborhoods for NetPower target issues
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_ia_netpower_uploader_probe \
            > research/recovered/STONEAGE-NETPOWER-IA-UPLOADER-NEIGHBORHOOD-R2.txt
      - name: Commit derived IA metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-NETPOWER-IA-UPLOADER-NEIGHBORHOOD-R2.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe precise NetPower missing issues'
          git pull --rebase origin main
          git push
