name: PET126G original Japan PC operator/fan album evidence separation
on:
  push:
    paths:
      - '.github/workflows/validate-stoneage-pet126g-jp-album-crosswalk.yml'
      - 'docs/continuity/STONEAGE-PET126G-JAPAN-2003-2010-OPERATOR-FAN-ALBUM-20261121.md'
      - 'research/recovered/STONEAGE-PET126G-JP-OPERATOR-PLAYER-ALBUM-2003-2010-CROSSWALK-R1.json'
      - 'tests/test_stoneage_pet126g_jp_album_crosswalk.py'
  pull_request:
    paths:
      - '.github/workflows/validate-stoneage-pet126g-jp-album-crosswalk.yml'
      - 'docs/continuity/STONEAGE-PET126G-JAPAN-2003-2010-OPERATOR-FAN-ALBUM-20261121.md'
      - 'research/recovered/STONEAGE-PET126G-JP-OPERATOR-PLAYER-ALBUM-2003-2010-CROSSWALK-R1.json'
      - 'tests/test_stoneage_pet126g_jp_album_crosswalk.py'
jobs:
  source-separation-and-ordinal-differences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Japanese official web names versus saved later fan text
        run: |
          python -m unittest discover -s tests -p 'test_stoneage_pet126g_jp_album_crosswalk.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet126f_source_custody_residual.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pc_only_scope_20261119.py' -v
