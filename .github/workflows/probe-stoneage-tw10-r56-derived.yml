          python -m tools.stoneage_tw10_savedata_writer_r54_audit --report /tmp/r54-immutable/stoneage-r54-derived.json
      - name: Regenerate conditional R55 specification with independent invented models
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_native_io_r55 --r54 /tmp/r54-immutable/stoneage-r54-derived.json --r51 /tmp/r53-origin/stoneage-r51-derived.json --r52 /tmp/r53-prior/stoneage-r52-derived.json --r53 /tmp/r53-immutable/stoneage-r53-spec.json > /tmp/stoneage-r55-spec.json
