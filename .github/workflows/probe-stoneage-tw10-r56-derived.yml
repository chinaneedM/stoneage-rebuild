          echo '15f54e5de8d1d20128fb7d948b54f13a0e3f6cf372eca203cbc7bb8adc473052  research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R51-ORIGINAL.json' | sha256sum -c -
          cmp /tmp/r54-immutable/stoneage-r54-derived.json research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R54-ORIGINAL.json
      - name: Authenticate successful immutable R55 source and derived specification
