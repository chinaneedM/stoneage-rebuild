          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38724589059" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|660a051f9b58ef596fb2fdf8f27bfc9fd321a7a0|agent/tw10-savedata-r54-writer-prefix-20261015'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11967805220" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38724589059|tw10-r54-original-writer-prefix-derived|sha256:a857094d202033ea378406fc3c5dae5580c984416181a80f497a6540466ffa5c|false'
          mkdir -p /tmp/r54-immutable
