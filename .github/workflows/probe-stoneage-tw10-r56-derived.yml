name: Probe TW1.0 R56 conditional helper frame and application write request
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r56-application-frame-20261015]
    paths:
      - .github/workflows/probe-stoneage-tw10-r56-derived.yml
      - tools/stoneage_tw10_savedata_frame_r56_model.py
      - tools/stoneage_tw10_savedata_native_io_r56.py
      - tests/test_stoneage_tw10_savedata_native_io_r56.py
      - research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R56-SPEC.json
permissions:
