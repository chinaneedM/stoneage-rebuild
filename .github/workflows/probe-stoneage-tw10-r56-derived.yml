          test "$identity" = 'completed|success|3b65aaff0d41e8d209c7212eabc1146d97631b96|agent/tw10-savedata-r53-conditional-transform-20261015'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11966653083" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38723269655|tw10-r53-conditional-transform-spec|sha256:1b6355be01eba8ba96af8c178ee32001770cf9607675482a3e2cc8f18cafd957|false'
