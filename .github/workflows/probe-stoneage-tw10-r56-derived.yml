  actions: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate immutable R51 original-derived custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38719176573" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|ee32f6d16f3dbfeabbb9d73020b64f83f47924dd|agent/tw10-savedata-r51-processor-stack-consumers-20261015'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11963713395" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38719176573|tw10-r51-original-processor-stack-consumers-derived|sha256:3e02a0c79114b8a3e2817a63ef4c6d280944435f4ad1106a213781484c2b4a8b|false'
          mkdir -p /tmp/r53-origin
          gh run download 38719176573 --repo "$GITHUB_REPOSITORY" --name tw10-r51-original-processor-stack-consumers-derived --dir /tmp/r53-origin
          test "$(find /tmp/r53-origin -type f | wc -l)" -eq 1
          test ! -L /tmp/r53-origin/stoneage-r51-derived.json
          test "$(stat -c %s /tmp/r53-origin/stoneage-r51-derived.json)" -eq 284533
          echo '15f54e5de8d1d20128fb7d948b54f13a0e3f6cf372eca203cbc7bb8adc473052  /tmp/r53-origin/stoneage-r51-derived.json' | sha256sum -c -
          cmp /tmp/r53-origin/stoneage-r51-derived.json research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R51-ORIGINAL.json
      - name: Authenticate and retrieve immutable R52 architectural metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38721170772" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|5bdf801831f2a8198ce49c5f91c04d583f03a5ec|agent/tw10-savedata-r52-cdq-sources-20261015'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11964589288" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38721170772|tw10-r52-metadata-cdq-source-derived|sha256:0c4346b23854cde9452a0f803bfcb5f5d36335563df0276101c08e8422d35d54|false'
          mkdir -p /tmp/r53-prior
