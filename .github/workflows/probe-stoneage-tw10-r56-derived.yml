      - name: Derive conditional helper/caller/write-request specification
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_native_io_r56 --r54 /tmp/r54-immutable/stoneage-r54-derived.json --r55 /tmp/r55-immutable/stoneage-r55-spec.json > /tmp/stoneage-r56-spec.json
