name: PET-HIGH-FIRST-57 preserve and integrate identical derived coverage
on:
  push:
    branches: [agent/pet-high-first-57-residual-visual-20261124]
    paths:
      - 'tools/stoneage_pet_high_first_57_custody.py'
      - '.github/workflows/pet-high-first-57-custody.yml'
permissions:
  actions: read
  contents: write
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact derived artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 14959872699 14961031196; do
            curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip" -o "/tmp/pet57-$id.zip"
          done
      - run: python -m tools.stoneage_pet_high_first_57_custody
      - run: python tools/stoneage_pet_source_lookup.py --verify
      - run: python tools/stoneage_pet_gap_queue.py --verify
      - name: Preserve derived report and manifest on candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/agent/pet-high-first-57-residual-visual-20261124'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/pets/PET-HIGH-FIRST-57-RESIDUAL-VISUAL-COVERAGE-R1.json research/pets/PET-HIGH-FIRST-57-COVERAGE-CUSTODY-R1.json research/pets/PET-HIGH-FIRST-32-UNIFIED-SOURCE-LOOKUP-MANIFEST-R1.json tools/stoneage_pet_source_lookup.py
          git diff --cached --stat
          git commit -m 'PET57: preserve verified coverage and link fixed source manifest'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/agent/pet-high-first-57-residual-visual-20261124"
