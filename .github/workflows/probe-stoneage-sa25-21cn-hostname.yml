name: Probe StoneAge 2.5 21CN hostname mirror

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_21cn_hostname_probe.py
      - tests/test_stoneage_sa25_21cn_hostname_probe.py
      - .github/workflows/probe-stoneage-sa25-21cn-hostname.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-21cn-hostname
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate 21CN hostname probe
        run: python3 -m unittest tests.test_stoneage_sa25_21cn_hostname_probe -v
      - name: Probe 21CN archive hostname variants
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_21cn_hostname_probe \
            > research/recovered/STONEAGE-SA25-21CN-HOSTNAME-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-21CN-HOSTNAME-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe 21CN sa25up hostname mirror'
          git push
