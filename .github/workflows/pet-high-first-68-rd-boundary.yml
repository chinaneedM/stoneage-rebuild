name: PET-HIGH-FIRST-68 RD boundary
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_68_rd_boundary.py'
      - '.github/workflows/pet-high-first-68-rd-boundary.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-68-RD-BOUNDARY-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-68-*'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_68_rd_boundary.py'
      - '.github/workflows/pet-high-first-68-rd-boundary.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-68-RD-BOUNDARY-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-68-*'
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/pet-high-first-68-rd-boundary-20261125' && startsWith(github.event.head_commit.message, 'PET-HIGH-FIRST-68:')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install Pillow
          python -m tools.stoneage_pet_high_first_68_rd_boundary --plan-only
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq msitools
      - run: python -m tools.stoneage_wayi85_sixpart_acquisition --work "$RUNNER_TEMP/tw85" --output "$RUNNER_TEMP/tw85-acquisition.json"
      - run: |
          python -m tools.stoneage_pet_high_first_68_rd_boundary --source-dir "$RUNNER_TEMP/tw85/msi-client/Program Files/WAYI/石器時代 魔域大冒險/data" --acquisition "$RUNNER_TEMP/tw85-acquisition.json"
          python -m tools.stoneage_pet_high_first_68_rd_boundary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pet68-derived-evidence
          path: |
            ${{ runner.temp }}/tw85-acquisition.json
            research/pets/PET-HIGH-FIRST-68-RD-BOUNDARY-R1.json
            research/pets/PET-HIGH-FIRST-68-RD-BOUNDARY-SUMMARY-R1.json
          if-no-files-found: warn
          retention-days: 7
      - run: |
          git add 'research/pets/PET-HIGH-FIRST-68-RD-BOUNDARY-R1.json' 'research/pets/PET-HIGH-FIRST-68-RD-BOUNDARY-SUMMARY-R1.json'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'PET68: archive actual RD boundary receipts'
          git push origin "HEAD:$GITHUB_REF"
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'PET-HIGH-FIRST-68:')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m tools.stoneage_pet_high_first_68_rd_boundary
