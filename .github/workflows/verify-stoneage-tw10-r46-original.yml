name: Independently verify TW1.0 R46 original conditional read adjustment bundle and helper ESP slots
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r46-adjustment-helper-slots-20261014, main]
    paths:
      - .github/workflows/verify-stoneage-tw10-r46-original.yml
      - tools/stoneage_tw10_savedata_native_io_r46_guard.py
      - docs/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R46.md
      - research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R46-ORIGINAL.json
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate independent immutable original run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38585030446" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|9f33f148cf7f4f994b435625744e5085c3d975a0|agent/tw10-savedata-r46-adjustment-helper-slots-20261014'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11905875057" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38585030446|tw10-r46-original-adjustment-helper-slots-derived|sha256:8e815487bdc4715ffb241401a7ddbcf8cdd3ea11fe319ae4c27f349b8e15bcde|false'
      - name: Download bounded R46 original-derived metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r46-independent
          gh run download 38585030446 --repo "$GITHUB_REPOSITORY" --name tw10-r46-original-adjustment-helper-slots-derived --dir /tmp/r46-independent
          test "$(find /tmp/r46-independent -type f | wc -l)" -eq 1
          test -f /tmp/r46-independent/stoneage-r46-derived.json
          test ! -L /tmp/r46-independent/stoneage-r46-derived.json
          test "$(stat -c %s /tmp/r46-independent/stoneage-r46-derived.json)" -le 300000
          sha256sum /tmp/r46-independent/stoneage-r46-derived.json
          wc -c /tmp/r46-independent/stoneage-r46-derived.json
      - name: Replay strict R46 through R32 tamper and negative controls
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r46 tests.test_stoneage_tw10_savedata_native_io_r45 tests.test_stoneage_tw10_savedata_native_io_r44 tests.test_stoneage_tw10_savedata_native_io_r43 tests.test_stoneage_tw10_savedata_native_io_r42 tests.test_stoneage_tw10_savedata_native_io_r41 tests.test_stoneage_tw10_savedata_native_io_r40 tests.test_stoneage_tw10_savedata_native_io_r39 tests.test_stoneage_tw10_savedata_native_io_r38 tests.test_stoneage_tw10_savedata_native_io_r37 tests.test_stoneage_tw10_savedata_native_io_r36 tests.test_stoneage_tw10_savedata_native_io_r35 tests.test_stoneage_tw10_savedata_native_io_r34 tests.test_stoneage_tw10_savedata_native_io_r33 tests.test_stoneage_tw10_savedata_native_io_r32 tests.test_stoneage_tw10_savedata_argtrace_r7 tests.test_stoneage_tw10_savedata_argtrace_r7_guard
          python -m tools.stoneage_tw10_savedata_native_io_r46_guard --report /tmp/r46-independent/stoneage-r46-derived.json
      - name: Review original bounded report and canonical exact equality when admitted
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from tools.stoneage_tw10_savedata_native_io_r46_guard import validate
          source=Path('/tmp/r46-independent/stoneage-r46-derived.json').read_bytes()
          assert len(source)==70648
          assert hashlib.sha256(source).hexdigest()=='9aff27e1dadb33b1df5642e114488b238e83efcb97015a806c9e6527658c560e'
          report=json.loads(source)
          validate(report)
          p=Path('research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R46-ORIGINAL.json')
          assert p.exists(), 'R46 canonical derivative missing'
          if p.exists():
              assert json.loads(p.read_text()) == report, 'original R46 canonical JSON differs'
              print('TW10_R46_EXACT_DERIVED_JSON_EQUALITY=PASS')
          else:
              print('TW10_R46_INDEPENDENT_REVIEW_ONLY=PASS')
          print('TW10_R46_ORIGINAL_DERIVED_JSON_BEGIN')
          print(json.dumps({'read_relation':report['read_adjustment_context']['conditional_adjustment_relation'],'first_api_paths':report['read_adjustment_context']['root_first_api_paths'],'helper_slots':report['write_helper_context']['conditional_caller_slot_bridges']},sort_keys=True))
          print('TW10_R46_ORIGINAL_DERIVED_JSON_END')
          PY
      - name: Purge independent temporary derivative
        if: always()
        run: rm -rf /tmp/r46-independent
