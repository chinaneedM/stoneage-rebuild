name: Verify SCENE22 original NPC content metadata and synthetic text reader
on:
  push:
    branches: [main, agent/scene22-npc-original-argument-20261029]
    paths:
      - tools/stoneage_scene22_*
      - tests/test_stoneage_scene22_*
      - research/recovered/STONEAGE-SCENE22-*.json
      - .github/workflows/verify-stoneage-scene22-npc.yml
  pull_request:
    paths:
      - tools/stoneage_scene22_*
      - tests/test_stoneage_scene22_*
      - research/recovered/STONEAGE-SCENE22-*.json
      - .github/workflows/verify-stoneage-scene22-npc.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-and-synthetic-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install pillow==11.3.0
      - run: python -m tools.stoneage_scene22_npc_argument
      - run: python -m unittest -v tests.test_stoneage_scene22_npc_argument tests.test_stoneage_scene17_derived_acceptance tests.test_stoneage_presentation_npc_model
      - run: npm install --prefix /tmp/scene22-browser playwright@1.55.1
      - name: Synthetic text and pixels only; original source is locally verified
        run: |
          python -m tools.stoneage_scene21_fixture --output /tmp/scene22-fixture.html
          python -m tools.stoneage_scene22_fixture /tmp/scene22-fixture.html
          CHROME_PATH="$(command -v google-chrome)" PLAYWRIGHT_MODULE=/tmp/scene22-browser/node_modules/playwright node tools/stoneage_scene22_browser.cjs /tmp/scene22-fixture.html /tmp/scene22-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene22-synthetic-reader-only
          path: /tmp/scene22-browser.json
          if-no-files-found: warn
          retention-days: 7
