name: Independently verify TW1.0 R26 original CALL-root conditional partial/affine evidence
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r26-call-root-inputs-20261013]
    paths:
      - .github/workflows/verify-stoneage-tw10-r26-original.yml
      - tools/stoneage_tw10_savedata_upstream_r26_guard.py
      - research/recovered/STONEAGE-TW10-SAVEDATA-UPSTREAM-R26-ORIGINAL.json
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable R26 original source and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38394940020" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|e16213cb60a1a560fa31a9d15fad39626e9052e6|agent/tw10-savedata-r26-call-root-inputs-20261013'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11811375871" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38394940020|tw10-r26-original-call-root-inputs-derived|sha256:6f3c6e8919ec3d7ee2922db1c59bbbf7f6fade1554c6aeef1e9023b26bd69e14|false'
      - name: Retrieve only bounded derived metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r26-independent
          gh run download 38394940020 --repo "$GITHUB_REPOSITORY" --name tw10-r26-original-call-root-inputs-derived --dir /tmp/r26-independent
          test "$(find /tmp/r26-independent -type f | wc -l)" -eq 1
          test -f /tmp/r26-independent/stoneage-r26-derived.json
          test ! -L /tmp/r26-independent/stoneage-r26-derived.json
          test "$(stat -c %s /tmp/r26-independent/stoneage-r26-derived.json)" -le 70000
          sha256sum /tmp/r26-independent/stoneage-r26-derived.json
          wc -c /tmp/r26-independent/stoneage-r26-derived.json
      - name: Strict semantic constraints and independent tamper tests
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_upstream_r26
          python -m tools.stoneage_tw10_savedata_upstream_r26_guard --report /tmp/r26-independent/stoneage-r26-derived.json
      - name: Compare accepted witness and disclose canonical bounded JSON
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.stoneage_tw10_savedata_upstream_r26_guard import validate
          d=json.loads(Path('/tmp/r26-independent/stoneage-r26-derived.json').read_text())
          validate(d)
          canonical=Path('research/recovered/STONEAGE-TW10-SAVEDATA-UPSTREAM-R26-ORIGINAL.json')
          if canonical.exists():
              assert json.loads(canonical.read_text())==d, 'R26 exact original-derived JSON differs from committed witness'
              print('TW10_R26_EXACT_DERIVED_JSON_EQUALITY=PASS')
          else:
              print('TW10_R26_REVIEW_ONLY_NOT_YET_COMMITTED=PASS')
          print('TW10_R26_DERIVED_JSON_BEGIN')
          print(json.dumps(d,sort_keys=True,separators=(',',':')))
          print('TW10_R26_DERIVED_JSON_END')
          PY
      - name: Always remove temporary derived metadata
        if: always()
        run: rm -rf /tmp/r26-independent
