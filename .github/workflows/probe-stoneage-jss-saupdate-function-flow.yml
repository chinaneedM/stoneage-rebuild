name: Probe archived JSS SaUpdate function flow
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_jss_saupdate_function_flow_probe.py
      - tests/test_stoneage_jss_saupdate_function_flow_probe.py
      - .github/workflows/probe-stoneage-jss-saupdate-function-flow.yml

permissions:
  contents: write

concurrency:
  group: stoneage-jss-saupdate-function-flow
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependency
        run: pip install --quiet capstone
      - name: Validate JSS SaUpdate function-flow probe
        run: python3 -m unittest tests.test_stoneage_jss_saupdate_function_flow_probe -v
      - name: Derive function-bounded updater flow
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_jss_saupdate_function_flow_probe \
            > research/recovered/STONEAGE-JSS-SAUPDATE-FUNCTION-FLOW-R1.txt
      - name: Verify no executable payload was retained
        run: |
          set -euo pipefail
          ! find research tools tests -type f -iname '*.exe' -print -quit | grep -q .
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-JSS-SAUPDATE-FUNCTION-FLOW-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: derive JSS SaUpdate function flow'
          git pull --rebase origin main
          git push
