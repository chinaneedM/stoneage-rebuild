name: Verify StoneAge INTEGRATION95 147 original dungeon00 source warps
on:
  push:
    branches: [main, 'agent/stoneage-integration95-*']
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION95-DUNGEON00-147-ORIGINAL-WARP-AND-PRIOR-DAT-R1.json'
      - 'tests/test_stoneage_integration95_dungeon00_source_graph.py'
      - '.github/workflows/verify-stoneage-integration95-dungeon00-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION95-DUNGEON00-147-ORIGINAL-WARP-AND-PRIOR-DAT-R1.json'
      - 'tests/test_stoneage_integration95_dungeon00_source_graph.py'
      - '.github/workflows/verify-stoneage-integration95-dungeon00-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 147 original source rows, 140 exact reverse candidates, 64-floor graph and prior DAT boundary
        run: python -m unittest discover -s tests -p 'test_stoneage_integration95_dungeon00_source_graph.py' -v
