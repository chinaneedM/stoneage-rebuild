name: Probe recovered StoneAge 2.5 DAT cache
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-stoneage-25-dat.yml
      - tools/stoneage_dat_probe.py
      - tests/test_stoneage_dat_probe.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test DAT probe
        run: python3 -m unittest tests.test_stoneage_dat_probe -v
      - name: Install extractor
        run: sudo apt-get update && sudo apt-get install -y unar
      - name: Recover verified preservation bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib,html,json,re,http.cookiejar,urllib.parse,urllib.request
          from pathlib import Path
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124 Safari/537.36'
          hashes={'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5','ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb'}
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def get(key,suffix):
              data=urllib.parse.urlencode({'quick_key':key,'response_format':'json'}).encode()
              req=urllib.request.Request('https://www.mediafire.com/api/1.5/file/get_info.php',data=data,headers={'User-Agent':ua})
              with op.open(req,timeout=60) as r: info=json.load(r)['response']['file_info']
              if str(info.get('hash','')).lower()!=hashes[key]: raise SystemExit('metadata hash changed')
              req=urllib.request.Request(info['links']['normal_download'],headers={'User-Agent':ua})
              with op.open(req,timeout=60) as r: page=r.read().decode('utf-8','replace'); referer=r.geturl()
              m=re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S) or re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
              if not m: raise SystemExit('direct link unavailable')
              dest=Path('/tmp/sa25')/('part.'+suffix); h=hashlib.sha256()
              req=urllib.request.Request(html.unescape(m.group(1)),headers={'User-Agent':ua,'Referer':referer})
              with op.open(req,timeout=300) as r,dest.open('wb') as out:
                  while True:
                      chunk=r.read(1024*1024)
                      if not chunk: break
                      out.write(chunk); h.update(chunk)
              if h.hexdigest()!=hashes[key]: raise SystemExit('download hash mismatch')
          get('ev7l29fw77891go','001'); get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 >/tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar | awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out
          ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/tmp/sa25/unar.log 2>&1
      - name: Analyze recovered DAT cache
        run: |
          set -euo pipefail
          MAPDIR="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
          ADRN="$(find /tmp/sa25/out -type f -path '*/SA2.5主程式/stoneage2.5/data/adrn_15.bin' -print -quit)"
          test -n "$MAPDIR" && test -n "$ADRN"
          mkdir -p research/recovered
          {
            echo 'SOURCE_BUNDLE_SHA256|d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5'
            echo 'SOURCE_LAYOUT|uint32 width,uint32 height,uint16 tile[],uint16 parts[],uint16 event[]'
            echo
            python3 tools/stoneage_dat_probe.py --dat-dir "$MAPDIR" --adrn "$ADRN"
          } > research/recovered/STONEAGE-25-DAT-PROBE-R1.txt
          git status --short --untracked-files=all
          test "$(git status --short --untracked-files=all | wc -l)" -eq 1
      - name: Commit derived report only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-25-DAT-PROBE-R1.txt
          git commit -m 'research: validate StoneAge 2.5 DAT map semantics'
          git push
