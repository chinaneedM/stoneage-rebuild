name: Validate StoneAge Riderman core
concurrency:
  group: stoneage-riderman-core
  cancel-in-progress: true
on:
  push:
    paths:
      - .github/workflows/validate-stoneage-riderman-core.yml
      - tools/stoneage_riderman_core_model.py
      - tests/test_stoneage_riderman_core_model.py
      - research/mechanics/STONEAGE-RIDERMAN-CORE-R1.md
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_riderman_core_model -v
