name: Probe StoneAge BattleModel source reference

concurrency:
  group: stoneage-battlemodel-source-reference-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-stoneage-battlemodel-source-reference.yml"
      - "tools/stoneage_battlemodel_source_audit.py"
      - "tools/stoneage_battlemodel_reference_model.py"
      - "tests/test_stoneage_battlemodel_reference_model.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bounded BattleModel reference primitives
        run: |
          python -m unittest -v tests.test_stoneage_battlemodel_reference_model
      - name: Recover pinned fixed descendant source profiles
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          profiles={
            "gavin":(
              "gavinlinasd/StoneAge",
              "1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56",
            ),
            "iris":(
              "iriselia/StoneAge",
              "9e6c8ce2cd8ed532a7157773acd1c61582c178b5",
            ),
            "bismarck":(
              "BismarckDD/stoneage",
              "999ffdf1d220ec6666eb65339180689c9caf1876",
            ),
          }
          for name,(repo,sha) in profiles.items():
            root=Path("/tmp/battlemodel-source")/name
            root.mkdir(parents=True)
            subprocess.run(["git","init",str(root)],check=True)
            subprocess.run([
              "git","-C",str(root),"remote","add","origin",
              "https://github.com/"+repo+".git",
            ],check=True)
            subprocess.run([
              "git","-C",str(root),"fetch","--depth","1","origin",sha,
            ],check=True)
            subprocess.run([
              "git","-C",str(root),"checkout","--detach","FETCH_HEAD",
            ],check=True)
          PY
      - name: Reproduce bounded BattleModel source semantics
        run: |
          mkdir -p research/recovered
          python -m tools.stoneage_battlemodel_source_audit \
            --gavin-dir /tmp/battlemodel-source/gavin \
            --iris-dir /tmp/battlemodel-source/iris \
            --bismarck-dir /tmp/battlemodel-source/bismarck \
            > research/recovered/STONEAGE-BATTLEMODEL-SOURCE-AUDIT-R1.txt
          cat research/recovered/STONEAGE-BATTLEMODEL-SOURCE-AUDIT-R1.txt
          grep -F 'RESOLUTION|BATTLEMODEL_FIXED_SOURCE_CLOSED_BOUNDED_REFERENCE' \
            research/recovered/STONEAGE-BATTLEMODEL-SOURCE-AUDIT-R1.txt
          test "$(grep -c '^PROFILE|' research/recovered/STONEAGE-BATTLEMODEL-SOURCE-AUDIT-R1.txt)" = 3
          test "$(grep -c 'native_plan_cases=200' research/recovered/STONEAGE-BATTLEMODEL-SOURCE-AUDIT-R1.txt)" = 3
      - name: Commit derived source report
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-BATTLEMODEL-SOURCE-AUDIT-R1.txt
          if git diff --cached --quiet; then
            echo 'BattleModel source report unchanged.'
            exit 0
          fi
          git commit -m 'research: audit pinned BattleModel source semantics'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
