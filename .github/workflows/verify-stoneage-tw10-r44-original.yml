name: Independently verify TW1.0 R44 original native frame slots and mutable wrapper sources
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r44-native-slots-mutable-20261014, main]
    paths:
      - .github/workflows/verify-stoneage-tw10-r44-original.yml
      - tools/stoneage_tw10_savedata_native_io_r44_guard.py
      - docs/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R44.md
      - research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R44-ORIGINAL.json
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate independent immutable original run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38579065734" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|8e6df983241cba248ed14e85fd03beb6f4b43171|agent/tw10-savedata-r44-native-slots-mutable-20261014'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11900549300" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38579065734|tw10-r44-original-native-slots-mutable-derived|sha256:98d01e4a6d28c58dd241241fc9851aa3ddee0fe4e0d14d835714704e086afd14|false'
      - name: Download bounded R44 original-derived metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r44-independent
          gh run download 38579065734 --repo "$GITHUB_REPOSITORY" --name tw10-r44-original-native-slots-mutable-derived --dir /tmp/r44-independent
          test "$(find /tmp/r44-independent -type f | wc -l)" -eq 1
          test -f /tmp/r44-independent/stoneage-r44-derived.json
          test ! -L /tmp/r44-independent/stoneage-r44-derived.json
          test "$(stat -c %s /tmp/r44-independent/stoneage-r44-derived.json)" -le 300000
          sha256sum /tmp/r44-independent/stoneage-r44-derived.json
          wc -c /tmp/r44-independent/stoneage-r44-derived.json
      - name: Replay strict R44 through R32 tamper and negative controls
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r44 tests.test_stoneage_tw10_savedata_native_io_r43 tests.test_stoneage_tw10_savedata_native_io_r42 tests.test_stoneage_tw10_savedata_native_io_r41 tests.test_stoneage_tw10_savedata_native_io_r40 tests.test_stoneage_tw10_savedata_native_io_r39 tests.test_stoneage_tw10_savedata_native_io_r38 tests.test_stoneage_tw10_savedata_native_io_r37 tests.test_stoneage_tw10_savedata_native_io_r36 tests.test_stoneage_tw10_savedata_native_io_r35 tests.test_stoneage_tw10_savedata_native_io_r34 tests.test_stoneage_tw10_savedata_native_io_r33 tests.test_stoneage_tw10_savedata_native_io_r32 tests.test_stoneage_tw10_savedata_argtrace_r7 tests.test_stoneage_tw10_savedata_argtrace_r7_guard
          python -m tools.stoneage_tw10_savedata_native_io_r44_guard --report /tmp/r44-independent/stoneage-r44-derived.json
      - name: Review original bounded report and canonical exact equality when admitted
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from tools.stoneage_tw10_savedata_native_io_r44_guard import validate
          source=Path('/tmp/r44-independent/stoneage-r44-derived.json').read_bytes()
          assert len(source)==225095
          assert hashlib.sha256(source).hexdigest()=='52c158d5f28f3ea287432e4b8214d306c491f158820808d7c4dd212c0646f5e8'
          report=json.loads(source)
          validate(report)
          p=Path('research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-IO-R44-ORIGINAL.json')
          assert p.exists(), 'R44 canonical derivative missing'
          if p.exists():
              assert json.loads(p.read_text()) == report, 'original R44 canonical JSON differs'
              print('TW10_R44_EXACT_DERIVED_JSON_EQUALITY=PASS')
          else:
              print('TW10_R44_INDEPENDENT_REVIEW_ONLY=PASS')
          print('TW10_R44_ORIGINAL_DERIVED_JSON_BEGIN')
          print(json.dumps(report,sort_keys=True,separators=(',',':')))
          print('TW10_R44_ORIGINAL_DERIVED_JSON_END')
          PY
      - name: Purge independent temporary derivative
        if: always()
        run: rm -rf /tmp/r44-independent
