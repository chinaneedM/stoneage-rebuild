name: Verify 2003 7.0 portal career dependency source boundaries
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN2003-PROFESSION-DEPENDENCIES-SOURCE-R1.json'
      - 'tests/test_stoneage_cn2003_profession_dependencies_source.py'
      - 'research/recovered/STONEAGE-CN2003-PROFESSION-DEPENDENCIES-ACCEPTANCE-R1.json'
      - '.github/workflows/verify-stoneage-cn2003-profession-dependencies.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN2003-PROFESSION-DEPENDENCIES-SOURCE-R1.json'
      - 'tests/test_stoneage_cn2003_profession_dependencies_source.py'
      - 'research/recovered/STONEAGE-CN2003-PROFESSION-DEPENDENCIES-ACCEPTANCE-R1.json'
      - '.github/workflows/verify-stoneage-cn2003-profession-dependencies.yml'
jobs:
  derived-claims-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source boundaries and nine cited prerequisite examples
        run: python -m unittest discover -s tests -p 'test_stoneage_cn2003_profession_dependencies_source.py' -v
