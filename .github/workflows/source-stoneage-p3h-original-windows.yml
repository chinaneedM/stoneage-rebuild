name: Observe authenticated original TW1 Windows login P3H with private runtime retention
on:
  push:
    branches: [agent/original-windows-p3h-20261028]
    paths:
      - tools/stoneage_p3h_native.py
      - tools/stoneage_p3h_windows_original.py
      - research/recovered/STONEAGE-P3H-TRANSFER-CERT.pem
      - .github/workflows/source-stoneage-p3h-original-windows.yml
permissions:
  contents: read
jobs:
  finite-native-original:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build only own preflight programs with no embedded manifest
        shell: cmd
        run: |
          cl /nologo /std:c11 /O2 /Fe:"%RUNNER_TEMP%\p3h-checker.exe" tools\stoneage_p3e_environment.c user32.lib gdi32.lib ddraw.lib dxguid.lib ws2_32.lib /link /SUBSYSTEM:CONSOLE /MANIFEST:NO
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /O2 /Fe:"%RUNNER_TEMP%\p3h-control.exe" tools\stoneage_p3d_control.c user32.lib gdi32.lib ddraw.lib dxguid.lib /link /SUBSYSTEM:WINDOWS /MANIFEST:NO
          if errorlevel 1 exit /b 1
      - run: python -m pip install --quiet pillow
      - name: Verify unchanged sidecar image, acquire exact originals only after preflight, observe and seal privately
        shell: pwsh
        run: |
          $ssl=(Get-Command openssl.exe -ErrorAction SilentlyContinue).Source
          if(-not $ssl){$ssl='C:/Program Files/Git/usr/bin/openssl.exe'}
          if(-not(Test-Path $ssl)){throw 'Private encryption executable unavailable before original acquisition'}
          python -m tools.stoneage_p3h_windows_original --work "$env:RUNNER_TEMP/p3h-private" --output "$env:RUNNER_TEMP/p3h-encrypted" --checker "$env:RUNNER_TEMP/p3h-checker.exe" --control "$env:RUNNER_TEMP/p3h-control.exe" --certificate research/recovered/STONEAGE-P3H-TRANSFER-CERT.pem --openssl "$ssl"
      - name: Always end original process tree before restoring and remove only task-scoped files
        if: always()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$env:RUNNER_TEMP\p3h-private\run\*" } | ForEach-Object {Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue}
          Remove-NetFirewallRule -Name StoneAgeP3HGuestOutbound -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName StoneAgeP3HGuestRestore -Confirm:$false -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/p3h-private" -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:RUNNER_TEMP/p3h-checker.exe","$env:RUNNER_TEMP/p3h-control.exe",stoneage_p3e_environment.obj,stoneage_p3d_control.obj -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3h-private-runtime-encrypted-and-derived
          path: |
            ${{ runner.temp }}/p3h-encrypted/source-report.json
            ${{ runner.temp }}/p3h-encrypted/private-runtime-and-observation.der
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
