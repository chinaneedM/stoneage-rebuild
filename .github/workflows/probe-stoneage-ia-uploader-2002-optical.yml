name: Census IA uploader 2002 optical items

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_ia_uploader_2002_optical_census.py
      - tests/test_stoneage_ia_uploader_2002_optical_census.py
      - .github/workflows/probe-stoneage-ia-uploader-2002-optical.yml

permissions:
  contents: write

concurrency:
  group: stoneage-ia-uploader-2002-optical
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate census filter
        run: python3 -m unittest tests.test_stoneage_ia_uploader_2002_optical_census -v
      - name: Enumerate 2002-era optical carriers
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_ia_uploader_2002_optical_census             > research/recovered/STONEAGE-IA-UPLOADER-2002-OPTICAL-CENSUS-R1.txt
      - name: Commit derived census only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-IA-UPLOADER-2002-OPTICAL-CENSUS-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: census IA uploader 2002 optical carriers'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
