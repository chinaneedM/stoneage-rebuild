name: PET115 CN85 operator historic archive routes and PET114 custody
on:
  push:
    branches: ['agent/pet-high-first-114-cn85-zol-archive-20261126']
    paths:
      - 'tools/stoneage_pet_high_first_115_cn85_operator_archive.py'
      - '.github/workflows/pet-high-first-115-cn85-operator-archive.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15117371023/zip > "$RUNNER_TEMP/pet114.zip"
          python -m tools.stoneage_pet_high_first_115_cn85_operator_archive --artifact "$RUNNER_TEMP/pet114.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pet115-cn85-operator-archive-metadata
          path: research/pets/PET-HIGH-FIRST-115-CN85-OPERATOR-ARCHIVE-R1.json
          if-no-files-found: error
          retention-days: 15
      - name: Retain derived reports only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/pets/PET-HIGH-FIRST-114-CN85-ZOL-ARCHIVE-R1.json research/pets/PET-HIGH-FIRST-115-CN85-OPERATOR-ARCHIVE-R1.json
          git commit -m 'PET114–115: preserve independent ZOL and operator archive metadata'
          git push origin HEAD:agent/pet-high-first-114-cn85-zol-archive-20261126
