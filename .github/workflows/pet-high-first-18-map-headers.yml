name: PET-HIGH-FIRST-18 same-commit map headers
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_18_map_headers.py'
      - '.github/workflows/pet-high-first-18-map-headers.yml'
      - 'research/pets/PET-HIGH-FIRST-18-COMPARISON-MAP-HEADERS-R1.json'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_18_map_headers.py'
      - '.github/workflows/pet-high-first-18-map-headers.yml'
      - 'research/pets/PET-HIGH-FIRST-18-COMPARISON-MAP-HEADERS-R1.json'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: source-pc
          persist-credentials: false
          sparse-checkout: |
            gmsv/data/map
      - run: python3 -m tools.stoneage_pet_high_first_18_map_headers source-pc
