name: Verify PET-MODULE-03 same-source skill join
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-PET-MODULE-03-SAME-SOURCE-SKILL-JOIN-R1.json'
      - 'research/recovered/STONEAGE-PET-MODULE-01-BATCH-SOURCE-SPR-INDEX-R1.json'
      - 'tests/test_stoneage_pet_module_03_skill_join.py'
      - '.github/workflows/verify-stoneage-pet-module-03-skill-join.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-skill-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-constrained complete slot conservation and negative boundaries
        run: python -m unittest tests.test_stoneage_pet_module_03_skill_join -v
