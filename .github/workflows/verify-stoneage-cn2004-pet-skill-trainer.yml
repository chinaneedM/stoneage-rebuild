name: Verify CN2004 pet skill trainer derived guide
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN2004-PET-SKILL-TRAINER-SOURCE-R1.json'
      - 'tests/test_stoneage_cn2004_pet_skill_trainer_source.py'
      - '.github/workflows/verify-stoneage-cn2004-pet-skill-trainer.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN2004-PET-SKILL-TRAINER-SOURCE-R1.json'
      - 'tests/test_stoneage_cn2004_pet_skill_trainer_source.py'
      - '.github/workflows/verify-stoneage-cn2004-pet-skill-trainer.yml'
jobs:
  derived-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check web-guide-derived rows and provenance
        run: python -m unittest discover -s tests -p 'test_stoneage_cn2004_pet_skill_trainer_source.py' -v
