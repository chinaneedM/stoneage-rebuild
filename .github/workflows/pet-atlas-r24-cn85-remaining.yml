name: PET atlas R24 CN85 remaining 501 original groups
on:
  push:
    branches: [pet-atlas-r24-cn85-remaining-501-20261127]
    paths:
      - 'tools/stoneage_pet_atlas_r24_cn85_remaining.py'
      - '.github/workflows/pet-atlas-r24-cn85-remaining.yml'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow cryptography==46.0.4
      - run: python -m tools.stoneage_pet_atlas_r24_cn85_remaining --plan-only
  source:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y unshield
      - run: python -m pip install Pillow cryptography==46.0.4
      - run: python -m tools.stoneage_pet_atlas_r24_cn85_remaining --output "$RUNNER_TEMP/r24" --public-key research/pets/PET-ATLAS-20261127-RECOVERY-PUBLIC.pem
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-1
          path: |
            ${{ runner.temp }}/r24/batch-1/private.enc
            ${{ runner.temp }}/r24/batch-1/envelope.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-2
          path: |
            ${{ runner.temp }}/r24/batch-2/private.enc
            ${{ runner.temp }}/r24/batch-2/envelope.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-3
          path: |
            ${{ runner.temp }}/r24/batch-3/private.enc
            ${{ runner.temp }}/r24/batch-3/envelope.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-4
          path: |
            ${{ runner.temp }}/r24/batch-4/private.enc
            ${{ runner.temp }}/r24/batch-4/envelope.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-5
          path: |
            ${{ runner.temp }}/r24/batch-5/private.enc
            ${{ runner.temp }}/r24/batch-5/envelope.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-6
          path: |
            ${{ runner.temp }}/r24/batch-6/private.enc
            ${{ runner.temp }}/r24/batch-6/envelope.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-7
          path: |
            ${{ runner.temp }}/r24/batch-7/private.enc
            ${{ runner.temp }}/r24/batch-7/envelope.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-8
          path: |
            ${{ runner.temp }}/r24/batch-8/private.enc
            ${{ runner.temp }}/r24/batch-8/envelope.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-9
          path: |
            ${{ runner.temp }}/r24/batch-9/private.enc
            ${{ runner.temp }}/r24/batch-9/envelope.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r24-cn85-private-batch-10
          path: |
            ${{ runner.temp }}/r24/batch-10/private.enc
            ${{ runner.temp }}/r24/batch-10/envelope.json
          if-no-files-found: error
          retention-days: 7
      - if: always()
        run: rm -rf "$RUNNER_TEMP/r24"
