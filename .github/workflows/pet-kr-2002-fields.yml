name: PET Korean 2002 factual fields and material inspection
on:
  push:
    branches: ['agent/pet-kr-2002-fields-20261126']
    paths:
      - 'tools/stoneage_pet_kr2002_fields.py'
      - 'research/pets/PET-KR-ARCHIVE-REPLAY-RECEIPT-R1.json'
      - '.github/workflows/pet-kr-2002-fields.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/stoneage_pet_kr2002_fields.py --verify
      - run: python tools/stoneage_pet_kr2002_fields.py > pet-kr2002-fields.json
      - run: cat pet-kr2002-fields.json
      - uses: actions/upload-artifact@v4
        with:
          name: pet-kr2002-derived-fields
          path: pet-kr2002-fields.json
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --verify
      - run: PYTHONPATH=. python tools/stoneage_pet_final_review_matrix.py
      - run: cmp pet-final-review-matrix.json research/pets/PET-FINAL-REVIEW-MATRIX-R1.json
