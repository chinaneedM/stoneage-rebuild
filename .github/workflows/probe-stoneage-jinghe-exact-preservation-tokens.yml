name: Search Jinghe StoneAge exact preservation tokens
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_jinghe_exact_token_preservation_probe.py
      - tests/test_stoneage_jinghe_exact_token_preservation_probe.py
      - .github/workflows/probe-stoneage-jinghe-exact-preservation-tokens.yml
permissions:
  contents: write
concurrency:
  group: stoneage-jinghe-exact-preservation-tokens
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_jinghe_exact_token_preservation_probe -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_jinghe_exact_token_preservation_probe > research/recovered/STONEAGE-JINGHE-EXACT-TOKEN-PRESERVATION-R1.txt
      - run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-JINGHE-EXACT-TOKEN-PRESERVATION-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: search Jinghe StoneAge exact preservation tokens'
          git pull --rebase origin main
          git push
