name: Verify CN2003 Mengde quest order and two reward screens
on:
  push:
    paths:
      - 'tools/stoneage_cn2003_mengde_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_cn2003_mengde_source.py'
      - 'research/recovered/STONEAGE-CN2003-MENGDE-CAVE-*.json'
      - 'research/recovered/STONEAGE-CN20-RECORDPOINT-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-CN2003-FIVE-BROTHERS-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-cn2003-mengde-source.yml'
  pull_request:
    paths:
      - 'tools/stoneage_cn2003_mengde_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_cn2003_mengde_source.py'
      - 'research/recovered/STONEAGE-CN2003-MENGDE-CAVE-*.json'
      - 'research/recovered/STONEAGE-CN20-RECORDPOINT-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-CN2003-FIVE-BROTHERS-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-cn2003-mengde-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Quest order, narrative, coordinate frames, reward and visual counterexamples
        run: python -m unittest tests.test_stoneage_cn2003_mengde_source -v
      - name: Retrieve one dated guide and two actual full-size reward screenshots
        run: python -m tools.stoneage_cn2003_mengde_source --fetch --output "$RUNNER_TEMP/r81-content/replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cn2003-mengde-derived-r81
          path: ${{ runner.temp }}/r81-content/replay.json
          if-no-files-found: error
          retention-days: 30
