name: Validate TW1.0 R20 CALL/global/alias synthetic and strict guard
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r20-call-global-alias-20261012]
    paths:
      - .github/workflows/validate-stoneage-tw10-r20-synthetic.yml
      - tools/stoneage_tw10_savedata_upstream_r20.py
      - tools/stoneage_tw10_savedata_upstream_r20_guard.py
      - tests/test_stoneage_tw10_savedata_upstream_r20.py
      - tests/test_stoneage_tw10_savedata_upstream_r20_guard.py
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet capstone pefile
      - name: R20 and R19 no-promotion regression tests
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_tw10_savedata_upstream_r20 tests.test_stoneage_tw10_savedata_upstream_r20_guard tests.test_stoneage_tw10_savedata_upstream_r19 tests.test_stoneage_tw10_savedata_upstream_r19_guard
          python -m compileall -q tools/stoneage_tw10_savedata_upstream_r20.py tools/stoneage_tw10_savedata_upstream_r20_guard.py
          echo TW10_R20_SYNTHETIC_AND_GUARD=PASS
          echo TW10_R20_ORIGINAL_EVIDENCE=OPEN
