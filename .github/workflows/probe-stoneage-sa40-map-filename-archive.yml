name: Probe StoneAge 4.0 map filename archive
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa40_map_filename_archive_probe.py
      - tests/test_stoneage_sa40_map_filename_archive_probe.py
      - .github/workflows/probe-stoneage-sa40-map-filename-archive.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa40-map-filename-archive
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate bounded filename probe
        run: python3 -m unittest tests.test_stoneage_sa40_map_filename_archive_probe -v

      - name: Probe Sina archive domains by exact source basename
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa40_map_filename_archive_probe \
            > research/recovered/STONEAGE-SA40-MAP-FILENAME-ARCHIVE-R1.txt

      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          report='research/recovered/STONEAGE-SA40-MAP-FILENAME-ARCHIVE-R1.txt'
          git add "$report"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe 4.0 map filename archive'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_sa40_map_filename_archive_probe > "$report"
            git add "$report"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe 4.0 map filename archive'
          fi
          git push
