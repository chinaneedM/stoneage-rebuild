name: Verify SCENE23 original body candidate metadata and synthetic gallery
on:
  push:
    branches: [main, agent/scene23-tw10-body-candidate-visuals-20261029]
    paths:
      - tools/stoneage_scene23_*
      - tests/test_stoneage_scene23_*
      - research/recovered/STONEAGE-SCENE23-*.json
      - .github/workflows/verify-stoneage-scene23-body.yml
  pull_request:
    paths:
      - tools/stoneage_scene23_*
      - tests/test_stoneage_scene23_*
      - research/recovered/STONEAGE-SCENE23-*.json
      - .github/workflows/verify-stoneage-scene23-body.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-and-synthetic-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install pillow==11.3.0
      - run: python -m tools.stoneage_scene23_body_visuals
      - run: python -m unittest -v tests.test_stoneage_scene23_body_visuals tests.test_stoneage_tw10_character_creation_r16_acceptance tests.test_stoneage_tw10_character_creation_r16_join
      - run: npm install --prefix /tmp/scene23-browser playwright@1.55.1
      - name: Only synthetic pixels; local original-source decoding is a separate witness
        run: |
          python -m tools.stoneage_scene23_fixture --output /tmp/scene23-fixture.html
          CHROME_PATH="$(command -v google-chrome)" PLAYWRIGHT_MODULE=/tmp/scene23-browser/node_modules/playwright node tools/stoneage_scene23_browser.cjs /tmp/scene23-fixture.html /tmp/scene23-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene23-synthetic-gallery-only
          path: /tmp/scene23-browser.json
          if-no-files-found: warn
          retention-days: 7
