name: PET126N 5.0 original PC runtime album 80-byte state evidence regression
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-PET126N-CN50-ORIGINAL-80BYTE-RUNTIME-SLOT-SOURCE-R1.json'
      - 'docs/continuity/STONEAGE-PET126N-CN50-80BYTE-RUNTIME-SLOT-20261121.md'
      - 'tests/test_stoneage_pet126n_source_receipt.py'
      - '.github/workflows/verify-stoneage-pet126n-source-receipt.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-PET126N-CN50-ORIGINAL-80BYTE-RUNTIME-SLOT-SOURCE-R1.json'
      - 'docs/continuity/STONEAGE-PET126N-CN50-80BYTE-RUNTIME-SLOT-20261121.md'
      - 'tests/test_stoneage_pet126n_source_receipt.py'
      - '.github/workflows/verify-stoneage-pet126n-source-receipt.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_pet126n_source_receipt.py' -v
