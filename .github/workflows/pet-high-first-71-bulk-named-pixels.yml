name: PET-HIGH-FIRST-71 bulk named original pixels
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_71_bulk_named_pixels.py'
      - '.github/workflows/pet-high-first-71-bulk-named-pixels.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-71-BULK-NAMED-PIXELS-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-71-*'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_71_bulk_named_pixels.py'
      - '.github/workflows/pet-high-first-71-bulk-named-pixels.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-71-BULK-NAMED-PIXELS-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-71-*'
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/pet-high-first-71-bulk-named-pixels-20261125' && startsWith(github.event.head_commit.message, 'PET-HIGH-FIRST-71:')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install Pillow
          python -m tools.stoneage_pet_high_first_71_bulk_named_pixels --selftest
          sudo apt-get update -qq
          sudo apt-get install -y -qq msitools
      - run: python -m tools.stoneage_wayi85_sixpart_acquisition --work "$RUNNER_TEMP/tw85" --output "$RUNNER_TEMP/tw85-acquisition.json"
      - run: |
          python -m tools.stoneage_pet_high_first_71_bulk_named_pixels --source-dir "$RUNNER_TEMP/tw85/msi-client/Program Files/WAYI/石器時代 魔域大冒險/data" --acquisition "$RUNNER_TEMP/tw85-acquisition.json"
          python -m tools.stoneage_pet_high_first_71_bulk_named_pixels
      - uses: actions/upload-artifact@v4
        with:
          name: pet71-derived-evidence
          path: |
            research/pets/PET-HIGH-FIRST-71-BULK-NAMED-PIXELS-R1.json.gz
            research/pets/PET-HIGH-FIRST-71-BULK-NAMED-PIXELS-SUMMARY-R1.json
          retention-days: 7
      - run: |
          git add 'research/pets/PET-HIGH-FIRST-71-BULK-NAMED-PIXELS-R1.json.gz' 'research/pets/PET-HIGH-FIRST-71-BULK-NAMED-PIXELS-SUMMARY-R1.json'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'PET71: archive actual named route source receipts'
          git push origin "HEAD:$GITHUB_REF"
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'PET-HIGH-FIRST-71:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual receipts if present; otherwise plan only (not acceptance)
        run: |
          if test -f research/pets/PET-HIGH-FIRST-71-BULK-NAMED-PIXELS-R1.json.gz; then
            python -m tools.stoneage_pet_high_first_71_bulk_named_pixels
          else
            python -m tools.stoneage_pet_high_first_71_bulk_named_pixels --plan-only
          fi
