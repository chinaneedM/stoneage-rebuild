name: Probe StoneAge Taiwan v1.0 technical structures

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_tw10_technical_probe.py
      - tests/test_stoneage_tw10_technical_probe.py
      - .github/workflows/probe-stoneage-tw10-technical.yml

permissions:
  contents: write

concurrency:
  group: stoneage-tw10-technical
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_tw10_technical_probe -v
      - name: Download and verify accepted preservation archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 --silent --show-error \
            -o /tmp/CD_DIC.rar \
            'https://archive.org/download/stoneage_tw_2000_win/CD_DIC.rar'
          echo "b37a4a47f4eb608cac67e4ddf7a1621a  /tmp/CD_DIC.rar" | md5sum -c -
          echo "b8cf92720b6ec8b3f46ea2e9bfcda986d21e7ded  /tmp/CD_DIC.rar" | sha1sum -c -
      - name: Extract accepted raw track
        run: |
          set -euo pipefail
          command -v 7z >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq 7zip
          }
          mkdir -p /tmp/stoneage_tw10
          7z x -y -o/tmp/stoneage_tw10 /tmp/CD_DIC.rar 'STONEAGE.bin'
          test "$(stat -c %s /tmp/stoneage_tw10/STONEAGE.bin)" = "523449360"
      - name: Probe runtime and resource structures
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_tw10_technical_probe \
            --bin /tmp/stoneage_tw10/STONEAGE.bin \
            > research/recovered/STONEAGE-TW10-TECHNICAL-PROBE-R1.txt
      - name: Delete transient proprietary payloads
        if: always()
        run: rm -rf /tmp/stoneage_tw10 /tmp/CD_DIC.rar
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-TW10-TECHNICAL-PROBE-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Taiwan 1.0 runtime and resources'
          git pull --rebase origin main
          git push
