name: Verify original TW1.0 writer origin bounded closure P2B
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-TW10-WRITER-SOURCE-CLOSURE-P2B-R1.json'
      - 'tools/stoneage_tw10_writer_source_closure_p2b.py'
      - 'tests/test_stoneage_tw10_writer_source_closure_p2b.py'
      - '.github/workflows/verify-stoneage-tw10-writer-source-closure-p2b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-provenance-and-unknowns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stoneage_tw10_writer_source_closure_p2b -v
      - run: python -m tools.stoneage_tw10_writer_source_closure_p2b
