name: Resolve Bahamut StoneAge 2.5 client package

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_bahamut_client_package_probe.py
      - tests/test_stoneage_sa25_bahamut_client_package_probe.py
      - .github/workflows/probe-stoneage-sa25-bahamut-client-package.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-bahamut-client-package
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sa25_bahamut_client_package_probe -v
      - name: Resolve 2.5 client-package article
        run: |
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_bahamut_client_package_probe > research/recovered/STONEAGE-SA25-BAHAMUT-CLIENT-PACKAGE-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA25-BAHAMUT-CLIENT-PACKAGE-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: resolve StoneAge 2.5 client package article'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
