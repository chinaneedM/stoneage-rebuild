name: Verify StoneAge INTEGRATION52 original dojo map pixel source
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION52-1021-DOJO-ORIGINAL-MAP09-300-CELL-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_52.py'
      - '.github/workflows/verify-stoneage-integration52-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION52-1021-DOJO-ORIGINAL-MAP09-300-CELL-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_52.py'
      - '.github/workflows/verify-stoneage-integration52-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_52.py' -v
