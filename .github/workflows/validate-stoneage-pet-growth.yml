name: Validate StoneAge pet growth model
on:
  workflow_dispatch:
  push:
    paths:
      - research/mechanics/STONEAGE-PET-GROWTH-CORE-R1.md
      - tools/stoneage_pet_growth_model.py
      - tests/test_stoneage_pet_growth_model.py
      - .github/workflows/validate-stoneage-pet-growth.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_pet_growth_model -v
