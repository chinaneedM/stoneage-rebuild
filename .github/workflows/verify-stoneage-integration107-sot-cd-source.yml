name: Verify StoneAge INTEGRATION107 original SOT C/D source and O14 contrast

on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION107-SOT-CD-27-ORIGINAL-SOURCE-VS-O14-R1.json'
      - 'docs/continuity/STONEAGE-INTEGRATION107-SOT-CD-ORIGINAL-SOURCE-AND-2003-GUIDE-20261114.md'
      - 'tests/test_stoneage_integration107_sot_cd_original.py'
      - '.github/workflows/verify-stoneage-integration107-sot-cd-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION107-SOT-CD-27-ORIGINAL-SOURCE-VS-O14-R1.json'
      - 'docs/continuity/STONEAGE-INTEGRATION107-SOT-CD-ORIGINAL-SOURCE-AND-2003-GUIDE-20261114.md'
      - 'tests/test_stoneage_integration107_sot_cd_original.py'
      - '.github/workflows/verify-stoneage-integration107-sot-cd-source.yml'
  workflow_dispatch:

jobs:
  static-source-and-guide-contrast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay 27 original-source boundaries and 24 player-guide contrasts
        run: python -m unittest discover -s tests -p 'test_stoneage_integration107_sot_cd_original.py' -v
