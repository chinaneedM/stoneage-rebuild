name: PET high-first original classic PC 305 named asset atlas
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_cn50_catalog.py'
      - 'tests/test_stoneage_pet_high_first_cn50_catalog.py'
      - 'research/pets/PET-HIGH-FIRST-CN50-305-SOURCE-ASSET-CATALOG-R1.tsv'
      - 'tools/stoneage_pet_high_first_cn50_native.py'
      - 'tools/stoneage_pet_high_first_cn50_sina.py'
      - 'tools/stoneage_pet_high_first_cn50_fusion.py'
      - 'tools/stoneage_pet_high_first_retention.py'
      - 'tools/stoneage_pet_high_first_tw85_extra.py'
      - 'tools/stoneage_pet_high_first_tw85_lookup.py'
      - 'tools/stoneage_pet_high_first_tw85_native_bridge.py'
      - 'tests/test_stoneage_pet_high_first_tw85_bridge.py'
      - 'research/pets/PET-HIGH-FIRST-TW85-NATIVE-SPR-ALBUM-R1.json'
      - 'tests/test_stoneage_pet_high_first_tw85_native.py'
      - 'research/pets/PET-HIGH-FIRST-TW85-ORIGINAL-PE-ALBUM-GRID-R1.json'
      - 'research/pets/PET-HIGH-FIRST-TW85-EXTRA-SPR-GROUPS-R1.json'
      - 'research/pets/PET-HIGH-FIRST-CN50-TW85-ART-RETENTION-R1.json'
      - 'research/pets/PET-HIGH-FIRST-CN50-FUSION-PANELS-R1.json'
      - 'research/pets/PET-HIGH-FIRST-CN50-SINA2003-CATALOG-R1.json'
      - 'tools/stoneage_pet16_lookup.py'
      - 'tests/test_stoneage_pet_high_first_cn50_native.py'
      - 'tests/test_stoneage_pet126r_cn50_lookup_integration.py'
      - 'research/pets/PET-HIGH-FIRST-CN50-NATIVE-SPR-ALBUM-R1.json'
      - '.github/workflows/validate-stoneage-pet-high-first-cn50.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preserved CN50 portraits and native SPR-to-album source catalogue
        run: |
          python -m unittest -v \
            tests.test_stoneage_pet_high_first_cn50_catalog \
            tests.test_stoneage_pet_high_first_cn50_native \
            tests.test_stoneage_pet126r_cn50_lookup_integration
          python -m tools.stoneage_pet_high_first_cn50_catalog
          python -m tools.stoneage_pet_high_first_cn50_native
          python -m tools.stoneage_pet_high_first_cn50_sina
          python -m tools.stoneage_pet_high_first_cn50_fusion
          python -m tools.stoneage_pet_high_first_retention
          python -m unittest -v tests.test_stoneage_pet_high_first_tw85_native tests.test_stoneage_pet_high_first_tw85_bridge
          python -m tools.stoneage_pet_high_first_tw85_native_bridge --verify > /tmp/tw85-native-source-bridge.json
          python -m tools.stoneage_pet_high_first_tw85_lookup --summary > /tmp/tw85-grid-summary.json
          python -m tools.stoneage_pet_high_first_tw85_extra --output /tmp/tw85-extra.json
          cmp /tmp/tw85-extra.json research/pets/PET-HIGH-FIRST-TW85-EXTRA-SPR-GROUPS-R1.json
