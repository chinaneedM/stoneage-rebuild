name: Validate direct TW1.0 sprite-to-ADRN source joins
on:
  push:
    paths:
      - 'tools/stoneage_pet_asset_growth_catalog.py'
      - 'tests/test_stoneage_pet_asset_growth_catalog.py'
      - 'docs/STONEAGE-PET-ASSET-GROWTH-CATALOG-MATRIX-R1.md'
      - 'research/recovered/STONEAGE-PET-ASSET-GROWTH-CATALOG-MATRIX-R1.json'
      - 'research/recovered/tw10-resource-metadata/**'
      - '.github/workflows/validate-stoneage-pet-asset-growth-crosswalk.yml'
      - 'docs/CURRENT-STATE.md'
      - 'docs/RESTORATION-ROADMAP-R2.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-direct-resource-join:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual 125996 ADRN, 464 groups, 39065 animations, 242085 frames and nine sample joins
        run: |
          python -m unittest tests.test_stoneage_pet_asset_growth_catalog -v
          python -m tools.stoneage_pet_asset_growth_catalog --emit-samples
