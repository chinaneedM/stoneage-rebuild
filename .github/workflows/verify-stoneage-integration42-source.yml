name: Verify StoneAge INTEGRATION42 registration source
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION42-JARUGA-REGISTRATION-ORIGINAL-TILES-R1.json'
      - 'tests/test_stoneage_integration_module_42.py'
      - '.github/workflows/verify-stoneage-integration42-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION42-JARUGA-REGISTRATION-ORIGINAL-TILES-R1.json'
      - 'tests/test_stoneage_integration_module_42.py'
      - '.github/workflows/verify-stoneage-integration42-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_42.py' -v
