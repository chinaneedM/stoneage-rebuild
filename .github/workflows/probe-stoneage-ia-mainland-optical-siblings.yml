name: Discover Mainland StoneAge IA optical siblings

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_ia_mainland_optical_sibling_probe.py
      - tests/test_stoneage_ia_mainland_optical_sibling_probe.py
      - .github/workflows/probe-stoneage-ia-mainland-optical-siblings.yml

permissions:
  contents: write

concurrency:
  group: stoneage-ia-mainland-optical-siblings
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate optical sibling discovery
        run: python3 -m unittest tests.test_stoneage_ia_mainland_optical_sibling_probe -v
      - name: Discover public optical siblings
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_ia_mainland_optical_sibling_probe \
            > research/recovered/STONEAGE-IA-MAINLAND-OPTICAL-SIBLINGS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-IA-MAINLAND-OPTICAL-SIBLINGS-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: discover Mainland IA optical siblings'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
