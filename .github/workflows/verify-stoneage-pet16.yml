name: PET16-22 whole-pet source-qualified catalogue and receipts
on:
  push:
    paths:
      - "research/recovered/STONEAGE-PET-MODULE-16-SOURCE-SEPARATED-UNIFIED-CATALOG-R1.json"
      - "tools/stoneage_pet16_lookup.py"
      - "tests/test_stoneage_pet16_unified_catalog.py"
      - "tests/test_stoneage_pet17_graphic_traces.py"
      - "tests/test_stoneage_pet18_capture_skill_links.py"
      - "tests/test_stoneage_pet19_skill_gap_audit.py"
      - "tests/test_stoneage_pet20_whole_module_coverage.py"
      - "tests/test_stoneage_pet21_source_receipt.py"
      - "tests/test_stoneage_pet22_jp_124_source_targets.py"
      - "tests/test_stoneage_pet22_archive_receipt.py"
      - "research/recovered/STONEAGE-PET-MODULE-22-JP-124-ARCHIVED-IMAGE-RECOVERY-R1.json"
      - "research/recovered/STONEAGE-PET-MODULE-21-OFFICIAL-WEB-ARCHIVED-IMAGE-REACCESS-R1.json"
      - "research/recovered/STONEAGE-PET-MODULE-20-FIELD-COVERAGE-AND-SOURCE-STOP-MATRIX-R1.json"
      - "research/recovered/STONEAGE-PET-MODULE-19-MISSING-SKILL-SOURCE-GAP-AUDIT-R1.json"
      - ".github/workflows/verify-stoneage-pet16.yml"
  pull_request:
    paths:
      - "research/recovered/STONEAGE-PET-MODULE-16-SOURCE-SEPARATED-UNIFIED-CATALOG-R1.json"
      - "tools/stoneage_pet16_lookup.py"
      - "tests/test_stoneage_pet16_unified_catalog.py"
      - "tests/test_stoneage_pet17_graphic_traces.py"
      - "tests/test_stoneage_pet18_capture_skill_links.py"
      - "tests/test_stoneage_pet19_skill_gap_audit.py"
      - "tests/test_stoneage_pet20_whole_module_coverage.py"
      - "tests/test_stoneage_pet21_source_receipt.py"
      - "tests/test_stoneage_pet22_jp_124_source_targets.py"
      - "tests/test_stoneage_pet22_archive_receipt.py"
      - "research/recovered/STONEAGE-PET-MODULE-22-JP-124-ARCHIVED-IMAGE-RECOVERY-R1.json"
      - "research/recovered/STONEAGE-PET-MODULE-21-OFFICIAL-WEB-ARCHIVED-IMAGE-REACCESS-R1.json"
      - "research/recovered/STONEAGE-PET-MODULE-20-FIELD-COVERAGE-AND-SOURCE-STOP-MATRIX-R1.json"
      - "research/recovered/STONEAGE-PET-MODULE-19-MISSING-SKILL-SOURCE-GAP-AUDIT-R1.json"
      - ".github/workflows/verify-stoneage-pet16.yml"
jobs:
  pet16-pet17-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing source-qualified pet catalogue against archived derived records
        run: python -m unittest tests.test_stoneage_pet16_unified_catalog
      - name: Independently audit PET17 ambiguous graphic joins and negative evidence
        run: python -m unittest tests.test_stoneage_pet17_graphic_traces
      - name: Independently verify PET18 same-archive capture and skill evidence
        run: python -m unittest tests.test_stoneage_pet18_capture_skill_links
      - name: Verify PET19 selected skill and alternative table gaps against original-derived rows
        run: python -m unittest tests.test_stoneage_pet19_skill_gap_audit
      - name: Independently verify PET20 original-source blob pins and incomplete-module gates
        run: python -m unittest tests.test_stoneage_pet20_whole_module_coverage
      - name: Verify PET21 archived operator-image SHA source receipts
        run: python -m unittest tests.test_stoneage_pet21_source_receipt
      - name: Verify PET22 all 124 original JP web image source references and historical SHA receipt guards
        run: python -m unittest tests.test_stoneage_pet22_jp_124_source_targets
      - name: Verify PET22 all 124 exact archived GIF byte receipts, repeat and failure evidence
        run: python -m unittest tests.test_stoneage_pet22_archive_receipt
      - name: Verify source-separated retrieval and cross-carrier candidate scope
        run: |
          python tools/stoneage_pet16_lookup.py --query 100400 --limit 10
          python tools/stoneage_pet16_lookup.py --dataset jp_official_web --query ウーリ
          python tools/stoneage_pet16_lookup.py --dataset mixed25_main --query 卡特利奴 --details
          python tools/stoneage_pet16_lookup.py --trace-graphic 100329 --limit 10
          python tools/stoneage_pet16_lookup.py --capture-template 524
          python tools/stoneage_pet16_lookup.py --skill-gaps --skill-id 114 --limit 1
          python tools/stoneage_pet16_lookup.py --skill-gaps --skill-id 503 --limit 5
          python tools/stoneage_pet16_lookup.py --operator-web jp --web-ordinal 4
