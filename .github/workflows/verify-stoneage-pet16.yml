name: PET16 PET17 PET18 source-qualified unified catalogue
on:
  push:
    paths:
      - "research/recovered/STONEAGE-PET-MODULE-16-SOURCE-SEPARATED-UNIFIED-CATALOG-R1.json"
      - "tools/stoneage_pet16_lookup.py"
      - "tests/test_stoneage_pet16_unified_catalog.py"
      - "tests/test_stoneage_pet17_graphic_traces.py"
      - "tests/test_stoneage_pet18_capture_skill_links.py"
      - ".github/workflows/verify-stoneage-pet16.yml"
  pull_request:
    paths:
      - "research/recovered/STONEAGE-PET-MODULE-16-SOURCE-SEPARATED-UNIFIED-CATALOG-R1.json"
      - "tools/stoneage_pet16_lookup.py"
      - "tests/test_stoneage_pet16_unified_catalog.py"
      - "tests/test_stoneage_pet17_graphic_traces.py"
      - "tests/test_stoneage_pet18_capture_skill_links.py"
      - ".github/workflows/verify-stoneage-pet16.yml"
jobs:
  pet16-pet17-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing source-qualified pet catalogue against archived derived records
        run: python -m unittest tests.test_stoneage_pet16_unified_catalog
      - name: Independently audit PET17 ambiguous graphic joins and negative evidence
        run: python -m unittest tests.test_stoneage_pet17_graphic_traces
      - name: Independently verify PET18 same-archive capture and skill evidence
        run: python -m unittest tests.test_stoneage_pet18_capture_skill_links
      - name: Verify source-separated retrieval and cross-carrier candidate scope
        run: |
          python tools/stoneage_pet16_lookup.py --query 100400 --limit 10
          python tools/stoneage_pet16_lookup.py --dataset jp_official_web --query ウーリ
          python tools/stoneage_pet16_lookup.py --dataset mixed25_main --query 卡特利奴 --details
          python tools/stoneage_pet16_lookup.py --trace-graphic 100329 --limit 10
          python tools/stoneage_pet16_lookup.py --capture-template 524
