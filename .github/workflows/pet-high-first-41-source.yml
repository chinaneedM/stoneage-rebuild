name: PET-HIGH-FIRST-41 source-qualified quiz and capture replay
on:
  push:
    branches: [agent/pet-high-first-41-quiz-award-20261124]
    paths:
      - 'tools/stoneage_pet_high_first_41_acquisition.py'
      - '.github/workflows/pet-high-first-41-source.yml'
permissions:
  contents: read
jobs:
  exact-members:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rarfile==4.2
      - run: sudo apt-get update -qq && sudo apt-get install -y unar
      - run: python -m tools.stoneage_pet_high_first_41_acquisition --output /tmp/pet41-derived.json
      - uses: actions/upload-artifact@v4
        with:
          name: pet41-derived-metadata-only
          path: /tmp/pet41-derived.json
          retention-days: 7
          if-no-files-found: error
