name: Verify SCENE20 original audio metadata and synthetic browser controls
on:
  push:
    branches: [main, agent/scene20-tw10-audio-observer-20261029]
    paths:
      - tools/stoneage_scene20_*
      - tests/test_stoneage_scene20_*
      - research/recovered/STONEAGE-SCENE20-*.json
      - .github/workflows/verify-stoneage-scene20-audio.yml
  pull_request:
    paths:
      - tools/stoneage_scene20_*
      - tests/test_stoneage_scene20_*
      - research/recovered/STONEAGE-SCENE20-*.json
      - .github/workflows/verify-stoneage-scene20-audio.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-and-synthetic-browser-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m tools.stoneage_scene20_tw10_audio
      - run: python -m unittest -v tests.test_stoneage_scene20_audio tests.test_stoneage_tw10_audio_metadata tests.test_stoneage_original_observation_lab
      - run: npm install --prefix /tmp/scene20-browser playwright@1.55.1
      - name: Public browser QA uses only synthetic PCM, never historical audio
        run: |
          python -m tools.stoneage_scene20_audio_fixture --output /tmp/scene20-fixture.html
          CHROME_PATH="$(command -v google-chrome)" PLAYWRIGHT_MODULE=/tmp/scene20-browser/node_modules/playwright node tools/stoneage_scene20_audio_browser.cjs /tmp/scene20-fixture.html /tmp/scene20-browser-synthetic-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene20-SYNTHETIC-browser-metadata-only
          path: /tmp/scene20-browser-synthetic-report.json
          if-no-files-found: warn
          retention-days: 7
