name: Validate StoneAge AttackMagic action composer

concurrency:
  group: stoneage-attack-magic-action-composer
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-attack-magic-action-model.yml
      - tools/stoneage_attack_magic_action_model.py
      - tests/test_stoneage_attack_magic_action_model.py
      - tools/stoneage_attack_magic_damage_model.py
      - tools/stoneage_recovered25_attack_magic_runtime.py
      - research/mechanics/STONEAGE-ATTACK-MAGIC-ACTION-COMPOSER-R1.md
  pull_request:
    paths:
      - .github/workflows/validate-stoneage-attack-magic-action-model.yml
      - tools/stoneage_attack_magic_action_model.py
      - tests/test_stoneage_attack_magic_action_model.py
      - tools/stoneage_attack_magic_damage_model.py
      - tools/stoneage_recovered25_attack_magic_runtime.py
      - research/mechanics/STONEAGE-ATTACK-MAGIC-ACTION-COMPOSER-R1.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate AttackMagic action composition
        run: |
          python3 -m unittest \
            tests.test_stoneage_attack_magic_damage_model \
            tests.test_stoneage_attack_magic_footprint_model \
            tests.test_stoneage_recovered25_attack_magic_runtime \
            tests.test_stoneage_attack_magic_action_model -v
