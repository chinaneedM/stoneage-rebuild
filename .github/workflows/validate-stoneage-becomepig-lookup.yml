name: Validate StoneAge BecomePig original appearance and ride lookups

concurrency:
  group: stoneage-becomepig-lookup-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-becomepig-lookup.yml"
      - "tools/stoneage_becomepig_lookup_audit.py"
      - "tools/stoneage_becomepig_badstatus_audit.py"
      - "tools/stoneage_becomepig_restore_audit.py"
      - "tests/test_stoneage_becomepig_lookup.py"
      - "research/recovered/STONEAGE-BECOMEPIG-LOOKUP-SOURCE-DOMAINS-R1.json"
      - "research/recovered/STONEAGE-BECOMEPIG-BADSTATUS-SOURCE-DOMAINS-R1.json"
      - "research/recovered/STONEAGE-BECOMEPIG-RESTORATION-SOURCE-DOMAINS-R1.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lookup domains and previous regressions
        run: python -m unittest -v tests.test_stoneage_becomepig_lookup tests.test_stoneage_becomepig_badstatus tests.test_stoneage_becomepig_restore tests.test_stoneage_becomepig_clock tests.test_stoneage_becomepig_native_domains tests.test_stoneage_recovered25_becomepig_probe
      - name: Recover exact descendant source trees
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_guard_break2_source_audit import PINNED
          repos={"gavin":"gavinlinasd/StoneAge","iris":"iriselia/StoneAge","bismarck":"BismarckDD/stoneage"}
          for name,sha in PINNED.items():
              root=Path("/tmp/becomepig-lookup-source")/name
              subprocess.run(["git","init",str(root)],check=True)
              subprocess.run(["git","-C",str(root),"remote","add","origin","https://github.com/"+repos[name]+".git"],check=True)
              subprocess.run(["git","-C",str(root),"fetch","--depth","1","origin",sha],check=True)
              subprocess.run(["git","-C",str(root),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Execute original appearance and ride lookups and prior complete callers and clocks
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          ARGS="--gavin-dir /tmp/becomepig-lookup-source/gavin --iris-dir /tmp/becomepig-lookup-source/iris --bismarck-dir /tmp/becomepig-lookup-source/bismarck"
          python -m tools.stoneage_becomepig_lookup_audit $ARGS > research/recovered/STONEAGE-BECOMEPIG-LOOKUP-NATIVE-R1.txt
          python -m tools.stoneage_becomepig_badstatus_audit $ARGS > /tmp/becomepig-prior-badstatus.txt
          cmp /tmp/becomepig-prior-badstatus.txt research/recovered/STONEAGE-BECOMEPIG-BADSTATUS-NATIVE-R1.txt
          python -m tools.stoneage_becomepig_restore_audit $ARGS > /tmp/becomepig-prior-restore.txt
          cmp /tmp/becomepig-prior-restore.txt research/recovered/STONEAGE-BECOMEPIG-RESTORATION-NATIVE-R1.txt
          python -m tools.stoneage_becomepig_clock_audit $ARGS > /tmp/becomepig-prior-clock.txt
          cmp /tmp/becomepig-prior-clock.txt research/recovered/STONEAGE-BECOMEPIG-CLOCK-NATIVE-R1.txt
          cat research/recovered/STONEAGE-BECOMEPIG-LOOKUP-NATIVE-R1.txt
          test "$(grep -c '^PROFILE|' research/recovered/STONEAGE-BECOMEPIG-LOOKUP-NATIVE-R1.txt)" = 3
          grep -F 'TOTAL|original_lookup_and_table_comparisons=181460|complete_composition_comparisons=141412|comparisons=322872' research/recovered/STONEAGE-BECOMEPIG-LOOKUP-NATIVE-R1.txt
          grep -F 'RESOLUTION|BECOMEPIG_BOUNDED_ORIGINAL_LOOKUP_AND_FULL_CALLER_COMPOSITION_PASS_ZERO_RUNTIME_PROMOTIONS' research/recovered/STONEAGE-BECOMEPIG-LOOKUP-NATIVE-R1.txt
      - name: Preserve exact-input derived evidence
        uses: actions/upload-artifact@v4
        with:
          name: becomepig-lookup-witnesses-${{ github.sha }}
          path: |
            research/recovered/STONEAGE-BECOMEPIG-LOOKUP-NATIVE-R1.txt
            research/recovered/STONEAGE-BECOMEPIG-BADSTATUS-NATIVE-R1.txt
            research/recovered/STONEAGE-BECOMEPIG-RESTORATION-NATIVE-R1.txt
            research/recovered/STONEAGE-BECOMEPIG-CLOCK-NATIVE-R1.txt
      - name: Commit only derived lookup report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/recovered/STONEAGE-BECOMEPIG-LOOKUP-NATIVE-R1.txt
          if ! git diff --cached --quiet; then
            git commit -m "research: verify original BecomePig lookup composition [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
