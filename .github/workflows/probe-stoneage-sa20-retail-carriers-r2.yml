name: Refine StoneAge 2.0 retail client discs

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa20_retail_carrier_census_r2.py
      - tests/test_stoneage_sa20_retail_carrier_census_r2.py
      - .github/workflows/probe-stoneage-sa20-retail-carriers-r2.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa20-retail-carriers-r2
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sa20_retail_carrier_census_r2 -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa20_retail_carrier_census_r2 > research/recovered/STONEAGE-SA20-RETAIL-CARRIER-CENSUS-R2.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA20-RETAIL-CARRIER-CENSUS-R2.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: refine StoneAge 2.0 retail client census'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
