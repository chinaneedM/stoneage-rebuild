name: Verify ITEM03 original composition dictionary and static exchange/lottery evidence
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-ITEM-MODULE-03-ORIGINAL-COMPOSITION-AND-EXCHANGE-SOURCE-CATALOG-R1.json'
      - 'tests/test_stoneage_item_module_03.py'
      - '.github/workflows/verify-stoneage-item-module-03.yml'
      - 'research/recovered/item-module-01/**'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-ITEM-MODULE-03-ORIGINAL-COMPOSITION-AND-EXCHANGE-SOURCE-CATALOG-R1.json'
      - 'tests/test_stoneage_item_module_03.py'
      - '.github/workflows/verify-stoneage-item-module-03.yml'
      - 'research/recovered/item-module-01/**'
  workflow_dispatch:
jobs:
  verify-source-bound-static-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_item_module_03.py' -v
