name: Recover direct Sina 2000 map route

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_2000_sina_direct_recovery.py
      - tests/test_stoneage_2000_sina_direct_recovery.py
      - .github/workflows/recover-stoneage-2000-sina-direct-route.yml

permissions:
  contents: write

concurrency:
  group: stoneage-2000-sina-direct-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_2000_sina_direct_recovery -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_2000_sina_direct_recovery             > research/recovered/STONEAGE-2000-SINA-DIRECT-RECOVERY-R1.txt
      - name: Commit derived recovery metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-2000-SINA-DIRECT-RECOVERY-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: recover direct Sina 2000 map route'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
