name: Recover StoneAge 2.5 static inventory

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recover-stoneage-25-static.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full file binutils
      - name: Download preserved split archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import html,re,http.cookiejar,urllib.request
          from pathlib import Path
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124 Safari/537.36'
          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders=[('User-Agent',ua)]
          def get(key,suffix):
              landing=f'https://www.mediafire.com/?{key}'
              with op.open(landing,timeout=60) as r:
                  page=r.read().decode('utf-8','replace'); referer=r.geturl()
              m=re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S)
              if not m:
                  m=re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
              if not m: raise SystemExit(f'No download URL for {key}')
              url=html.unescape(m.group(1))
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':referer})
              dest=Path('/tmp/sa25')/f'stoneage25.rar.{suffix}'
              with op.open(req,timeout=180) as r, open(dest,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
              print(key,dest.stat().st_size)
          get('ev7l29fw77891go','001')
          get('ytaa168o5jih0lx','002')
          PY
      - name: Extract and write derived report
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25/out research/recovered
          R=research/recovered/STONEAGE-25-PRESERVED-BUNDLE-STATIC-INVENTORY-R1.txt
          {
            echo 'StoneAge 2.5 preserved bundle static inventory — R1'
            echo 'Original recovered payload is NOT committed.'
            echo 'Source: https://www.lab.welovesa.com/viewthread.php?extra=&page=1&tid=219'
            echo
            echo 'PART HASHES / SIZES'
            sha256sum /tmp/sa25/stoneage25.rar.00{1,2}
            md5sum /tmp/sa25/stoneage25.rar.00{1,2}
            stat -c '%n|%s' /tmp/sa25/stoneage25.rar.00{1,2}
            echo
            echo 'ARCHIVE LISTING'
            7z l -slt /tmp/sa25/stoneage25.rar.001
          } > "$R" 2>&1
          7z x -y -o/tmp/sa25/out /tmp/sa25/stoneage25.rar.001 >> "$R" 2>&1
          {
            echo
            echo 'EXTRACTED TREE (PATH|BYTES)'
            find /tmp/sa25/out -type f -printf '%P|%s\n' | LC_ALL=C sort
            echo
            echo 'EXECUTABLE/DLL METADATA'
            while IFS= read -r -d '' f; do
              rel="${f#/tmp/sa25/out/}"
              echo "--- $rel ---"
              sha256sum "$f"
              file "$f"
              objdump -p "$f" 2>/dev/null | grep -E '^(Time/Date|ImageBase|Subsystem|DLL Name:)' || true
              strings -a -n 5 "$f" 2>/dev/null | grep -Eai 'https?://|www\.|[0-9]{1,3}(\.[0-9]{1,3}){3}|ttttttttt|20041215|12345678|cary|login|launcher|inject|server|stoneage' | head -n 100 || true
            done < <(find /tmp/sa25/out -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
            echo
            echo 'ALL-FILE SHA256'
            find /tmp/sa25/out -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          } >> "$R"
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -F '?? research/recovered/STONEAGE-25-PRESERVED-BUNDLE-STATIC-INVENTORY-R1.txt'
      - name: Commit derived report only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-25-PRESERVED-BUNDLE-STATIC-INVENTORY-R1.txt
          git commit -m 'research: inventory preserved StoneAge 2.5 bundle'
          git push
