name: Verify official Wayi ice-region names and scene-caption attribution
on:
  push:
    paths:
      - tools/stoneage_wayi_ice_region.py
      - tests/test_stoneage_wayi_ice_region.py
      - docs/specs/STONEAGE-WAYI-OFFICIAL-ICE-REGION-R1.md
      - research/recovered/STONEAGE-WAYI-OFFICIAL-ICE-REGION*.json
      - .github/workflows/verify-stoneage-wayi-ice-region.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-one-detail-and-six-original-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Reject name normalization, caption swaps and inferred map/service identities
        run: python -m unittest tests.test_stoneage_wayi_ice_region -v
      - name: Independently reacquire official detail and six exact original JPEGs
        run: |
          python -m tools.stoneage_wayi_ice_region --output "${{ runner.temp }}/ice-region/wayi-official-ice-region.json" --catalog-output "${{ runner.temp }}/ice-region/ice-region-content-catalog.json"
          cmp "${{ runner.temp }}/ice-region/wayi-official-ice-region.json" research/recovered/STONEAGE-WAYI-OFFICIAL-ICE-REGION-R1.json
          cmp "${{ runner.temp }}/ice-region/ice-region-content-catalog.json" research/recovered/STONEAGE-WAYI-OFFICIAL-ICE-REGION-CONTENT-CATALOG-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: wayi-official-ice-region-derived-report
          path: ${{ runner.temp }}/ice-region/*.json
          retention-days: 30
