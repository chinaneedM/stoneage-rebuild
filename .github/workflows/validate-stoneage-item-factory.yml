name: Validate StoneAge original item factory and register
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-item-factory.yml"
      - "tools/stoneage_item_factory_audit.py"
      - "tests/test_stoneage_item_factory.py"
      - "research/recovered/STONEAGE-ITEM-FACTORY-SOURCE-R1.json"
permissions:
  contents: read
jobs:
  original-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Original source mutation and retained allocator/reward regression checks
        run: |
          python -m unittest -v tests.test_stoneage_item_factory tests.test_stoneage_item_allocator tests.test_stoneage_party_pet_reward_ownership tests.test_stoneage_party_pet_original_reward_item tests.test_stoneage_party_pet_original_pet_growth tests.test_stoneage_party_pet_original_player_level
      - name: Recover pinned public original sources outside repository
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_party_pet_original_attack_audit import PINNED
          repos={"gavin":"gavinlinasd/StoneAge","iris":"iriselia/StoneAge","bismarck":"BismarckDD/stoneage"}
          for p,sha in PINNED.items():
              d=Path("/tmp/stoneage-item-factory-r1")/p
              subprocess.run(["git","init",str(d)],check=True)
              subprocess.run(["git","-C",str(d),"remote","add","origin","https://github.com/"+repos[p]+".git"],check=True)
              subprocess.run(["git","-C",str(d),"fetch","--depth","1","origin",sha],check=True)
              subprocess.run(["git","-C",str(d),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Original source-body factory and register execution in complete terminal harness
        run: |
          set -euo pipefail
          python -m tools.stoneage_item_factory_audit --gavin-dir /tmp/stoneage-item-factory-r1/gavin --iris-dir /tmp/stoneage-item-factory-r1/iris --bismarck-dir /tmp/stoneage-item-factory-r1/bismarck > /tmp/stoneage-item-factory-r1.txt
          cat /tmp/stoneage-item-factory-r1.txt
          grep -Fx 'RESOLUTION|ORIGINAL_REAL_HEADER_ITEM_FACTORY_BOUNDED_PASS' /tmp/stoneage-item-factory-r1.txt
          test "$(grep -c '^ACTUAL|.*REAL_HEADER_ITEM_FACTORY|' /tmp/stoneage-item-factory-r1.txt)" -eq 2
      - name: Preserve prior allocator witness independently
        run: |
          set -euo pipefail
          python -m tools.stoneage_item_allocator_audit --gavin-dir /tmp/stoneage-item-factory-r1/gavin --iris-dir /tmp/stoneage-item-factory-r1/iris --bismarck-dir /tmp/stoneage-item-factory-r1/bismarck > /tmp/stoneage-item-allocator-retained-r1.txt
          grep -Fx 'RESOLUTION|ORIGINAL_REAL_HEADER_ITEM_ALLOCATOR_BOUNDED_PASS' /tmp/stoneage-item-allocator-retained-r1.txt
      - name: Upload derived traces only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoneage-item-factory-r1
          path: |
            /tmp/stoneage-item-factory-r1.txt
            /tmp/stoneage-item-allocator-retained-r1.txt
          if-no-files-found: ignore
