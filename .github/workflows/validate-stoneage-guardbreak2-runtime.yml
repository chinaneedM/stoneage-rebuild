name: Validate StoneAge GuardBreak2 runtime
concurrency:
  group: stoneage-guardbreak2-runtime
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-guardbreak2-runtime.yml
      - tools/stoneage_guard_break2_model.py
      - tools/stoneage_enemy_ai_guard_break2_bridge.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_battle_state_model.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_guard_break2_runtime.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate GuardBreak2 runtime chain
        run: |
          python3 -m unittest \
            tests.test_stoneage_guard_break2_model \
            tests.test_stoneage_guard_break2_runtime \
            tests.test_stoneage_local_runtime_session_coordinator.LocalRuntimeSessionCoordinatorTests.test_recovered_enemy_ai_guard_break2_executes_semantic_attack -v
