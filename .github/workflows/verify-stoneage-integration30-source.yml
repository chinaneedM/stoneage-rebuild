name: Verify StoneAge INTEGRATION30-32 original source links
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION30-EVENT20-DUNGEON-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_30.py'
      - 'docs/continuity/STONEAGE-INTEGRATION30-EVENT20-DUNGEON-20261110.md'
      - '.github/workflows/verify-stoneage-integration30-source.yml'
      - 'research/recovered/STONEAGE-INTEGRATION31-DUNGEON-WARPMAN-ENTRY-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_31.py'
      - 'docs/continuity/STONEAGE-INTEGRATION31-DUNGEON-WARPMAN-ENTRY-20261110.md'
      - 'research/recovered/STONEAGE-INTEGRATION32-QIKAKA-FOUR-ROOMS-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_32.py'
      - 'docs/continuity/STONEAGE-INTEGRATION32-QIKAKA-FOUR-ROOMS-20261110.md'
      - 'README.md'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION30-EVENT20-DUNGEON-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_30.py'
      - 'docs/continuity/STONEAGE-INTEGRATION30-EVENT20-DUNGEON-20261110.md'
      - '.github/workflows/verify-stoneage-integration30-source.yml'
      - 'research/recovered/STONEAGE-INTEGRATION32-QIKAKA-FOUR-ROOMS-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_32.py'
      - 'docs/continuity/STONEAGE-INTEGRATION32-QIKAKA-FOUR-ROOMS-20261110.md'
      - 'README.md'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_30.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_31.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_32.py' -v
