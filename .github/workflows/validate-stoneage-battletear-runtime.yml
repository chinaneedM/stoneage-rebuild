name: Validate StoneAge BattleTear runtime
concurrency:
  group: stoneage-battletear-runtime
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-battletear-runtime.yml
      - tools/stoneage_battle_tear_damage_model.py
      - tools/stoneage_enemy_ai_battle_tear_bridge.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_default_pet_exit_model.py
      - tools/stoneage_battle_state_model.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_battle_tear_damage_model.py
      - tests/test_stoneage_enemy_ai_battle_tear_bridge.py
      - tests/test_stoneage_battle_tear_round.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovered25 BattleTear runtime
        run: |
          python3 -m unittest \
            tests.test_stoneage_battle_tear_damage_model \
            tests.test_stoneage_enemy_ai_battle_tear_bridge \
            tests.test_stoneage_battle_tear_round \
            tests.test_stoneage_local_runtime_session_coordinator -v
