name: Probe TW1.0 R58 original shared write-close and close-path helpers
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r58-shared-close-helpers-20261015]
    paths:
      - .github/workflows/probe-stoneage-tw10-r58-original.yml
      - tools/stoneage_tw10_savedata_native_io_r58.py
      - tools/stoneage_tw10_savedata_native_io_r58_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r58.py
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded synthetic bridges and inherited static tooling
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r58 tests.test_stoneage_tw10_savedata_return_r57 tests.test_stoneage_tw10_savedata_native_io_r57 tests.test_stoneage_tw10_savedata_native_io_r56
      - name: Retrieve authenticated original TW1.0 retail archive transiently
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m tools.stoneage_tw10_archive_parallel_download --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar; then
              echo TW10_R58_AUTHENTICATED_ARCHIVE=PASS
              break
            fi
            rm -f /tmp/CD_DIC.rar
            if [ "$attempt" -eq 3 ]; then
              echo TW10_R58_ORIGINAL_SOURCE_UNAVAILABLE=OPEN
              exit 1
            fi
            sleep 10
          done
      - name: Extract bounded original runtime transiently
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r58
          7z x -y -o/tmp/stoneage-r58 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r58/STONEAGE.bin)" -eq 523449360
      - name: Derive and strictly validate R58 rooted nonexecuting metadata
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_native_io_r58 --bin /tmp/stoneage-r58/STONEAGE.bin > /tmp/stoneage-r58-derived.json
          python -m tools.stoneage_tw10_savedata_native_io_r58_guard --report /tmp/stoneage-r58-derived.json
          test "$(stat -c %s /tmp/stoneage-r58-derived.json)" -le 2000000
          echo TW10_R58_ROOTED_ORIGINAL_STATIC=PASS
          echo TW10_R58_ACTUAL_NATIVE_PERSISTENCE=OPEN
      - name: Always purge proprietary source
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r58
      - name: Upload derived instruction metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-r58-original-shared-close-helpers-derived
          path: /tmp/stoneage-r58-derived.json
          retention-days: 21
