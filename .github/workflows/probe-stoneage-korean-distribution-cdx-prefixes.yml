name: Enumerate Korean StoneAge distribution CDX prefixes

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_korean_distribution_cdx_prefix_probe.py
      - tests/test_stoneage_korean_distribution_cdx_prefix_probe.py
      - .github/workflows/probe-stoneage-korean-distribution-cdx-prefixes.yml

permissions:
  contents: write

concurrency:
  group: stoneage-korean-distribution-cdx-prefixes
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_korean_distribution_cdx_prefix_probe -v
      - name: Enumerate archived distribution-directory filenames
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_korean_distribution_cdx_prefix_probe             > research/recovered/STONEAGE-KOREAN-DISTRIBUTION-CDX-PREFIXES-R1.txt
      - name: Commit derived CDX metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-KOREAN-DISTRIBUTION-CDX-PREFIXES-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: enumerate Korean StoneAge distribution CDX prefixes'
          git pull --rebase origin main
          git push
