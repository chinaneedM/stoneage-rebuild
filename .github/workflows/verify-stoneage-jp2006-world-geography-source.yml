name: Verify JP2006 volcano and wind-rain geography sources
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-JP2006-WORLD-GEOGRAPHY-*.json'
      - 'tools/stoneage_jp2006_world_geography_source.py'
      - 'tests/test_stoneage_jp2006_world_geography_source.py'
      - '.github/workflows/verify-stoneage-jp2006-world-geography-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-JP2006-WORLD-GEOGRAPHY-*.json'
      - 'tools/stoneage_jp2006_world_geography_source.py'
      - 'tests/test_stoneage_jp2006_world_geography_source.py'
      - '.github/workflows/verify-stoneage-jp2006-world-geography-source.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check map versions, condition unknowns and source constraints
        run: python -m unittest discover -s tests -p 'test_stoneage_jp2006_world_geography_source.py' -v
      - name: Re-read exactly three 2006 map announcements
        run: python -m tools.stoneage_jp2006_world_geography_source --fetch --output /tmp/jp2006-map/replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: jp2006-geography-derived-replay
          path: /tmp/jp2006-map/replay.json
          if-no-files-found: error
          retention-days: 30
