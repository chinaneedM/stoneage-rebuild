name: Probe TW1.0 original R16 bounded callees and third virtual-global references
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-callee-global-r16-20261012]
    paths:
      - .github/workflows/probe-stoneage-tw10-r16-original.yml
      - tools/stoneage_tw10_savedata_callee_global_r16.py
      - tests/test_stoneage_tw10_savedata_callee_global_r16.py
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic bounded helper and data reference regressions
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_callee_global_r16
      - name: Retrieve verified historical archive in parallel ranges
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_archive_parallel_download --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar
      - name: Extract only for temporary original static analysis
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r16
          7z x -y -o/tmp/stoneage-r16 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r16/STONEAGE.bin)" = 523449360
      - name: Emit bounded original-derived R16 evidence
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_callee_global_r16 --bin /tmp/stoneage-r16/STONEAGE.bin > /tmp/stoneage-r16-derived.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.stoneage_tw10_savedata_callee_global_r16 import SCHEMA,STATUS,GLOBAL,CALLEES,FLAGS
          p=Path("/tmp/stoneage-r16-derived.json")
          data=json.loads(p.read_text())
          assert p.stat().st_size<=65000
          assert data["schema"]==SCHEMA and data["status"]==STATUS
          assert [r["root_rva"] for r in data["callee_frontiers"]]==[x[0] for x in CALLEES]
          assert data["third_global_references"]["globals"][0]["global_rva"]==GLOBAL
          assert all(data[k] is False for k in FLAGS)
          assert all(row["original_callee_effects_admitted"] is False for row in data["callee_frontiers"])
          print("TW10_R16_ORIGINAL_BOUNDED_CALLEE_GLOBAL=PASS")
          print("TW10_R16_NATIVE_IO_AND_OBJECT_OWNERSHIP=OPEN")
          PY
      - name: Always purge historical originals
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r16
      - name: Publish derived-only R16 report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-r16-original-callee-global-derived
          path: /tmp/stoneage-r16-derived.json
          retention-days: 21
