name: Verify StoneAge INTEGRATION22 ten original shop source rooms
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION22-THREE-VILLAGE-TEN-SHOPS-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_22.py'
      - 'docs/continuity/STONEAGE-INTEGRATION22-THREE-VILLAGE-SHOPS-20261109.md'
      - '.github/workflows/verify-stoneage-integration22-source.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION22-THREE-VILLAGE-TEN-SHOPS-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_22.py'
      - 'docs/continuity/STONEAGE-INTEGRATION22-THREE-VILLAGE-SHOPS-20261109.md'
      - '.github/workflows/verify-stoneage-integration22-source.yml'
      - 'README.md'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_22.py' -v
