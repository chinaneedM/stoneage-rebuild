name: Validate TW1.0 R23 call/stack/cycle synthetic and strict guard
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r23-heap-links-20261013]
    paths:
      - .github/workflows/validate-stoneage-tw10-r23-synthetic.yml
      - tools/stoneage_tw10_savedata_upstream_r23.py
      - tools/stoneage_tw10_savedata_upstream_r23_guard.py
      - tests/test_stoneage_tw10_savedata_upstream_r23.py
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet capstone pefile
      - name: R23 and R22 synthetic and strict negative controls
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_tw10_savedata_upstream_r23 tests.test_stoneage_tw10_savedata_upstream_r22 tests.test_stoneage_tw10_savedata_upstream_r22_guard
          python -m compileall -q tools/stoneage_tw10_savedata_upstream_r23.py tools/stoneage_tw10_savedata_upstream_r23_guard.py
          echo TW10_R23_SYNTHETIC_STRICT=PASS
          echo TW10_R23_ORIGINAL_EVIDENCE=OPEN
