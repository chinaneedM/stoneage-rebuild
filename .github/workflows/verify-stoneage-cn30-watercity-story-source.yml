name: Verify CN3.0 Watercity player-guide and dated-article boundaries
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN30-WATERCITY-HEART-BRACELET-GUIDE-R1.json'
      - 'research/recovered/STONEAGE-CN30-WATERCITY-TWO-SOURCE-STORY-BRANCHES-R1.json'
      - 'tests/test_stoneage_cn30_watercity_story_source.py'
      - 'tests/test_stoneage_cn30_watercity_source_variants.py'
      - '.github/workflows/verify-stoneage-cn30-watercity-story-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN30-WATERCITY-HEART-BRACELET-GUIDE-R1.json'
      - 'research/recovered/STONEAGE-CN30-WATERCITY-TWO-SOURCE-STORY-BRANCHES-R1.json'
      - 'tests/test_stoneage_cn30_watercity_story_source.py'
      - 'tests/test_stoneage_cn30_watercity_source_variants.py'
      - '.github/workflows/verify-stoneage-cn30-watercity-story-source.yml'
jobs:
  verify-source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline validate both source-boundary reports
        run: python -m unittest discover -s tests -p 'test_stoneage_cn30_watercity*.py' -v
