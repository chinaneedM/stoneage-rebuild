name: Verify Stage A WORLD31 original-derived itemset variant
on:
  pull_request:
    paths:
      - 'tools/stoneage_world31_itemset_variant.py'
      - 'research/recovered/STONEAGE-STAGE-A-WORLD31-ITEMSET-VARIANT-R1.json'
      - 'tests/test_stoneage_stage_a_world31_itemset_variant.py'
      - '.github/workflows/verify-stoneage-world31-itemset-variant.yml'
  push:
    branches: [main]
    paths:
      - 'tools/stoneage_world31_itemset_variant.py'
      - 'research/recovered/STONEAGE-STAGE-A-WORLD31-ITEMSET-VARIANT-R1.json'
      - 'tests/test_stoneage_stage_a_world31_itemset_variant.py'
      - '.github/workflows/verify-stoneage-world31-itemset-variant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stoneage_stage_a_world31_itemset_variant -v
