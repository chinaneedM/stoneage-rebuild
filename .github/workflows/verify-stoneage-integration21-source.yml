name: Verify StoneAge INTEGRATION21 source-bound pet service atlas

on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION21-TEN-PET-ROOMS-SOURCE-ATLAS-R1.json'
      - 'tests/test_stoneage_integration_module_21.py'
      - 'docs/continuity/STONEAGE-INTEGRATION21-TEN-PET-ROOMS-ATLAS-20261109.md'
      - '.github/workflows/verify-stoneage-integration21-source.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION21-TEN-PET-ROOMS-SOURCE-ATLAS-R1.json'
      - 'tests/test_stoneage_integration_module_21.py'
      - 'docs/continuity/STONEAGE-INTEGRATION21-TEN-PET-ROOMS-ATLAS-20261109.md'
      - '.github/workflows/verify-stoneage-integration21-source.yml'
      - 'README.md'
jobs:
  public-source-atlas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_21.py' -v
