name: Validate R114 CN2003 merchant elephant quest evidence boundaries
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN2003-MERCHANT-ELEPHANT-R114.json'
      - 'tools/stoneage_cn2003_merchant_elephant_r114.py'
      - 'tests/test_stoneage_cn2003_merchant_elephant_r114.py'
      - '.github/workflows/stoneage-cn2003-merchant-elephant-r114.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN2003-MERCHANT-ELEPHANT-R114.json'
      - 'tools/stoneage_cn2003_merchant_elephant_r114.py'
      - 'tests/test_stoneage_cn2003_merchant_elephant_r114.py'
      - '.github/workflows/stoneage-cn2003-merchant-elephant-r114.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/stoneage_cn2003_merchant_elephant_r114.py
      - run: python tests/test_stoneage_cn2003_merchant_elephant_r114.py
