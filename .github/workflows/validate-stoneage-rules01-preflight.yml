name: Validate StoneAge RULES-01 bounded playflow preflight
on:
  push:
    paths:
      - "research/recovered/STONEAGE-RULES01-CROSSSYSTEM-PREFLIGHT-R1.json"
      - "docs/specs/STONEAGE-RULES01-PLAYFLOW-ATTRIBUTION-R1.md"
      - "tests/test_stoneage_rules01_crosssystem_preflight.py"
      - ".github/workflows/validate-stoneage-rules01-preflight.yml"
  workflow_dispatch:
jobs:
  source-qualified-playflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_stoneage_rules01_crosssystem_preflight.py -v
