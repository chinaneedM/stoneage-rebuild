name: Probe Waei early trial download redirects

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_trial_router_cdx_probe.py
      - tests/test_stoneage_waei_trial_router_cdx_probe.py
      - .github/workflows/probe-stoneage-waei-trial-router-cdx.yml

permissions:
  contents: write

concurrency:
  group: stoneage-waei-trial-router-cdx
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate redirect-preserving CDX probe
        run: python3 -m unittest tests.test_stoneage_waei_trial_router_cdx_probe -v
      - name: Probe early Waei central-download redirect metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_trial_router_cdx_probe \
            > research/recovered/STONEAGE-WAEI-TRIAL-ROUTER-CDX-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-WAEI-TRIAL-ROUTER-CDX-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Waei early trial redirects'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_waei_trial_router_cdx_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe Waei early trial redirects'
          fi
          git push
