name: Verify official Wayi world synopsis and bounded version relationships
on:
  push:
    paths:
      - tools/stoneage_wayi_official_worldline.py
      - tools/stoneage_material_review_r4.py
      - tests/test_stoneage_wayi_official_worldline.py
      - docs/specs/STONEAGE-WAYI-OFFICIAL-WORLDLINE-R1.md
      - research/recovered/STONEAGE-WAYI-OFFICIAL-WORLDLINE*.json
      - research/recovered/STONEAGE-CROSS-DOMAIN-MATERIAL-REVIEW-R4.json
      - .github/workflows/verify-stoneage-wayi-official-worldline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-official-world-and-partial-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Reject invented chronology, answered mysteries, build promotion and image overclaims
        run: python -m unittest tests.test_stoneage_wayi_official_worldline -v
      - name: Independently reacquire two HTML and eight original GIF slices
        run: |
          python -m tools.stoneage_wayi_official_worldline --output "${{ runner.temp }}/worldline/wayi-official-worldline.json"
          cmp "${{ runner.temp }}/worldline/wayi-official-worldline.json" research/recovered/STONEAGE-WAYI-OFFICIAL-WORLDLINE-R1.json
          python -m tools.stoneage_material_review_r4 --output "${{ runner.temp }}/worldline/material-review-r4.json"
          cmp "${{ runner.temp }}/worldline/material-review-r4.json" research/recovered/STONEAGE-CROSS-DOMAIN-MATERIAL-REVIEW-R4.json
      - uses: actions/upload-artifact@v4
        with:
          name: wayi-official-worldline-derived-reports
          path: ${{ runner.temp }}/worldline/*.json
          retention-days: 30
