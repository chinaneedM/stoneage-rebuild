name: Probe 21CN StoneAge 2.5 updater URL variants

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_21cn_mirror_variant_probe.py
      - tests/test_stoneage_sa25_21cn_mirror_variant_probe.py
      - .github/workflows/probe-stoneage-sa25-21cn-mirror-variants.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-21cn-mirror-variants
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sa25_21cn_mirror_variant_probe -v
      - name: Probe URL-prefix variants
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_21cn_mirror_variant_probe > research/recovered/STONEAGE-SA25-21CN-MIRROR-VARIANTS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA25-21CN-MIRROR-VARIANTS-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe 21CN sa25up URL variants'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*2)); done
          exit 1
