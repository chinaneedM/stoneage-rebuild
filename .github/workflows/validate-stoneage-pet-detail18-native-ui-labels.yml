name: PET-DETAIL18 original native Taiwan PC skill ID to UI literal safeguards
on:
  push:
    paths:
      - 'research/pets/PET-DETAIL-EVIDENCE18-TW10-NATIVE-ID200-201-UI-LABEL-BRIDGE-R1.json'
      - 'docs/continuity/STONEAGE-PET-DETAIL18-TW10-ORIGINAL-ID200-201-UI-LABELS-20261122.md'
      - 'tools/stoneage_pet_detail18_tw10_native_ui_label_replay.py'
      - 'tests/test_stoneage_pet_detail18_native_ui_label_r1.py'
      - 'docs/pets/INDEX.md'
      - '.github/workflows/validate-stoneage-pet-detail18-native-ui-labels.yml'
  pull_request:
    paths:
      - 'research/pets/PET-DETAIL-EVIDENCE18-TW10-NATIVE-ID200-201-UI-LABEL-BRIDGE-R1.json'
      - 'docs/continuity/STONEAGE-PET-DETAIL18-TW10-ORIGINAL-ID200-201-UI-LABELS-20261122.md'
      - 'tools/stoneage_pet_detail18_tw10_native_ui_label_replay.py'
      - 'tests/test_stoneage_pet_detail18_native_ui_label_r1.py'
      - 'docs/pets/INDEX.md'
      - '.github/workflows/validate-stoneage-pet-detail18-native-ui-labels.yml'
permissions:
  contents: read
jobs:
  public-derived-original-native-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-qualified receipt without original commercial bytes
        run: |
          python -m py_compile tools/stoneage_pet_detail18_tw10_native_ui_label_replay.py
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail18_native_ui_label_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail17_200_201_community_candidate_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail16_tw10_native_battle_skill_r1.py' -v
