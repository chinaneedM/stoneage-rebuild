name: Validate single-player original-resource offline observation kit
on:
  push:
    paths:
      - tools/stoneage_singleplayer_observation_kit.py
      - tests/test_stoneage_singleplayer_observation_kit.py
      - .github/workflows/verify-stoneage-offline-asset-first-r1.yml
      - docs/continuity/STONEAGE-SINGLEPLAYER-ASSET-FIRST-20261030.md
  pull_request:
    paths:
      - tools/stoneage_singleplayer_observation_kit.py
      - tests/test_stoneage_singleplayer_observation_kit.py
      - .github/workflows/verify-stoneage-offline-asset-first-r1.yml
      - docs/continuity/STONEAGE-SINGLEPLAYER-ASSET-FIRST-20261030.md
permissions:
  contents: read
jobs:
  offline-synthetic-negative-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run source-preserving synthetic regression tests
        run: python3 -m unittest tests.test_stoneage_singleplayer_observation_kit -v
      - name: Recheck original pinned animation catalog without proprietary source bytes
        run: python3 -m tools.stoneage_original_animation_lab --check-report
