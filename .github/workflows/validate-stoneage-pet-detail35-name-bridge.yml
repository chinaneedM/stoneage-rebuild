name: Validate PET-DETAIL35 original-PC name crosswalk
on:
  push:
    paths:
      - 'research/pets/PET-DETAIL-EVIDENCE35-CN2002-2003-NAME-TO-CN50-ALBUM-BRIDGE-R1.json'
      - 'tests/test_stoneage_pet_detail35_cn2002_2003_name_bridge.py'
      - '.github/workflows/validate-stoneage-pet-detail35-name-bridge.yml'
  pull_request:
    paths:
      - 'research/pets/PET-DETAIL-EVIDENCE35-CN2002-2003-NAME-TO-CN50-ALBUM-BRIDGE-R1.json'
      - 'tests/test_stoneage_pet_detail35_cn2002_2003_name_bridge.py'
  workflow_dispatch:
jobs:
  evidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_pet_detail35_cn2002_2003_name_bridge.py' -v
