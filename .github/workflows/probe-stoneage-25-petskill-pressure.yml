name: Rank recovered StoneAge pet-skill callback pressure
concurrency:
  group: stoneage-25-petskill-pressure-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-stoneage-25-petskill-pressure.yml
      - tools/stoneage_battlemodel_placement_capability.py
      - tests/test_stoneage_battlemodel_placement_capability.py
      - tools/stoneage_recovered25_petskill_pressure_probe.py
      - tests/test_stoneage_recovered25_petskill_pressure_probe.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate pressure-ranking logic
        run: python3 -m unittest tests.test_stoneage_recovered25_petskill_pressure_probe tests.test_stoneage_battlemodel_placement_capability -v
      - run: sudo apt-get update && sudo apt-get install -y unar
      - name: Recover verified preservation bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib,html,json,re,http.cookiejar,urllib.parse,urllib.request
          from pathlib import Path
          ua='Mozilla/5.0'; hashes={'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5','ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb'}
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def get(k,s):
            data=urllib.parse.urlencode({'quick_key':k,'response_format':'json'}).encode()
            req=urllib.request.Request('https://www.mediafire.com/api/1.5/file/get_info.php',data=data,headers={'User-Agent':ua})
            with op.open(req,timeout=60) as r:i=json.load(r)['response']['file_info']
            if str(i.get('hash','')).lower()!=hashes[k]:raise SystemExit('metadata hash changed')
            with op.open(urllib.request.Request(i['links']['normal_download'],headers={'User-Agent':ua}),timeout=60) as r:
              page=r.read().decode('utf-8','replace');ref=r.geturl()
            m=re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S) or re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
            if not m:raise SystemExit('no direct link')
            p=Path('/tmp/sa25')/('part.'+s);h=hashlib.sha256()
            with op.open(urllib.request.Request(html.unescape(m.group(1)),headers={'User-Agent':ua,'Referer':ref}),timeout=300) as r,p.open('wb') as o:
              while True:
                b=r.read(1048576)
                if not b:break
                o.write(b);h.update(b)
            if h.hexdigest()!=hashes[k]:raise SystemExit('hash mismatch')
          get('ev7l29fw77891go','001');get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 >/tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar|awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out
          ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/dev/null 2>&1
      - name: Rank active enemybase pet-skill callback pressure
        run: |
          D="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv/data' -print -quit)"
          C="$(find /tmp/sa25/out -type f -path '*/SA2.5服務端/gmsv/setup.cf' -print -quit)"
          test -n "$D"; test -n "$C"
          mkdir -p research/recovered
          python3 -m tools.stoneage_recovered25_petskill_pressure_probe \
            --data-dir "$D" --setup "$C" \
            > research/recovered/STONEAGE-25-PETSKILL-PRESSURE-R1.txt
          grep -F 'TOTAL|positive_skill_slot_uses|2486' research/recovered/STONEAGE-25-PETSKILL-PRESSURE-R1.txt
          grep -F 'TOTAL|unresolved_skill_ids|0' research/recovered/STONEAGE-25-PETSKILL-PRESSURE-R1.txt
          grep -F 'CAPABILITY_PRESSURE|total=2486|closed=2465|open=18|historical_ub=3' research/recovered/STONEAGE-25-PETSKILL-PRESSURE-R1.txt
          grep -F 'callback=PETSKILL_BecomeFox|ids=625|slot_uses=2|templates=2|status=closed_runtime' research/recovered/STONEAGE-25-PETSKILL-PRESSURE-R1.txt
          test "$(grep -c '^CONDITIONAL_PLACEMENT|' research/recovered/STONEAGE-25-PETSKILL-PRESSURE-R1.txt)" = 2
          grep -F 'NEXT_OPEN|callback=PETSKILL_BecomePig|ids=631,635|slot_uses=2|templates=2' research/recovered/STONEAGE-25-PETSKILL-PRESSURE-R1.txt
      - name: Commit derived ranking report
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-25-PETSKILL-PRESSURE-R1.txt
          if git diff --cached --quiet; then echo 'Pressure report unchanged.'; exit 0; fi
          git commit -m 'research: rank recovered pet-skill callback pressure'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
