name: Validate P3D actual RGB and received-input evidence boundaries
on:
  push:
    branches: [main, agent/synthetic-win32-p3d-20261026]
    paths:
      - 'tools/stoneage_p3d_*'
      - 'tests/test_stoneage_p3d_*'
      - 'research/recovered/STONEAGE-P3D-SYNTHETIC-*.json'
      - 'docs/continuity/STONEAGE-SYNTHETIC-WIN32-P3D-20261026.md'
      - '.github/workflows/verify-stoneage-synthetic-win32-p3d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-measurement-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest -v tests.test_stoneage_p3d_bench tests.test_stoneage_p3d_evidence_guard
      - run: python -m tools.stoneage_p3d_evidence_guard
