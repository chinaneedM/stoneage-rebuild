name: PET-HIGH-FIRST-45 bulk acquisition source replay
on:
  push:
    branches: [agent/pet-high-first-45-bulk-acquisition-20261124]
    paths:
      - 'tools/stoneage_pet_high_first_45_source.py'
      - '.github/workflows/pet-high-first-45-source.yml'
permissions:
  contents: read
jobs:
  original-members:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rarfile==4.2
      - run: sudo apt-get update -qq && sudo apt-get install -y unar
      - run: python -m tools.stoneage_pet_high_first_45_source --output /tmp/pet45-derived.json
      - uses: actions/upload-artifact@v4
        with:
          name: pet45-derived-metadata-only
          path: /tmp/pet45-derived.json
          retention-days: 7
          if-no-files-found: error
