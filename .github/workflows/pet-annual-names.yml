name: PET annual named evidence access
on:
  push:
    branches: ['agent/pet-annual-names-20261126', 'agent/pet-annual-subordinate-20261126', 'agent/pet-annual-unmatched-20261126']
    paths:
      - 'tools/stoneage_pet_annual_names.py'
      - 'tools/stoneage_pet_source_lookup.py'
      - 'research/pets/PET-ANNUAL-NAMED-EVIDENCE-SELECTION-R1.json'
      - 'research/pets/PET-ANNUAL-SUBORDINATE-NAMES-R1.json'
      - '.github/workflows/pet-annual-names.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --verify
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --year 2003 --region CN --query 波比 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --region KR --query 도에디크 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --year 2023 --query 里拉拉 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --year 2025 --query 雷爾的意念 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --year 2012 --query 呼拔拔 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --year 2018 --query 貝洛寶利 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --year 2020 --query 米尼樂 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --year 2020 --query 風地貓卡芙娜 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --year 2005 --query ヴァンレム --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --year 2006 --query 普格多基 --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --history --verify
      - run: python tools/stoneage_pet_source_lookup.py --documentary --verify
      - run: python tools/stoneage_pet_source_lookup.py --legacy-pet16 --verify
      - run: python tools/stoneage_pet_source_lookup.py --verify
      - run: python tools/stoneage_pet_gap_queue.py --current --verify
      - run: PYTHONPATH=. python tools/stoneage_pet_final_review_matrix.py
      - run: cmp pet-final-review-matrix.json research/pets/PET-FINAL-REVIEW-MATRIX-R1.json
