name: Probe StoneAge Waei central download 2001

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_download_center_2001_probe.py
      - tests/test_stoneage_waei_download_center_2001_probe.py
      - .github/workflows/probe-stoneage-waei-download-center-2001.yml

permissions:
  contents: write

concurrency:
  group: stoneage-waei-download-center-2001
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate central-download probe
        run: python3 -m unittest tests.test_stoneage_waei_download_center_2001_probe -v
      - name: Probe Waei central download archive
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_download_center_2001_probe \
            > research/recovered/STONEAGE-WAEI-DOWNLOAD-CENTER-2001-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-WAEI-DOWNLOAD-CENTER-2001-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Waei central download for early StoneAge'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_waei_download_center_2001_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe Waei central download for early StoneAge'
          fi
          git push
