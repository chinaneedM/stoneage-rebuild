name: Validate StoneAge 2BattleTimid runtime

concurrency:
  group: stoneage-2battletimid-runtime-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-2battletimid-runtime.yml"
      - "tools/stoneage_2battletimid_reference_model.py"
      - "tools/stoneage_enemy_ai_2battletimid_bridge.py"
      - "tools/stoneage_battle_round_model.py"
      - "tools/stoneage_default_pet_exit_model.py"
      - "tools/stoneage_battle_state_model.py"
      - "tools/stoneage_singleplayer_domain.py"
      - "tools/stoneage_singleplayer_persistence.py"
      - "tools/stoneage_singleplayer_runtime.py"
      - "tools/stoneage_local_runtime_session_coordinator.py"
      - "tests/test_stoneage_2battletimid_reference_model.py"
      - "tests/test_stoneage_2battletimid_runtime.py"
      - "tests/test_stoneage_singleplayer_persistence.py"
      - "tests/test_stoneage_local_runtime_session_coordinator.py"
      - "specs/STONEAGE-2BATTLETIMID-RUNTIME-STATE-AUDIT-R1.md"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bounded 2BattleTimid runtime seam
        run: |
          python -m unittest -v \
            tests.test_stoneage_2battletimid_reference_model \
            tests.test_stoneage_2battletimid_runtime \
            tests.test_stoneage_singleplayer_persistence \
            tests.test_stoneage_local_runtime_session_coordinator.LocalRuntimeSessionCoordinatorTests.test_recovered_enemy_ai_2battletimid_recall_roundtrips_world_save_and_noreturn
