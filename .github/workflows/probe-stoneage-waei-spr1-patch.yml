name: Probe StoneAge Waei spr1 patch provenance

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_spr1_patch_probe.py
      - tests/test_stoneage_waei_spr1_patch_probe.py
      - .github/workflows/probe-stoneage-waei-spr1-patch.yml

permissions:
  contents: write

concurrency:
  group: stoneage-waei-spr1-patch
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate targeted spr1 probe
        run: python3 -m unittest tests.test_stoneage_waei_spr1_patch_probe -v
      - name: Probe archived spr1 and detail-page association
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_spr1_patch_probe             > research/recovered/STONEAGE-WAEI-SPR1-PATCH-PROVENANCE-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-WAEI-SPR1-PATCH-PROVENANCE-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Waei spr1 patch provenance'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_waei_spr1_patch_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe Waei spr1 patch provenance'
          fi
          git push
