name: Verify StoneAge INTEGRATION25 seven original source market shops
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION25-ORIGINAL-2009-MARKET-SEVEN-SHOPS-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_25.py'
      - 'docs/continuity/STONEAGE-INTEGRATION25-MARKET-SEVEN-SHOPS-20261109.md'
      - '.github/workflows/verify-stoneage-integration25-source.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION25-ORIGINAL-2009-MARKET-SEVEN-SHOPS-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_25.py'
      - 'docs/continuity/STONEAGE-INTEGRATION25-MARKET-SEVEN-SHOPS-20261109.md'
      - '.github/workflows/verify-stoneage-integration25-source.yml'
      - 'README.md'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_25.py' -v
