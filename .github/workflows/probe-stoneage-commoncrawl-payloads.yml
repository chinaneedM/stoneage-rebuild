name: Probe StoneAge payloads in Common Crawl
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_commoncrawl_exact_payload_probe.py
      - tests/test_stoneage_commoncrawl_exact_payload_probe.py
      - .github/workflows/probe-stoneage-commoncrawl-payloads.yml

permissions:
  contents: write

concurrency:
  group: stoneage-commoncrawl-payloads
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_commoncrawl_exact_payload_probe -v
      - name: Query oldest Common Crawl indexes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_commoncrawl_exact_payload_probe             > research/recovered/STONEAGE-COMMONCRAWL-EXACT-PAYLOADS-R1.txt
      - name: Commit derived crawl metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-COMMONCRAWL-EXACT-PAYLOADS-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe StoneAge payloads in Common Crawl'
          git pull --rebase origin main
          git push
