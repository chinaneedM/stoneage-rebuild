name: Verify StoneAge INTEGRATION36 original quiz source and inactive backup
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION36-QUIZ-THREE-BROTHERS-ORIGINAL-SOURCE-R1.json'
      - 'docs/continuity/STONEAGE-INTEGRATION36-QUIZ-THREE-BROTHERS-20261110.md'
      - 'tests/test_stoneage_integration_module_36.py'
      - '.github/workflows/verify-stoneage-integration36-source.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION36-QUIZ-THREE-BROTHERS-ORIGINAL-SOURCE-R1.json'
      - 'docs/continuity/STONEAGE-INTEGRATION36-QUIZ-THREE-BROTHERS-20261110.md'
      - 'tests/test_stoneage_integration_module_36.py'
      - '.github/workflows/verify-stoneage-integration36-source.yml'
      - 'README.md'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_36.py' -v
