name: Measure bounded disposable Windows guest egress denial and input P3G
on:
  push:
    branches: [agent/original-world-p3g-20261028]
    paths:
      - tools/stoneage_p3g_isolation.py
      - .github/workflows/probe-stoneage-p3g-isolation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-own-only:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - shell: pwsh
        run: python -m tools.stoneage_p3g_manifest_environment --prepare "$env:RUNNER_TEMP/p3g-isolation"
      - name: Build synthetic checker and RGB input receiver before temporary denial
        shell: cmd
        run: |
          cl /nologo /std:c11 /O2 /Fe:"%RUNNER_TEMP%\p3g-isolation\correct_zh_tw.exe" tools\stoneage_p3e_environment.c user32.lib gdi32.lib ddraw.lib dxguid.lib ws2_32.lib /link /SUBSYSTEM:CONSOLE /MANIFEST:NO
          mt.exe -manifest "%RUNNER_TEMP%\p3g-isolation\correct_zh_tw.manifest" "-outputresource:%RUNNER_TEMP%\p3g-isolation\correct_zh_tw.exe;#1"
          copy /Y "%RUNNER_TEMP%\p3g-isolation\correct_zh_tw.exe" "%RUNNER_TEMP%\p3g-isolation\network-copy.exe"
          cl /nologo /std:c11 /O2 /Fe:"%RUNNER_TEMP%\p3g-isolation\control-zh-tw.exe" tools\stoneage_p3d_control.c user32.lib gdi32.lib ddraw.lib dxguid.lib /link /SUBSYSTEM:WINDOWS /MANIFEST:NO
          mt.exe -manifest "%RUNNER_TEMP%\p3g-isolation\correct_zh_tw.manifest" "-outputresource:%RUNNER_TEMP%\p3g-isolation\control-zh-tw.exe;#1"
      - run: python -m pip install --quiet pillow
      - name: Arm independent SYSTEM rollback, measure denial and receiving process, restore before upload
        shell: pwsh
        run: python -m tools.stoneage_p3g_isolation --directory "$env:RUNNER_TEMP/p3g-isolation" --output "$env:RUNNER_TEMP/p3g-isolation-derived.json"
      - name: Final narrowly named cleanup
        if: always()
        shell: pwsh
        run: |
          Remove-NetFirewallRule -Name StoneAgeP3GDisposableGuestOutbound -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName StoneAgeP3GDisposableGuestRestore -Confirm:$false -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP/p3g-isolation" -ErrorAction SilentlyContinue
          Remove-Item -Force stoneage_p3e_environment.obj,stoneage_p3d_control.obj -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3g-disposable-egress-derived-only
          path: ${{ runner.temp }}/p3g-isolation-derived.json
          if-no-files-found: error
          retention-days: 7
