name: PET Korea archived material bounded replay
on:
  push:
    branches: ['agent/pet-kr-archive-targets-20261126']
    paths:
      - 'tools/stoneage_pet_kr_archive_targets.py'
      - 'research/pets/PET-KR-ARCHIVE-TARGETS-R1.json'
      - '.github/workflows/pet-kr-archive-targets.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/stoneage_pet_kr_archive_targets.py --verify
      - run: python tools/stoneage_pet_kr_archive_targets.py > pet-kr-archive-replay.json
      - run: cat pet-kr-archive-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: pet-kr-archive-replay-derived-metadata
          path: pet-kr-archive-replay.json
      - run: python tools/stoneage_pet_source_lookup.py --annual-names --verify
      - run: PYTHONPATH=. python tools/stoneage_pet_final_review_matrix.py
      - run: cmp pet-final-review-matrix.json research/pets/PET-FINAL-REVIEW-MATRIX-R1.json
