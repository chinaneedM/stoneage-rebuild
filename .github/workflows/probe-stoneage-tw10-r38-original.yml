name: Probe TW1.0 original R38 conditional ESP slots and shared-store inputs
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r38-stack-shared-store-20261014]
    paths:
      - .github/workflows/probe-stoneage-tw10-r38-original.yml
      - tools/stoneage_tw10_savedata_native_io_r38.py
      - tools/stoneage_tw10_savedata_native_io_r38_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r38.py
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: R38 and inherited synthetic strict gates
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r38 tests.test_stoneage_tw10_savedata_native_io_r37
      - name: Retrieve authenticated transient TW1.0 retail archive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m tools.stoneage_tw10_archive_parallel_download --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar; then
              echo TW10_R38_PINNED_ARCHIVE=PASS
              break
            fi
            rm -f /tmp/CD_DIC.rar
            if [ "$attempt" -eq 3 ]; then
              echo TW10_R38_SOURCE_UNAVAILABLE=OPEN
              exit 1
            fi
            sleep 10
          done
      - name: Extract original BIN transient only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r38
          7z x -y -o/tmp/stoneage-r38 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r38/STONEAGE.bin)" -eq 523449360
      - name: Derive bounded R38 static-only original metadata
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_native_io_r38 --bin /tmp/stoneage-r38/STONEAGE.bin > /tmp/stoneage-r38-derived.json
          python -m tools.stoneage_tw10_savedata_native_io_r38_guard --report /tmp/stoneage-r38-derived.json
          test "$(stat -c %s /tmp/stoneage-r38-derived.json)" -le 100000
          echo TW10_R38_ORIGINAL_STATIC_ONLY=PASS
          echo TW10_R38_NATIVE_SAVE=OPEN
      - name: Always purge proprietary source
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r38
      - name: Upload derived metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-r38-original-stack-shared-store-derived
          path: /tmp/stoneage-r38-derived.json
          retention-days: 21
