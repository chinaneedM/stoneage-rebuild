name: Probe archived JSS SaUpdate HTTP flow
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_jss_saupdate_http_flow_probe.py
      - tests/test_stoneage_jss_saupdate_http_flow_probe.py
      - .github/workflows/probe-stoneage-jss-saupdate-http-flow.yml

permissions:
  contents: write

concurrency:
  group: stoneage-jss-saupdate-http-flow
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate SaUpdate HTTP-flow probe
        run: python3 -m unittest tests.test_stoneage_jss_saupdate_http_flow_probe -v
      - name: Derive HTTP/update topology transiently
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_jss_saupdate_http_flow_probe \
            > research/recovered/STONEAGE-JSS-SAUPDATE-HTTP-FLOW-R1.txt
      - name: Verify no executable or binary resource was retained
        run: |
          set -euo pipefail
          ! find research tools tests -type f \( -iname '*.exe' -o -iname '*.bin' -o -iname '*.cab' -o -iname '*.zip' \) -print -quit | grep -q .
      - name: Commit derived topology only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-JSS-SAUPDATE-HTTP-FLOW-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: derive JSS SaUpdate HTTP topology'
          git pull --rebase origin main
          git push
