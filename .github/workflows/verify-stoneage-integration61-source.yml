name: Verify StoneAge INTEGRATION61 original chef dish pixels
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION61-TWO-CHEFS-THREE-DISHES-TW1-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_61.py'
      - '.github/workflows/verify-stoneage-integration61-source.yml'
      - 'research/recovered/STONEAGE-O75-ORIGINAL-COOKING-CRAFTING-NPC-SOURCE-R1.json'
      - 'research/recovered/item-module-01/**'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION61-TWO-CHEFS-THREE-DISHES-TW1-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_61.py'
      - '.github/workflows/verify-stoneage-integration61-source.yml'
      - 'research/recovered/STONEAGE-O75-ORIGINAL-COOKING-CRAFTING-NPC-SOURCE-R1.json'
      - 'research/recovered/item-module-01/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_61.py' -v
