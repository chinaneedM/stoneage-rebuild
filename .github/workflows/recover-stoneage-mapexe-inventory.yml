name: Recover historical map.exe inventory

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_mapexe_full_probe.py
      - tests/test_stoneage_mapexe_full_probe.py
      - .github/workflows/recover-stoneage-mapexe-inventory.yml

permissions:
  contents: write

concurrency:
  group: stoneage-mapexe-inventory
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded full-recovery analyzer
        run: python3 -m unittest tests.test_stoneage_mapexe_full_probe -v
      - name: Install archive inspector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
      - name: Recover bounded historical executable
        run: |
          set -euo pipefail
          python3 -m tools.stoneage_mapexe_full_probe --recover /tmp/map.exe > /tmp/recover.txt
          file /tmp/map.exe | tee /tmp/file.txt
          7z l -slt /tmp/map.exe > /tmp/7z-list.txt 2>&1 || true
      - name: Extract transient map payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/mapx
          7z x -y -o/tmp/mapx /tmp/map.exe > /tmp/7z-extract.txt 2>&1
      - name: Build derived inventory and delete payload
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          R=research/recovered/STONEAGE-HISTORICAL-MAPEXE-INVENTORY-R1.txt
          cat /tmp/recover.txt > "$R"
          echo "FILE_TOOL|$(cat /tmp/file.txt)" >> "$R"
          echo "SEVENZIP_LIST_BEGIN" >> "$R"
          cat /tmp/7z-list.txt >> "$R"
          echo "SEVENZIP_LIST_END" >> "$R"
          python3 -m tools.stoneage_mapexe_full_probe --analyze /tmp/mapx >> "$R"
          rm -rf /tmp/mapx /tmp/map.exe /tmp/recover.txt /tmp/file.txt /tmp/7z-list.txt /tmp/7z-extract.txt
      - name: Commit derived inventory only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-HISTORICAL-MAPEXE-INVENTORY-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: inventory historical map.exe payload'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
