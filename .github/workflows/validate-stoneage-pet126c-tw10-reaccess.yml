name: PET126C authenticated original TW1 source reaccess receipt
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-PET126C-TW10-ORIGINAL-SOURCE-REACCESS-R1.json'
      - 'docs/continuity/STONEAGE-PET126C-TW10-ORIGINAL-BYTES-REACCESS-20261120.md'
      - 'tests/test_stoneage_pet126c_tw10_reaccess.py'
      - '.github/workflows/validate-stoneage-pet126c-tw10-reaccess.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-PET126C-TW10-ORIGINAL-SOURCE-REACCESS-R1.json'
      - 'docs/continuity/STONEAGE-PET126C-TW10-ORIGINAL-BYTES-REACCESS-20261120.md'
      - 'tests/test_stoneage_pet126c_tw10_reaccess.py'
      - '.github/workflows/validate-stoneage-pet126c-tw10-reaccess.yml'
jobs:
  source-custody-public-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PET126C source receipt with PET39 and year gates
        run: |
          python -m unittest discover -s tests -p 'test_stoneage_pet126c_tw10_reaccess.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet39_tw10_album.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet126_2026_ytd_pc_gap_matrix.py' -v
