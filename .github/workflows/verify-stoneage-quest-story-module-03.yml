name: Verify QUEST03 original quiz and timed NPC source-bounded joins
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-QUEST-STORY-MODULE-03-QUIZ-TIMEMAN-ORIGINAL-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-CHARACTER-NPC-MODULE-01-FULL-SOURCE-ROWS-R1.json'
      - 'tests/test_stoneage_quest_story_module_03.py'
      - '.github/workflows/verify-stoneage-quest-story-module-03.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-QUEST-STORY-MODULE-03-QUIZ-TIMEMAN-ORIGINAL-SOURCE-R1.json'
      - 'tests/test_stoneage_quest_story_module_03.py'
  workflow_dispatch:
jobs:
  source-bounded-static-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_quest_story_module_03.py' -v
