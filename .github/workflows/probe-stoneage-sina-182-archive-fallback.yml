name: Probe Sina-labelled StoneAge 1.82 archive fallbacks
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sina_182_archive_fallback_probe.py
      - tests/test_stoneage_sina_182_archive_fallback_probe.py
      - .github/workflows/probe-stoneage-sina-182-archive-fallback.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sina-182-archive-fallback
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate Sina-labelled 1.82 fallback probe
        run: python3 -m unittest tests.test_stoneage_sina_182_archive_fallback_probe -v
      - name: Probe independent archive indexes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sina_182_archive_fallback_probe \
            > research/recovered/STONEAGE-SINA-182-ARCHIVE-FALLBACK-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          report='research/recovered/STONEAGE-SINA-182-ARCHIVE-FALLBACK-R1.txt'
          git add "$report"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Sina-labelled 1.82 archive fallbacks'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_sina_182_archive_fallback_probe > "$report"
            git add "$report"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe Sina-labelled 1.82 archive fallbacks'
          fi
          git push
