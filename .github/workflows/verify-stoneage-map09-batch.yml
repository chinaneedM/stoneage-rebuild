name: Verify MAP09 source-ready batch and synthetic observer
on:
  push:
    branches: [main, agent/map09-batch-scenes-20261107]
    paths:
      - tools/stoneage_map09_*
      - tests/test_stoneage_map09_*
      - research/recovered/STONEAGE-MAP09-*.json
      - .github/workflows/verify-stoneage-map09-batch.yml
  pull_request:
    paths:
      - tools/stoneage_map09_*
      - tests/test_stoneage_map09_*
      - research/recovered/STONEAGE-MAP09-*.json
      - .github/workflows/verify-stoneage-map09-batch.yml
permissions: {contents: read}
jobs:
  metadata-and-synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install pillow==11.3.0 numpy==2.2.6
      - run: python -m unittest discover -s tests -p 'test_stoneage_map09_*.py' -v
      - run: npm install --prefix /tmp/map09-browser playwright@1.55.1
      - name: Synthetic source planes and full canvas UI checks; no private original pixels
        run: |
          python -m tools.stoneage_map09_fixture /tmp/map09-fixture
          CHROME_PATH="$(command -v google-chrome)" PLAYWRIGHT_MODULE=/tmp/map09-browser/node_modules/playwright node tools/stoneage_map09_browser.cjs /tmp/map09-fixture/MAP09.html /tmp/map09-synthetic-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map09-synthetic-browser-derived-only
          path: /tmp/map09-synthetic-browser.json
          if-no-files-found: warn
          retention-days: 7
