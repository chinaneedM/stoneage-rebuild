name: Map StoneAge Waei spr1 field differences
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_tw10_spr_field_diff.py
      - tests/test_stoneage_waei_tw10_spr_field_diff.py
      - .github/workflows/diff-stoneage-waei-spr1-fields.yml
permissions:
  contents: write
concurrency:
  group: stoneage-waei-spr1-fields
  cancel-in-progress: true
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic diff
        run: python3 -m unittest tests.test_stoneage_waei_tw10_spr_field_diff -v
      - name: Download accepted Taiwan preservation archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 --silent --show-error -o /tmp/CD_DIC.rar 'https://archive.org/download/stoneage_tw_2000_win/CD_DIC.rar'
          7z x -y -o/tmp/tw10 /tmp/CD_DIC.rar 'STONEAGE.bin' >/dev/null
          test "$(stat -c %s /tmp/tw10/STONEAGE.bin)" = "523449360"
      - name: Map field differences
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_tw10_spr_field_diff --tw-bin /tmp/tw10/STONEAGE.bin > research/recovered/STONEAGE-WAEI-VS-TW10-SPR1-FIELD-DIFF-R2.txt
          rm -f /tmp/CD_DIC.rar /tmp/tw10/STONEAGE.bin
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-WAEI-VS-TW10-SPR1-FIELD-DIFF-R2.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: map Waei spr1 field differences'
          git pull --rebase origin main || { git rebase --abort || true; exit 1; }
          git push
