name: Verify SCENE14 same-carrier room shop source linkage
on:
  push:
    branches: [main, agent/scene14-room-shop-20261029]
    paths:
      - tools/stoneage_scene14_room_shop.py
      - tools/stoneage_scene14_independent_replay.py
      - tools/scene-room-shop-viewer-r14.html
      - tests/test_stoneage_scene14_room_shop.py
      - research/recovered/STONEAGE-SCENE14-ROOM-SHOP-SOURCE-R1.json
      - research/recovered/STONEAGE-SCENE14-ACCEPTANCE-R1.json
      - .github/workflows/verify-stoneage-scene14-room-shop.yml
  pull_request:
    paths:
      - tools/stoneage_scene14_room_shop.py
      - tools/stoneage_scene14_independent_replay.py
      - tools/scene-room-shop-viewer-r14.html
      - tests/test_stoneage_scene14_room_shop.py
      - research/recovered/STONEAGE-SCENE14-ROOM-SHOP-SOURCE-R1.json
      - research/recovered/STONEAGE-SCENE14-ACCEPTANCE-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-linkage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rarfile==4.2
      - run: python -m tools.stoneage_scene14_room_shop
      - run: python -m unittest -v tests.test_stoneage_scene14_room_shop tests.test_stoneage_preserved_item_shop_r44 tests.test_stoneage_item_shop_material_r44 tests.test_stoneage_scene13_pet_action0
