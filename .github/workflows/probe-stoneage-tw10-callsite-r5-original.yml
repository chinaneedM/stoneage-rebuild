name: Probe TW1.0 original R5 savedata callsite/API surfaces by pinned archive

on:
  workflow_dispatch:
  push:
    branches:
      - agent/tw10-savedata-callsite-r5-20261012
    paths:
      - .github/workflows/probe-stoneage-tw10-callsite-r5-original.yml

permissions:
  contents: read

jobs:
  original-static:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
      - name: Verify static path and import-count semantics on synthetic x86
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python3 -m unittest tests.test_stoneage_tw10_savedata_callsite_r5 -v
      - name: Retrieve strictly catalog-pinned original archive in bounded ranges
        run: |
          set -euo pipefail
          python3 -m tools.stoneage_tw10_archive_parallel_download \
            --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar
      - name: Extract accepted disc image for static analysis only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r5
          7z x -y -o/tmp/stoneage-r5 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r5/STONEAGE.bin)" = 523449360
      - name: Verify original embedded hashes and emit bounded R5 metadata only
        run: |
          set -euo pipefail
          python3 -m tools.stoneage_tw10_savedata_callsite_r5 \
            --bin /tmp/stoneage-r5/STONEAGE.bin | tee /tmp/stoneage-r5-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/stoneage-r5-report.json').read_text())
          assert data['schema']=='stoneage-tw10-savedata-r5-static-api-neighborhood'
          assert data['status']=='PINNED_ORIGINAL_STATIC_SURFACE_NOT_NATIVE_IO'
          assert len(data['sites'])==4
          assert data['r4_graph_nodes']==31665 and data['r4_graph_edges']==35092
          assert data['r4_graph_limit_hit'] is False
          assert all(site['entrypoint_graph_min_hops'] is not None
                     and site['actual_path_feasibility_proven'] is False
                     and site['filename_argument_to_file_api_proven'] is False
                     and site['native_read_write_size_proven'] is False
                     for site in data['sites'])
          assert data['filename_argument_to_CreateFileA_proven'] is False
          assert data['ReadFile_WriteFile_buffer_size_proven'] is False
          assert data['native_save_io_executed'] is False
          assert data['original_bytes_published'] is False
          print('TW10_R5_ORIGINAL_STATIC_NEIGHBORHOOD=PASS')
          print('TW10_R5_NATIVE_SAVE_IO=OPEN')
          PY
      - name: Remove copyrighted original media even on error
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r5
      - name: Upload derived-only JSON when every provenance gate succeeded
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-original-callsite-r5-derived
          path: /tmp/stoneage-r5-report.json
          retention-days: 21
