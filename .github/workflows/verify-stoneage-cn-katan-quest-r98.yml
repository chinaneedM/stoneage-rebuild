name: Verify R98 Katan quest NPC handover source conflicts
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN-KATAN-QUEST-SOURCE-CONFLICTS-R98.json'
      - 'tools/stoneage_cn_katan_quest_r98.py'
      - 'tests/test_stoneage_cn_katan_quest_r98.py'
      - '.github/workflows/verify-stoneage-cn-katan-quest-r98.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN-KATAN-QUEST-SOURCE-CONFLICTS-R98.json'
      - 'tools/stoneage_cn_katan_quest_r98.py'
      - 'tests/test_stoneage_cn_katan_quest_r98.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-r98-source-conflicts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stoneage_cn_katan_quest_r98 -v
      - run: python -m tools.stoneage_cn_katan_quest_r98
