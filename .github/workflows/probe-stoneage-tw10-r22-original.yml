name: Probe TW1.0 original R22 writer CALL, HeapReAlloc and alias cycle
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r22-call-stack-cycle-20261012]
    paths:
      - .github/workflows/probe-stoneage-tw10-r22-original.yml
      - tools/stoneage_tw10_savedata_upstream_r22.py
      - tests/test_stoneage_tw10_savedata_upstream_r22.py
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: R22 and R21 synthetic prerequisite
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_upstream_r22 tests.test_stoneage_tw10_savedata_upstream_r21
      - name: Transient historic pinned archive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m tools.stoneage_tw10_archive_parallel_download --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar; then
              echo TW10_R22_ARCHIVE_PINNED=PASS
              break
            fi
            rm -f /tmp/CD_DIC.rar
            if [ "$attempt" -eq 3 ]; then
              echo TW10_R22_ARCHIVE_SOURCE_UNAVAILABLE=OPEN
              exit 1
            fi
            sleep 10
          done
      - name: Extract pinned original BIN TEMP only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r22
          7z x -y -o/tmp/stoneage-r22 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r22/STONEAGE.bin)" -eq 523449360
      - name: Static original R22 derived-only report
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_upstream_r22 --bin /tmp/stoneage-r22/STONEAGE.bin > /tmp/stoneage-r22-derived.json
          python -m tools.stoneage_tw10_savedata_upstream_r22_guard --report /tmp/stoneage-r22-derived.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.stoneage_tw10_savedata_upstream_r22 import (
            SCHEMA,STATUS,WRITER_CALL,WRITER_SITE,SECOND_CALL,ALIAS_SITE,FLAGS)
          p=Path('/tmp/stoneage-r22-derived.json')
          d=json.loads(p.read_text())
          assert p.stat().st_size<=70000
          assert d['schema']==SCHEMA and d['status']==STATUS
          assert d['r21_original_identity_revalidated'] and d['static_only']
          assert d['writer_opaque_call']['site_rva']==WRITER_CALL
          assert d['writer_opaque_call']['writer_rva']==WRITER_SITE
          assert d['heaprealloc_push_flow']['call_rva']==SECOND_CALL
          assert d['eax_cycle']['site_rva']==ALIAS_SITE
          assert all(d[k] is False for k in FLAGS)
          print('TW10_R22_ORIGINAL_STATIC_ONLY=PASS')
          print('TW10_R22_NATIVE_SAVE=OPEN')
          PY
      - name: Always purge historical proprietary content
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r22
      - name: Upload DERIVED JSON only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-r22-original-call-stack-cycle-derived
          path: /tmp/stoneage-r22-derived.json
          retention-days: 21
