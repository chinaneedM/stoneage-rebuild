name: Verify StoneAge INTEGRATION63 Banum vessel original item and script source
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION63-BANUM-11-VESSEL-STATES-16-SOURCE-EDGES-R1.json'
      - 'tests/test_stoneage_integration_module_63.py'
      - '.github/workflows/verify-stoneage-integration63-source.yml'
      - 'research/recovered/STONEAGE-QUEST18-GIIRU-SINK-SOURCE-R1.json'
      - 'research/recovered/item-module-01/**'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION63-BANUM-11-VESSEL-STATES-16-SOURCE-EDGES-R1.json'
      - 'tests/test_stoneage_integration_module_63.py'
      - '.github/workflows/verify-stoneage-integration63-source.yml'
      - 'research/recovered/STONEAGE-QUEST18-GIIRU-SINK-SOURCE-R1.json'
      - 'research/recovered/item-module-01/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_63.py' -v
