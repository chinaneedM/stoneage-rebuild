name: Probe Hananet PDS direct replay variants
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_pds_direct_replay_probe.py
      - tests/test_stoneage_hananet_pds_direct_replay_probe.py
      - .github/workflows/probe-stoneage-hananet-pds-direct-replay.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-pds-direct-replay
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_pds_direct_replay_probe -v
      - name: Probe exact PDS and binary replay variants
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_pds_direct_replay_probe             > research/recovered/STONEAGE-HANANET-PDS-DIRECT-REPLAY-R1.txt
      - name: Commit derived replay metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-PDS-DIRECT-REPLAY-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Hananet PDS direct replay variants'
          git pull --rebase origin main
          git push
