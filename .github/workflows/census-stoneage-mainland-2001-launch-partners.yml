name: Census Mainland StoneAge launch partners

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_mainland_2001_launch_partner_census.py
      - tests/test_stoneage_mainland_2001_launch_partner_census.py
      - .github/workflows/census-stoneage-mainland-2001-launch-partners.yml

permissions:
  contents: write

concurrency:
  group: stoneage-mainland-2001-launch-partners
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate launch-partner census
        run: python3 -m unittest tests.test_stoneage_mainland_2001_launch_partner_census -v
      - name: Census narrow launch window
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_mainland_2001_launch_partner_census \
            > research/recovered/STONEAGE-MAINLAND-2001-LAUNCH-PARTNERS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R=research/recovered/STONEAGE-MAINLAND-2001-LAUNCH-PARTNERS-R1.txt
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: census Mainland StoneAge launch partners'
          git pull --rebase origin main
          git push
