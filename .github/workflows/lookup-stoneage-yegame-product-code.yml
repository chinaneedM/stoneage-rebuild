name: Lookup Yegame StoneAge product code

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_yegame_product_code_lookup.py
      - tests/test_stoneage_yegame_product_code_lookup.py
      - .github/workflows/lookup-stoneage-yegame-product-code.yml

permissions:
  contents: write

concurrency:
  group: stoneage-yegame-product-code-lookup
  cancel-in-progress: true

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_yegame_product_code_lookup -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_yegame_product_code_lookup \
            > research/recovered/STONEAGE-YEGAME-PRODUCT-CODE-LOOKUP-R1.txt
      - name: Commit derived metadata
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R=research/recovered/STONEAGE-YEGAME-PRODUCT-CODE-LOOKUP-R1.txt
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: lookup Yegame StoneAge product code'
          git pull --rebase origin main
          git push
