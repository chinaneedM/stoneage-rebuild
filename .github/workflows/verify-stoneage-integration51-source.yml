name: Verify StoneAge INTEGRATION51 original paired dojo source
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION51-TWO-ORIGINAL-100-DOJOS-SOURCE-BRIDGE-R1.json'
      - 'tests/test_stoneage_integration_module_51.py'
      - '.github/workflows/verify-stoneage-integration51-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION51-TWO-ORIGINAL-100-DOJOS-SOURCE-BRIDGE-R1.json'
      - 'tests/test_stoneage_integration_module_51.py'
      - '.github/workflows/verify-stoneage-integration51-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_51.py' -v
