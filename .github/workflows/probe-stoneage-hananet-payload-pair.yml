name: Probe Hananet StoneAge formal/trial payloads
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_payload_pair_probe.py
      - tests/test_stoneage_hananet_payload_pair_probe.py
      - .github/workflows/probe-stoneage-hananet-payload-pair.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-payload-pair
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_payload_pair_probe -v
      - name: Probe archived payload availability/prefixes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_payload_pair_probe             > research/recovered/STONEAGE-HANANET-PAYLOAD-PAIR-R1.txt
      - name: Commit derived payload metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-PAYLOAD-PAIR-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Hananet StoneAge payload pair'
          git pull --rebase origin main
          git push
