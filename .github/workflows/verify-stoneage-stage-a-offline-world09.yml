name: Verify WORLD25 compiled Quiz and SavePoint item roles
on:
  pull_request:
    paths:
      - 'tools/stoneage_quiz_item_source.py'
      - 'tests/test_stoneage_stage_a_world25_quiz.py'
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-25-QUIZ-ITEM-ROLE-R1.json'
      - 'tools/stoneage_savepoint_item_source.py'
      - 'tests/test_stoneage_stage_a_world24_savepoint.py'
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-24-SAVEPOINT-ITEM-ROLE-R1.json'
      - 'tools/stoneage_npc_item_transfers.py'
      - 'tools/stoneage_quest_currency_source.py'
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-23-NPC-ITEM-TRANSFERS-R1.json'
      - 'tests/test_stoneage_stage_a_world23_item_transfers.py'
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-09-GETRANDITEM-SOURCE-SLOTS-R1.json'
      - 'docs/continuity/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-09-ORIGINAL-RANDOM-ITEM-20261104.md'
      - 'tests/test_stoneage_stage_a_world09_random_item.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world09.yml'
  push:
    branches: [main]
    paths:
      - 'tools/stoneage_quiz_item_source.py'
      - 'tests/test_stoneage_stage_a_world25_quiz.py'
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-25-QUIZ-ITEM-ROLE-R1.json'
      - 'tools/stoneage_savepoint_item_source.py'
      - 'tests/test_stoneage_stage_a_world24_savepoint.py'
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-24-SAVEPOINT-ITEM-ROLE-R1.json'
      - 'tools/stoneage_npc_item_transfers.py'
      - 'tools/stoneage_quest_currency_source.py'
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-23-NPC-ITEM-TRANSFERS-R1.json'
      - 'tests/test_stoneage_stage_a_world23_item_transfers.py'
      - 'research/recovered/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-09-GETRANDITEM-SOURCE-SLOTS-R1.json'
      - 'docs/continuity/STONEAGE-STAGE-A-OFFLINE-WORLD-CONTENT-09-ORIGINAL-RANDOM-ITEM-20261104.md'
      - 'tests/test_stoneage_stage_a_world09_random_item.py'
      - '.github/workflows/verify-stoneage-stage-a-offline-world09.yml'
jobs:
  original-item-script-and-fixed-later-C:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve one pinned later community C file
        run: |
          set -eu
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/pimpcapital/longzoro-sa/57b14e2bb373ba851c14db28a239273e4a8831bb/gmsv/src/npc/npc_exchangeman.c' \
            -o /tmp/stoneage-world09-exchange.c
      - name: Verify literal item fields, frozen older projection, and separate fixed C evidence
        env:
          STONEAGE_WORLD09_PINNED_EXCHANGE: /tmp/stoneage-world09-exchange.c
        run: python -m unittest -v tests.test_stoneage_stage_a_world25_quiz tests.test_stoneage_stage_a_world24_savepoint tests.test_stoneage_stage_a_world23_item_transfers tests.test_stoneage_stage_a_world22_quest_currency tests.test_stoneage_stage_a_world14_fishing_quest tests.test_stoneage_stage_a_world09_random_item
