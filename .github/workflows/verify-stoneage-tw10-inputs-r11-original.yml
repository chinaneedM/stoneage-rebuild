name: Independently verify TW1.0 R11 original-derived helper evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/tw10-savedata-inputs-r11-20261012
    paths:
      - .github/workflows/verify-stoneage-tw10-inputs-r11-original.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-pinned-derived:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable original source run and branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38238943049" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|205bcdc7e112f265c8661c44cbda04679e272507|agent/tw10-savedata-inputs-r11-20261012'
          echo 'TW10_R11_ORIGINAL_SOURCE_CUSTODY=PASS'
      - name: Retrieve only the original run's tiny derived JSON artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tw10-r11-review
          gh run download 38238943049 --repo "$GITHUB_REPOSITORY" --name tw10-original-helper-r11-derived --dir /tmp/tw10-r11-review
          test "$(find /tmp/tw10-r11-review -type f | wc -l)" -eq 1
          test -f /tmp/tw10-r11-review/stoneage-r11-report.json
          test ! -L /tmp/tw10-r11-review/stoneage-r11-report.json
          test "$(stat -c %s /tmp/tw10-r11-review/stoneage-r11-report.json)" -le 24000
      - name: Strict original R11 report validation and bounded expected metrics
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python3 -m tools.stoneage_tw10_savedata_inputs_r11_guard --report /tmp/tw10-r11-review/stoneage-r11-report.json | tee /tmp/tw10-r11-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/tw10-r11-summary.json').read_text())
          assert v['delegate_states']==16 and v['delegate_qualifies_modeled_summary'] is False
          assert v['input_queries']==8
          assert v['effective_object_proven'] is False and v['native_io_executed'] is False
          actual=json.loads(Path('/tmp/tw10-r11-review/stoneage-r11-report.json').read_text())
          pinned=json.loads(Path('research/recovered/STONEAGE-TW10-SAVEDATA-INPUTS-R11-ORIGINAL.json').read_text())
          assert actual==pinned
          assert actual['delegate_helper']['root_rva']==0x491cd
          assert actual['parent_nodes']==50 and actual['parent_edges']==55
          assert actual['structural_call_return_assumptions']==1
          print('TW10_R11_DERIVED_CUSTODY_STORE_GEOMETRY_AND_STRUCTURAL_LOOP=PASS')
          print('TW10_R11_RUNTIME_OWNERSHIP_LOOP_CONDITIONS_AND_SAVE_IO=OPEN')
          PY
      - name: Purge downloaded derived JSON
        if: always()
        run: rm -rf /tmp/tw10-r11-review /tmp/tw10-r11-summary.json
