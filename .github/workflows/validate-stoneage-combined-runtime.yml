name: Validate StoneAge Combined runtime

concurrency:
  group: stoneage-combined-runtime-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-combined-runtime.yml"
      - "tools/stoneage_combined_initiative_model.py"
      - "tools/stoneage_combined_effect_model.py"
      - "tools/stoneage_combined_runtime_state.py"
      - "tools/stoneage_enemy_ai_combined_bridge.py"
      - "tools/stoneage_battle_round_model.py"
      - "tools/stoneage_battle_state_model.py"
      - "tools/stoneage_local_runtime_session_coordinator.py"
      - "tests/test_stoneage_combined_initiative_model.py"
      - "tests/test_stoneage_combined_effect_model.py"
      - "tests/test_stoneage_combined_runtime_state.py"
      - "tests/test_stoneage_combined_ordered_runtime.py"
      - "tests/test_stoneage_local_runtime_session_coordinator.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Combined ordered runtime
        run: |
          python -m unittest -v \
            tests.test_stoneage_combined_initiative_model \
            tests.test_stoneage_combined_effect_model \
            tests.test_stoneage_combined_runtime_state \
            tests.test_stoneage_combined_ordered_runtime \
            tests.test_stoneage_local_runtime_session_coordinator.LocalRuntimeSessionCoordinatorTests.test_recovered_enemy_ai_combined_attreverse_executes_and_persists
