name: Probe Yegame StoneAge game catalog

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_yegame_game_catalog_probe.py
      - tests/test_stoneage_yegame_game_catalog_probe.py
      - .github/workflows/probe-stoneage-yegame-game-catalog.yml

permissions:
  contents: write

concurrency:
  group: stoneage-yegame-game-catalog
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Yegame game-catalog probe
        run: python3 -m unittest tests.test_stoneage_yegame_game_catalog_probe -v
      - name: Probe historical Yegame game catalog
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_yegame_game_catalog_probe \
            > research/recovered/STONEAGE-YEGAME-GAME-CATALOG-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-YEGAME-GAME-CATALOG-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Yegame StoneAge game catalog'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_yegame_game_catalog_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe Yegame StoneAge game catalog'
          fi
          git push
