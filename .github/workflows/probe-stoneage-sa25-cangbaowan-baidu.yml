name: Probe StoneAge 2.5 Baidu share

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_cangbaowan_baidu_probe.py
      - tests/test_stoneage_sa25_cangbaowan_baidu_probe.py
      - .github/workflows/probe-stoneage-sa25-cangbaowan-baidu.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-cangbaowan-baidu
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sa25_cangbaowan_baidu_probe -v
      - name: Probe anonymous public Baidu landing and archive indexes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_cangbaowan_baidu_probe             > research/recovered/STONEAGE-SA25-CANGBAOWAN-BAIDU-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA25-CANGBAOWAN-BAIDU-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe StoneAge 2.5 Baidu share'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
