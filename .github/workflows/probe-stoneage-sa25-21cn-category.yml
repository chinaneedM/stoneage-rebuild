name: Scan 21CN StoneAge category pages

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_21cn_category_probe.py
      - tests/test_stoneage_sa25_21cn_category_probe.py
      - .github/workflows/probe-stoneage-sa25-21cn-category.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-21cn-category
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate category probe
        run: python3 -m unittest tests.test_stoneage_sa25_21cn_category_probe -v
      - name: Scan archived category pages
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_21cn_category_probe \
            > research/recovered/STONEAGE-SA25-21CN-CATEGORY-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-21CN-CATEGORY-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan 21CN StoneAge category pages'
          git push
