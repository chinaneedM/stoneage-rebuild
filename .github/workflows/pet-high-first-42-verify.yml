name: PET-HIGH-FIRST-42 reward index replay
on:
  push:
    paths:
      - 'research/pets/PET-HIGH-FIRST-42-*.json'
      - 'tools/stoneage_pet_high_first_42*.py'
      - '.github/workflows/pet-high-first-42-verify.yml'
  pull_request:
    paths:
      - 'research/pets/PET-HIGH-FIRST-42-*.json'
      - 'tools/stoneage_pet_high_first_42*.py'
      - '.github/workflows/pet-high-first-42-verify.yml'
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m tools.stoneage_pet_high_first_42_verify
      - run: python3 tools/stoneage_pet_source_lookup.py --verify
