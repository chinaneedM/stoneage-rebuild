name: Probe Popsoft Dec-2000 exact discs

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_popsoft_200012_exact_disc_probe.py
      - tests/test_stoneage_popsoft_200012_exact_disc_probe.py
      - .github/workflows/probe-stoneage-popsoft-200012-exact-discs.yml

permissions:
  contents: write

concurrency:
  group: stoneage-popsoft-200012-exact-discs
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact-disc probe
        run: python3 -m unittest tests.test_stoneage_popsoft_200012_exact_disc_probe -v
      - name: Query independent indexes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_popsoft_200012_exact_disc_probe \
            > research/recovered/STONEAGE-POPSOFT-200012-EXACT-DISCS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-POPSOFT-200012-EXACT-DISCS-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Popsoft Dec-2000 exact discs'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
