name: PET-HIGH-FIRST-63 variant and period witnesses
on:
  push:
    paths:
      - 'research/pets/PET-HIGH-FIRST-63-VARIANT-PERIOD-WITNESSES-R1.json'
      - 'tools/stoneage_pet_high_first_63_review.py'
      - '.github/workflows/pet-high-first-63-review.yml'
  pull_request:
    paths:
      - 'research/pets/PET-HIGH-FIRST-63-VARIANT-PERIOD-WITNESSES-R1.json'
      - 'tools/stoneage_pet_high_first_63_review.py'
      - '.github/workflows/pet-high-first-63-review.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m tools.stoneage_pet_high_first_62_review
      - run: python -m tools.stoneage_pet_high_first_63_review
      - run: python tools/stoneage_pet_source_lookup.py --verify
      - run: python tools/stoneage_pet_gap_queue.py --verify
