name: Probe StoneAge IA preservation uploaders

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_ia_preservation_uploader_reverse_probe.py
      - tests/test_stoneage_ia_preservation_uploader_reverse_probe.py
      - .github/workflows/probe-stoneage-ia-preservation-uploaders.yml

permissions:
  contents: write

concurrency:
  group: stoneage-ia-preservation-uploaders
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_ia_preservation_uploader_reverse_probe -v
      - name: Probe IA preservation uploader inventories
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_ia_preservation_uploader_reverse_probe \
            > research/recovered/STONEAGE-IA-PRESERVATION-UPLOADER-REVERSE-R1.txt
      - name: Commit derived IA metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-IA-PRESERVATION-UPLOADER-REVERSE-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: reverse-index StoneAge preservation uploaders'
          git pull --rebase origin main
          git push
