name: Verify Japanese operator pet catalog across three captures and one image
on:
  push:
    paths:
      - tools/stoneage_jp_pet_catalog.py
      - tests/test_stoneage_jp_pet_catalog.py
      - research/recovered/STONEAGE-JP-OFFICIAL-PET-CATALOG-R1.json
      - docs/specs/STONEAGE-JP-OFFICIAL-PET-CATALOG-R1.md
      - .github/workflows/verify-stoneage-jp-official-pet-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-four-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned GIF decoder
        run: python -m pip install Pillow==12.3.0
      - name: Reject incorrect names DOM joins aliases and mixed capture dates
        run: python -m unittest tests.test_stoneage_jp_pet_catalog -v
      - name: Reacquire only three qualified pet pages and sole illustration
        run: python -m tools.stoneage_jp_pet_catalog --output output/derived.json
      - name: Compare complete derived catalog to durable Git report
        run: cmp output/derived.json research/recovered/STONEAGE-JP-OFFICIAL-PET-CATALOG-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: jp-official-pet-catalog-derived-only
          path: output/derived.json
          retention-days: 30
