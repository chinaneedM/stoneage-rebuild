name: PET-DETAIL19 original TW10 PC inventory local crafting selection gate
on:
  push:
    paths:
      - 'research/pets/PET-DETAIL-EVIDENCE19-TW10-NATIVE-ITEM-SELECT-COUNT-GATE-R1.json'
      - 'docs/continuity/STONEAGE-PET-DETAIL19-TW10-ORIGINAL-ITEM-SELECT-COUNT-GATE-20261122.md'
      - 'tools/stoneage_pet_detail19_original_inventory_selection_replay.py'
      - 'tests/test_stoneage_pet_detail19_original_inventory_selection_r1.py'
      - 'docs/pets/INDEX.md'
      - '.github/workflows/validate-stoneage-pet-detail19-original-inventory-selection.yml'
  pull_request:
    paths:
      - 'research/pets/PET-DETAIL-EVIDENCE19-TW10-NATIVE-ITEM-SELECT-COUNT-GATE-R1.json'
      - 'docs/continuity/STONEAGE-PET-DETAIL19-TW10-ORIGINAL-ITEM-SELECT-COUNT-GATE-20261122.md'
      - 'tools/stoneage_pet_detail19_original_inventory_selection_replay.py'
      - 'tests/test_stoneage_pet_detail19_original_inventory_selection_r1.py'
      - 'docs/pets/INDEX.md'
      - '.github/workflows/validate-stoneage-pet-detail19-original-inventory-selection.yml'
permissions:
  contents: read
jobs:
  public-source-derived-inventory-select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original source receipt and prior pet skill evidence without proprietary bytes
        run: |
          python -m py_compile tools/stoneage_pet_detail19_original_inventory_selection_replay.py
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail19_original_inventory_selection_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail18_native_ui_label_r1.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet_detail17_200_201_community_candidate_r1.py' -v
