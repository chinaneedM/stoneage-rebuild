name: Verify hero guide and descendant configuration source relations without entity merge
on:
  push:
    paths:
      - tools/stoneage_waei_hero_source_relations.py
      - tests/test_stoneage_waei_hero_source_relations.py
      - research/recovered/STONEAGE-WAEI-HERO-GUIDE-SOURCE-RELATIONS-R1.json
      - research/recovered/STONEAGE-WAEI-CN20-ISLAND-HERO-CONTENT-R1.json
      - research/recovered/STONEAGE-WORLD-NPC-QUEST-CATALOG-R1.json
      - docs/specs/STONEAGE-WAEI-HERO-GUIDE-SOURCE-RELATIONS-R1.md
      - .github/workflows/verify-stoneage-waei-hero-source-relations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-pinned-git-reports-six-source-relations-no-network:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stoneage_waei_hero_source_relations -v
      - name: Recompute six relations using only pinned Git metadata
        run: python -m tools.stoneage_waei_hero_source_relations --output output/derived.json
      - run: cmp output/derived.json research/recovered/STONEAGE-WAEI-HERO-GUIDE-SOURCE-RELATIONS-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: waei-hero-source-relations-derived-only
          path: output/derived.json
          retention-days: 30
