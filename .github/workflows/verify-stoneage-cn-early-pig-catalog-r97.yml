name: Verify R97 early pig catalog image-name identity boundaries
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN-EARLY-PIG-CATALOG-IMAGE-IDENTITY-SOURCE-R97.json'
      - 'research/recovered/STONEAGE-CN-EARLY-PIG-CATALOG-ACCEPTANCE-R97.json'
      - 'tools/stoneage_cn_early_pig_catalog_r97.py'
      - 'tests/test_stoneage_cn_early_pig_catalog_r97.py'
      - 'tests/test_stoneage_cn_early_pig_catalog_r97_custody.py'
      - '.github/workflows/verify-stoneage-cn-early-pig-catalog-r97.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN-EARLY-PIG-CATALOG-IMAGE-IDENTITY-SOURCE-R97.json'
      - 'tools/stoneage_cn_early_pig_catalog_r97.py'
      - 'tests/test_stoneage_cn_early_pig_catalog_r97.py'
      - 'tests/test_stoneage_cn_early_pig_catalog_r97_custody.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-catalog-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_stoneage_cn_early_pig_catalog_r97 tests.test_stoneage_cn_early_pig_catalog_r97_custody -v
      - run: python -m tools.stoneage_cn_early_pig_catalog_r97
