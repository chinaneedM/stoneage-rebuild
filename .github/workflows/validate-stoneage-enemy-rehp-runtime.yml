name: Validate StoneAge enemy ReHP runtime

concurrency:
  group: stoneage-enemy-rehp-runtime
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-enemy-rehp-runtime.yml
      - tools/stoneage_enemy_rehp_model.py
      - tools/stoneage_enemy_ai_rehp_bridge.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_battle_state_model.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_enemy_rehp_model.py
      - tests/test_stoneage_enemy_ai_rehp_bridge.py
      - tests/test_stoneage_enemy_rehp_round.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
      - research/mechanics/STONEAGE-ENEMY-REHP-R1.md
  pull_request:
    paths:
      - .github/workflows/validate-stoneage-enemy-rehp-runtime.yml
      - tools/stoneage_enemy_rehp_model.py
      - tools/stoneage_enemy_ai_rehp_bridge.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_battle_state_model.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_enemy_rehp_model.py
      - tests/test_stoneage_enemy_ai_rehp_bridge.py
      - tests/test_stoneage_enemy_rehp_round.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
      - research/mechanics/STONEAGE-ENEMY-REHP-R1.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate enemy ReHP semantic runtime
        run: |
          python3 -m unittest \
            tests.test_stoneage_enemy_rehp_model \
            tests.test_stoneage_enemy_ai_rehp_bridge \
            tests.test_stoneage_enemy_rehp_round \
            tests.test_stoneage_local_runtime_session_coordinator -v
