name: Verify SCENE15 authored doorway and original-source viewport material
on:
  push:
    branches: [main, agent/scene15-doorway-source-20261029]
    paths:
      - tools/stoneage_scene15_exit_observer.py
      - tools/stoneage_scene15_independent_replay.py
      - tools/scene-doorway-viewer-r15.html
      - tests/test_stoneage_scene15_exit_observer.py
      - research/recovered/STONEAGE-SCENE15-DOORWAY-SOURCE-R1.json
      - research/recovered/STONEAGE-SCENE15-ACCEPTANCE-R1.json
      - .github/workflows/verify-stoneage-scene15-doorway.yml
  pull_request:
    paths:
      - tools/stoneage_scene15_exit_observer.py
      - tools/stoneage_scene15_independent_replay.py
      - tools/scene-doorway-viewer-r15.html
      - tests/test_stoneage_scene15_exit_observer.py
      - research/recovered/STONEAGE-SCENE15-DOORWAY-SOURCE-R1.json
      - research/recovered/STONEAGE-SCENE15-ACCEPTANCE-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-doorway-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rarfile==4.2
      - run: python -m tools.stoneage_scene15_exit_observer
      - run: python -m unittest -v tests.test_stoneage_scene15_exit_observer tests.test_stoneage_scene14_room_shop tests.test_stoneage_scene13_pet_action0
