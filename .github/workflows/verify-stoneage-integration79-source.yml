name: Verify StoneAge INTEGRATION79 original feather shops and TW1 pixel source
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION79-FEATHER-SHOP-ORIGINAL-NPC-ITEM-PIXEL-R1.json'
      - 'tests/test_stoneage_integration79_feather_source.py'
      - '.github/workflows/verify-stoneage-integration79-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION79-FEATHER-SHOP-ORIGINAL-NPC-ITEM-PIXEL-R1.json'
      - 'tests/test_stoneage_integration79_feather_source.py'
      - '.github/workflows/verify-stoneage-integration79-source.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source-bound numeric contracts
        run: python -m unittest discover -s tests -p 'test_stoneage_integration79_feather_source.py' -v
