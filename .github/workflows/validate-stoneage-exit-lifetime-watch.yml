name: Validate StoneAge enemy slot and watcher lifecycle

concurrency:
  group: stoneage-exit-lifetime-watch-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-exit-lifetime-watch.yml"
      - "tools/stoneage_becomepig_hp_death_audit.py"
      - "tools/stoneage_exit_lifetime_watch_audit.py"
      - "tools/stoneage_becomepig_exit_modes_audit.py"
      - "tools/stoneage_mdfyattack_source_audit.py"
      - "research/recovered/STONEAGE-EXIT-LIFETIME-WATCH-SOURCE-DOMAINS-R1.json"
      - "tests/test_stoneage_becomepig_hp_death.py"
      - "tests/test_stoneage_exit_lifetime_watch.py"
      - "tests/test_stoneage_becomepig_exit_modes.py"
      - "tools/stoneage_becomepig_lookup_audit.py"
      - "tools/stoneage_becomepig_badstatus_audit.py"
      - "tools/stoneage_becomepig_restore_audit.py"
      - "tools/stoneage_becomepig_native_audit.py"
      - "tools/stoneage_guard_break2_source_audit.py"
      - "tools/stoneage_mdfyattack_source_audit.py"
      - "research/recovered/STONEAGE-BECOMEPIG-LOOKUP-SOURCE-DOMAINS-R1.json"
      - "research/recovered/STONEAGE-BECOMEPIG-BADSTATUS-SOURCE-DOMAINS-R1.json"
      - "research/recovered/STONEAGE-BECOMEPIG-RESTORATION-SOURCE-DOMAINS-R1.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lookup domains and previous regressions
        run: python -m unittest -v tests.test_stoneage_exit_lifetime_watch tests.test_stoneage_becomepig_exit_modes tests.test_stoneage_becomepig_pet_state tests.test_stoneage_becomepig_hp_death tests.test_stoneage_becomepig_lookup tests.test_stoneage_becomepig_badstatus tests.test_stoneage_becomepig_restore tests.test_stoneage_becomepig_clock tests.test_stoneage_becomepig_native_domains tests.test_stoneage_recovered25_becomepig_probe
      - name: Recover exact descendant source trees
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_guard_break2_source_audit import PINNED
          repos={"gavin":"gavinlinasd/StoneAge","iris":"iriselia/StoneAge","bismarck":"BismarckDD/stoneage"}
          for name,sha in PINNED.items():
              root=Path("/tmp/exit-lifetime-watch-source")/name
              subprocess.run(["git","init",str(root)],check=True)
              subprocess.run(["git","-C",str(root),"remote","add","origin","https://github.com/"+repos[name]+".git"],check=True)
              subprocess.run(["git","-C",str(root),"fetch","--depth","1","origin",sha],check=True)
              subprocess.run(["git","-C",str(root),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Execute original enemy slot and watcher lifecycle bodies
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          ARGS="--gavin-dir /tmp/exit-lifetime-watch-source/gavin --iris-dir /tmp/exit-lifetime-watch-source/iris --bismarck-dir /tmp/exit-lifetime-watch-source/bismarck"
          python -m tools.stoneage_exit_lifetime_watch_audit $ARGS > research/recovered/STONEAGE-EXIT-LIFETIME-WATCH-NATIVE-R1.txt
          cat research/recovered/STONEAGE-EXIT-LIFETIME-WATCH-NATIVE-R1.txt
          grep -F 'TOTAL|lifetime_watch_comparisons=576|profiles=3' research/recovered/STONEAGE-EXIT-LIFETIME-WATCH-NATIVE-R1.txt
          grep -F 'RESOLUTION|BOUNDED_ENEMY_SLOT_WATCH_LIST_LIFECYCLE_PASS_ZERO_RUNTIME_PROMOTIONS' research/recovered/STONEAGE-EXIT-LIFETIME-WATCH-NATIVE-R1.txt
      - name: Reproduce accepted complete Exit modes report
        run: |
          set -euo pipefail
          python -m tools.stoneage_becomepig_exit_modes_audit \
            --gavin-dir /tmp/exit-lifetime-watch-source/gavin \
            --iris-dir /tmp/exit-lifetime-watch-source/iris \
            --bismarck-dir /tmp/exit-lifetime-watch-source/bismarck \
            > /tmp/exit-modes-regression.txt
          cmp /tmp/exit-modes-regression.txt research/recovered/STONEAGE-BECOMEPIG-EXIT-MODES-NATIVE-R1.txt
          echo 'Prior 263268 Exit-mode comparisons reproduce the complete accepted report'
      - name: Preserve exact input derived lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: exit-lifetime-watch-${{ github.sha }}
          path: research/recovered/STONEAGE-EXIT-LIFETIME-WATCH-NATIVE-R1.txt
