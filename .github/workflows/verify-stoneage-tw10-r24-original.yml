name: Independently verify TW1.0 R24 original prefix/scalar/flags and competing-anchor evidence
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r24-prefix-scalar-flags-20261013]
    paths:
      - .github/workflows/verify-stoneage-tw10-r24-original.yml
      - tools/stoneage_tw10_savedata_upstream_r24_guard.py
      - tests/test_stoneage_tw10_savedata_upstream_r24_guard.py
      - research/recovered/STONEAGE-TW10-SAVEDATA-UPSTREAM-R24-ORIGINAL.json
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable R24 original source and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/38389572994" --jq '[.status,.conclusion,.head_sha,.head_branch] | join("|")')"
          test "$identity" = 'completed|success|1348831660debb1e86b4dec6cd270f2dcba3e126|agent/tw10-savedata-r24-prefix-scalar-flags-20261013'
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11807971334" --jq '[.workflow_run.id,.name,.digest,.expired] | join("|")')"
          test "$artifact" = '38389572994|tw10-r24-original-prefix-scalar-flags-derived|sha256:27b0d78b1a80f7d2c8d60f8e4f2081e0311f4dc32b60dc85ca33781196b16e04|false'
      - name: Retrieve only bounded derived metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r24-independent
          gh run download 38389572994 --repo "$GITHUB_REPOSITORY" --name tw10-r24-original-prefix-scalar-flags-derived --dir /tmp/r24-independent
          test "$(find /tmp/r24-independent -type f | wc -l)" -eq 1
          test -f /tmp/r24-independent/stoneage-r24-derived.json
          test ! -L /tmp/r24-independent/stoneage-r24-derived.json
          test "$(stat -c %s /tmp/r24-independent/stoneage-r24-derived.json)" -le 70000
          sha256sum /tmp/r24-independent/stoneage-r24-derived.json
          wc -c /tmp/r24-independent/stoneage-r24-derived.json
      - name: Strict semantic constraints and independent tamper tests
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_upstream_r24 tests.test_stoneage_tw10_savedata_upstream_r24_guard
          python -m tools.stoneage_tw10_savedata_upstream_r24_guard --report /tmp/r24-independent/stoneage-r24-derived.json
      - name: Compare accepted witness and disclose canonical bounded JSON
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.stoneage_tw10_savedata_upstream_r24_guard import validate
          d=json.loads(Path('/tmp/r24-independent/stoneage-r24-derived.json').read_text())
          validate(d)
          canonical=Path('research/recovered/STONEAGE-TW10-SAVEDATA-UPSTREAM-R24-ORIGINAL.json')
          if canonical.exists():
              assert json.loads(canonical.read_text())==d, 'R24 exact original-derived JSON differs from committed witness'
              print('TW10_R24_EXACT_DERIVED_JSON_EQUALITY=PASS')
          else:
              print('TW10_R24_REVIEW_ONLY_NOT_YET_COMMITTED=PASS')
          print('TW10_R24_DERIVED_JSON_BEGIN')
          print(json.dumps(d,sort_keys=True,separators=(',',':')))
          print('TW10_R24_DERIVED_JSON_END')
          PY
      - name: Always remove temporary derived metadata
        if: always()
        run: rm -rf /tmp/r24-independent
