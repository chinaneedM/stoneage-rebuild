name: Probe Sina 2002 updatex route timeline

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa40_sina_updatex_timeline_probe.py
      - tests/test_stoneage_sa40_sina_updatex_timeline_probe.py
      - .github/workflows/probe-stoneage-sa40-sina-updatex-timeline.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa40-sina-updatex-timeline
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sa40_sina_updatex_timeline_probe -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa40_sina_updatex_timeline_probe > research/recovered/STONEAGE-SA40-SINA-UPDATEX-TIMELINE-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA40-SINA-UPDATEX-TIMELINE-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: recover Sina updatex route timeline'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
