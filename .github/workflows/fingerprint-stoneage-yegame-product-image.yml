name: Fingerprint Yegame StoneAge product image
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_yegame_product_image_fingerprint.py
      - tests/test_stoneage_yegame_product_image_fingerprint.py
      - .github/workflows/fingerprint-stoneage-yegame-product-image.yml
permissions:
  contents: write
concurrency:
  group: stoneage-yegame-product-image-fingerprint
  cancel-in-progress: true
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_yegame_product_image_fingerprint -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_yegame_product_image_fingerprint > research/recovered/STONEAGE-YEGAME-PRODUCT-IMAGE-FINGERPRINT-R1.txt
      - run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-YEGAME-PRODUCT-IMAGE-FINGERPRINT-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: fingerprint Yegame StoneAge product image'
          git pull --rebase origin main
          git push
