name: Source bounded original pet skill names R45
on:
  push:
    branches: ['agent/pet-skill-source-r45-20261027']
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rarfile==4.2 libarchive-c==5.3
      - run: sudo apt-get update -qq && sudo apt-get install -y unar libarchive-tools
      - run: python -m unittest -v tests.test_stoneage_preserved_pet_skill_r45
      - run: python -m tools.stoneage_preserved_pet_skill_r45 --output /tmp/r45-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: r45-derived-source-report-only
          path: /tmp/r45-source.json
          retention-days: 7
          if-no-files-found: error
