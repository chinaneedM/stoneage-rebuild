name: Retry China.com StoneAge download residual

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_china2000_zhcn_download_residual.py
      - tests/test_stoneage_china2000_zhcn_download_residual.py
      - .github/workflows/retry-stoneage-china2000-zhcn-download-residual.yml

permissions:
  contents: write

concurrency:
  group: stoneage-china2000-zhcn-download-residual
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate residual retry
        run: python3 -m unittest tests.test_stoneage_china2000_zhcn_download_residual -v
      - name: Replay sole China.com download row
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_china2000_zhcn_download_residual \
            > research/recovered/STONEAGE-CHINA2000-ZHCN-DOWNLOAD-RESIDUAL-R2.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R=research/recovered/STONEAGE-CHINA2000-ZHCN-DOWNLOAD-RESIDUAL-R2.txt
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: close China.com download residual'
          git pull --rebase origin main
          git push
