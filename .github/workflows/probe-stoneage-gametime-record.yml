name: Resolve GameTime StoneAge archived record

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_gametime_stoneage_record_probe.py
      - tests/test_stoneage_gametime_stoneage_record_probe.py
      - .github/workflows/probe-stoneage-gametime-record.yml

permissions:
  contents: write

concurrency:
  group: stoneage-gametime-record
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_gametime_stoneage_record_probe -v
      - name: Resolve archived StoneAge search/result chain
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_gametime_stoneage_record_probe             > research/recovered/STONEAGE-GAMETIME-2001-RECORD-RESOLUTION-R1.txt
      - name: Commit derived archived metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-GAMETIME-2001-RECORD-RESOLUTION-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: resolve GameTime StoneAge archived record'
          git pull --rebase origin main
          git push
