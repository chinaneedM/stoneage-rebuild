name: Probe exact StoneAge mirrors via Arquivo CDX
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_exact_mirror_arquivopt_cdx_probe.py
      - tests/test_stoneage_exact_mirror_arquivopt_cdx_probe.py
      - .github/workflows/probe-stoneage-exact-mirror-arquivo-cdx.yml

permissions:
  contents: write

concurrency:
  group: stoneage-exact-mirror-arquivo-cdx
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_exact_mirror_arquivopt_cdx_probe -v
      - name: Query exact mirror URLs through Arquivo CDX
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_exact_mirror_arquivopt_cdx_probe             > research/recovered/STONEAGE-EXACT-MIRROR-ARQUIVO-CDX-R1.txt
      - name: Commit derived CDX metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-EXACT-MIRROR-ARQUIVO-CDX-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe exact StoneAge mirrors via Arquivo CDX'
          git pull --rebase origin main
          git push
