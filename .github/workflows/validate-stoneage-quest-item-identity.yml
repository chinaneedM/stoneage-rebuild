name: Recover bounded logging item identity candidates
on:
  push:
    paths:
      - 'tools/stoneage_quest_item_identity_probe.py'
      - 'tools/stoneage_itemset_schema_probe.py'
      - 'tests/test_stoneage_quest_item_identity_probe.py'
      - 'research/recovered/STONEAGE-QUEST-ITEM-*.json'
      - 'docs/specs/STONEAGE-QUEST-ITEM-IDENTITY-R1.md'
      - '.github/workflows/validate-stoneage-quest-item-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query, source-custody, archived replay and no-promotion gates
        run: python -m unittest tests.test_stoneage_quest_item_identity_probe -v
      - run: sudo apt-get update && sudo apt-get install -y unar
        if: ${{ hashFiles('research/recovered/STONEAGE-QUEST-ITEM-CI-DERIVED-R1.json') == '' || github.event_name == 'workflow_dispatch' }}
      - name: Recover verified preservation bundle
        if: ${{ hashFiles('research/recovered/STONEAGE-QUEST-ITEM-CI-DERIVED-R1.json') == '' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib,html,json,re,http.cookiejar,urllib.parse,urllib.request
          from pathlib import Path
          ua='Mozilla/5.0'; hashes={'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5','ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb'}
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def get(k,s):
            data=urllib.parse.urlencode({'quick_key':k,'response_format':'json'}).encode()
            req=urllib.request.Request('https://www.mediafire.com/api/1.5/file/get_info.php',data=data,headers={'User-Agent':ua})
            with op.open(req,timeout=60) as r:i=json.load(r)['response']['file_info']
            if str(i.get('hash','')).lower()!=hashes[k]:raise SystemExit('metadata hash changed')
            with op.open(urllib.request.Request(i['links']['normal_download'],headers={'User-Agent':ua}),timeout=60) as r:
              page=r.read().decode('utf-8','replace');ref=r.geturl()
            m=re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S) or re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
            if not m:raise SystemExit('no direct link')
            p=Path('/tmp/sa25')/('part.'+s);h=hashlib.sha256()
            with op.open(urllib.request.Request(html.unescape(m.group(1)),headers={'User-Agent':ua,'Referer':ref}),timeout=300) as r,p.open('wb') as o:
              while True:
                b=r.read(1048576)
                if not b:break
                o.write(b);h.update(b)
            if h.hexdigest()!=hashes[k]:raise SystemExit('hash mismatch')
          get('ev7l29fw77891go','001');get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 >/tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar|awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out; ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/dev/null 2>&1
      - name: Extract only hash-pinned candidate numeric metadata
        if: ${{ hashFiles('research/recovered/STONEAGE-QUEST-ITEM-CI-DERIVED-R1.json') == '' || github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess, os
          roots = [p for p in Path('/tmp/sa25/out').rglob('data') if p.is_dir() and p.parent.name == 'gmsv' and (p/'itemset.txt').is_file()]
          assert len(roots) == 1, 'missing/ambiguous gmsv data directory'
          data = roots[0]
          subprocess.run(['python', 'tools/stoneage_quest_item_identity_probe.py', '--data-dir', str(data), '--setup', str(data.parent/'setup.cf'), '--output', str(Path(os.environ['RUNNER_TEMP'])/'quest-item-derived.json')], check=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('research/recovered/STONEAGE-QUEST-ITEM-CI-DERIVED-R1.json') == '' || github.event_name == 'workflow_dispatch' }}
        with:
          name: quest-item-derived
          path: ${{ runner.temp }}/quest-item-derived.json
          retention-days: 7
      - name: Validate permanent metadata without downloading original payloads again
        if: ${{ hashFiles('research/recovered/STONEAGE-QUEST-ITEM-CI-DERIVED-R1.json') != '' }}
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.stoneage_quest_item_identity_probe import validate_derived
          data = json.loads(Path('research/recovered/STONEAGE-QUEST-ITEM-CI-DERIVED-R1.json').read_text())
          assert validate_derived(data)
          print('permanent source-qualified metadata replayed; no original table/network retrieval in this archival path')
          PYCODE
