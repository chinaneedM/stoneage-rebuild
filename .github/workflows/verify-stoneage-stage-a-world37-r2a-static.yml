name: Verify original compiled capture tail and required items WORLD37
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-WORLD37-R2A-ORIGINAL-COMPILED-CAPTURE-TAIL-STATIC-R1.json'
      - 'tests/test_stoneage_stage_a_world37_r2a_compiled_capture_tail_static.py'
      - 'research/recovered/STONEAGE-STAGE-A-WORLD37-R2B-COMPILED-CAPTURE-REQUIRED-ITEMS-R1.json'
      - 'tests/test_stoneage_stage_a_world37_r2b_capture_required_items.py'
      - 'tools/stoneage_world37_capture_required_table.py'
      - 'research/recovered/STONEAGE-STAGE-A-WORLD37-R2B3-CAPTURE-ORIGINAL-SPR-BRIDGE-R1.json'
      - 'tests/test_stoneage_stage_a_world37_r2b3_capture_spr_bridge.py'
      - 'research/recovered/STONEAGE-PET-MODULE-11-TW10-CAPTURE-SPR-ORIGINAL-496-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_pet_module_11_tw10_capture_sprite_source.py'
      - 'tools/stoneage_pet11_tw10_capture_sprite_source.py'
      - 'tools/stoneage_pet12_tw85_capture_spr_rd_bridge.py'
      - 'research/recovered/STONEAGE-PET-MODULE-12-TW85-SIX-CAPTURE-SPR-RD-BRIDGE-R1.json'
      - 'tests/test_stoneage_pet_module_12_tw85_capture_spr_rd_bridge.py'
      - '.github/workflows/verify-stoneage-stage-a-world37-r2a-static.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-STAGE-A-WORLD37-R2A-ORIGINAL-COMPILED-CAPTURE-TAIL-STATIC-R1.json'
      - 'tests/test_stoneage_stage_a_world37_r2a_compiled_capture_tail_static.py'
      - 'research/recovered/STONEAGE-STAGE-A-WORLD37-R2B-COMPILED-CAPTURE-REQUIRED-ITEMS-R1.json'
      - 'tests/test_stoneage_stage_a_world37_r2b_capture_required_items.py'
      - 'tools/stoneage_world37_capture_required_table.py'
      - 'research/recovered/STONEAGE-STAGE-A-WORLD37-R2B3-CAPTURE-ORIGINAL-SPR-BRIDGE-R1.json'
      - 'tests/test_stoneage_stage_a_world37_r2b3_capture_spr_bridge.py'
      - 'research/recovered/STONEAGE-PET-MODULE-11-TW10-CAPTURE-SPR-ORIGINAL-496-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_pet_module_11_tw10_capture_sprite_source.py'
      - 'tools/stoneage_pet11_tw10_capture_sprite_source.py'
      - 'tools/stoneage_pet12_tw85_capture_spr_rd_bridge.py'
      - 'research/recovered/STONEAGE-PET-MODULE-12-TW85-SIX-CAPTURE-SPR-RD-BRIDGE-R1.json'
      - 'tests/test_stoneage_pet_module_12_tw85_capture_spr_rd_bridge.py'
      - '.github/workflows/verify-stoneage-stage-a-world37-r2a-static.yml'
jobs:
  world37-r2a-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original-code receipt and negative evidence boundaries
        run: python -m unittest -v tests.test_stoneage_stage_a_world37_r2a_compiled_capture_tail_static
      - name: Validate original configured capture-item crosswalk and source-only boundaries
        run: python -m unittest -v tests.test_stoneage_stage_a_world37_r2b_capture_required_items
      - name: Validate same-archive capture candidate to original SPR-index numeric bridge
        run: python -m unittest -v tests.test_stoneage_stage_a_world37_r2b3_capture_spr_bridge
      - name: Validate original TW1 capture-linked pet sprite pixels and retained negative evidence
        run: python -m unittest -v tests.test_stoneage_pet_module_11_tw10_capture_sprite_source

      - name: Restore six captured-candidate TW85 complete source SPR segments and same-carrier RD bindings
        run: python tools/stoneage_pet12_tw85_capture_spr_rd_bridge.py --check research/recovered/STONEAGE-PET-MODULE-12-TW85-SIX-CAPTURE-SPR-RD-BRIDGE-R1.json
      - name: Validate six TW85 native-source group/RD joins and negative game-evidence boundaries
        run: python -m unittest -v tests.test_stoneage_pet_module_12_tw85_capture_spr_rd_bridge
