name: Verify StoneAge INTEGRATION76 anniversary original cake source and image
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION76-ANNIVERSARY-CAKE-ORIGINAL-IMAGE-SOURCE-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-05-R1.json'
      - 'tests/test_stoneage_integration_module_76.py'
      - '.github/workflows/verify-stoneage-integration76-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION76-ANNIVERSARY-CAKE-ORIGINAL-IMAGE-SOURCE-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-05-R1.json'
      - 'tests/test_stoneage_integration_module_76.py'
      - '.github/workflows/verify-stoneage-integration76-source.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_76.py' -v
