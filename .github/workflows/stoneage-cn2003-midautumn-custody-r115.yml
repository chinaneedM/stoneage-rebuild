name: Verify R115 permanent nine-file Git and Actions custody
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CN2003-MIDAUTUMN-CUSTODY-R115.json'
      - 'tools/verify_stoneage_cn2003_midautumn_custody_r115.py'
      - 'tests/test_stoneage_cn2003_midautumn_custody_r115.py'
      - '.github/workflows/stoneage-cn2003-midautumn-custody-r115.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-CN2003-MIDAUTUMN-CUSTODY-R115.json'
      - 'tools/verify_stoneage_cn2003_midautumn_custody_r115.py'
      - 'tests/test_stoneage_cn2003_midautumn_custody_r115.py'
      - '.github/workflows/stoneage-cn2003-midautumn-custody-r115.yml'
  workflow_dispatch:
jobs:
  custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/verify_stoneage_cn2003_midautumn_custody_r115.py
      - run: python tests/test_stoneage_cn2003_midautumn_custody_r115.py
