name: Validate TW1.0 R19 bounded second global and HeapAlloc synthetic
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r19-write-heap-20261012]
    paths:
      - .github/workflows/validate-stoneage-tw10-r19-synthetic.yml
      - tools/stoneage_tw10_savedata_upstream_r19.py
      - tests/test_stoneage_tw10_savedata_upstream_r19.py
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet capstone pefile
      - name: R19 and adjacent R18 synthetic tests
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_tw10_savedata_upstream_r19 tests.test_stoneage_tw10_savedata_upstream_r18
          python -m compileall -q tools/stoneage_tw10_savedata_upstream_r19.py
          echo TW10_R19_SYNTHETIC_PASS
