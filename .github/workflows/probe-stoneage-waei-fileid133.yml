name: Bind Waei StoneAge fileid 133

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_fileid133_route_probe.py
      - tests/test_stoneage_waei_fileid133_route_probe.py
      - .github/workflows/probe-stoneage-waei-fileid133.yml

permissions:
  contents: write

concurrency:
  group: stoneage-waei-fileid133
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate route probe
        run: python3 -m unittest tests.test_stoneage_waei_fileid133_route_probe -v
      - name: Probe route metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_fileid133_route_probe \
            > research/recovered/STONEAGE-WAEI-FILEID133-ROUTE-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R='research/recovered/STONEAGE-WAEI-FILEID133-ROUTE-R1.txt'
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: bind Waei fileid 133 route'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_waei_fileid133_route_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: bind Waei fileid 133 route'
          fi
          git push
