name: Source bounded original family healing NPC creation R46
on:
  push:
    branches: ['agent/healing-npc-source-r46-20261027']
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rarfile==4.2 libarchive-c==5.3
      - run: sudo apt-get update -qq && sudo apt-get install -y unar libarchive-tools
      - run: python -m unittest -v tests.test_stoneage_preserved_healing_npc_r46
      - run: python -m tools.stoneage_preserved_healing_npc_r46 --output /tmp/r46-source.json
      - uses: actions/upload-artifact@v4
        with:
          name: r46-derived-source-report-only
          path: /tmp/r46-source.json
          if-no-files-found: error
          retention-days: 7
