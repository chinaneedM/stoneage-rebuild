name: PET atlas R25 CN85 runtime residual source
on:
  push:
    branches: [pet-atlas-r24-cn85-compatible-residual-20261127]
    paths:
      - 'tools/stoneage_pet_atlas_r25_cn85_runtime_residual.py'
      - '.github/workflows/pet-atlas-r25-cn85-runtime-residual.yml'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow cryptography==46.0.4
      - run: python -m tools.stoneage_pet_atlas_r25_cn85_runtime_residual --plan-only
  source:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y unshield
      - run: python -m pip install Pillow cryptography==46.0.4
      - run: python -m tools.stoneage_pet_atlas_r25_cn85_runtime_residual --output "$RUNNER_TEMP/r25" --public-key research/pets/PET-ATLAS-20261127-RECOVERY-PUBLIC.pem
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r25-cn85-private-runtime-residual
          path: |
            ${{ runner.temp }}/r25/batch-1/private.enc
            ${{ runner.temp }}/r25/batch-1/envelope.json
          if-no-files-found: error
          retention-days: 7
      - if: always()
        run: rm -rf "$RUNNER_TEMP/r25"
