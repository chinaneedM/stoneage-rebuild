name: Verify StoneAge INTEGRATION83 original 1009 4009 material shops and cross-carrier RD candidates
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION83-1009-4009-ORIGINAL-MATERIAL-SHOP-2D-SOURCE-R1.json'
      - 'tests/test_stoneage_integration83_material_shops_source.py'
      - '.github/workflows/verify-stoneage-integration83-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION83-1009-4009-ORIGINAL-MATERIAL-SHOP-2D-SOURCE-R1.json'
      - 'tests/test_stoneage_integration83_material_shops_source.py'
      - '.github/workflows/verify-stoneage-integration83-source.yml'
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify bounded original NPC and material item source contracts
        run: python -m unittest discover -s tests -p 'test_stoneage_integration83_material_shops_source.py' -v
