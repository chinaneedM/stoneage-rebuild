name: Qualify adult ceremony source contracts
on:
  push:
    paths:
      - 'tools/stoneage_adult_ceremony_probe.py'
      - 'tests/test_stoneage_adult_ceremony_probe.py'
      - 'research/recovered/STONEAGE-ADULT-CEREMONY-*.json'
      - 'docs/specs/STONEAGE-ADULT-CEREMONY-SOURCE-CONTRACT-R1.md'
      - '.github/workflows/validate-stoneage-adult-ceremony.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source lineage and version boundary regressions
        run: python -m unittest tests.test_stoneage_adult_ceremony_probe tests.test_stoneage_early_content_probe -v
      - name: Independently acquire six fixed evidence pages including exact archive capture
        run: python tools/stoneage_adult_ceremony_probe.py --output "$RUNNER_TEMP/adult-derived.json"
      - name: Compare selected source claims with permanent report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          fresh = json.loads((Path(os.environ['RUNNER_TEMP']) / 'adult-derived.json').read_text())
          archived = json.loads(Path('research/recovered/STONEAGE-ADULT-CEREMONY-SOURCE-CONTRACT-R1.json').read_text())
          assert fresh['observations'] == archived['observations']
          assert fresh['original_server_executed'] is False
          print('six selected source blocks, archive capture, profiles and lineage match permanent report')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adult-derived
          path: ${{ runner.temp }}/adult-derived.json
          retention-days: 7
