name: Verify StoneAge INTEGRATION34 source-qualified pet visual bridge
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION34-GETPET95-CROSSCARRIER-ORIGINAL-PIXEL-R1.json'
      - 'tests/test_stoneage_integration_module_34.py'
      - 'docs/continuity/STONEAGE-INTEGRATION34-GETPET95-CROSSCARRIER-VISUAL-20261110.md'
      - '.github/workflows/verify-stoneage-integration34-source.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION34-GETPET95-CROSSCARRIER-ORIGINAL-PIXEL-R1.json'
      - 'tests/test_stoneage_integration_module_34.py'
      - 'docs/continuity/STONEAGE-INTEGRATION34-GETPET95-CROSSCARRIER-VISUAL-20261110.md'
      - '.github/workflows/verify-stoneage-integration34-source.yml'
      - 'README.md'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_34.py' -v
