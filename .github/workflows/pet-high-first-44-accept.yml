name: PET-HIGH-FIRST-44 window reward acceptance replay
on:
  push:
    paths:
      - 'research/pets/PET-HIGH-FIRST-44-*.json'
      - 'tools/stoneage_pet_high_first_44_accept.py'
      - '.github/workflows/pet-high-first-44-accept.yml'
  pull_request:
    paths:
      - 'research/pets/PET-HIGH-FIRST-44-*.json'
      - 'tools/stoneage_pet_high_first_44_accept.py'
      - '.github/workflows/pet-high-first-44-accept.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m tools.stoneage_pet_high_first_44_accept
      - run: python3 tools/stoneage_pet_source_lookup.py --verify
