name: Validate StoneAge personal bank model
on:
  workflow_dispatch:
  push:
    paths:
      - research/mechanics/STONEAGE-PERSONAL-BANK-PERSISTENCE-R1.md
      - tools/stoneage_personal_bank_model.py
      - tests/test_stoneage_personal_bank_model.py
      - .github/workflows/validate-stoneage-personal-bank.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_personal_bank_model -v
