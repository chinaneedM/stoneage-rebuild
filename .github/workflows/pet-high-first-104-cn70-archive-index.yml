name: PET104 bounded CN70 historical archive index query
on:
  push:
    branches: ['agent/pet-high-first-104-cn70-archive-index-20261126']
    paths:
      - 'tools/stoneage_pet_high_first_104_cn70_archive_index.py'
      - '.github/workflows/pet-high-first-104-cn70-archive-index.yml'
permissions:
  contents: read
jobs:
  archive-index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m tools.stoneage_pet_high_first_104_cn70_archive_index --self-test
      - run: python -m tools.stoneage_pet_high_first_104_cn70_archive_index --output "$RUNNER_TEMP/pet104.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pet104-cn70-archive-index-metadata
          path: ${{ runner.temp }}/pet104.json
          if-no-files-found: error
          retention-days: 15
