name: Probe Beijing Waei StoneAge2 upgrade page
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_sa25_upgrade_page_probe.py
      - tests/test_stoneage_waei_sa25_upgrade_page_probe.py
      - .github/workflows/probe-stoneage-waei-sa25-upgrade-page.yml
permissions:
  contents: write
concurrency:
  group: stoneage-waei-sa25-upgrade-page
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact upgrade-page probe
        run: python3 -m unittest tests.test_stoneage_waei_sa25_upgrade_page_probe -v
      - name: Recover official upgrade page evidence
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_sa25_upgrade_page_probe > research/recovered/STONEAGE-WAEI-SA25-UPGRADE-PAGE-R1.txt
      - name: Commit derived evidence only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          report='research/recovered/STONEAGE-WAEI-SA25-UPGRADE-PAGE-R1.txt'
          git add "$report"
          git diff --cached --quiet && exit 0
          git commit -m 'research: recover official StoneAge2 upgrade page'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_waei_sa25_upgrade_page_probe > "$report"
            git add "$report"; git diff --cached --quiet && exit 0
            git commit -m 'research: recover official StoneAge2 upgrade page'
          fi
          git push
