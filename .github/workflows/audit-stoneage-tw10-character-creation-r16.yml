name: Audit authentic TW1.0 creation body base table R16
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_tw10_character_creation_body_window_r16.py
      - tests/test_stoneage_tw10_character_creation_body_window_r16.py
      - .github/workflows/audit-stoneage-tw10-character-creation-r16.yml
permissions:
  contents: read
jobs:
  source-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded decoder and run semantic guards
        run: |
          python -m pip install --quiet capstone pefile
          python -m unittest tests.test_stoneage_tw10_character_creation_body_window_r16 -v
      - name: Acquire already accepted original Taiwan 1.0 carrier once
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 --silent --show-error -o /tmp/CD_DIC.rar 'https://archive.org/download/stoneage_tw_2000_win/CD_DIC.rar'
          echo 'b37a4a47f4eb608cac67e4ddf7a1621a  /tmp/CD_DIC.rar' | md5sum -c -
          echo 'b8cf92720b6ec8b3f46ea2e9bfcda986d21e7ded  /tmp/CD_DIC.rar' | sha1sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/tw10
          7z x -y -o/tmp/tw10 /tmp/CD_DIC.rar 'STONEAGE.bin' >/dev/null
          test "$(stat -c %s /tmp/tw10/STONEAGE.bin)" = '523449360'
      - name: Examine exact original numeric base and SPR metadata
        run: |
          python -m tools.stoneage_tw10_character_creation_body_window_r16 --bin /tmp/tw10/STONEAGE.bin --output /tmp/derived-r16/TW10-CREATION-BODY-WINDOW-R16.json
      - name: Remove commercial source payload
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/tw10
      - uses: actions/upload-artifact@v4
        with:
          name: tw10-character-creation-source-r16
          path: /tmp/derived-r16/TW10-CREATION-BODY-WINDOW-R16.json
          if-no-files-found: error
          retention-days: 7
