name: Verify StoneAge INTEGRATION46 original Jaruga A12 source
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION46-JARUGA-A12-ORIGINAL-DAT-AND-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_46.py'
      - '.github/workflows/verify-stoneage-integration46-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION46-JARUGA-A12-ORIGINAL-DAT-AND-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_46.py'
      - '.github/workflows/verify-stoneage-integration46-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_46.py' -v
