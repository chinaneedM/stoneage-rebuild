name: Validate StoneAge original battle drop attack-list ticket
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-battle-original-drop-ticket.yml"
      - "tools/stoneage_battle_original_drop_ticket_audit.py"
      - "tests/test_stoneage_enemy_original_drop.py"
      - "tests/test_stoneage_battle_original_drop_ticket.py"
      - "research/recovered/STONEAGE-BATTLE-ORIGINAL-DROP-TICKET-SOURCE-R1.json"
permissions:
  contents: read
jobs:
  original-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Original drop source and retained regression gates
        run: |
          python -m unittest -v tests.test_stoneage_battle_original_drop_ticket tests.test_stoneage_enemy_original_drop tests.test_stoneage_item_factory tests.test_stoneage_item_allocator tests.test_stoneage_party_pet_reward_ownership tests.test_stoneage_party_pet_original_reward_item tests.test_stoneage_party_pet_original_pet_growth tests.test_stoneage_party_pet_original_player_level
      - name: Recover pinned historical descendant sources transiently
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_party_pet_original_attack_audit import PINNED
          repos={"gavin":"gavinlinasd/StoneAge","iris":"iriselia/StoneAge","bismarck":"BismarckDD/stoneage"}
          for profile,commit in PINNED.items():
              folder=Path("/tmp/stoneage-battle-original-drop-ticket-r1")/profile
              subprocess.run(["git","init",str(folder)],check=True)
              subprocess.run(["git","-C",str(folder),"remote","add","origin","https://github.com/"+repos[profile]+".git"],check=True)
              subprocess.run(["git","-C",str(folder),"fetch","--depth","1","origin",commit],check=True)
              subprocess.run(["git","-C",str(folder),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Run original battle attack-list ticket against freshly spawned enemy item
        run: |
          set -euo pipefail
          python -m tools.stoneage_battle_original_drop_ticket_audit --gavin-dir /tmp/stoneage-battle-original-drop-ticket-r1/gavin --iris-dir /tmp/stoneage-battle-original-drop-ticket-r1/iris --bismarck-dir /tmp/stoneage-battle-original-drop-ticket-r1/bismarck > /tmp/stoneage-battle-original-drop-ticket-r1.txt
          cat /tmp/stoneage-battle-original-drop-ticket-r1.txt
          grep -Fx 'RESOLUTION|ORIGINAL_REAL_HEADER_DROP_TICKET_BOUNDED_PASS' /tmp/stoneage-battle-original-drop-ticket-r1.txt
          test "$(grep -c '^ACTUAL|.*REAL_HEADER_DROP_TICKET|' /tmp/stoneage-battle-original-drop-ticket-r1.txt)" -eq 2
      - name: Preserve original item factory independently
        run: |
          set -euo pipefail
          python -m tools.stoneage_item_factory_audit --gavin-dir /tmp/stoneage-battle-original-drop-ticket-r1/gavin --iris-dir /tmp/stoneage-battle-original-drop-ticket-r1/iris --bismarck-dir /tmp/stoneage-battle-original-drop-ticket-r1/bismarck > /tmp/stoneage-item-factory-retained-r1.txt
          grep -Fx 'RESOLUTION|ORIGINAL_REAL_HEADER_ITEM_FACTORY_BOUNDED_PASS' /tmp/stoneage-item-factory-retained-r1.txt
      - name: Upload only derived evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoneage-battle-original-drop-ticket-r1
          path: |
            /tmp/stoneage-battle-original-drop-ticket-r1.txt
            /tmp/stoneage-item-factory-retained-r1.txt
          if-no-files-found: ignore
