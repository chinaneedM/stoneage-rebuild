name: Probe JSS 1999 beta application path
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_jss1999_beta_apply_archive_probe.py
      - tests/test_stoneage_jss1999_beta_apply_archive_probe.py
      - .github/workflows/probe-stoneage-jss1999-beta-apply.yml

permissions:
  contents: write

concurrency:
  group: stoneage-jss1999-beta-apply
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate wildcard-path probe
        run: python3 -m unittest tests.test_stoneage_jss1999_beta_apply_archive_probe -v
      - name: Query 1999 archive indexes
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_jss1999_beta_apply_archive_probe \
            > research/recovered/STONEAGE-JSS1999-BETA-APPLY-ARCHIVE-R1.txt
      - name: Commit derived index metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-JSS1999-BETA-APPLY-ARCHIVE-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe JSS 1999 beta application path'
          git pull --rebase origin main
          git push
