name: Verify JP2007 starter club source and attribution boundaries
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-JP2007-STARTER-CLUB-*.json'
      - 'tools/stoneage_jp2007_starter_club_source.py'
      - 'tests/test_stoneage_jp2007_starter_club_source.py'
      - '.github/workflows/verify-stoneage-jp2007-starter-club-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-JP2007-STARTER-CLUB-*.json'
      - 'tools/stoneage_jp2007_starter_club_source.py'
      - 'tests/test_stoneage_jp2007_starter_club_source.py'
      - '.github/workflows/verify-stoneage-jp2007-starter-club-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check source roles, unknowns, version and durable metadata
        run: python -m unittest discover -s tests -p 'test_stoneage_jp2007_starter_club_source.py' -v
      - name: Re-fetch article and mutate thirteen actual source facts
        run: python -m tools.stoneage_jp2007_starter_club_source --fetch --output /tmp/jp2007-starter/replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: jp2007-starter-derived-replay
          path: /tmp/jp2007-starter/replay.json
          if-no-files-found: error
          retention-days: 30
