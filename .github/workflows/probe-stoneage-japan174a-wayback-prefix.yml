name: Probe Japan 1.74a Wayback prefix neighborhood
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_japan174a_wayback_prefix_probe.py
      - tests/test_stoneage_japan174a_wayback_prefix_probe.py
      - .github/workflows/probe-stoneage-japan174a-wayback-prefix.yml

permissions:
  contents: write

concurrency:
  group: stoneage-japan174a-wayback-prefix
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run prefix-neighborhood probe tests
        run: python3 -m unittest tests.test_stoneage_japan174a_wayback_prefix_probe -v
      - name: Probe Wayback prefix neighborhoods
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_japan174a_wayback_prefix_probe \
            > research/recovered/STONEAGE-JAPAN-174A-WAYBACK-PREFIX-R1.txt
      - name: Commit derived index metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-JAPAN-174A-WAYBACK-PREFIX-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Japan 1.74a Wayback prefix neighborhood'
          git pull --rebase origin main
          git push
