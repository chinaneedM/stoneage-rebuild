name: PET-HIGH-FIRST-14 TW85 special RD and master census
on:
  push:
    branches: [agent/pet-high-first-14-20261124, main]
    paths:
      - '.github/workflows/pet-high-first-14-tw85-source.yml'
      - 'tools/stoneage_pet_high_first_tw85_special.py'
  pull_request:
    paths:
      - '.github/workflows/pet-high-first-14-tw85-source.yml'
      - 'tools/stoneage_pet_high_first_tw85_special.py'
      - 'research/pets/PET-HIGH-FIRST-14-*'
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/agent/pet-high-first-14-20261124'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static MSI and PE inspection dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq msitools upx-ucl
          python -m pip install capstone Pillow
      - name: Authenticate and statically extract saved carrier
        run: python -m tools.stoneage_wayi85_sixpart_acquisition --work "$RUNNER_TEMP/tw85" --output "$RUNNER_TEMP/tw85-acquisition.json"
      - name: Read actual special RD blocks and inspect original PE anchors
        run: |
          python -m tools.stoneage_pet_high_first_tw85_special --source-root "$RUNNER_TEMP/tw85/msi-client" --temp "$RUNNER_TEMP"
          python -m tools.stoneage_pet_high_first_tw85_special
      - name: Archive metadata only
        run: |
          git add research/pets/PET-HIGH-FIRST-14-TW85-SPECIAL-RD-AND-MASTER-CENSUS-R1.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'PET14: archive special RD and exact client file census'
          git push origin "HEAD:$GITHUB_REF"
  verify:
    if: github.ref != 'refs/heads/agent/pet-high-first-14-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay special source boundary and previous receipts
        run: |
          python -m tools.stoneage_pet_high_first_tw85_special
          python -m tools.stoneage_pet_high_first_tw85_residual
          python -m unittest tests.test_stoneage_pet_high_first_tw85_pixels
