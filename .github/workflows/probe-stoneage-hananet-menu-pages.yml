name: Probe exact Hananet StoneAge menu pages
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_menu_page_probe.py
      - tests/test_stoneage_hananet_menu_page_probe.py
      - .github/workflows/probe-stoneage-hananet-menu-pages.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-menu-pages
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_menu_page_probe -v
      - name: Fetch exact menu snapshots
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_menu_page_probe             > research/recovered/STONEAGE-HANANET-MENU-PAGES-R1.txt
      - name: Commit derived menu metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-MENU-PAGES-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: extract exact Hananet StoneAge menu pages'
          git pull --rebase origin main
          git push
