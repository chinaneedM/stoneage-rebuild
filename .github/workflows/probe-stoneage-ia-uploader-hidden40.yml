name: Scan IA uploader for hidden StoneAge 4.0

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_ia_uploader_hidden40_probe.py
      - tests/test_stoneage_ia_uploader_hidden40_probe.py
      - .github/workflows/probe-stoneage-ia-uploader-hidden40.yml

permissions:
  contents: write

concurrency:
  group: stoneage-ia-uploader-hidden40
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate filter
        run: python3 -m unittest tests.test_stoneage_ia_uploader_hidden40_probe -v
      - name: Scan uploader catalogue and candidate file lists
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_ia_uploader_hidden40_probe             > research/recovered/STONEAGE-IA-UPLOADER-HIDDEN40-R1.txt
      - name: Commit derived catalogue evidence only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-IA-UPLOADER-HIDDEN40-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan IA uploader for hidden StoneAge 4.0'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
