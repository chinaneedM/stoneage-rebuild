name: Recover qualified 28 original MAP07 DAT with private encrypted transfer
on:
  push:
    branches: [agent/map07-original-scenes-batch-20261107]
    paths:
      - tools/stoneage_map07_private_dat_batch.py
      - research/recovered/STONEAGE-MAP07-TRANSFER-CERT.pem
      - .github/workflows/source-stoneage-map07-private-dat.yml
permissions:
  contents: read
jobs:
  map07-private-dat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install libarchive-c==5.3
      - name: Byte-verify original carrier and 28 exact DAT source members
        run: python -m tools.stoneage_map07_private_dat_batch --output /tmp/map07-output --certificate research/recovered/STONEAGE-MAP07-TRANSFER-CERT.pem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map07-original-private-dat-encrypted-and-derived-metadata
          path: /tmp/map07-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
