name: Validate TW1.0 R27 native file API conditional synthetic and strict guard
on:
  workflow_dispatch:
  push:
    branches: [main, agent/tw10-savedata-r27-native-io-sites-20261013]
    paths:
      - .github/workflows/validate-stoneage-tw10-r27-synthetic.yml
      - tools/stoneage_tw10_savedata_native_io_r27.py
      - tools/stoneage_tw10_savedata_native_io_r27_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r27.py
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet capstone pefile
      - name: R27 and R25 synthetic and strict negative controls
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r27 tests.test_stoneage_tw10_savedata_upstream_r26
          python -m compileall -q tools/stoneage_tw10_savedata_native_io_r27.py tools/stoneage_tw10_savedata_native_io_r27_guard.py
          echo TW10_R27_SYNTHETIC_STRICT=PASS
          echo TW10_R27_ORIGINAL_EVIDENCE=OPEN
