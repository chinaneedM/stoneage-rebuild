name: Recover StoneAge 2.5 collector archived images

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_collector_archive_probe.py
      - tests/test_stoneage_sa25_collector_archive_probe.py
      - .github/workflows/probe-stoneage-sa25-collector-archive.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-collector-archive
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV runtime
        run: python3 -m pip install --quiet opencv-python-headless
      - run: python3 -m unittest tests.test_stoneage_sa25_collector_archive_probe -v
      - name: Recover archived collector images
        run: |
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_collector_archive_probe > research/recovered/STONEAGE-SA25-COLLECTOR-ARCHIVE-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA25-COLLECTOR-ARCHIVE-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: recover archived StoneAge 2.5 collector images'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
