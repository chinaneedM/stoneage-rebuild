name: PET atlas R79 bounded sea dragon item dictionary
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pet-atlas-r79-drop-items.yml'
      - 'tools/stoneage_pet_atlas_r79_drop_items.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/stoneage_pet_atlas_r79_drop_items.py
