name: Probe TW1.0 original R40 read-frame slots and postcall predicate candidates
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-savedata-r40-read-frame-endcheck-20261014]
    paths:
      - .github/workflows/probe-stoneage-tw10-r40-original.yml
      - tools/stoneage_tw10_savedata_native_io_r40.py
      - tools/stoneage_tw10_savedata_native_io_r40_guard.py
      - tests/test_stoneage_tw10_savedata_native_io_r40.py
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: R40 and inherited synthetic strict gates
        run: |
          set -euo pipefail
          pip install --quiet capstone pefile
          python -m unittest -v tests.test_stoneage_tw10_savedata_native_io_r40 tests.test_stoneage_tw10_savedata_native_io_r38
      - name: Retrieve authenticated transient TW1.0 retail archive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m tools.stoneage_tw10_archive_parallel_download --deadline 1500 --workers 16 --chunk 8388608 --output /tmp/CD_DIC.rar; then
              echo TW10_R40_PINNED_ARCHIVE=PASS
              break
            fi
            rm -f /tmp/CD_DIC.rar
            if [ "$attempt" -eq 3 ]; then
              echo TW10_R40_SOURCE_UNAVAILABLE=OPEN
              exit 1
            fi
            sleep 10
          done
      - name: Extract original BIN transient only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip
          mkdir -p /tmp/stoneage-r40
          7z x -y -o/tmp/stoneage-r40 /tmp/CD_DIC.rar STONEAGE.bin >/dev/null
          test "$(stat -c %s /tmp/stoneage-r40/STONEAGE.bin)" -eq 523449360
      - name: Derive bounded R40 static-only original metadata
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_savedata_native_io_r40 --bin /tmp/stoneage-r40/STONEAGE.bin > /tmp/stoneage-r40-derived.json
          python -m tools.stoneage_tw10_savedata_native_io_r40_guard --report /tmp/stoneage-r40-derived.json
          test "$(stat -c %s /tmp/stoneage-r40-derived.json)" -le 100000
          echo TW10_R40_ORIGINAL_STATIC_ONLY=PASS
          echo TW10_R40_NATIVE_SAVE=OPEN
      - name: Always purge proprietary source
        if: always()
        run: rm -rf /tmp/CD_DIC.rar /tmp/stoneage-r40
      - name: Upload derived metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tw10-r40-original-read-frame-endcheck-derived
          path: /tmp/stoneage-r40-derived.json
          retention-days: 21
