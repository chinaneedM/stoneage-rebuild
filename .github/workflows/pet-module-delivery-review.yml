name: PET module source-separated delivery review
on:
  push:
    branches: ['agent/pet-module-delivery-review-20261126']
    paths:
      - 'tools/stoneage_pet_module_delivery_review.py'
      - 'docs/pets/PET-MODULE-DELIVERY-REVIEW-20261126.md'
      - '.github/workflows/pet-module-delivery-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/stoneage_pet_module_delivery_review.py
      - run: cat pet-module-delivery-review.json
      - run: PYTHONPATH=. python tools/stoneage_pet_final_review_matrix.py
      - run: cmp pet-final-review-matrix.json research/pets/PET-FINAL-REVIEW-MATRIX-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: pet-module-delivery-review-derived
          path: pet-module-delivery-review.json
