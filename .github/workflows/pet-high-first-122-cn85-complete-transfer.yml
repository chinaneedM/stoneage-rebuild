name: PET122 CN85 final bounded full transfer and resource analysis
on:
  push:
    branches: ['agent/pet-high-first-122-cn85-complete-transfer-20261126']
    paths:
      - 'tools/stoneage_pet_high_first_122_cn85_complete_transfer.py'
      - '.github/workflows/pet-high-first-122-cn85-complete-transfer.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y unshield
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15120460742/zip > "$RUNNER_TEMP/pet120.zip"
          python -m tools.stoneage_pet_high_first_122_cn85_complete_transfer --artifact "$RUNNER_TEMP/pet120.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pet122-cn85-derived-resource-evidence
          path: research/pets/PET-HIGH-FIRST-122-CN85-COMPLETE-TRANSFER-R1.json
          if-no-files-found: error
          retention-days: 15
      - name: Retain derived metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/pets/PET-HIGH-FIRST-122-CN85-COMPLETE-TRANSFER-R1.json
          git commit -m 'PET122: retain measured archive transfer and original resource evidence'
          git push origin HEAD:agent/pet-high-first-122-cn85-complete-transfer-20261126
