name: Probe sa-arena optical carrier

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa_arena_ia_probe.py
      - tests/test_stoneage_sa_arena_ia_probe.py
      - .github/workflows/probe-stoneage-sa-arena-ia.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa-arena-ia
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded optical probe
        run: python3 -m unittest tests.test_stoneage_sa_arena_ia_probe -v
      - name: Probe IA metadata and ISO9660 sectors
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa_arena_ia_probe \
            > research/recovered/STONEAGE-SA-ARENA-IA-OPTICAL-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA-ARENA-IA-OPTICAL-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe sa-arena optical metadata'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
