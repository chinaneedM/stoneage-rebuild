name: Audit native TW1.0 graphic writer value origins P2B
on:
  push:
    paths:
      - 'tools/stoneage_tw10_writer_identity_p2b.py'
      - 'tests/test_stoneage_tw10_writer_identity_p2b.py'
      - '.github/workflows/audit-stoneage-tw10-writer-identity-p2b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-static-writer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install capstone==5.0.9 pefile==2024.8.26
      - run: python -m unittest tests.test_stoneage_tw10_writer_identity_p2b -v
      - name: Reacquire exactly pinned original Taiwan 1.0 bytes without executing EXE
        run: |
          set -euo pipefail
          python -m tools.stoneage_tw10_archive_parallel_download --output /tmp/p2bw-CD_DIC.rar --workers 16 --deadline 600
          command -v 7z >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq 7zip)
          mkdir -p /tmp/p2bw-disc
          7z x -y -o/tmp/p2bw-disc /tmp/p2bw-CD_DIC.rar STONEAGE.bin >/dev/null
          python -m tools.stoneage_tw10_writer_identity_p2b --disc /tmp/p2bw-disc/STONEAGE.bin --out /tmp/p2bw-original-writer-report.json
          python -m json.tool /tmp/p2bw-original-writer-report.json >/dev/null
      - name: Delete proprietary carrier
        if: always()
        run: rm -rf /tmp/p2bw-CD_DIC.rar /tmp/p2bw-disc
      - uses: actions/upload-artifact@v4
        with:
          name: tw10-p2b-original-writer-derived-only
          path: /tmp/p2bw-original-writer-report.json
          retention-days: 30
