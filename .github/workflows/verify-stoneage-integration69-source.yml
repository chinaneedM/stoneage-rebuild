name: Verify StoneAge INTEGRATION69 original event13 heirloom source and pixels
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION69-HEIRLOOM-EVENT13-NPC-ITEM-TW1-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_69.py'
      - '.github/workflows/verify-stoneage-integration69-source.yml'
      - 'research/recovered/STONEAGE-QUEST-STORY-MODULE-01-ORIGINAL-EXCHANGEMAN-QUEST-SOURCE-BLOCK-CATALOG-R1.json'
      - 'research/recovered/STONEAGE-CHARACTER-NPC-MODULE-01-FULL-SOURCE-ROWS-R1.json'
      - 'research/recovered/item-module-01/STONEAGE-ITEM01-ORIGINAL-ITEM-ID-DERIVED-INDEX-02-R1.json'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION69-HEIRLOOM-EVENT13-NPC-ITEM-TW1-PIXEL-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_69.py'
      - '.github/workflows/verify-stoneage-integration69-source.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_69.py' -v
      - run: python -m unittest discover -s tests -p 'test_stoneage_quest31_four_village_source.py' -v
