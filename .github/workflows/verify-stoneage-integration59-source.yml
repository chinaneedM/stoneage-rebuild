name: Verify StoneAge INTEGRATION59 four village original shop numeric source
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION59-FOUR-VILLAGE-SHOP-120-ORIGINAL-NUMERIC-TW1-PIXEL-CROSSWALK-R1.json'
      - 'tests/test_stoneage_integration_module_59.py'
      - '.github/workflows/verify-stoneage-integration59-source.yml'
      - 'research/recovered/STONEAGE-ITEM-EQUIPMENT-SHOP-MODULE-01-224-SOURCE-ITEMLISTS-191-CREATE-REFERENCES-R1.json'
      - 'research/recovered/item-module-01/**'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION59-FOUR-VILLAGE-SHOP-120-ORIGINAL-NUMERIC-TW1-PIXEL-CROSSWALK-R1.json'
      - 'tests/test_stoneage_integration_module_59.py'
      - '.github/workflows/verify-stoneage-integration59-source.yml'
      - 'research/recovered/STONEAGE-ITEM-EQUIPMENT-SHOP-MODULE-01-224-SOURCE-ITEMLISTS-191-CREATE-REFERENCES-R1.json'
      - 'research/recovered/item-module-01/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_59.py' -v
