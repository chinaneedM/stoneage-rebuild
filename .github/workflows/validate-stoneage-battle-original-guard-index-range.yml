name: Validate StoneAge original guard index range crossed with actor type and validity
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-battle-original-guard-index-range.yml"
      - "tools/stoneage_battle_original_guard_index_range_audit.py"
      - "tools/stoneage_battle_original_player_pet_partition_audit.py"
      - "research/recovered/STONEAGE-BATTLE-ORIGINAL-GUARD-INDEX-RANGE-R1.txt"
      - "tests/test_stoneage_enemy_original_drop.py"
      - "tests/test_stoneage_battle_original_same_item_finish.py"
      - "tests/test_stoneage_battle_original_guard_index_range.py"
      - "tests/test_stoneage_battle_original_ticket_cleanup.py"
      - "tests/test_stoneage_battle_original_same_item_full_bag.py"
      - "tests/test_stoneage_battle_original_drop_payout.py"
      - "tests/test_stoneage_battle_original_drop_ticket.py"
      - "research/recovered/STONEAGE-BATTLE-ORIGINAL-DROP-TICKET-SOURCE-R1.json"
permissions:
  contents: read
jobs:
  original-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Original drop source and retained regression gates
        run: |
          python -m unittest -v tests.test_stoneage_battle_original_guard_index_range tests.test_stoneage_battle_original_player_pet_partition tests.test_stoneage_battle_original_shared_item_retention tests.test_stoneage_battle_original_two_player_concentrated tests.test_stoneage_battle_original_two_player_split tests.test_stoneage_battle_original_four_drop_chain tests.test_stoneage_battle_original_overflow_ticket tests.test_stoneage_battle_original_distinct_item_ticket tests.test_stoneage_battle_original_last_slot_ticket tests.test_stoneage_battle_original_mixed_item_ticket tests.test_stoneage_battle_original_invalid_item_ticket tests.test_stoneage_battle_original_recipient_side tests.test_stoneage_battle_original_ticket_cleanup tests.test_stoneage_battle_original_same_item_full_bag tests.test_stoneage_battle_original_same_item_finish tests.test_stoneage_battle_original_drop_payout tests.test_stoneage_battle_original_drop_ticket tests.test_stoneage_enemy_original_drop tests.test_stoneage_item_factory tests.test_stoneage_item_allocator tests.test_stoneage_party_pet_reward_ownership tests.test_stoneage_party_pet_original_reward_item tests.test_stoneage_party_pet_original_pet_growth tests.test_stoneage_party_pet_original_player_level
      - name: Recover pinned historical descendant sources transiently
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_party_pet_original_attack_audit import PINNED
          repos={"gavin":"gavinlinasd/StoneAge","iris":"iriselia/StoneAge","bismarck":"BismarckDD/stoneage"}
          for profile,commit in PINNED.items():
              folder=Path("/tmp/stoneage-battle-original-guard-index-range-r1")/profile
              subprocess.run(["git","init",str(folder)],check=True)
              subprocess.run(["git","-C",str(folder),"remote","add","origin","https://github.com/"+repos[profile]+".git"],check=True)
              subprocess.run(["git","-C",str(folder),"fetch","--depth","1","origin",commit],check=True)
              subprocess.run(["git","-C",str(folder),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Run original guard index range crossed with actor type and validity
        run: |
          set -euo pipefail
          python -m tools.stoneage_battle_original_guard_index_range_audit --gavin-dir /tmp/stoneage-battle-original-guard-index-range-r1/gavin --iris-dir /tmp/stoneage-battle-original-guard-index-range-r1/iris --bismarck-dir /tmp/stoneage-battle-original-guard-index-range-r1/bismarck > /tmp/stoneage-battle-original-guard-index-range-r1.txt
          cat /tmp/stoneage-battle-original-guard-index-range-r1.txt
          grep -Fx 'RESOLUTION|ORIGINAL_REAL_HEADER_GUARD_INDEX_RANGE_BOUNDED_PASS' /tmp/stoneage-battle-original-guard-index-range-r1.txt
          test "$(grep -c '^ACTUAL|.*REAL_HEADER_GUARD_INDEX_RANGE|' /tmp/stoneage-battle-original-guard-index-range-r1.txt)" -eq 96
      - name: Validate guard-index-range matrix and all predecessor witnesses
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.stoneage_battle_original_guard_index_range_audit import validate_report
          rows=validate_report(Path('/tmp/stoneage-battle-original-guard-index-range-r1.txt').read_text())
          report=Path('/tmp/stoneage-battle-original-guard-index-range-r1.txt').read_text()
          prior=Path('research/recovered/STONEAGE-BATTLE-ORIGINAL-PLAYER-PET-PARTITION-R1.txt').read_text()
          prior_rows=[s for s in prior.splitlines() if s.startswith('ACTUAL|')]
          current_rows=[s for s in report.splitlines() if s.startswith('ACTUAL|') and '|REAL_HEADER_GUARD_INDEX_RANGE|' not in s]
          assert current_rows==prior_rows
          assert report==Path('research/recovered/STONEAGE-BATTLE-ORIGINAL-GUARD-INDEX-RANGE-R1.txt').read_text()
          print('Complete original guard range witnesses:',len(rows),'byte-exact predecessor witnesses',len(prior_rows))
          PY
      - name: Preserve original item factory independently
        run: |
          set -euo pipefail
          python -m tools.stoneage_item_factory_audit --gavin-dir /tmp/stoneage-battle-original-guard-index-range-r1/gavin --iris-dir /tmp/stoneage-battle-original-guard-index-range-r1/iris --bismarck-dir /tmp/stoneage-battle-original-guard-index-range-r1/bismarck > /tmp/stoneage-item-factory-retained-r1.txt
          grep -Fx 'RESOLUTION|ORIGINAL_REAL_HEADER_ITEM_FACTORY_BOUNDED_PASS' /tmp/stoneage-item-factory-retained-r1.txt
      - name: Upload only derived evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoneage-battle-original-guard-index-range-r1
          path: |
            /tmp/stoneage-battle-original-guard-index-range-r1.txt
            /tmp/stoneage-item-factory-retained-r1.txt
          if-no-files-found: ignore
