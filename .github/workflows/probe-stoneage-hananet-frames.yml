name: Probe Hananet StoneAge frame paths
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_frame_probe.py
      - tests/test_stoneage_hananet_frame_probe.py
      - .github/workflows/probe-stoneage-hananet-frames.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-frames
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_frame_probe -v
      - name: Probe preserved Hananet frame pages
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_frame_probe             > research/recovered/STONEAGE-HANANET-FRAME-PATHS-R1.txt
      - name: Commit derived Hananet metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-FRAME-PATHS-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: extract Hananet StoneAge frame paths'
          git pull --rebase origin main
          git push
