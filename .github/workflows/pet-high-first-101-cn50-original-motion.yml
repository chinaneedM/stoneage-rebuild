name: PET101 CN50 retained original motion acceptance
on:
  push:
    branches: [main, agent/pet-high-first-100-cn50-full-motion-preflight-20261126]
    paths:
      - '.github/workflows/pet-high-first-101-cn50-original-motion.yml'
      - 'tools/stoneage_pet_high_first_101_accept.py'
      - 'research/pets/PET-HIGH-FIRST-10*'
      - 'tools/stoneage_pet_source_lookup.py'
      - 'tools/stoneage_pet_high_first_64_coverage.py'
  pull_request:
    paths:
      - '.github/workflows/pet-high-first-101-cn50-original-motion.yml'
      - 'tools/stoneage_pet_high_first_101_accept.py'
      - 'research/pets/PET-HIGH-FIRST-10*'
      - 'tools/stoneage_pet_source_lookup.py'
      - 'tools/stoneage_pet_high_first_64_coverage.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python -m tools.stoneage_pet_high_first_101_accept
      - run: python -m tools.stoneage_pet_source_lookup --verify
      - run: python -m tools.stoneage_pet_high_first_64_coverage --current > "$RUNNER_TEMP/pet101-coverage.json"
      - run: python -m tools.stoneage_pet_high_first_64_coverage
      - run: python tools/stoneage_pet_gap_queue.py --verify
