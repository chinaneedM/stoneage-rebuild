name: Probe GameTime StoneAge library supplement metadata

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_gametime_library_probe.py
      - tests/test_stoneage_gametime_library_probe.py
      - .github/workflows/probe-stoneage-gametime-library.yml

permissions:
  contents: write

concurrency:
  group: stoneage-gametime-library
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_gametime_library_probe -v
      - name: Probe public library/catalog metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_gametime_library_probe             > research/recovered/STONEAGE-GAMETIME-2001-LIBRARY-SUPPLEMENT-R1.txt
      - name: Commit derived catalog metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-GAMETIME-2001-LIBRARY-SUPPLEMENT-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe GameTime library supplement metadata'
          git pull --rebase origin main
          git push
