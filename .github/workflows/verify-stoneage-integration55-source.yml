name: Verify StoneAge INTEGRATION55 ranch triple-pet source pixels
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION55-DINO-RANCH-THREE-PETS-TW1-48-REAL-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_55.py'
      - '.github/workflows/verify-stoneage-integration55-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION55-DINO-RANCH-THREE-PETS-TW1-48-REAL-PIXELS-R1.json'
      - 'tests/test_stoneage_integration_module_55.py'
      - '.github/workflows/verify-stoneage-integration55-source.yml'
permissions:
  contents: read
jobs:
  verify-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_55.py' -v
