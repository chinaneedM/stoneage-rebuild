name: PET-HIGH-FIRST-56 special roles and original all-residual NPC references
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_56_source.py'
      - 'research/pets/PET-HIGH-FIRST-56-SPECIAL-ROLE-PREFLIGHT-R1.json'
      - '.github/workflows/pet-high-first-56-source.yml'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_56_source.py'
      - 'research/pets/PET-HIGH-FIRST-56-SPECIAL-ROLE-PREFLIGHT-R1.json'
      - '.github/workflows/pet-high-first-56-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rarfile==4.2 libarchive-c==5.3
      - run: sudo apt-get update -qq && sudo apt-get install -y unar
      - run: python -m tools.stoneage_pet_high_first_56_source --output /tmp/pet56-derived.json
      - uses: actions/upload-artifact@v4
        with:
          name: pet56-derived-only
          path: /tmp/pet56-derived.json
          retention-days: 7
