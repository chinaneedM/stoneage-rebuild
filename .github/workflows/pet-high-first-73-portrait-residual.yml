name: PET-HIGH-FIRST-73 original portraits and residual motion
on:
  push:
    paths:
      - 'tools/stoneage_pet_high_first_73_portrait_residual.py'
      - '.github/workflows/pet-high-first-73-portrait-residual.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-73-PORTRAIT-RESIDUAL-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-73-*'
  pull_request:
    paths:
      - 'tools/stoneage_pet_high_first_73_portrait_residual.py'
      - '.github/workflows/pet-high-first-73-portrait-residual.yml'
      - 'docs/continuity/STONEAGE-PET-HIGH-FIRST-73-PORTRAIT-RESIDUAL-20261125.md'
      - 'research/pets/PET-HIGH-FIRST-73-*'
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/pet-high-first-73-portrait-residual-20261125' && startsWith(github.event.head_commit.message, 'PET-HIGH-FIRST-73:')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq msitools
      - run: python -m tools.stoneage_wayi85_sixpart_acquisition --work "$RUNNER_TEMP/tw85" --output "$RUNNER_TEMP/tw85-acquisition.json"
      - run: |
          python -m tools.stoneage_pet_high_first_73_portrait_residual --source-dir "$RUNNER_TEMP/tw85/msi-client/Program Files/WAYI/石器時代 魔域大冒險/data" --acquisition "$RUNNER_TEMP/tw85-acquisition.json"
          python -m tools.stoneage_pet_high_first_73_portrait_residual
      - uses: actions/upload-artifact@v4
        with:
          name: pet73-derived-evidence
          path: |
            research/pets/PET-HIGH-FIRST-73-PORTRAIT-RESIDUAL-R1.json
            research/pets/PET-HIGH-FIRST-73-PORTRAIT-RESIDUAL-SUMMARY-R1.json
          retention-days: 7
      - run: |
          git add 'research/pets/PET-HIGH-FIRST-73-PORTRAIT-RESIDUAL-R1.json' 'research/pets/PET-HIGH-FIRST-73-PORTRAIT-RESIDUAL-SUMMARY-R1.json'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'PET73: archive original portrait alias and residual group receipts'
          git push origin "HEAD:$GITHUB_REF"
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'PET-HIGH-FIRST-73:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: |
          if test -f research/pets/PET-HIGH-FIRST-73-PORTRAIT-RESIDUAL-R1.json; then
            python -m tools.stoneage_pet_high_first_73_portrait_residual
          else
            python -m tools.stoneage_pet_high_first_73_portrait_residual --plan-only
          fi
