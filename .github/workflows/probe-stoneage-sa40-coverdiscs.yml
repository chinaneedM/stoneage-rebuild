name: Scan 4.0-era coverdisc filesystems
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa40_coverdisc_fs_probe.py
      - tests/test_stoneage_sa40_coverdisc_fs_probe.py
      - .github/workflows/probe-stoneage-sa40-coverdiscs.yml
permissions:
  contents: write
concurrency:
  group: stoneage-sa40-coverdisc-fs
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_sa40_coverdisc_fs_probe -v
      - run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa40_coverdisc_fs_probe > research/recovered/STONEAGE-SA40-COVERDISC-FS-R1.txt
      - run: |
          set -euo pipefail
          R=research/recovered/STONEAGE-SA40-COVERDISC-FS-R1.txt
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan 4.0-era coverdisc filesystems'
          for n in 1 2 3 4 5; do git push && exit 0; sleep $((n*3)); done
          exit 1
