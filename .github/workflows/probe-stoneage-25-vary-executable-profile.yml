name: Probe recovered StoneAge Vary executable profile

concurrency:
  group: stoneage-vary-executable-profile-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-stoneage-25-vary-executable-profile.yml"
      - "tools/stoneage_vary_executable_profile_probe.py"
      - "tests/test_stoneage_vary_executable_profile_probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate executable-profile probe unit tests
        run: python -m unittest -v tests.test_stoneage_vary_executable_profile_probe

      - run: sudo apt-get update && sudo apt-get install -y unar binutils file

      - name: Recover verified preservation bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python - <<'PY'
          import hashlib,html,json,re,http.cookiejar,urllib.parse,urllib.request
          from pathlib import Path
          ua="Mozilla/5.0"
          hashes={
            "ev7l29fw77891go":"7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5",
            "ytaa168o5jih0lx":"567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb",
          }
          op=urllib.request.build_opener(
            urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          def get(key,suffix):
            data=urllib.parse.urlencode({
              "quick_key":key,"response_format":"json"
            }).encode()
            req=urllib.request.Request(
              "https://www.mediafire.com/api/1.5/file/get_info.php",
              data=data,headers={"User-Agent":ua}
            )
            with op.open(req,timeout=60) as response:
              info=json.load(response)["response"]["file_info"]
            if str(info.get("hash","")).lower()!=hashes[key]:
              raise SystemExit("metadata hash changed")
            with op.open(urllib.request.Request(
              info["links"]["normal_download"],headers={"User-Agent":ua}
            ),timeout=60) as response:
              page=response.read().decode("utf-8","replace")
              ref=response.geturl()
            match=(
              re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S)
              or re.search(
                r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',
                page,re.I
              )
            )
            if not match:
              raise SystemExit("no direct link")
            path=Path("/tmp/sa25")/("part."+suffix)
            digest=hashlib.sha256()
            with op.open(urllib.request.Request(
              html.unescape(match.group(1)),
              headers={"User-Agent":ua,"Referer":ref}
            ),timeout=300) as response,path.open("wb") as out:
              while True:
                block=response.read(1048576)
                if not block:
                  break
                out.write(block)
                digest.update(block)
            if digest.hexdigest()!=hashes[key]:
              raise SystemExit("hash mismatch")
          get("ev7l29fw77891go","001")
          get("ytaa168o5jih0lx","002")
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 >/tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar|awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out
          ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/dev/null 2>&1

      - name: Locate recovered gmsv executable and probe Vary profile
        run: |
          set -euo pipefail
          ROOT="$(find /tmp/sa25/out -type d -path '*/SA2.5服務端/gmsv' -print -quit)"
          test -n "$ROOT"
          GMSV="$ROOT/gmsv"
          if [ ! -f "$GMSV" ]; then
            GMSV=""
            while IFS= read -r candidate; do
              if file "$candidate" | grep -q 'ELF'; then
                GMSV="$candidate"
                break
              fi
            done < <(find "$ROOT" -maxdepth 1 -type f -print)
          fi
          test -n "$GMSV"
          mkdir -p research/recovered
          echo "GMSV_FILE=$(file -b "$GMSV")"
          echo "GMSV_SIZE=$(stat -c %s "$GMSV")"
          python -m tools.stoneage_vary_executable_profile_probe --binary "$GMSV" | tee research/recovered/STONEAGE-25-VARY-EXECUTABLE-PROFILE-R1.txt
          grep -F 'RESOLUTION|VARY_EXECUTABLE_PROFILE_DISCRIMINATOR_ATTEMPTED' research/recovered/STONEAGE-25-VARY-EXECUTABLE-PROFILE-R1.txt

      - name: Commit derived report only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-25-VARY-EXECUTABLE-PROFILE-R1.txt
          if git diff --cached --quiet; then
            echo 'Vary executable-profile report unchanged.'
            exit 0
          fi
          git commit -m 'research: probe recovered Vary executable profile'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
