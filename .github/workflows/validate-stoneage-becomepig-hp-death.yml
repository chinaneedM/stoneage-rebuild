name: Validate StoneAge BecomePig player HP and death boundaries

concurrency:
  group: stoneage-becomepig-hp-death-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-becomepig-hp-death.yml"
      - "tools/stoneage_becomepig_hp_death_audit.py"
      - "tests/test_stoneage_becomepig_hp_death.py"
      - "tools/stoneage_becomepig_lookup_audit.py"
      - "tools/stoneage_becomepig_badstatus_audit.py"
      - "tools/stoneage_becomepig_restore_audit.py"
      - "tools/stoneage_becomepig_native_audit.py"
      - "tools/stoneage_guard_break2_source_audit.py"
      - "tools/stoneage_mdfyattack_source_audit.py"
      - "research/recovered/STONEAGE-BECOMEPIG-LOOKUP-SOURCE-DOMAINS-R1.json"
      - "research/recovered/STONEAGE-BECOMEPIG-BADSTATUS-SOURCE-DOMAINS-R1.json"
      - "research/recovered/STONEAGE-BECOMEPIG-RESTORATION-SOURCE-DOMAINS-R1.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lookup domains and previous regressions
        run: python -m unittest -v tests.test_stoneage_becomepig_hp_death tests.test_stoneage_becomepig_lookup tests.test_stoneage_becomepig_badstatus tests.test_stoneage_becomepig_restore tests.test_stoneage_becomepig_clock tests.test_stoneage_becomepig_native_domains tests.test_stoneage_recovered25_becomepig_probe
      - name: Recover exact descendant source trees
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_guard_break2_source_audit import PINNED
          repos={"gavin":"gavinlinasd/StoneAge","iris":"iriselia/StoneAge","bismarck":"BismarckDD/stoneage"}
          for name,sha in PINNED.items():
              root=Path("/tmp/becomepig-hp-death-source")/name
              subprocess.run(["git","init",str(root)],check=True)
              subprocess.run(["git","-C",str(root),"remote","add","origin","https://github.com/"+repos[name]+".git"],check=True)
              subprocess.run(["git","-C",str(root),"fetch","--depth","1","origin",sha],check=True)
              subprocess.run(["git","-C",str(root),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Execute complete original player HP death callers
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python -m tools.stoneage_becomepig_hp_death_audit \
            --gavin-dir /tmp/becomepig-hp-death-source/gavin \
            --iris-dir /tmp/becomepig-hp-death-source/iris \
            --bismarck-dir /tmp/becomepig-hp-death-source/bismarck \
            > research/recovered/STONEAGE-BECOMEPIG-HP-DEATH-NATIVE-R1.txt
          cat research/recovered/STONEAGE-BECOMEPIG-HP-DEATH-NATIVE-R1.txt
          grep -F 'TOTAL|player_hp_death_comparisons=36864|profiles=3' research/recovered/STONEAGE-BECOMEPIG-HP-DEATH-NATIVE-R1.txt
          grep -F 'RESOLUTION|BECOMEPIG_BOUNDED_PLAYER_HP_DEATH_FULL_CALLER_PASS_ZERO_RUNTIME_PROMOTIONS' research/recovered/STONEAGE-BECOMEPIG-HP-DEATH-NATIVE-R1.txt
      - name: Preserve exact input derived evidence
        uses: actions/upload-artifact@v4
        with:
          name: becomepig-hp-death-${{ github.sha }}
          path: research/recovered/STONEAGE-BECOMEPIG-HP-DEATH-NATIVE-R1.txt
      - name: Commit only derived HP death report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/recovered/STONEAGE-BECOMEPIG-HP-DEATH-NATIVE-R1.txt
          if ! git diff --cached --quiet; then
            git commit -m "research: verify BecomePig player HP death composition [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
