name: Verify Japan official screenshot index and one later image with separate capture provenance
on:
  push:
    paths:
      - tools/stoneage_jp2003_screenshot_reference.py
      - tests/test_stoneage_jp2003_screenshot_reference.py
      - tools/stoneage_early_content_probe.py
      - research/recovered/STONEAGE-JP-OFFICIAL-SCREENSHOT-REFERENCE-R1.json
      - docs/specs/STONEAGE-JP-OFFICIAL-SCREENSHOT-REFERENCE-R1.md
      - .github/workflows/verify-stoneage-jp-official-screenshot-reference.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-index-and-one-gif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python -m unittest tests.test_stoneage_jp2003_screenshot_reference -v
      - name: Reacquire exact index and only first image from their distinct captures
        run: python -m tools.stoneage_jp2003_screenshot_reference --output output/derived.json
      - run: cmp output/derived.json research/recovered/STONEAGE-JP-OFFICIAL-SCREENSHOT-REFERENCE-R1.json
      - uses: actions/upload-artifact@v4
        with:
          name: jp-official-screenshot-reference-derived-only
          path: output/derived.json
          retention-days: 30
