name: Validate StoneAge Mdfyattack runtime
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-mdfyattack-runtime.yml
      - tools/stoneage_mdfyattack_model.py
      - tools/stoneage_enemy_ai_mdfyattack_bridge.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_default_pet_exit_model.py
      - tools/stoneage_battle_state_model.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_mdfyattack_runtime.py
      - tests/test_stoneage_mdfyattack_model.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest \
            tests.test_stoneage_mdfyattack_model \
            tests.test_stoneage_recovered25_mdfyattack_probe \
            tests.test_stoneage_mdfyattack_runtime \
            tests.test_stoneage_local_runtime_session_coordinator.LocalRuntimeSessionCoordinatorTests.test_recovered_enemy_ai_mdfyattack_executes_and_persists -v
