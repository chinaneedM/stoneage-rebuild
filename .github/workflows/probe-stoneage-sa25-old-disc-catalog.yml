name: Probe StoneAge 2.5 old-disc catalog neighborhood

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-stoneage-sa25-old-disc-catalog.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-old-disc-catalog
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install catalogue readers
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq antiword p7zip-full >/dev/null
      - name: Probe catalogue text and compiled help
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/recovered /tmp/sa25cat/chm
          python3 - <<'PY'
          import hashlib, html, os, re, urllib.parse, urllib.request

          UA="stoneage-rebuild-archaeology/1.0"
          BASE="https://oddownload.nuduseng.com/"
          COLLECTION="18老光盘群(群号854318908)群友分享汇总 2020年4月-5月"
          SUMMARY=COLLECTION+"/=+= 下载地址汇总 老光盘群 =+=.txt"
          UNMERGED=COLLECTION+"/=+= 未加入汇总BT的内容 =+=.txt"
          DOC="10老光盘群(群号854318908)群友分享汇总 2019年9月/2019-09-13/俞某某/藏經閣电脑游戏总目录（001-710）.doc"
          CHM="10老光盘群(群号854318908)群友分享汇总 2019年9月/2019-09-13/俞某某/藏经阁1-490目录.chm"
          TARGETS=("2001C226","哇靠轰炸鸡","NEW GAME 093","总第280期","藏经阁-东方狂龙","藏经阁")
          OUT="research/recovered/STONEAGE-SA25-OLD-DISC-CATALOG-NEIGHBORHOOD-R2.txt"

          def url_for(path):
              return BASE+urllib.parse.quote(path,safe="/()=+")
          def clean(v,n=1600):
              return " ".join(str(v or "").split()).replace("|","%7C")[:n]
          def get(path,max_bytes):
              url=url_for(path)
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=35) as r:
                  b=r.read(max_bytes+1)
                  if len(b)>max_bytes: raise ValueError("response-too-large")
                  return int(getattr(r,"status",r.getcode())),r.geturl(),dict(r.headers.items()),b
          def decode_best(b):
              best=""
              for enc in ("utf-8","gb18030","big5","latin1"):
                  try: s=b.decode(enc,errors="ignore")
                  except: continue
                  score=sum(s.count(x) for x in TARGETS)+sum(s.count(x) for x in ("百度","115","磁力","torrent","东方狂龙"))
                  if score>sum(best.count(x) for x in TARGETS): best=s
              return best
          def contexts(s,token,radius=380):
              out=[]
              low=s.lower(); t=token.lower(); pos=0
              while True:
                  i=low.find(t,pos)
                  if i<0: break
                  out.append(s[max(0,i-radius):min(len(s),i+len(token)+radius)])
                  pos=i+len(token)
                  if len(out)>=10: break
              return out

          rows=[]
          rows.append("StoneAge 2.5 old-disc catalogue neighborhood probe — R2")
          rows.append("SCOPE|small catalogue metadata+text only|DOC/CHM extraction|no PDF body|no game/disc image")
          for label,path,limit,dest in (
              ("summary",SUMMARY,2_000_000,"/tmp/sa25cat/summary.bin"),
              ("unmerged",UNMERGED,2_000_000,"/tmp/sa25cat/unmerged.bin"),
              ("doc",DOC,3_000_000,"/tmp/sa25cat/catalog.doc"),
              ("chm",CHM,8_000_000,"/tmp/sa25cat/catalog.chm"),
          ):
              try:
                  st,final,h,b=get(path,limit)
                  open(dest,"wb").write(b)
                  rows.append(f"FETCH|label={label}|status={st}|bytes={len(b)}|sha256={hashlib.sha256(b).hexdigest()}|content_type={clean(h.get('Content-Type'))}|last_modified={clean(h.get('Last-Modified'))}|final={clean(final)}")
                  if label in ("summary","unmerged"):
                      s=decode_best(b)
                      for tok in TARGETS:
                          for n,c in enumerate(contexts(s,tok),1):
                              rows.append(f"CONTEXT|label={label}|token={clean(tok)}|n={n}|text={clean(c,2400)}")
              except Exception as e:
                  rows.append(f"FETCH_ERROR|label={label}|kind={type(e).__name__}|message={clean(e)}")
          open(OUT,"w",encoding="utf-8").write("\n".join(rows)+"\n")
          PY

          {
            echo "DOC_TEXT_BEGIN"
            if antiword /tmp/sa25cat/catalog.doc >/tmp/sa25cat/catalog-doc.txt 2>/tmp/sa25cat/antiword.err; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sa25cat/catalog-doc.txt')
          s=p.read_text('utf-8','ignore') if p.exists() else ''
          toks=("2001C226","哇靠轰炸鸡","NEW GAME 093","总第280期")
          def clean(x,n=2600): return " ".join(x.split()).replace("|","%7C")[:n]
          for t in toks:
              start=0; n=0
              while True:
                  i=s.lower().find(t.lower(),start)
                  if i<0: break
                  n+=1
                  print(f"DOC_MATCH|token={clean(t)}|n={n}|context={clean(s[max(0,i-700):i+len(t)+1000])}")
                  start=i+len(t)
                  if n>=10: break
          print(f"DOC_TEXT_BYTES|{len(s.encode('utf-8'))}")
          PY
            else
              echo "DOC_EXTRACT_ERROR|$(tr '\n' ' ' </tmp/sa25cat/antiword.err | head -c 1200)"
            fi
            echo "DOC_TEXT_END"
          } >> research/recovered/STONEAGE-SA25-OLD-DISC-CATALOG-NEIGHBORHOOD-R2.txt

          {
            echo "CHM_TEXT_BEGIN"
            if 7z x -y /tmp/sa25cat/catalog.chm -o/tmp/sa25cat/chm >/tmp/sa25cat/7z.log 2>&1; then
              python3 - <<'PY'
          from pathlib import Path
          toks=("2001C226","哇靠轰炸鸡","NEW GAME 093","总第280期")
          def decode(b):
              best=''
              for enc in ('utf-8','gb18030','big5','utf-16le','latin1'):
                  try: s=b.decode(enc,'ignore')
                  except: continue
                  if sum(s.lower().count(t.lower()) for t in toks)>sum(best.lower().count(t.lower()) for t in toks): best=s
              return best
          def clean(x,n=2800): return " ".join(str(x).split()).replace("|","%7C")[:n]
          hits=0
          for p in Path('/tmp/sa25cat/chm').rglob('*'):
              if not p.is_file() or p.stat().st_size>3_000_000: continue
              try: s=decode(p.read_bytes())
              except: continue
              for t in toks:
                  start=0; n=0
                  while True:
                      i=s.lower().find(t.lower(),start)
                      if i<0: break
                      n+=1; hits+=1
                      print(f"CHM_MATCH|file={clean(p.relative_to('/tmp/sa25cat/chm'))}|token={clean(t)}|n={n}|context={clean(s[max(0,i-800):i+len(t)+1200])}")
                      start=i+len(t)
                      if n>=10: break
          print(f"CHM_MATCH_COUNT|{hits}")
          PY
            else
              echo "CHM_EXTRACT_ERROR|$(tr '\n' ' ' </tmp/sa25cat/7z.log | head -c 1200)"
            fi
            echo "CHM_TEXT_END"
          } >> research/recovered/STONEAGE-SA25-OLD-DISC-CATALOG-NEIGHBORHOOD-R2.txt

          echo "EVIDENCE_BOUNDARY|Collector catalogues and share summaries are later preservation metadata. Catalogue IDs and links remain search/recovery leads, not contemporaneous Waei provenance." >> research/recovered/STONEAGE-SA25-OLD-DISC-CATALOG-NEIGHBORHOOD-R2.txt
          rm -rf /tmp/sa25cat
      - name: Commit derived report only
        shell: bash
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-OLD-DISC-CATALOG-NEIGHBORHOOD-R2.txt'
          cp "$R" /tmp/report.txt
          echo 'DERIVED_REPORT_BEGIN'; cat "$R"; echo 'DERIVED_REPORT_END'
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: extract StoneAge 2.5 old-disc catalog metadata'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
