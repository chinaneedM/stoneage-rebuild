name: Probe StoneAge 2.5 old-disc catalog neighborhood

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-stoneage-sa25-old-disc-catalog.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-old-disc-catalog
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe bounded Directory Lister neighborhood
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 - > research/recovered/STONEAGE-SA25-OLD-DISC-CATALOG-NEIGHBORHOOD-R1.txt <<'PY'
          import hashlib, html, re, urllib.parse, urllib.request

          UA="stoneage-rebuild-archaeology/1.0"
          BASE="https://oddownload.nuduseng.com/"
          DIRS=(
            "18老光盘群(群号854318908)群友分享汇总 2020年4月-5月",
            "18老光盘群(群号854318908)群友分享汇总 2020年4月-5月/2020-04-30",
            "18老光盘群(群号854318908)群友分享汇总 2020年4月-5月/2020-04-30/藏经阁-东方狂龙",
            "10老光盘群(群号854318908)群友分享汇总 2019年9月",
            "10老光盘群(群号854318908)群友分享汇总 2019年9月/2019-09-13",
            "10老光盘群(群号854318908)群友分享汇总 2019年9月/2019-09-13/俞某某",
          )
          TOKENS=("2001C226","哇靠轰炸鸡","NEW GAME 093","藏经阁","下载地址汇总","torrent")
          MAX_TEXT=2_000_000

          def clean(v,n=1800):
              return " ".join(str(v or "").split()).replace("|","%7C")[:n]

          def fetch(url, method="GET", max_bytes=MAX_TEXT):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept":"text/html,text/plain,*/*"},method=method)
              with urllib.request.urlopen(req,timeout=25) as r:
                  status=int(getattr(r,"status",r.getcode()))
                  headers=dict(r.headers.items())
                  data=b""
                  if method!="HEAD":
                      data=r.read(max_bytes+1)
                      if len(data)>max_bytes:
                          data=data[:max_bytes]
                  return status,r.geturl(),headers,data

          def lister_url(path):
              return BASE+"?"+urllib.parse.urlencode({"dir":path})

          def links(body):
              s=body.decode("utf-8","replace")
              out=[]
              for m in re.finditer(r'href=["\']([^"\']+)["\']',s,re.I):
                  href=html.unescape(m.group(1))
                  out.append(urllib.parse.urljoin(BASE,href))
              return tuple(dict.fromkeys(out))

          print("StoneAge 2.5 old-disc catalogue neighborhood probe — R1")
          print("SCOPE|bounded-public-directory-listings+headers|no-PDF-body|no-game-image")
          all_links=[]
          errors=[]
          for path in DIRS:
              url=lister_url(path)
              try:
                  st,final,h,b=fetch(url)
                  print(f"DIR|path={clean(path)}|status={st}|bytes={len(b)}|sha256={hashlib.sha256(b).hexdigest()}|final={clean(final)}")
                  text=b.decode("utf-8","replace")
                  for tok in TOKENS:
                      if tok.lower() in text.lower():
                          print(f"DIR_TOKEN|path={clean(path)}|token={clean(tok)}")
                  for u in links(b):
                      all_links.append(u)
              except Exception as e:
                  errors.append((path,type(e).__name__,str(e)))
                  print(f"DIR_ERROR|path={clean(path)}|kind={type(e).__name__}|message={clean(e)}")

          unique=tuple(dict.fromkeys(all_links))
          interesting=[]
          for u in unique:
              low=urllib.parse.unquote(u).lower()
              if any(x in low for x in ("藏经","new_game","new%20game","总目录","封面图","torrent","下载地址","未加入汇总")):
                  interesting.append(u)

          for u in interesting:
              try:
                  st,final,h,_=fetch(u,method="HEAD")
                  print("FILE_HEAD|url=%s|status=%s|content_type=%s|content_length=%s|last_modified=%s|etag=%s|final=%s" % (
                      clean(u),st,clean(h.get("Content-Type")),clean(h.get("Content-Length")),
                      clean(h.get("Last-Modified")),clean(h.get("ETag")),clean(final)))
                  ctype=(h.get("Content-Type") or "").lower()
                  clen=int(h.get("Content-Length") or 0) if str(h.get("Content-Length") or "").isdigit() else 0
                  if (u.lower().endswith((".txt",".torrent")) or "text/" in ctype) and (not clen or clen<=MAX_TEXT):
                      try:
                          st2,final2,h2,b2=fetch(u,max_bytes=MAX_TEXT)
                          print(f"SMALL_FILE|url={clean(u)}|status={st2}|bytes={len(b2)}|sha256={hashlib.sha256(b2).hexdigest()}|final={clean(final2)}")
                          # Treat body as opaque bytes plus best-effort decodings; record tokens/URLs only.
                          texts=[b2.decode(enc,"ignore") for enc in ("utf-8","gb18030","big5","latin1")]
                          joined="\n".join(texts)
                          for tok in TOKENS:
                              if tok.lower() in joined.lower():
                                  print(f"SMALL_TOKEN|url={clean(u)}|token={clean(tok)}")
                          for m in re.finditer(r'(?:https?://|magnet:\?xt=)[^\s<>"\']+',joined,re.I):
                              print(f"SMALL_URL|source={clean(u)}|value={clean(m.group(0),800)}")
                      except Exception as e:
                          print(f"SMALL_ERROR|url={clean(u)}|kind={type(e).__name__}|message={clean(e)}")
              except Exception as e:
                  errors.append((u,type(e).__name__,str(e)))
                  print(f"HEAD_ERROR|url={clean(u)}|kind={type(e).__name__}|message={clean(e)}")

          for s,k,m in errors:
              print(f"ERROR|scope={clean(s)}|kind={clean(k)}|message={clean(m)}")
          print(f"COUNT|directory_pages|{len(DIRS)}")
          print(f"COUNT|unique_links|{len(unique)}")
          print(f"COUNT|interesting_links|{len(interesting)}")
          print(f"COUNT|errors|{len(errors)}")
          print("EVIDENCE_BOUNDARY|Directory/catalogue metadata can supply carrier/search tokens only. No PDF body or game/disc image is downloaded, and no catalogue-local ID is promoted to Waei provenance.")
          PY
      - name: Commit derived report only
        shell: bash
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-OLD-DISC-CATALOG-NEIGHBORHOOD-R1.txt'
          cp "$R" /tmp/report.txt
          echo 'DERIVED_REPORT_BEGIN'; cat "$R"; echo 'DERIVED_REPORT_END'
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe StoneAge 2.5 old-disc catalog neighborhood'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
