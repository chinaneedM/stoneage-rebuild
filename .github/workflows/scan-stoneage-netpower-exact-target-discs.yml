name: Scan exact NetPower StoneAge target discs

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_netpower_exact_target_disc_scan.py
      - tests/test_stoneage_netpower_exact_target_disc_scan.py
      - .github/workflows/scan-stoneage-netpower-exact-target-discs.yml

permissions:
  contents: write

concurrency:
  group: stoneage-netpower-exact-target-discs
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_netpower_exact_target_disc_scan -v
      - name: Scan exact NetPower target-disc directories
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_netpower_exact_target_disc_scan \
            > research/recovered/STONEAGE-NETPOWER-EXACT-TARGET-DISC-SCAN-R1.txt
      - name: Commit derived directory metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-NETPOWER-EXACT-TARGET-DISC-SCAN-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan exact NetPower target discs'
          git pull --rebase origin main
          git push
