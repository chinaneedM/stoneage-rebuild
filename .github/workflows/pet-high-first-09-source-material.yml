name: PET-HIGH-FIRST-09 TW85 source visual and action reference
on:
  push:
    branches:
      - agent/pet-high-first-09-20261123
    paths:
      - tools/stoneage_pet_high_first_tw85_material.py
      - tests/test_stoneage_pet_high_first_tw85_material.py
      - .github/workflows/pet-high-first-09-source-material.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derive-source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate from immutable archived index files
        run: python -m tools.stoneage_pet_high_first_tw85_material --mode generate
      - name: Independently compare generated bytes with source replay
        run: python -m tools.stoneage_pet_high_first_tw85_material --mode verify
      - name: Recheck PET08 source identity guards
        run: python -m unittest discover -s tests -p test_stoneage_pet_high_first_tw85_bridge.py
      - name: Test PET09 conservation and negative historical proof gates
        run: python -m unittest discover -s tests -p test_stoneage_pet_high_first_tw85_material.py
      - name: Publish rights-safe derived JSON to this research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pets/PET-HIGH-FIRST-TW85-VISUAL-ACTION-REFERENCES-R1.json
          if ! git diff --cached --quiet; then
            git commit -m "PET09: archive TW85 original source-only visual and action references"
            git push
          fi
