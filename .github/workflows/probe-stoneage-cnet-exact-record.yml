name: Probe CNET Korea StoneAge exact record
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_cnet_exact_record_probe.py
      - tests/test_stoneage_cnet_exact_record_probe.py
      - .github/workflows/probe-stoneage-cnet-exact-record.yml

permissions:
  contents: write

concurrency:
  group: stoneage-cnet-exact-record
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_cnet_exact_record_probe -v
      - name: Probe exact CNET StoneAge record
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_cnet_exact_record_probe             > research/recovered/STONEAGE-CNET-KOREA-EXACT-RECORD-R1.txt
      - name: Commit derived metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-CNET-KOREA-EXACT-RECORD-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: recover CNET StoneAge record metadata'
          git pull --rebase origin main
          git push
