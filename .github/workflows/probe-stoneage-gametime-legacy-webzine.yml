name: Probe GameTime legacy StoneAge webzine

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_gametime_legacy_webzine_probe.py
      - tests/test_stoneage_gametime_legacy_webzine_probe.py
      - .github/workflows/probe-stoneage-gametime-legacy-webzine.yml

permissions:
  contents: write

concurrency:
  group: stoneage-gametime-legacy-webzine
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_gametime_legacy_webzine_probe -v
      - name: Probe archived GameTime legacy webzine pages
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_gametime_legacy_webzine_probe             > research/recovered/STONEAGE-GAMETIME-LEGACY-WEBZINE-R1.txt
      - name: Commit derived archived metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-GAMETIME-LEGACY-WEBZINE-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: resolve GameTime legacy webzine records'
          git pull --rebase origin main
          git push
