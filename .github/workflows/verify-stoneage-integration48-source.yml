name: Verify StoneAge INTEGRATION48 four-village courier source conditions
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION48-FOUR-VILLAGE-COURIER-SOURCE-HINT-ACCEPTANCE-R1.json'
      - 'tests/test_stoneage_integration_module_48.py'
      - '.github/workflows/verify-stoneage-integration48-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION48-FOUR-VILLAGE-COURIER-SOURCE-HINT-ACCEPTANCE-R1.json'
      - 'tests/test_stoneage_integration_module_48.py'
      - '.github/workflows/verify-stoneage-integration48-source.yml'
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_48.py' -v
