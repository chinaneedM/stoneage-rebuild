name: Scan StoneAge Internet Archive file metadata
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_archive_candidate_file_probe.py
      - tests/test_stoneage_archive_candidate_file_probe.py
      - .github/workflows/probe-stoneage-archive-candidate-files.yml

permissions:
  contents: write

concurrency:
  group: stoneage-archive-candidate-files
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_archive_candidate_file_probe -v
      - name: Scan archive item/file metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_archive_candidate_file_probe             > research/recovered/STONEAGE-ARCHIVE-CANDIDATE-FILES-R1.txt
      - name: Commit derived metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-ARCHIVE-CANDIDATE-FILES-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan StoneAge archive candidate files'
          git pull --rebase origin main
          git push
