name: Verify StoneAge INTEGRATION45 original A3 A7 A11 source relations
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION45-JARUGA-A3-A7-A11-ORIGINAL-SOURCE-SCENES-R1.json'
      - 'tests/test_stoneage_integration_module_45.py'
      - '.github/workflows/verify-stoneage-integration45-source.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION45-JARUGA-A3-A7-A11-ORIGINAL-SOURCE-SCENES-R1.json'
      - 'tests/test_stoneage_integration_module_45.py'
      - '.github/workflows/verify-stoneage-integration45-source.yml'
permissions:
  contents: read
jobs:
  derived-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_45.py' -v
