name: Verify CHAR09 original NPCEnemy numeric source joins
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-CHARACTER-NPC-MODULE-09-ORIGINAL-NPCENEMY-ROSTER-BRIDGE-R1.json'
      - 'tests/test_stoneage_character_npc_module_09.py'
      - '.github/workflows/verify-stoneage-character-npc-module-09.yml'
  workflow_dispatch:
jobs:
  source-numeric-joins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_character_npc_module_09.py' -v
