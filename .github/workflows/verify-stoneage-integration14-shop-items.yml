name: Verify StoneAge INTEGRATION14 Hotoru shop items
on:
  push:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION14-HOTORU-SHOP-ITEM-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_14.py'
      - 'tools/stoneage_integration14_hotoru_shop_items.py'
      - '.github/workflows/verify-stoneage-integration14-shop-items.yml'
  pull_request:
    paths:
      - 'research/recovered/STONEAGE-INTEGRATION14-HOTORU-SHOP-ITEM-SOURCE-R1.json'
      - 'tests/test_stoneage_integration_module_14.py'
      - 'tools/stoneage_integration14_hotoru_shop_items.py'
      - '.github/workflows/verify-stoneage-integration14-shop-items.yml'
jobs:
  public-evidence-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_stoneage_integration_module_14.py' -v
