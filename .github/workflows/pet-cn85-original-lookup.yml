name: CN85 authenticated compiled source lookup replay
on:
  push:
    branches: ['agent/pet-cn85-original-lookup-20261126']
    paths:
      - 'tools/stoneage_pet_source_lookup.py'
      - 'research/pets/PET-HIGH-FIRST-32-UNIFIED-SOURCE-LOOKUP-MANIFEST-R1.json'
      - '.github/workflows/pet-cn85-original-lookup.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m tools.stoneage_pet_cn50_cn85_native_name_crosswalk
      - run: python tools/stoneage_pet_source_lookup.py --verify
      - run: python tools/stoneage_pet_gap_queue.py --verify
      - run: python tools/stoneage_pet_source_lookup.py --source cn85_original --query ordinal:314 --exact --full
