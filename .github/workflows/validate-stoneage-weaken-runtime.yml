name: Validate StoneAge Weaken runtime
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-weaken-runtime.yml
      - tools/stoneage_weaken_model.py
      - tools/stoneage_enemy_ai_weaken_bridge.py
      - tools/stoneage_weaken_runtime_state.py
      - tools/stoneage_nocast_runtime_state.py
      - tools/stoneage_recovered25_weaken_probe.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_default_pet_exit_model.py
      - tools/stoneage_battle_state_model.py
      - tools/stoneage_local_runtime_session_coordinator.py
      - tests/test_stoneage_weaken_runtime.py
      - tests/test_stoneage_weaken_model.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest \
            tests.test_stoneage_weaken_model \
            tests.test_stoneage_recovered25_weaken_probe \
            tests.test_stoneage_weaken_runtime \
            tests.test_stoneage_barrier_runtime \
            tests.test_stoneage_nocast_model \
            tests.test_stoneage_local_runtime_session_coordinator.LocalRuntimeSessionCoordinatorTests.test_recovered_enemy_ai_weaken_executes_and_persists -v
