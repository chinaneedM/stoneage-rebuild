name: Probe StoneAge 2.5 named carrier torrents

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_named_carrier_torrent_probe.py
      - tests/test_stoneage_sa25_named_carrier_torrent_probe.py
      - .github/workflows/probe-stoneage-sa25-named-carrier-torrents.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-named-carrier-torrents
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate named-carrier scanner
        run: python3 -m unittest tests.test_stoneage_sa25_named_carrier_torrent_probe -v
      - name: Cross-scan source-named carrier paths
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_named_carrier_torrent_probe > research/recovered/STONEAGE-SA25-NAMED-CARRIER-TORRENTS-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-NAMED-CARRIER-TORRENTS-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: scan StoneAge 2.5 source-named carrier torrents'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
