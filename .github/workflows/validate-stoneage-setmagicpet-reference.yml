name: Validate StoneAge SetMagicPet reference
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-setmagicpet-reference.yml"
      - "tools/stoneage_setmagicpet_model.py"
      - "tools/stoneage_setmagicpet_source_audit.py"
      - "tools/stoneage_recovered25_setmagicpet_probe.py"
      - "tests/test_stoneage_setmagicpet_model.py"
      - "tests/test_stoneage_recovered25_setmagicpet_probe.py"
      - "specs/STONEAGE-SETMAGICPET-REFERENCE-R1.md"
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bounded model and probe logic
        run: |
          python -m unittest -v \
            tests.test_stoneage_setmagicpet_model \
            tests.test_stoneage_recovered25_setmagicpet_probe \
            tests.test_stoneage_recovered25_petskill_runtime \
            tests.test_stoneage_recovered25_enemybase_runtime \
            tests.test_stoneage_recovered25_petskill_pressure_probe
