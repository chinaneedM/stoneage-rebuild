name: PET year and region historical access
on:
  push:
    branches: ['agent/pet-year-region-access-20261126']
    paths:
      - 'tools/stoneage_pet_history_access.py'
      - 'tools/stoneage_pet_source_lookup.py'
      - '.github/workflows/pet-year-region-access.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/stoneage_pet_source_lookup.py --history --verify
      - run: python tools/stoneage_pet_source_lookup.py --history --year 2002 --region CN --full
      - run: python tools/stoneage_pet_source_lookup.py --history --year 2001 --region HK_MO
      - run: python tools/stoneage_pet_source_lookup.py --history --year 2026 --region TW --full
      - run: python tools/stoneage_pet_source_lookup.py --history --version 2.0
      - run: python tools/stoneage_pet_source_lookup.py --history --query ハクエン --exact --full
      - run: python tools/stoneage_pet_source_lookup.py --documentary --verify
      - run: python tools/stoneage_pet_source_lookup.py --legacy-pet16 --verify
      - run: python tools/stoneage_pet_source_lookup.py --verify
      - run: python tools/stoneage_pet_gap_queue.py --current --verify
      - run: PYTHONPATH=. python tools/stoneage_pet_final_review_matrix.py
      - run: cmp pet-final-review-matrix.json research/pets/PET-FINAL-REVIEW-MATRIX-R1.json
