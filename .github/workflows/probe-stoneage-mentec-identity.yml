name: Probe StoneAge Mentec historical identity

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_mentec_identity_probe.py
      - tests/test_stoneage_mentec_identity_probe.py
      - .github/workflows/probe-stoneage-mentec-identity.yml

permissions:
  contents: write

concurrency:
  group: stoneage-mentec-identity
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_mentec_identity_probe -v
      - name: Probe candidate historical Mentec domains
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_mentec_identity_probe             > research/recovered/STONEAGE-MENTEC-HISTORICAL-IDENTITY-R1.txt
      - name: Commit derived archive metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-MENTEC-HISTORICAL-IDENTITY-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Mentec historical identity'
          git pull --rebase origin main
          git push
