name: Independently accept TW1.0 R77 original bounded handle-source effects artifact and permanent static report
on:
  workflow_dispatch:
  push:
    branches: [agent/tw10-r77-independent-20261016, main]
    paths:
      - .github/workflows/verify-stoneage-tw10-r77-retained.yml
      - tools/stoneage_tw10_savedata_*.py
      - tests/test_stoneage_tw10_savedata_*.py
      - research/recovered/STONEAGE-TW10-SAVEDATA-*.json
      - docs/specs/STONEAGE-TW10-R77-R78-HANDLE-CONTRACTS.md
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Requalify immutable source run/job and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r77-custody
          python - <<'PY' > /tmp/r77-custody/ids
          import json
          r=json.load(open('research/recovered/STONEAGE-TW10-SAVEDATA-R77-SOURCE-CUSTODY.json'))
          assert type(r['source_run_id']) is int and type(r['artifact_id']) is int
          print(r['source_run_id'],r['artifact_id'])
          PY
          read -r run_id artifact_id < /tmp/r77-custody/ids
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/r77-custody/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" > /tmp/r77-custody/jobs.json
          if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /tmp/r77-custody/artifact.json; then
            expired="$(python -c 'import json; print(json.load(open("/tmp/r77-custody/artifact.json"))["expired"])')"
            if [ "$expired" = 'False' ]; then
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name tw10-r77-original-static-handle-source-derived-only --dir /tmp/r77-custody/raw
            fi
          else
            rm -f /tmp/r77-custody/artifact.json
          fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/r77-custody');r=json.load(open('research/recovered/STONEAGE-TW10-SAVEDATA-R77-SOURCE-CUSTODY.json'))
          run=json.loads((p/'run.json').read_text());assert (run['status'],run['conclusion'],run['head_sha'],run['head_branch'])==('completed','success',r['source_head'],r['source_branch'])
          jobs=json.loads((p/'jobs.json').read_text())['jobs'];job=[j for j in jobs if j['id']==r['source_job_id']];assert len(job)==1 and job[0]['name']=='original-static' and job[0]['conclusion']=='success'
          assert (r['source_run_id'],r['source_head'],r['source_job_id'],r['artifact_id'])==(38891577123,'ba49bb5ca0dc27d481dcca9ef0a46bb046586dd8',116942132806,12041483206)
          assert r['artifact_zip_sha256']=='3e860fbfca18edb7b3016ec5fedc5c92b26fc341769ee88cd87a718341ade674'
          raw=Path('research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-HANDLE-R77-ORIGINAL.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='4944a5037e02c5b88b9424b953bcf93254e67560a217663c73b11e42d2827f48'
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='870b84cb7968d325b37463ca68de1540960e1f5e'
          if (p/'artifact.json').exists():
              artifact=json.loads((p/'artifact.json').read_text())
              assert artifact['workflow_run']['id']==r['source_run_id'] and artifact['digest']=='sha256:'+r['artifact_zip_sha256']
              if not artifact['expired']:
                  assert len(list((p/'raw').iterdir()))==1 and raw==(p/'raw/tw10-r77-static.json').read_bytes()
                  print('R77_LIVE_ARTIFACT_EQUALS_PERMANENT_REPORT=PASS')
              else:
                  print('R77_ARTIFACT_EXPIRED_PERMANENT_PINNED_METADATA_CUSTODY=PASS')
          else:
              print('R77_ARTIFACT_UNAVAILABLE_PERMANENT_PINNED_METADATA_CUSTODY=PASS')
          assert len(raw)==r['raw_bytes'] and hashlib.sha256(raw).hexdigest()==r['raw_sha256']
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==r['canonical_git_blob']
          assert r['original_proprietary_bytes_archived'] is False and r['actual_native_persistence_proven'] is False
          print('R77_IMMUTABLE_SOURCE_ARTIFACT_AND_CANONICAL_BYTES=PASS')
          PY
      - name: Independently verify exact bounded handle-source effects neighborhood and adverse mutations
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_stoneage_tw10_savedata_r77_handle_static tests.test_stoneage_tw10_savedata_r78_handle_contracts tests.test_stoneage_tw10_savedata_r76_seek_contracts tests.test_stoneage_tw10_savedata_r75_seek_helper_static
          python -m tools.stoneage_tw10_savedata_r77_guard --report research/recovered/STONEAGE-TW10-SAVEDATA-NATIVE-HANDLE-R77-ORIGINAL.json
      - name: Independently replay exact156-report retained-first census
        run: python -m tools.stoneage_tw10_savedata_r77_preflight_guard
