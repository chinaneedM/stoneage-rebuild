name: Verify JP2005 pet encyclopedia registration and staged rollout
on:
  push:
    paths:
      - 'tools/stoneage_jp2005_pet_encyclopedia_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_jp2005_pet_encyclopedia_source.py'
      - 'research/recovered/STONEAGE-JP2005-PET-ENCYCLOPEDIA-*.json'
      - 'research/recovered/STONEAGE-CN20-OPERATION-UI-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-JP-OFFICIAL-PET-CATALOG-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-jp2005-pet-encyclopedia-source.yml'
  pull_request:
    paths:
      - 'tools/stoneage_jp2005_pet_encyclopedia_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_jp2005_pet_encyclopedia_source.py'
      - 'research/recovered/STONEAGE-JP2005-PET-ENCYCLOPEDIA-*.json'
      - 'research/recovered/STONEAGE-CN20-OPERATION-UI-SOURCE-R1.json'
      - 'research/recovered/STONEAGE-JP-OFFICIAL-PET-CATALOG-R1.json'
      - 'research/recovered/STONEAGE-PREPRODUCTION-CONTENT-ARCHIVE-R1.json'
      - '.github/workflows/verify-stoneage-jp2005-pet-encyclopedia-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: On-screen name registration, patch phases and illustration boundaries
        run: python -m unittest tests.test_stoneage_jp2005_pet_encyclopedia_source -v
      - name: Retrieve one dated report and its actual linked small illustration
        run: python -m tools.stoneage_jp2005_pet_encyclopedia_source --fetch --output "$RUNNER_TEMP/r87-content/replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: jp2005-pet-encyclopedia-derived-r87
          path: ${{ runner.temp }}/r87-content/replay.json
          if-no-files-found: error
          retention-days: 30
