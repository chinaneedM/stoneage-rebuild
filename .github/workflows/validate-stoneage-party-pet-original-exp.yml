name: Validate StoneAge original party pet EXP transfer
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-party-pet-original-exp.yml"
      - "tools/stoneage_party_pet_original_exp_audit.py"
      - "research/recovered/STONEAGE-PARTY-PET-ORIGINAL-EXP-SOURCE-R1.json"
      - "tests/test_stoneage_party_pet_original_exp.py"
permissions:
  contents: read
jobs:
  original-exp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Original EXP source mutation and physical regressions
        run: python -m unittest -v tests.test_stoneage_party_pet_original_exp tests.test_stoneage_party_pet_original_lethal_loop tests.test_stoneage_party_pet_original_lethal_direct tests.test_stoneage_party_pet_original_attack
      - name: Recover pinned sources transiently
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_party_pet_original_attack_audit import PINNED
          repos={"gavin":"gavinlinasd/StoneAge","iris":"iriselia/StoneAge","bismarck":"BismarckDD/stoneage"}
          for p,sha in PINNED.items():
              d=Path("/tmp/stoneage-party-exp")/p
              subprocess.run(["git","init",str(d)],check=True)
              subprocess.run(["git","-C",str(d),"remote","add","origin","https://github.com/"+repos[p]+".git"],check=True)
              subprocess.run(["git","-C",str(d),"fetch","--depth","1","origin",sha],check=True)
              subprocess.run(["git","-C",str(d),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Native original EXP transfer and complete state oracles
        run: |
          set -euo pipefail
          python -m tools.stoneage_party_pet_original_exp_audit --gavin-dir /tmp/stoneage-party-exp/gavin --iris-dir /tmp/stoneage-party-exp/iris --bismarck-dir /tmp/stoneage-party-exp/bismarck > /tmp/stoneage-party-exp.txt
          cat /tmp/stoneage-party-exp.txt
          grep -Fx 'RESOLUTION|ORIGINAL_REAL_HEADER_EXP_TRANSFER_BOUNDED_PASS' /tmp/stoneage-party-exp.txt
          test "$(grep -c '^ACTUAL|.*REAL_HEADER_EXP_TRANSFER|' /tmp/stoneage-party-exp.txt)" -eq 72
      - name: Upload only derived observations
        uses: actions/upload-artifact@v4
        with:
          name: stoneage-party-original-exp
          path: /tmp/stoneage-party-exp.txt
