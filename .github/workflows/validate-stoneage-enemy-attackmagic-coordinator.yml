name: Validate StoneAge enemy AttackMagic coordinator

concurrency:
  group: stoneage-enemy-attackmagic-coordinator
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-enemy-attackmagic-coordinator.yml
      - tools/stoneage_local_runtime_session_coordinator.py
      - tools/stoneage_enemy_ai_attack_magic_bridge.py
      - tools/stoneage_attack_magic_state_model.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_default_pet_exit_model.py
      - tools/stoneage_battle_state_model.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
      - research/mechanics/STONEAGE-ATTACK-MAGIC-COORDINATOR-INTEGRATION-R1.md
  pull_request:
    paths:
      - .github/workflows/validate-stoneage-enemy-attackmagic-coordinator.yml
      - tools/stoneage_local_runtime_session_coordinator.py
      - tools/stoneage_enemy_ai_attack_magic_bridge.py
      - tools/stoneage_attack_magic_state_model.py
      - tools/stoneage_battle_round_model.py
      - tools/stoneage_default_pet_exit_model.py
      - tools/stoneage_battle_state_model.py
      - tests/test_stoneage_local_runtime_session_coordinator.py
      - research/mechanics/STONEAGE-ATTACK-MAGIC-COORDINATOR-INTEGRATION-R1.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate full enemy AttackMagic local-session path
        run: |
          python3 -m unittest \
            tests.test_stoneage_attack_magic_round_execution \
            tests.test_stoneage_local_runtime_session_coordinator -v
