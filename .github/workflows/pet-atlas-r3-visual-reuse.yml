name: PET atlas R3 exact cross-version visual reuse
on:
  pull_request:
    paths:
      - 'tools/stoneage_pet_atlas_r3_visual_reuse.py'
      - 'tests/test_stoneage_pet_atlas_r3_visual_reuse.py'
      - '.github/workflows/pet-atlas-r3-visual-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_stoneage_pet_atlas_r3_visual_reuse.py'
      - run: python -m tools.stoneage_pet_atlas_r3_visual_reuse --output pet-atlas-r3-visual-reuse.json
      - uses: actions/upload-artifact@v4
        with:
          name: pet-atlas-r3-visual-reuse-proof
          path: pet-atlas-r3-visual-reuse.json
