name: PET118 CN85 verified InstallShield directory and PET117 custody
on:
  push:
    branches: ['agent/pet-high-first-114-cn85-zol-archive-20261126']
    paths:
      - 'tools/stoneage_pet_high_first_118_cn85_installshield_index.py'
      - '.github/workflows/pet-high-first-118-cn85-installshield-index.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install directory reader
        run: sudo apt-get update -qq && sudo apt-get install -y unshield
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15118386642/zip > "$RUNNER_TEMP/pet117.zip"
          python -m tools.stoneage_pet_high_first_118_cn85_installshield_index --artifact "$RUNNER_TEMP/pet117.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pet118-cn85-installshield-index-metadata
          path: research/pets/PET-HIGH-FIRST-118-CN85-INSTALLSHIELD-INDEX-R1.json
          if-no-files-found: error
          retention-days: 15
      - name: Retain derived metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/pets/PET-HIGH-FIRST-118-CN85-INSTALLSHIELD-INDEX-R1.json
          git commit -m 'PET118: retain verified InstallShield member and directory metadata'
          git push origin HEAD:agent/pet-high-first-114-cn85-zol-archive-20261126
