name: Probe Hananet pkboard attachment mechanism
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_hananet_pkboard_mechanism_probe.py
      - tests/test_stoneage_hananet_pkboard_mechanism_probe.py
      - .github/workflows/probe-stoneage-hananet-pkboard-mechanism.yml

permissions:
  contents: write

concurrency:
  group: stoneage-hananet-pkboard-mechanism
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_hananet_pkboard_mechanism_probe -v
      - name: Extract sparse board mechanism metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_hananet_pkboard_mechanism_probe             > research/recovered/STONEAGE-HANANET-PKBOARD-MECHANISM-R1.txt
      - name: Commit derived mechanism metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-HANANET-PKBOARD-MECHANISM-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: recover Hananet pkboard mechanism'
          git pull --rebase origin main
          git push
