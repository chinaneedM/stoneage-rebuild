name: Probe StoneAge 2.5 physical image fingerprints

on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_sa25_physical_image_fingerprint_probe.py
      - tests/test_stoneage_sa25_physical_image_fingerprint_probe.py
      - .github/workflows/probe-stoneage-sa25-physical-image-fingerprints.yml

permissions:
  contents: write

concurrency:
  group: stoneage-sa25-physical-image-fingerprints
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install transient image-analysis dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless
      - name: Validate visual fingerprint probe
        run: python3 -m unittest tests.test_stoneage_sa25_physical_image_fingerprint_probe -v
      - name: Probe public image bodies transiently
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_sa25_physical_image_fingerprint_probe > research/recovered/STONEAGE-SA25-PHYSICAL-IMAGE-FINGERPRINTS-R1.txt
      - name: Commit derived metrics only
        run: |
          set -euo pipefail
          R='research/recovered/STONEAGE-SA25-PHYSICAL-IMAGE-FINGERPRINTS-R1.txt'
          cp "$R" /tmp/report.txt
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p research/recovered
          cp /tmp/report.txt "$R"
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: fingerprint StoneAge 2.5 physical-media images'
          for n in 1 2 3 4 5; do
            git push && exit 0
            sleep $((n * 3))
          done
          exit 1
