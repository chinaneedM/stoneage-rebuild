name: Verify dated shell delivery guide witnesses
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_shell_delivery_witness_probe.py
      - tests/test_stoneage_shell_delivery_witness_probe.py
      - .github/workflows/probe-stoneage-shell-delivery-witness.yml
permissions:
  contents: read
jobs:
  three-text-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest tests.test_stoneage_shell_delivery_witness_probe -v
      - run: |
          mkdir -p /tmp/shell-witnesses
          python -m tools.stoneage_shell_delivery_witness_probe --output /tmp/shell-witnesses/shell-witnesses.json
      - uses: actions/upload-artifact@v4
        with:
          name: shell-delivery-witnesses-derived-r1
          path: /tmp/shell-witnesses/*.json
          if-no-files-found: error
          retention-days: 7
