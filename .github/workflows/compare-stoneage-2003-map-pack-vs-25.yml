name: Compare archived 2003 maps with preserved 2.5 corpus
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_historical_map_25_compare.py
      - tests/test_stoneage_historical_map_25_compare.py
      - .github/workflows/compare-stoneage-2003-map-pack-vs-25.yml

permissions:
  contents: write

concurrency:
  group: stoneage-2003-map-pack-vs-25
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq 7zip unar
      - name: Validate comparator
        run: python3 -m unittest tests.test_stoneage_historical_map_25_compare -v
      - name: Recover archived 2003-06 map package transiently
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa-map-2003/out
          python3 - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          url='https://web.archive.org/web/20030623234451id_/http://www.wuxitianlong.com:80/sa/map.exe'
          expected='372426e46765a1cf479041bdafc1d3e58fb019117d00d0b43d6a5f796620776e'
          req=urllib.request.Request(url,headers={'User-Agent':'stoneage-rebuild-archaeology/1.0'})
          h=hashlib.sha256(); dest=Path('/tmp/sa-map-2003/map.exe')
          with urllib.request.urlopen(req,timeout=60) as r,dest.open('wb') as out:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  out.write(chunk); h.update(chunk)
          if h.hexdigest()!=expected:
              raise SystemExit(f'historical map package hash mismatch: {h.hexdigest()}')
          PY
          7z x -y -o/tmp/sa-map-2003/out /tmp/sa-map-2003/map.exe >/tmp/sa-map-2003/7z.log
      - name: Recover preserved 2.5 bridge bundle transiently
        run: |
          set -euo pipefail
          mkdir -p /tmp/sa25
          python3 - <<'PY'
          import hashlib,html,json,re,http.cookiejar,urllib.parse,urllib.request
          from pathlib import Path
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124 Safari/537.36'
          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders=[('User-Agent',ua),('Accept-Language','en-US,en;q=0.9')]
          expected={
              'ev7l29fw77891go':'7cb7acdecd56617132e6f284c468158917c91d542cad5b2e7b3c7774fb5630d5',
              'ytaa168o5jih0lx':'567e1ec0aeff9ea6a9ada791a339aa8f8bb8ffba83cf762e4b445fc0f1cb16bb',
          }
          def get(key,suffix):
              api='https://www.mediafire.com/api/1.5/file/get_info.php'
              data=urllib.parse.urlencode({'quick_key':key,'response_format':'json'}).encode()
              req=urllib.request.Request(api,data=data,headers={'User-Agent':ua})
              with op.open(req,timeout=60) as r:
                  info=json.load(r)['response']['file_info']
              if str(info.get('hash') or '').lower()!=expected[key]:
                  raise SystemExit('MediaFire metadata hash changed')
              req=urllib.request.Request(info['links']['normal_download'],headers={'User-Agent':ua})
              with op.open(req,timeout=60) as r:
                  page=r.read().decode('utf-8','replace'); referer=r.geturl()
              m=re.search(r'id="downloadButton"[^>]*href="([^"]+)"',page,re.I|re.S)
              if not m:
                  m=re.search(r'(https://download\d+\.mediafire\.com/[^"\'<> ]+)',page,re.I)
              if not m: raise SystemExit('No direct link')
              dest=Path('/tmp/sa25')/f'part.{suffix}'
              h=hashlib.sha256()
              req=urllib.request.Request(html.unescape(m.group(1)),headers={'User-Agent':ua,'Referer':referer})
              with op.open(req,timeout=300) as r,dest.open('wb') as out:
                  while True:
                      chunk=r.read(1024*1024)
                      if not chunk: break
                      out.write(chunk); h.update(chunk)
              if h.hexdigest()!=expected[key]: raise SystemExit('Hash mismatch')
          get('ev7l29fw77891go','001')
          get('ytaa168o5jih0lx','002')
          PY
          cat /tmp/sa25/part.001 /tmp/sa25/part.002 > /tmp/sa25/bundle.rar
          test "$(sha256sum /tmp/sa25/bundle.rar | awk '{print $1}')" = "d71e2e6766e8eac9f3fd1a8d3ab910b4b903daaf5f26f4077f07660d0102faa5"
          mkdir -p /tmp/sa25/out
          ulimit -c 0
          unar -f -o /tmp/sa25/out /tmp/sa25/bundle.rar >/tmp/sa25/unar.log 2>&1
      - name: Compare numeric DAT corpora
        run: |
          set -euo pipefail
          HIST="$(find /tmp/sa-map-2003/out -type d -name map -print -quit)"
          PRES="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
          test -n "$HIST"
          test -n "$PRES"
          mkdir -p research/recovered
          python3 -m tools.stoneage_historical_map_25_compare --historical-root "$HIST" --preserved-root "$PRES" --profile research/recovered/tw10-resource-metadata/COLLISION-ATTR-R1.tsv.gz > research/recovered/STONEAGE-2003-MAP-VS-25-R1.txt
      - name: Verify proprietary payloads were not retained
        run: |
          set -euo pipefail
          ! find research tools tests -type f \( -iname 'map.exe' -o -regex '.*/map/[0-9]+\.dat' \) -print -quit | grep -q .
      - name: Commit derived comparison only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          report='research/recovered/STONEAGE-2003-MAP-VS-25-R1.txt'
          git add "$report"
          git diff --cached --quiet && exit 0
          git commit -m 'research: compare archived 2003 maps with 2.5 corpus'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            HIST="$(find /tmp/sa-map-2003/out -type d -name map -print -quit)"
            PRES="$(find /tmp/sa25/out -type d -path '*/SA2.5主程式/stoneage2.5/map' -print -quit)"
            python3 -m tools.stoneage_historical_map_25_compare --historical-root "$HIST" --preserved-root "$PRES" --profile research/recovered/tw10-resource-metadata/COLLISION-ATTR-R1.tsv.gz > "$report"
            git add "$report"
            git diff --cached --quiet && exit 0
            git commit -m 'research: compare archived 2003 maps with 2.5 corpus'
          fi
          git push
