name: Validate StoneAge BecomePig PvP WATCH typed and enemy Exit

concurrency:
  group: stoneage-becomepig-exit-modes-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-stoneage-becomepig-exit-modes.yml"
      - "tools/stoneage_becomepig_hp_death_audit.py"
      - "tools/stoneage_becomepig_exit_modes_audit.py"
      - "tests/test_stoneage_becomepig_hp_death.py"
      - "tests/test_stoneage_becomepig_exit_modes.py"
      - "tools/stoneage_becomepig_lookup_audit.py"
      - "tools/stoneage_becomepig_badstatus_audit.py"
      - "tools/stoneage_becomepig_restore_audit.py"
      - "tools/stoneage_becomepig_native_audit.py"
      - "tools/stoneage_guard_break2_source_audit.py"
      - "tools/stoneage_mdfyattack_source_audit.py"
      - "research/recovered/STONEAGE-BECOMEPIG-LOOKUP-SOURCE-DOMAINS-R1.json"
      - "research/recovered/STONEAGE-BECOMEPIG-BADSTATUS-SOURCE-DOMAINS-R1.json"
      - "research/recovered/STONEAGE-BECOMEPIG-RESTORATION-SOURCE-DOMAINS-R1.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lookup domains and previous regressions
        run: python -m unittest -v tests.test_stoneage_becomepig_exit_modes tests.test_stoneage_becomepig_pet_state tests.test_stoneage_becomepig_hp_death tests.test_stoneage_becomepig_lookup tests.test_stoneage_becomepig_badstatus tests.test_stoneage_becomepig_restore tests.test_stoneage_becomepig_clock tests.test_stoneage_becomepig_native_domains tests.test_stoneage_recovered25_becomepig_probe
      - name: Recover exact descendant source trees
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from tools.stoneage_guard_break2_source_audit import PINNED
          repos={"gavin":"gavinlinasd/StoneAge","iris":"iriselia/StoneAge","bismarck":"BismarckDD/stoneage"}
          for name,sha in PINNED.items():
              root=Path("/tmp/becomepig-exit-modes-source")/name
              subprocess.run(["git","init",str(root)],check=True)
              subprocess.run(["git","-C",str(root),"remote","add","origin","https://github.com/"+repos[name]+".git"],check=True)
              subprocess.run(["git","-C",str(root),"fetch","--depth","1","origin",sha],check=True)
              subprocess.run(["git","-C",str(root),"checkout","--detach","FETCH_HEAD"],check=True)
          PY
      - name: Execute complete original PvP WATCH typed and enemy Exit callers
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          ARGS="--gavin-dir /tmp/becomepig-exit-modes-source/gavin --iris-dir /tmp/becomepig-exit-modes-source/iris --bismarck-dir /tmp/becomepig-exit-modes-source/bismarck"
          python -m tools.stoneage_becomepig_exit_modes_audit $ARGS > research/recovered/STONEAGE-BECOMEPIG-EXIT-MODES-NATIVE-R1.txt
          cat research/recovered/STONEAGE-BECOMEPIG-EXIT-MODES-NATIVE-R1.txt
          grep -F 'TOTAL|exit_modes_comparisons=263268|profiles=3' research/recovered/STONEAGE-BECOMEPIG-EXIT-MODES-NATIVE-R1.txt
          grep -F 'RESOLUTION|BECOMEPIG_BOUNDED_PVP_WATCH_TYPED_ENEMY_EXIT_PASS_ZERO_RUNTIME_PROMOTIONS' research/recovered/STONEAGE-BECOMEPIG-EXIT-MODES-NATIVE-R1.txt
      - name: Reproduce prior HP death semantic digests after timing label correction
        run: |
          set -euo pipefail
          python -m tools.stoneage_becomepig_hp_death_audit \
            --gavin-dir /tmp/becomepig-exit-modes-source/gavin \
            --iris-dir /tmp/becomepig-exit-modes-source/iris \
            --bismarck-dir /tmp/becomepig-exit-modes-source/bismarck \
            > /tmp/becomepig-corrected-hp.txt
          python - <<'PY'
          from pathlib import Path
          def profiles(path):
              rows={}
              for line in Path(path).read_text().splitlines():
                  if line.startswith("PROFILE|"):
                      d=dict(x.split("=",1) for x in line.split("|")[1:])
                      rows[d["profile"]]=(d["source_sha"],d["native_comparisons"],d["semantic_sha256"])
              assert set(rows)=={"gavin","iris","bismarck"}
              return rows
          assert profiles("/tmp/becomepig-corrected-hp.txt")==profiles("research/recovered/STONEAGE-BECOMEPIG-HP-DEATH-NATIVE-R1.txt")
          print("Prior complete HP/death semantic digests unchanged; timing labels corrected")
          PY
      - name: Preserve exact input derived exit modes evidence
        uses: actions/upload-artifact@v4
        with:
          name: becomepig-exit-modes-${{ github.sha }}
          path: research/recovered/STONEAGE-BECOMEPIG-EXIT-MODES-NATIVE-R1.txt
