name: Probe StoneAge Waei www9 pre-release downloads
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_waei_www9_download_probe.py
      - tests/test_stoneage_waei_www9_download_probe.py
      - .github/workflows/probe-stoneage-waei-www9-download.yml
permissions:
  contents: write
concurrency:
  group: stoneage-waei-www9-download
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate www9 probe
        run: python3 -m unittest tests.test_stoneage_waei_www9_download_probe -v
      - name: Probe archived old download system
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_waei_www9_download_probe > research/recovered/STONEAGE-WAEI-WWW9-DOWNLOAD-R1.txt
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          R=research/recovered/STONEAGE-WAEI-WWW9-DOWNLOAD-R1.txt
          git add "$R"
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Waei www9 pre-release downloads'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 -m tools.stoneage_waei_www9_download_probe > "$R"
            git add "$R"
            git diff --cached --quiet && exit 0
            git commit -m 'research: probe Waei www9 pre-release downloads'
          fi
          git push
