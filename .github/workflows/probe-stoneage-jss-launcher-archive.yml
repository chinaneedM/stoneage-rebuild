name: Probe archived JSS StoneAge launcher
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_jss_launcher_archive_probe.py
      - tests/test_stoneage_jss_launcher_archive_probe.py
      - .github/workflows/probe-stoneage-jss-launcher-archive.yml
permissions:
  contents: write
concurrency:
  group: stoneage-jss-launcher-archive
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSS launcher probe
        run: python3 -m unittest tests.test_stoneage_jss_launcher_archive_probe -v
      - name: Recover derived launcher metadata
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_jss_launcher_archive_probe > research/recovered/STONEAGE-JSS-LAUNCHER-ARCHIVE-PROBE-R1.txt
      - name: Verify no executable was retained
        run: |
          set -euo pipefail
          test ! -e /tmp/stoneage.exe
          ! find research tools tests -type f -iname '*.exe' -print -quit | grep -q .
      - name: Commit derived metadata only
        run: |
          set -euo pipefail
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-JSS-LAUNCHER-ARCHIVE-PROBE-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe archived JSS StoneAge launcher'
          git pull --rebase origin main
          git push
