name: PET126F original-PC pet source custody and seven-dimension residual review
on:
  push:
    paths:
      - 'docs/continuity/STONEAGE-PET126F-SOURCE-CUSTODY-SEVEN-DIMENSION-RESIDUAL-20261121.md'
      - 'research/recovered/STONEAGE-PET126F-SOURCE-CUSTODY-SEVEN-DIMENSION-RESIDUAL-R1.json'
      - 'tests/test_stoneage_pet126f_source_custody_residual.py'
      - 'tools/stoneage_pet126f_private_custody_replay.py'
      - '.github/workflows/validate-stoneage-pet126f-source-custody.yml'
  pull_request:
    paths:
      - 'docs/continuity/STONEAGE-PET126F-SOURCE-CUSTODY-SEVEN-DIMENSION-RESIDUAL-20261121.md'
      - 'research/recovered/STONEAGE-PET126F-SOURCE-CUSTODY-SEVEN-DIMENSION-RESIDUAL-R1.json'
      - 'tests/test_stoneage_pet126f_source_custody_residual.py'
      - 'tools/stoneage_pet126f_private_custody_replay.py'
      - '.github/workflows/validate-stoneage-pet126f-source-custody.yml'
jobs:
  seven-field-public-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check seven PET source closure dimensions from published derived receipts
        run: |
          python -m unittest discover -s tests -p 'test_stoneage_pet126f_source_custody_residual.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet126e_tw10_k_slot_bridge.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pet126d_tw10_capture_static.py' -v
          python -m unittest discover -s tests -p 'test_stoneage_pc_only_scope_20261119.py' -v
      - name: Compile private-only archive validator without commercial bytes
        run: |
          python -m py_compile tools/stoneage_pet126f_private_custody_replay.py
