name: Probe Inium StoneAge exact download page
on:
  workflow_dispatch:
  push:
    paths:
      - tools/stoneage_inium_down_probe.py
      - tests/test_stoneage_inium_down_probe.py
      - .github/workflows/probe-stoneage-inium-down.yml

permissions:
  contents: write

concurrency:
  group: stoneage-inium-down
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_inium_down_probe -v
      - name: Probe archived Inium down.htm
        run: |
          set -euo pipefail
          mkdir -p research/recovered
          python3 -m tools.stoneage_inium_down_probe             > research/recovered/STONEAGE-INIUM-DOWN-PROBE-R1.txt
      - name: Commit derived download-page metadata only
        run: |
          git config user.name stoneage-recovery-bot
          git config user.email stoneage-recovery-bot@users.noreply.github.com
          git add research/recovered/STONEAGE-INIUM-DOWN-PROBE-R1.txt
          git diff --cached --quiet && exit 0
          git commit -m 'research: probe Inium StoneAge download page'
          git pull --rebase origin main
          git push
