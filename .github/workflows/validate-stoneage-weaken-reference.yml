name: Validate StoneAge Weaken reference
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-stoneage-weaken-reference.yml
      - tools/stoneage_nocast_model.py
      - tools/stoneage_barrier_model.py
      - tools/stoneage_nocast_runtime_state.py
      - tools/stoneage_battle_status_model.py
      - tools/stoneage_weaken_model.py
      - tools/stoneage_weaken_source_audit.py
      - tools/stoneage_recovered25_weaken_probe.py
      - tests/test_stoneage_weaken_model.py
      - tests/test_stoneage_recovered25_weaken_probe.py
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_stoneage_weaken_model tests.test_stoneage_recovered25_weaken_probe tests.test_stoneage_nocast_model tests.test_stoneage_barrier_model tests.test_stoneage_local_runtime_session_coordinator.LocalRuntimeSessionCoordinatorTests.test_recovered_enemy_ai_nocast_executes_and_ticks_persistently tests.test_stoneage_barrier_runtime tests.test_stoneage_local_runtime_session_coordinator.LocalRuntimeSessionCoordinatorTests.test_recovered_enemy_ai_barrier_executes_and_persists tests.test_stoneage_battle_core_model tests.test_stoneage_recovered25_petskill_pressure_probe -v
