name: Verify MAP07 28 original DAT source receipt (public metadata only)
on:
  push:
    branches: [main, agent/map07-original-scenes-batch-20261107]
    paths:
      - research/recovered/STONEAGE-MAP07-28-ORIGINAL-DAT-SOURCE-SCENE-RECEIPT-R1.json
      - tests/test_stoneage_map07_source_scene_batch.py
      - .github/workflows/verify-stoneage-map07-public.yml
  pull_request:
    paths:
      - research/recovered/STONEAGE-MAP07-28-ORIGINAL-DAT-SOURCE-SCENE-RECEIPT-R1.json
      - tests/test_stoneage_map07_source_scene_batch.py
      - .github/workflows/verify-stoneage-map07-public.yml
permissions: {contents: read}
jobs:
  source-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p test_stoneage_map07_source_scene_batch.py -v
