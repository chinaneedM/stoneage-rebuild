name: Verify Japanese flea market venue and scoped player event announcement service
on:
  push:
    paths:
      - 'tools/stoneage_jp2005_market_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_jp2005_market_source.py'
      - 'research/recovered/STONEAGE-JP2005-FLEA-MARKET-*.json'
      - 'docs/specs/STONEAGE-JP2005-FLEA-MARKET-SOURCE-R1.md'
      - '.github/workflows/verify-stoneage-jp2005-market-source.yml'
  pull_request:
    paths:
      - 'tools/stoneage_jp2005_market_source.py'
      - 'tools/stoneage_jp2005_treasure_source.py'
      - 'tests/test_stoneage_jp2005_market_source.py'
      - 'research/recovered/STONEAGE-JP2005-FLEA-MARKET-*.json'
      - 'docs/specs/STONEAGE-JP2005-FLEA-MARKET-SOURCE-R1.md'
      - '.github/workflows/verify-stoneage-jp2005-market-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode referenced JPEG originals
        run: python -m pip install Pillow==12.3.0
      - name: Venue, calendar, eligibility and evidence boundary counterexamples
        run: python -m unittest tests.test_stoneage_jp2005_market_source -v
      - name: Retrieve two articles, three actual wrapper chains and original illustrations
        run: python -m tools.stoneage_jp2005_market_source --fetch --output "$RUNNER_TEMP/r74/replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: jp2005-market-derived-r74
          path: ${{ runner.temp }}/r74/replay.json
          if-no-files-found: error
          retention-days: 30
