<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src data:; connect-src data:; img-src data:">
<title>石器时代｜台湾1.0原声音观察</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#172128;color:#e8edea;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:25px;line-height:1.3;margin:0 0 12px}p{margin:8px 0}.notice{background:#302d26;border:1px solid #7e7051;padding:12px 16px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}section{background:#202f38;border:1px solid #405560;border-radius:10px;padding:16px}label{display:block}input,select,button{font:inherit;padding:8px;background:#172128;color:inherit;border:1px solid #70808a;border-radius:4px}input[type=search]{width:100%}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e2c284}#list{height:460px;overflow:auto;margin-top:12px}#list button{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 10px}#list button[aria-pressed=true]{border-color:#ebc991;background:#3f443b}.small{font-size:12px;color:#b7c8ce}audio{width:100%;margin:14px 0}pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}#message{min-height:28px;color:#e5c589}#log{max-height:130px;overflow:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:15px}#list{height:250px}}
</style>
<main><h1>石器时代｜台湾1.0原声音观察</h1>
<p class="notice">本页嵌入经完整SHA验证的台湾WAEI/JSS 1.0原文件：116个音效目录WAV、11个配乐目录WAV。它们是已有原资源的试听入口，不是127个新发现或已确认游戏事件。文件名、原采样率与重复位置均保留。<b>未确定声音对应的NPC、宠物、村落或战斗；未进入原版世界。</b></p>
<p class="small">现代离线播放器：选择文件后手动播放。音量初始25%，不自动连播；“循环”仅是试听选项，不采用原游戏循环点。无外部请求。</p>
<div class="grid"><section><label for="search">按原文件名检索</label><input id="search" type="search" placeholder="例如 sabgm_s0 或 sak_91" autocomplete="off"><p><label for="category">来源目录</label><select id="category"><option value="ALL">全部</option><option value="BGM_DIRECTORY">配乐目录（11）</option><option value="SFX_DIRECTORY">音效目录（116）</option></select> <span id="count" class="small"></span></p><div id="list" aria-label="原声音文件列表"></div></section>
<section><h2 id="name">选择一个原文件</h2><audio id="player" controls preload="none"></audio><p><button id="play" type="button">播放</button> <button id="pause" type="button">暂停</button></p><label><input id="loop" type="checkbox">现代试听循环（默认关闭）</label><p id="message" role="status" aria-live="polite">尚未播放</p><pre id="facts"></pre><details><summary>本页播放记录</summary><pre id="log"></pre></details></section></div></main>
<script id="evidence" type="application/json">__PRIVATE_AUDIO_JSON__</script>
<script>
(()=>{'use strict';
const files=JSON.parse(document.getElementById('evidence').textContent), by=id=>document.getElementById(id),player=by('player');
const state={selected:null,selectionCount:0,events:[]};player.volume=.25;
const note=(event)=>{state.events.push({event,source:state.selected?.original_path??null,time:player.currentTime,volume:player.volume,loop:player.loop});by('log').textContent=state.events.slice(-30).map(x=>JSON.stringify(x)).join('\n')};
function select(file){player.pause();player.loop=false;by('loop').checked=false;state.selected=file;state.selectionCount++;player.src=file.dataURI;player.load();by('name').textContent=file.filename;by('message').textContent='已选择原文件，等待手动播放';by('facts').textContent=JSON.stringify({原路径:file.original_path,原文件字节:file.bytes,时长秒:file.duration_seconds,声道:file.channels,原采样率:file.sample_rate,原采样位数:file.sample_width_bytes*8,原WAV_SHA256:file.WAV_sha256,原PCM_SHA256:file.PCM_sha256,原文件块:file.chunk_signature,游戏事件:'未知',原游戏已运行:false},null,2);note('selected');render();}
function render(){const q=by('search').value.trim().toLowerCase(),category=by('category').value,visible=files.filter(f=>(category==='ALL'||f.category===category)&&f.original_path.toLowerCase().includes(q));by('count').textContent=visible.length+' / '+files.length;by('list').replaceChildren();for(const file of visible){const b=document.createElement('button');b.textContent=file.filename+' · '+file.duration_seconds.toFixed(3)+'秒';b.dataset.path=file.original_path;b.setAttribute('aria-pressed',String(state.selected===file));b.addEventListener('click',()=>select(file));by('list').append(b);}}
by('search').addEventListener('input',render);by('category').addEventListener('change',render);by('loop').addEventListener('change',()=>{player.loop=by('loop').checked;note('modern_loop')});
by('play').addEventListener('click',async()=>{if(!state.selected){by('message').textContent='请先选择一个原文件';return;}try{await player.play()}catch(error){by('message').textContent='浏览器播放失败：'+error.name;note('play_rejected')}});by('pause').addEventListener('click',()=>player.pause());
player.addEventListener('play',()=>{by('message').textContent='浏览器正在播放所选原文件';note('play')});player.addEventListener('pause',()=>{by('message').textContent='已暂停';note('pause')});player.addEventListener('ended',()=>{by('message').textContent='本段播放结束';note('ended')});player.addEventListener('error',()=>{by('message').textContent='浏览器无法播放此原文件，错误码 '+(player.error?.code??'未知');note('error')});
Object.defineProperty(window,'audioObserver',{value:{files,state,select,render},writable:false});render();
})();
</script></html>
