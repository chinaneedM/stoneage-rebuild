<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; script-src 'self' file: 'unsafe-inline'; style-src 'unsafe-inline'">
<title>MAP09 原地图来源观察目录</title>
<style>body{background:#11232a;color:#e9eee9;font:16px system-ui;margin:24px}header{max-width:1100px}select,input,button{font:inherit;padding:7px;margin:3px}canvas{image-rendering:pixelated;max-width:100%;height:auto}#facts{white-space:pre-wrap}#status{color:#b9d5c5}.tools{position:sticky;top:0;background:#11232a;padding:8px 0;z-index:1}#wrap{overflow:auto;max-height:80vh}canvas.native{max-width:none}</style>
<header><h1>MAP09 原地图来源观察目录</h1><p>691份来源图块齐全的地图，原DAT来自社区保存混合2.5，原图来自台湾1.0 RD配色候选。这里展示现代研究拼接；原层序、色盘、透明、碰撞、NPC/任务和官方同部署仍未认证。不是原客户端截图或可玩的游戏。</p><p>解压全部文件后打开本页。按编号选择或筛选，原图按需加载；所有955份原DAT另存附包，缺图地图未混入本目录。</p></header>
<div class="tools"><input id="search" type="search" placeholder="筛选原DAT编号" aria-label="筛选原DAT编号"><button id="prev">上一张</button><select id="floor" aria-label="原DAT编号"></select><button id="next">下一张</button><select id="mode" aria-label="候选平面"><option value="combined">合层候选</option><option value="plane0">原平面0</option><option value="plane1">原平面1</option></select><select id="zoom" aria-label="观察缩放"><option value="fit">适应窗口</option><option value="1">原尺寸</option><option value="2">2倍</option></select></div>
<p id="status" role="status"></p><p id="facts"></p><div id="wrap"><canvas id="scene"></canvas></div>
<script src="dataset.js"></script><script>
'use strict';
const data=window.MAP09_DATA,el=id=>document.getElementById(id),cache=new Map();
let sequence=0;window.map09={data,state:{ready:false,floor:null,mode:null,renderCount:0}};
const keys=Object.keys(data.maps).sort((a,b)=>Number(a)-Number(b));
function options(){const old=el('floor').value,q=el('search').value.trim(),visible=keys.filter(k=>k.includes(q));el('floor').replaceChildren(...visible.map(k=>new Option('DAT '+k,k)));if(visible.includes(old))el('floor').value=old;el('prev').disabled=el('next').disabled=!visible.length;return visible;}
function positions(map){const raw=Uint8Array.from(atob(map.dat_base64),c=>c.charCodeAt(0)),dv=new DataView(raw.buffer),w=dv.getUint32(0,true),h=dv.getUint32(4,true),n=w*h;if(!w||!h||raw.length!==8+6*n)throw Error('原DAT尺寸不符');const cells=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)cells.push([x,y]);cells.sort((a,b)=>(a[0]-a[1])-(b[0]-b[1])||b[0]-a[0]);const out=[];for(let p=0;p<2;p++)for(const [x,y]of cells){const key=dv.getUint16(8+2*(p*n+y*w+x),true);if(key>99)out.push({p,x,y,key});}return out;}
async function image(key){if(!cache.has(key)){const im=new Image();im.src='tiles/'+key+'.png';cache.set(key,im.decode().then(()=>im).catch(e=>{cache.delete(key);throw e}));}return cache.get(key);}
function zoom(){const c=el('scene'),z=el('zoom').value;c.classList.toggle('native',z!=='fit');c.style.width=z==='fit'?'':(c.width*Number(z))+'px';}
async function show(){const token=++sequence,floor=el('floor').value;map09.state.ready=false;if(!floor){el('status').textContent='没有匹配的地图编号';el('facts').textContent='';el('scene').width=el('scene').height=1;return;}const map=data.maps[floor],mode=el('mode').value;el('status').textContent='正在读取原图：DAT '+floor;try{const items=positions(map).filter(p=>mode==='combined'||p.p===(mode==='plane0'?0:1)),ids=[...new Set(items.map(p=>p.key))];await Promise.all(ids.map(image));if(token!==sequence)return;const c=el('scene');[c.width,c.height]=map.canvas_size;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#11232a';ctx.fillRect(0,0,c.width,c.height);for(const p of items){const r=data.records[p.key];if(!r)throw Error('缺来源图号 '+p.key);ctx.drawImage(await image(p.key),map.origin[0]+(p.x+p.y)*32+r.xoff,map.origin[1]+(p.y-p.x)*24+r.yoff);}if(token!==sequence)return;zoom();el('facts').textContent='DAT '+floor+' | '+map.geometry.join(' × ')+' 原格 | '+map.draw_positions+' 候选位置 | '+map.unique_draw_aliases+' 图号\n'+map.low_nonzero_not_rendered+' 个非零1–99值保留但未绘制；第三平面未解释。原DAT SHA256 '+map.source_sha256;el('status').textContent='已显示 '+(keys.indexOf(floor)+1)+' / '+keys.length+'：'+floor+' / '+mode;map09.state={ready:true,floor,mode,renderCount:map09.state.renderCount+1};}catch(e){if(token===sequence){el('status').textContent='无法显示：'+e.message;map09.state.error=e.message;}throw e;}}
el('floor').onchange=el('mode').onchange=show;el('search').oninput=()=>{options();show();};el('zoom').onchange=zoom;
for(const [id,direction]of [['prev',-1],['next',1]])el(id).onclick=()=>{const q=el('floor'),n=q.options.length;if(n){q.selectedIndex=(q.selectedIndex+direction+n)%n;show();}};
options();show();
</script></html>
