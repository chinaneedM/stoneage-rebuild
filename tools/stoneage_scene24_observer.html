<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src data:"><title>石器时代｜三件商品原行与图形别名候选</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101b22;color:#e4efed;font:15px/1.65 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:25px}.note{padding:14px;background:#292c29;border:1px solid #87734e;border-radius:8px}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:7px 10px;background:#28434f;color:inherit;border:1px solid #849ea7;border-radius:5px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ead395}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid #48626d;border-radius:9px;overflow:hidden;background:#142129}.card.selected{border:2px solid #e7cc7d}.card.control{border-color:#d58b75}.card canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.card button{width:100%;border:0;border-radius:0}.card p{padding:0 12px;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace}.panel{padding:16px;margin-top:18px;border:1px solid #48626d;border-radius:8px}.fine{font-size:13px;color:#bacdd0}@media(max-width:760px){.gallery{grid-template-columns:1fr}main{padding:14px}}</style><main><h1>商店原参数｜三件商品的图形候选</h1><p class="note">保存混合2.5原商店参数的前三项ID0／4／10，与原物品表的imagenumber，再接原ADRN偏移+76处的同值别名。<b>这里只证明静态数值关联与原图来源，不是原版商店界面或买卖执行。</b> 两份原SAP配色均为候选。台湾1.0原图与本保存资源的身份依据是已验完整公共前缀；不证明台湾1.0官方服存在这些商品/商店。</p><div class="controls"><label>配色候选<select id="palette"><option value="1">Palet_1</option><option value="0">Palet_0</option></select></label><label>整数倍率<select id="scale"><option value="4">4倍</option><option value="2">2倍</option></select></label><label><input id="compare" type="checkbox">查看直接物理号对照（不是商品候选）</label><button id="reset">重置</button><span id="status" role="status"></span></div><div id="gallery" class="gallery"></div><section class="panel"><h2 style="font-size:18px">选中原行与命名空间</h2><pre id="facts"></pre><p class="fine">cost、level、type按原字段记录，不计算成交价、不推等级准入。ID0是有效表行。未读取同部署的实时绘制选择器，别名路径仍保留候选资格；同值物理号有不同原图，不得静默混用。</p></section></main><script id="evidence" type="application/json">__SCENE24_MODEL__</script><script>
(()=>{'use strict';const model=JSON.parse(document.getElementById('evidence').textContent),r=model.report,by=id=>document.getElementById(id),state={item:0,palette:'1',scale:4,mode:'alias'},images={};const names={0:'小斧头',4:'莱伊卡Lv1斧头',10:'普通普通的斧头'};
for(const item of r.items){const card=document.createElement('article');card.className='card';card.dataset.item=item.id;const c=document.createElement('canvas');c.width=320;c.height=360;const b=document.createElement('button');b.textContent='ID '+item.id+' · '+names[item.id];b.addEventListener('click',()=>{state.item=item.id;facts()});const p=document.createElement('p');p.className='source';card.append(c,b,p);by('gallery').append(card)}
function facts(){const item=r.items.find(x=>x.id===state.item),raw=item.source_row;by('facts').textContent=JSON.stringify({物品ID:raw.id,原名:raw.name_original,简体说明:names[item.id],原cost字段:raw.numeric_fields.cost,原level字段:raw.numeric_fields.level,原type字段:raw.numeric_fields.type,原imagenumber:item.imagenumber,别名候选物理图号:item.alias_candidate.bitmapno,同值物理图号对照:item.literal_bitmap_control.bitmapno,当前路径:state.mode,同服选择器已认证:false,原交易已执行:false,原世界已进入:false},null,2);for(const card of by('gallery').children)card.classList.toggle('selected',Number(card.dataset.item)===state.item)}
async function render(){state.palette=by('palette').value;state.scale=Number(by('scale').value);state.mode=by('compare').checked?'literal':'alias';await ready;for(const item of r.items){const row=item[state.mode==='alias'?'alias_candidate':'literal_bitmap_control'],card=by('gallery').querySelector('[data-item="'+item.id+'"]'),c=card.querySelector('canvas'),ctx=c.getContext('2d'),w=row.width*state.scale,h=row.height*state.scale;ctx.fillStyle='#142129';ctx.fillRect(0,0,320,360);ctx.imageSmoothingEnabled=false;ctx.drawImage(images[state.palette+':'+row.bitmapno],Math.floor((320-w)/2),Math.floor((360-h)/2),w,h);card.classList.toggle('control',state.mode==='literal');card.querySelector('.source').textContent=state.mode==='alias'?'原imagenumber '+item.imagenumber+' → 别名+76 → 物理图号 '+row.bitmapno:'直接使用物理号 '+row.bitmapno+' 得到的对照图；不是商品候选'}facts();by('status').textContent=state.mode==='alias'?'静态别名候选图 · 未模拟买卖':'不同命名空间的原图对照 · 不是商品候选'}
const ready=Promise.all(Object.entries(model.images).flatMap(([p,values])=>Object.entries(values).map(async([n,data])=>{const im=new Image();im.src='data:image/png;base64,'+data;await im.decode();images[p+':'+n]=im})));for(const id of ['palette','scale','compare'])by(id).addEventListener('change',render);by('reset').addEventListener('click',()=>{by('palette').value='1';by('scale').value='4';by('compare').checked=false;state.item=0;render()});Object.defineProperty(window,'scene24',{value:{model,state,ready,render}});render()})();
</script></html>
