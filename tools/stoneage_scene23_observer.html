<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src data:"><title>石器时代｜台湾1.0人物图形候选观察</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101a21;color:#e4ecea;font:15px/1.65 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:25px;line-height:1.4}.note{border:1px solid #84734e;background:#292b28;border-radius:8px;padding:14px}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:20px 0}button,select{background:#284450;border:1px solid #8ba1a9;color:inherit;border-radius:6px;padding:7px 11px;font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #edce83}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{border:1px solid #48616b;border-radius:9px;overflow:hidden;background:#142129;text-align:center}.card.selected{border:2px solid #e8d394}.card canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.card button{width:100%;border:0;border-radius:0;background:#233943}.detail{padding:16px;border:1px solid #48616b;border-radius:8px;margin-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}.fine{font-size:13px;color:#b5c8cd}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:14px}}
</style><main><h1>台湾1.0｜十二个身体图形候选的原像素</h1><p class="note">从原程序身体图形候选数值表，连接同一台湾1.0原SPR与RD像素。每组显示动作码2、所选方向的<b>首帧</b>，共96个观察位置。<b>这不是原版建角界面，不证明十二个编号均为可选人物或完整人物总数。</b> 姓名、头像绑定和可选颜色未认证；两套配色不是可选人物颜色表；两份原Palet_0/1初始化配色候选、倒行、透明和统一锚点为有来源的现代观察候选，未认证游戏当时选色。没有启动原客户端世界。</p><div class="controls"><label>原方向值 <select id="direction"></select></label><label>原调色板候选 <select id="palette"><option value="1">Palet_1（候选）</option><option value="0">Palet_0（候选）</option></select></label><button id="previous">上一方向</button><button id="next">下一方向</button><button id="reset">重置</button><span id="status" role="status"></span></div><div class="grid" id="gallery"></div><section class="detail"><h2 style="font-size:18px">选中候选的原记录</h2><pre id="facts"></pre><p class="fine">卡片坐标统一摆放便于比较；不是原生镜头、朝向名称或建角动作。源duration与帧数只记录，不换算帧率；未播放其余动画帧或声音。</p></section></main><script id="evidence" type="application/json">__SCENE23_MODEL__</script><script>
(()=>{'use strict';const model=JSON.parse(document.getElementById('evidence').textContent),r=model.report,by=id=>document.getElementById(id),state={direction:0,palette:"1",group:r.groups[0].spr_no},images={};by('direction').replaceChildren(...Array.from({length:8},(_,i)=>new Option(String(i),String(i))));
for(const g of r.groups){const card=document.createElement('article');card.className='card';card.dataset.group=g.spr_no;const c=document.createElement('canvas');c.width=240;c.height=260;c.setAttribute('aria-label','候选图形'+g.spr_no);const button=document.createElement('button');button.textContent='图形键 '+g.spr_no;button.addEventListener('click',()=>{state.group=g.spr_no;facts()});card.append(c,button);by('gallery').append(card)}
function facts(){const g=r.groups.find(x=>x.spr_no===state.group),a=g.directions.find(x=>x.direction===state.direction),b=r.bitmaps.find(x=>x.bitmapno===a.first_frame[0]);by('facts').textContent=JSON.stringify({候选图形键:g.spr_no,源组位置:g.source_group_index,方向原值:a.direction,动作码:2,本页显示帧位置:0,该动画源帧数:a.source_frame_count,原duration:a.duration_word,原首帧:a.first_frame,原图片号:b.bitmapno,原尺寸:[b.width,b.height],原偏移:[b.xoff,b.yoff],已认证可选人物总数:null,原世界已进入:false,当前配色候选:state.palette},null,2);for(const card of by('gallery').children)card.classList.toggle('selected',Number(card.dataset.group)===state.group)}
async function render(){state.direction=Number(by('direction').value);state.palette=by('palette').value;await ready;for(const g of r.groups){const a=g.directions.find(x=>x.direction===state.direction),b=r.bitmaps.find(x=>x.bitmapno===a.first_frame[0]),c=by('gallery').querySelector('[data-group="'+g.spr_no+'"] canvas'),ctx=c.getContext('2d');ctx.fillStyle='#142129';ctx.fillRect(0,0,240,260);ctx.imageSmoothingEnabled=false;ctx.drawImage(images[state.palette+":"+b.bitmapno],120+2*(b.xoff+a.first_frame[1]),200+2*(b.yoff+a.first_frame[2]),b.width*2,b.height*2)}facts();by('status').textContent='12组 · 原方向 '+state.direction+' · 仅首帧'}
const ready=Promise.all(Object.entries(model.images).flatMap(([palette,values])=>Object.entries(values).map(async([n,data])=>{const im=new Image();im.src='data:image/png;base64,'+data;await im.decode();images[palette+":"+n]=im})));by('direction').addEventListener('change',render);by('palette').addEventListener('change',render);for(const[id,delta]of[['previous',-1],['next',1]])by(id).addEventListener('click',()=>{by('direction').value=String((Number(by('direction').value)+delta+8)%8);render()});by('reset').addEventListener('click',()=>{by('direction').value='0';by('palette').value='1';state.group=r.groups[0].spr_no;render()});Object.defineProperty(window,'scene23',{value:{model,state,ready,render}});render()})();
</script></html>
